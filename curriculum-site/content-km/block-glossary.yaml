# សទ្ទានុក្រមប្លុក — ភាសាខ្មែរ។ សោគឺជាសោរបស់ផ្ទាំងឧបករណ៍ (ext.opcode) ដូចគ្នានឹង
# content/block-glossary.yaml។ វាល `example` និង `see` មិនស្ថិតនៅទីនេះទេ ព្រោះជា
# ប្រភពប្លុក និងបញ្ជីសោ ដែលមិនប្រែភាសា — generator/glossary.py យកវាពីឯកសារអង់គ្លេស។

# ---------------------------------------------------------------- mBot2 Chassis
mbot2.mbot2_move_direction_with_time:
  what: >
    បើកបររូបយន្តទាំងមូលទៅទិសមួយក្នុងចំណោមបួន — ទៅមុខ ថយក្រោយ បត់ឆ្វេង បត់ស្តាំ —
    ក្នុងល្បឿនដែលអ្នកជ្រើស អស់រយៈពេលជាវិនាទី រួចបញ្ឈប់ម៉ូទ័រដោយខ្លួនឯង។
  when: >
    នេះជាវិធីសាមញ្ញបំផុតដើម្បីធ្វើចលនាមួយដែលវាស់បាន។ ប្រើវាពេលអ្នកចង់បានចលនាច្បាស់លាស់មួយ
    រួចបន្តទៅអ្វីបន្ទាប់៖ ជ្រុងមួយនៃការេ ការរុញចូលទីតាំង ការថយចេញពីជ្រុង។
    ដោយសារវាឈប់ដោយខ្លួនឯង អ្នកមិនអាចភ្លេចបិទម៉ូទ័របានទេ។
  caption: >
    ជ្រុងមួយនៃការេ៖ បើកបរមួយវិនាទី រួចបត់មុំកែង។
  watch: >
    ស្គ្រីបរង់ចាំនៅទីនេះ។ គ្មានអ្វីផ្សេងក្នុងស្គ្រីបនេះដំណើរការទេ រហូតដល់អស់វិនាទី
    ដូច្នេះអ្នកមិនអាចមើលឧបករណ៍ចាប់សញ្ញាខណៈប្លុកនេះកំពុងបើកបរបានទេ។

mbot2.mbot2_move_direction_with_rpm:
  what: >
    ចាប់ផ្ដើមឲ្យរូបយន្តធ្វើចលនា ហើយឲ្យស្គ្រីបបន្តភ្លាម។ កង់នៅតែបង្វិលក្នុងល្បឿននោះ
    រហូតដល់ប្លុកផ្សេងផ្លាស់ប្ដូរ ឬបញ្ឈប់វា។
  when: >
    គ្រប់ពេលដែលរូបយន្តត្រូវធ្វើចលនា និងមើលក្នុងពេលតែមួយ — បើកបរទៅមុខខណៈពិនិត្យ
    ឧបករណ៍ចាប់ចម្ងាយ ដើរតាមបន្ទាត់ ឆ្លើយតបនឹងឈ្នាន់បញ្ជា។ នេះជាប្លុកសម្រាប់
    «បន្តទៅមុខខណៈខ្ញុំគិតរឿងផ្សេង»។
  caption: >
    វារទៅមុខ ហើយឈប់ពេលមានវត្ថុនៅជិតជាង ១៥ ស.ម.។
  watch: >
    គ្មានអ្វីបញ្ឈប់វាដោយខ្លួនឯងទេ។ បើស្គ្រីបដល់ចុងបញ្ចប់ កង់នៅតែបង្វិល ដូច្នេះត្រូវបញ្ចប់ដោយ
    ប្លុកបញ្ឈប់ម៉ូទ័រ ឬកំណត់ល្បឿនទៅ 0។

mbot2.mbot2_move_straight_with_cm_and_inch:
  what: >
    បើកបរត្រង់ទៅមុខ ឬថយក្រោយ តាមចម្ងាយវាស់ជាសង់ទីម៉ែត្រ ហើយរង់ចាំរហូតដល់រូបយន្តឆ្លងផុត។
  when: >
    ពេលចម្ងាយសំខាន់ជាងពេលវេលា — ជ្រុង ៣០ ស.ម. នៃការេ ការថយក្រោយ ២០ ស.ម.។
    វារាប់ការបង្វិលកង់ជំនួសវិនាទី ដូច្នេះថ្មខ្សោយ ឬឥដ្ឋរអិលបន្តិច មិនប្ដូរចម្ងាយដែលរូបយន្តទៅដល់ទេ។
  caption: >
    ការេ ៣០ ស.ម.៖ ជ្រុងដដែល និងមុំដដែល បួនដង។
  watch: >
    សង់ទីម៉ែត្រត្រឹមត្រូវតែប៉ុណ្ណាដែលការកំណត់តួរូបយន្តត្រឹមត្រូវ។ បើការេរបស់អ្នកចេញជាចតុកោណកែង
    សូមដំណើរការប្លុកក្រិតតួម្ដង។

mbot2.mbot2_cw_and_ccw_with_angle:
  what: >
    បង្វិលរូបយន្តនៅនឹងកន្លែងតាមចំនួនដឺក្រេ — ឆ្វេង ឬស្តាំ — ហើយរង់ចាំរហូតដល់បង្វិលរួច។
  when: >
    គ្រប់ពេលដែលអ្នកចង់បានមុំដែលធ្វើឡើងវិញបាន។ ៩០° សម្រាប់ការេ ១២០° សម្រាប់ត្រីកោណ
    ១៨០° ដើម្បីត្រឡប់តាមផ្លូវដើម ៣៦០° សម្រាប់ការបង្វិលអបអរ។
  caption: >
    បង្វិលត្រឡប់ រួចបើកបរចេញឆ្ងាយពីទិសដើម។
  watch: >
    ដឺក្រេអាស្រ័យលើកង់ចាប់ដី។ នៅលើឥដ្ឋរអិល រូបយន្តបង្វិលមិនគ្រប់; ដំណោះស្រាយគឺបង្វិលយឺតជាង
    ឬផ្ទៃចាប់ជាង មិនមែនលេខធំជាងទេ ព្រោះលេខខុសនឹងបែកនៅឥដ្ឋបន្ទាប់។

mbot2.mbot2_encoder_motor_set_with_time:
  what: >
    បង្វិលកង់មួយ — ឆ្វេង ស្តាំ ឬទាំងពីរ — ក្នុងល្បឿនដែលជ្រើស អស់រយៈពេលជាវិនាទី រួចបញ្ឈប់វា។
    ល្បឿនគិតជា RPM ហើយលេខអវិជ្ជមានបង្វិលកង់ថយក្រោយ។
  when: >
    ពេលកង់ទាំងពីរត្រូវការបញ្ជាខុសគ្នា។ ការបង្វិលកង់តែមួយធ្វើឲ្យរូបយន្តវិលជុំវិញកង់មួយទៀត
    ដែលជាការបត់តូចចង្អៀតជាងការបង្វិលនៅនឹងកន្លែង។
  caption: >
    កង់ឆ្វេងតែមួយបើកបរមួយវិនាទី ដូច្នេះរូបយន្តវិលជុំវិញកង់ស្តាំ។

mbot2.mbot2_encoder_motor_set:
  what: >
    កំណត់ឲ្យកង់មួយបង្វិលក្នុងល្បឿនមួយ ហើយឲ្យស្គ្រីបបន្ត។ កង់នៅតែបង្វិលរហូតដល់មានអ្វីផ្លាស់ប្ដូរ
    ឬបញ្ឈប់វា។
  when: >
    ជាកំណែកង់តែមួយនៃ «បន្តទៅមុខខណៈខ្ញុំគិត»។ មានប្រយោជន៍ពេលមានតែម្ខាងត្រូវប្ដូរ —
    ពង្រីកកោងឲ្យធំបន្តិច ខណៈកង់ម្ខាងទៀតរក្សាល្បឿន។
  caption: >
    ល្បឿនកង់ពីរខុសគ្នា បង្កើតកោងវែងទៅស្តាំ។
  watch: >
    ដូចប្លុកចលនាដែលមិនរង់ចាំទាំងអស់ វាទុកកង់ឲ្យបង្វិលបន្ត។

mbot2.mbot2_encoder_motor_set_with_time_angle_and_circle:
  what: >
    បង្វិលកង់មួយតាមចំនួនដឺក្រេពិតប្រាកដនៃការបង្វិលរបស់វាផ្ទាល់ ហើយរង់ចាំរហូតដល់រួច។
    នេះជាកង់បង្វិល មិនមែនរូបយន្តបង្វិលទេ។
  when: >
    ពេលអ្នកកំពុងបញ្ជាអ្វីមួយដែលភ្ជាប់នឹងអ័ក្សកង់ ឬចង់បានចំណែកជាក់លាក់នៃការបង្វិលកង់មួយ។
    ចំពោះការផ្លាស់ទីរូបយន្តតាមចម្ងាយ ប្លុកសង់ទីម៉ែត្រងាយយល់ជាង។
  caption: >
    ការបង្វិលពេញមួយជុំនៃកង់ឆ្វេង។

mbot2.mbot2_encoder_motor_drive_speed2:
  what: >
    ផ្ដល់ល្បឿនដល់កង់ទាំងពីរក្នុងប្លុកតែមួយ៖ កង់ឆ្វេងក្នុង RPM មួយ កង់ស្តាំក្នុង RPM មួយទៀត។
    ស្គ្រីបបន្តភ្លាម។
  when: >
    នេះជាប្លុកបញ្ជាទិស។ ល្បឿនស្មើគ្នាបើកបរត្រង់ ភាពខុសគ្នាធ្វើឲ្យកោង ហើយសញ្ញាផ្ទុយគ្នា
    បង្វិលនៅនឹងកន្លែង។ អ្នកដើរតាមបន្ទាត់ និងអ្នកបើកបរដោយឈ្នាន់គ្រប់រូបសង់លើវា
    ព្រោះប្លុកតែមួយកំណត់ស្ថានភាពទាំងមូលនៃតួរូបយន្ត។
  caption: >
    ការបញ្ជាបែបរថក្រោះ៖ ដងនីមួយៗបើកបរកង់នៅខាងខ្លួន ចែកនឹង ៣ ដើម្បីឲ្យដងពេញក្លាយជាល្បឿនសមរម្យ
    មិនមែនការហោះចេញទេ។
  watch: >
    EM1 ជាកង់ឆ្វេង និង EM2 ជាកង់ស្តាំ។ បើរូបយន្តបត់ខុសទិសពេលអ្នករុញទៅមុខ នោះអ្នកដាក់ច្រឡំគ្នា
    ឬម៉ូទ័រមួយដោតច្រឡំរន្ធ។

mbot2.mbot2_encoder_motor_drive_power:
  what: >
    ប្លុកកង់ពីរដដែល ប៉ុន្តែសុំភាគរយនៃកម្លាំងម៉ូទ័រជំនួសល្បឿនគោលដៅ។
  when: >
    កម្រណាស់ក្នុងវគ្គសិក្សានេះ។ កម្លាំងប្រាប់ថាត្រូវរុញខ្លាំងប៉ុណ្ណា; RPM ប្រាប់ថាត្រូវទៅលឿនប៉ុណ្ណា
    ហើយអនុញ្ញាតឲ្យរូបយន្តរុញខ្លាំងឡើងដោយខ្លួនឯងពេលកង់ជួបព្រំ ឬជម្រាល។
    គួរប្រើប្លុក RPM លុះត្រាតែអ្នកមានហេតុផល។
  caption: >
    កង់ទាំងពីរក្នុងកម្លាំង ៤០% — ការខិតខំដូចគ្នា ទោះឥដ្ឋធ្វើឲ្យល្បឿនពិតខុសគ្នាយ៉ាងណា។

mbot2.mbot2_encoder_motor_stop:
  what: >
    បញ្ឈប់កង់មួយ ឬទាំងពីរ ក្នុងពេលតែមួយ។
  when: >
    នៅចុងបញ្ចប់នៃអ្វីៗដែលប្រើប្លុកចលនាមិនរង់ចាំ។ ជ្រើស «all» លុះត្រាតែអ្នកពិតជាចង់បានតែម្ខាង។
  caption: >
    ប៊ូតុងបន្ទាន់៖ B បញ្ឈប់រូបយន្តទោះវាកំពុងធ្វើអ្វីក៏ដោយ។
  watch: >
    ប្លុកមួកបញ្ឈប់បែបនេះដំណើរការតែពេលស្គ្រីបដែលកំពុងបើកបរអនុញ្ញាតឲ្យ CyberPi ឆ្លើយតបប៊ូតុង —
    ក្នុងរង្វិលជុំ forever វាធ្វើបាន។

mbot2.mbot2_encoder_motor_get_speed:
  what: >
    រាយការណ៍ថាកង់មួយកំពុងបង្វិលលឿនប៉ុណ្ណាពិតប្រាកដឥឡូវនេះ គិតជា RPM។
  when: >
    សម្រាប់ការពិនិត្យ មិនមែនការបញ្ជាទេ។ បង្ហាញវាលើអេក្រង់ដើម្បីមើលថារូបយន្តឈានដល់ល្បឿនដែលអ្នកសុំឬអត់ —
    កង់ដែលជាប់នឹងជញ្ជាំងរាយការណ៍តិចជាងអ្វីដែលវាត្រូវបានប្រាប់ច្រើន។
  caption: >
    មើលល្បឿនពិតរបស់កង់ឆ្វេងលើអេក្រង់ CyberPi។

mbot2.mbot2_encoder_motor_get_angle:
  what: >
    រាយការណ៍ថាកង់មួយបានបង្វិលប៉ុន្មានដឺក្រេ ដោយបូកកើនឡើងតាមដំណើរ ចាប់តាំងពីការកំណត់ឡើងវិញចុងក្រោយ។
  when: >
    ពេលអ្នកចង់វាស់ដំណើរជំនួសការកំណត់ពេល។ កំណត់ចំនួនឡើងវិញ បើកបរ រួចអានមុំដើម្បីដឹងថាកង់ទៅឆ្ងាយប៉ុណ្ណា។
  caption: >
    វាស់ថាកង់ឆ្វេងបង្វិលប៉ុន្មានដឺក្រេអំឡុងការបើកបរពីរវិនាទី។
  watch: >
    ចំនួននៅតែកើនរហូតដល់អ្នកកំណត់វាឡើងវិញ ដូច្នេះត្រូវកំណត់ឡើងវិញជាមុន បើមិនដូច្នេះទេអ្នកនឹងអានលើកនេះ
    បូកនឹងគ្រប់លើកមុន។

mbot2.mbot2_encoder_motor_reset_angle:
  what: >
    កំណត់ចំនួនបង្វិលរបស់កង់ត្រឡប់ទៅសូន្យ។
  when: >
    ភ្លាមមុនចលនាដែលអ្នកមានបំណងវាស់។
  caption: >
    កំណត់ចំនួនកង់ឆ្វេងទៅសូន្យ ដើម្បីឲ្យការអានបន្ទាប់ចាប់ផ្ដើមពីទីនេះ។

mbot2.mbot2_encoder_motor_lock_and_unlock:
  what: >
    បើក ឬបិទការចាក់សោដោយស្វ័យប្រវត្តិរបស់កង់។ ពេលចាក់សោ ម៉ូទ័ររក្សាទីតាំងយ៉ាងសកម្ម ហើយទប់ការរុញ;
    ពេលដោះសោ កង់វិលដោយសេរី។
  when: >
    ចាក់សោពេលរូបយន្តត្រូវឈរនឹងលើជម្រាល ឬទប់នឹងការរុញ។ ដោះសោពេលអ្នកចង់រុញរូបយន្តដោយដៃ
    ដោយមិនប្រយុទ្ធនឹងម៉ូទ័រ។
  caption: >
    រក្សាកង់ឆ្វេងនៅនឹងកន្លែងចាប់ពីពេលរូបយន្តបើកដំណើរការ។

mbot2.mbot2_set_para:
  what: >
    ដំណើរការការក្រិតតួរូបយន្ត ដែលបង្រៀនរូបយន្តអំពីទំហំកង់របស់វា និងចម្ងាយរវាងកង់ទាំងពីរ។
  when: >
    ម្ដង បន្ទាប់ពីសង់រូបយន្ត និងម្ដងទៀតបើអ្នកប្ដូរកង់។ គ្រប់អ្វីដែលវាស់ជាសង់ទីម៉ែត្រ ឬដឺក្រេ
    គណនាចេញពីលេខទាំងនេះ ដូច្នេះការកំណត់ខុសធ្វើឲ្យការេគ្រប់ក្លាយជាចតុកោណកែង
    និងមុំ ៩០° គ្រប់ខុសបន្តិច។
  caption: >
    ដាក់រូបយន្តលើឥដ្ឋទំនេរ ហើយចុច B ម្ដង។
  watch: >
    ទុកកន្លែងឲ្យវា — វាបើកបរខ្លួនឯងជុំវិញអំឡុងការក្រិត។

# ---------------------------------------------------------------------- Events
cyberpi.cyberpi_when_launch:
  what: >
    ប្លុកមួក។ អ្វីៗនៅក្រោមវាដំណើរការភ្លាមពេល CyberPi បើកថាមពល ឬត្រូវបានកំណត់ឡើងវិញ —
    ហើយដោយសារការអាប់ឡូតធ្វើឲ្យរូបយន្តចាប់ផ្ដើមឡើងវិញ ក៏ភ្លាមពេលកម្មវិធីអាប់ឡូតរួចដែរ។
  when: >
    សម្រាប់ការរៀបចំដែលគួរធ្វើតែម្ដង និងសម្រាប់អ្វីដែលរូបយន្តគួរធ្វើដោយគ្មានអ្នកមើល។
    ក្នុងវគ្គសិក្សានេះ វាតែងតែផ្ទុកបន្ទាត់តែមួយប្រាប់អ្នកបើកបរថាត្រូវចុចអ្វី ព្រោះកម្មវិធីដែលបើកបរ
    ភ្លាមពេលចាប់ផ្ដើម គឺជាកម្មវិធីដែលបើកបរធ្លាក់ពីតុអំឡុងការអាប់ឡូត។
  caption: >
    ពេលបើកថាមពល បង្ហាញសេចក្ដីណែនាំ រួចរង់ចាំ។ គ្មានអ្វីធ្វើចលនាទេ រហូតដល់មនុស្សសម្រេចថាគួរ។
  watch: >
    ស្គ្រីបតែមួយប៉ុណ្ណោះអាចនៅក្រោមប្លុកមួកមួយ។ ប្លុកមួក «when CyberPi starts up» ពីរក្នុងគម្រោងតែមួយ
    មិនមែនជាកម្មវិធីពីរទេ — វាជាការគាំង។

cyberpi.cyberpi_when_button_press:
  what: >
    ប្លុកមួកដែលដំណើរការស្គ្រីបរបស់វា ពេលប៊ូតុង A ឬ B លើ CyberPi ត្រូវបានចុច។
  when: >
    នេះជាប៊ូតុងចាប់ផ្ដើមស្តង់ដាររបស់វគ្គសិក្សា។ ការអាប់ឡូតតែងតែដំណើរការកម្មវិធីភ្លាម
    ដូច្នេះការដាក់ផ្នែកដែលធ្វើចលនានៅក្រោមប៊ូតុង A គឺជាអ្វីដែលរក្សារូបយន្តឲ្យនៅស្ងៀម
    រហូតដល់មានអ្នកត្រៀមរួច។
  caption: >
    រូបយន្តរង់ចាំ ទោះយូរប៉ុណ្ណា រហូតដល់មនុស្សម្នាក់ចុច A។
  watch: >
    A និង B ជាប៊ូតុងមូលពីរនៅក្បែរអេក្រង់ មិនមែនឈ្នាន់បញ្ជាទេ។

cyberpi.cyberpi_when_direction_key_press:
  what: >
    ប្លុកមួកសម្រាប់ឈ្នាន់ប្រាំទិសរបស់ CyberPi ផ្ទាល់ — ដងតូចនៅលើផ្ទាំងខ្លួនឯង។
    វាបាញ់ពេលដងត្រូវរុញឡើងលើ ចុះក្រោម ឆ្វេង ឬស្តាំ ឬចុចកណ្តាល។
  when: >
    សម្រាប់ការជ្រើសរើសរវាងរបស់ផ្សេងៗដោយមិនប្រើឧបករណ៍បន្ថែម៖ ម៉ឺនុយ ការប្ដូររបៀប ការរុញមួយទិស។
    មានប្រយោជន៍ពេលក្រុមនីមួយៗមានរូបយន្ត តែមិនមែនក្រុមនីមួយៗមានឈ្នាន់បញ្ជា។
  caption: >
    រុញដងលើផ្ទាំងឡើងលើ ហើយរូបយន្តឈានមួយជំហានទៅមុខ។
  watch: >
    នេះជាដងដែលភ្ជាប់ក្នុង CyberPi មិនមែនឈ្នាន់បញ្ជា Bluetooth ទេ។ ឈ្នាន់បញ្ជាមានប្លុករបស់វាផ្ទាល់
    ក្នុងថតឧបករណ៍ Bluetooth controller។

cyberpi.cyberpi_when_detect_attitude:
  what: >
    ប្លុកមួកដែលបាញ់ពេល CyberPi ត្រូវបានកាន់នៅមុំជាក់លាក់មួយ — ផ្អៀងឆ្វេង ស្តាំ ទៅមុខ ថយក្រោយ
    ឬដេកអេក្រង់ឡើងលើ ឬអេក្រង់ចុះក្រោម។
  when: >
    ពេលរូបយន្តខ្លួនឯងជាឧបករណ៍បញ្ជា ឬដើម្បីកត់សម្គាល់ថាមានអ្វីមួយខុស៖ រូបយន្តដែលរាយការណ៍
    «អេក្រង់ចុះក្រោម» គឺត្រូវបានផ្ដួល។
  caption: >
    ផ្អៀងរូបយន្តទៅឆ្វេង ហើយវាឆ្លើយតបដោយសំឡេង។

cyberpi.cyberpi_when_detect_action:
  what: >
    ប្លុកមួកដែលបាញ់លើចលនា មិនមែនលើទីតាំង — ការគ្រវីមួយក្នុងចំណោមបួនទិស ឬការបង្វិលតាម
    ឬច្រាសទ្រនិចនាឡិកា។
  when: >
    សម្រាប់កាយវិការ។ វាអានចលនាមុតស្រួច ដូច្នេះវាសមនឹង «អង្រួនដើម្បីកំណត់ឡើងវិញ»
    ជាងការបញ្ជាដ៏ជាក់លាក់។
  caption: >
    ការគ្រវីទៅឆ្វេងបិទភ្លើង។

cyberpi.cyberpi_when_sensor_value_bigger_or_smaller_than:
  what: >
    ប្លុកមួកដែលឃ្លាំមើលឧបករណ៍ចាប់សញ្ញាក្នុងខ្លួនមួយ — ពន្លឺ សំឡេង កម្លាំងអង្រួន ឬនាឡិកា —
    ហើយបាញ់ភ្លាមពេលវាឆ្លងលេខដែលអ្នកកំណត់។
  when: >
    ពេលអ្នកចង់បានប្រតិកម្មដោយមិនចាំបាច់សរសេរការឃ្លាំមើលដោយខ្លួនឯង។ វាជំនួសរង្វិលជុំ forever
    ដែលមាន if នៅខាងក្នុង ហើយវាបន្តដំណើរការនៅផ្ទៃខាងក្រោយខណៈស្គ្រីបចម្បងធ្វើអ្វីផ្សេង។
  caption: >
    ការទះដៃខ្លាំងធ្វើឲ្យរង្វង់ភ្លើងក្រហម ទោះរូបយន្តកំពុងធ្វើអ្វីផ្សេងក៏ដោយ។
  watch: >
    វាបាញ់នៅពេលឆ្លង មិនមែនខណៈតម្លៃនៅតែខ្ពស់ទេ — សំឡេងខ្លាំងជាប់ៗធ្វើឲ្យវាបាញ់ម្ដង
    មិនមែនម្ដងហើយម្ដងទៀតទេ។

event_whenflagclicked:
  what: >
    ប្លុកមួកទង់បៃតងរបស់ Scratch។ វាដំណើរការពេលអ្នកចុចទង់បៃតងខាងលើឆាកនៅលើកុំព្យូទ័រ។
  when: >
    តែក្នុងរបៀប Live ប៉ុណ្ណោះ ជាកន្លែងដែលកម្មវិធីដំណើរការលើកុំព្យូទ័រ ហើយរូបយន្តជាតុក្កតានៅចុងខ្សែ។
    កម្មវិធីដែលអាប់ឡូតរួចគ្មានទង់ឲ្យចុចទេ ដូច្នេះប្លុកមួកនេះមិនដែលបាញ់នៅលើរូបយន្តឡើយ។
  caption: >
    ក្នុងរបៀប Live ការចុចទង់សរសេរលើអេក្រង់រូបយន្ត។
  watch: >
    បើកម្មវិធីរបស់អ្នកមិនធ្វើអ្វីសោះក្រោយអាប់ឡូត សូមពិនិត្យថាប្លុកមួករបស់វាមិនមែនប្លុកនេះ។
    ប្រើ «when CyberPi starts up» ឬ «when button A pressed» ជំនួស។

event_whenkeypressed:
  what: >
    ប្លុកមួកដែលបាញ់ពេលគ្រាប់ចុចលើក្ដារចុចកុំព្យូទ័រត្រូវបានចុច។
  when: >
    តែរបៀប Live ប៉ុណ្ណោះ ដោយហេតុផលដូចទង់បៃតង — រូបយន្តដែលអាប់ឡូតរួចមិនភ្ជាប់នឹងក្ដារចុចរបស់អ្នកទេ។
    មានប្រយោជន៍សម្រាប់ការសាកល្បងរហ័សនៅតុ។
  caption: >
    ប៊ូតុងបញ្ឈប់បន្ទាន់ដោយ space bar ខណៈអ្នកសាកល្បងក្នុងរបៀប Live។

event_whenbroadcastreceived:
  what: >
    ប្លុកមួកដែលដំណើរការពេលសារដែលមានឈ្មោះអ្នកជ្រើសត្រូវបានផ្សាយ។
  when: >
    ដើម្បីបំបែកកម្មវិធីជាផ្នែកមានឈ្មោះដែលហៅគ្នាទៅវិញទៅមក ហើយដើម្បីឲ្យព្រឹត្តិការណ៍មួយចាប់ផ្ដើម
    ស្គ្រីបច្រើនក្នុងពេលតែមួយ។ គ្រប់ស្គ្រីបដែលមាន «when I receive» ដូចគ្នាដំណើរការជាមួយគ្នា។
  caption: >
    អ្វីក៏ដោយដែលផ្សាយ «go» ធ្វើឲ្យស្គ្រីបនេះដំណើរការ។

event_broadcast:
  what: >
    ផ្ញើសារដែលមានឈ្មោះ ហើយបន្តភ្លាមដោយមិនរង់ចាំអ្វីដែលឆ្លើយតបវាទេ។
  when: >
    ពេលរឿងមួយគួរធ្វើឲ្យរឿងមួយទៀតកើតឡើង តែទាំងពីរមិនចាំបាច់ផ្លាស់វេនគ្នា — ចាប់ផ្ដើមភ្លើង
    ខណៈការបើកបរបន្ត។
  caption: >
    សារចេញទៅ ហើយស្គ្រីបនេះបន្តភ្លាម។

event_broadcastandwait:
  what: >
    ផ្ញើសារដែលមានឈ្មោះ រួចទប់ស្គ្រីបនេះរហូតដល់គ្រប់ស្គ្រីបដែលស្តាប់សារនោះបានបញ្ចប់។
  when: >
    ពេលលំដាប់សំខាន់ — ធ្វើរឿងនោះ ហើយតែពេលវារួចទាំងស្រុងទើបធ្វើរឿងនេះ។
  caption: >
    ចតមុនសិន; តែពេលការចតរួចទើបរូបយន្តបន្លឺសំឡេង។

# --------------------------------------------------------------------- Control
control_forever:
  what: >
    រង្វិលជុំគ្មានទីបញ្ចប់។ អ្វីៗនៅខាងក្នុងដំណើរការ រួចដំណើរការម្ដងទៀត ដរាបណាកម្មវិធីនៅរស់។
  when: >
    សម្រាប់អ្វីដែលរូបយន្តត្រូវធ្វើជាបន្តបន្ទាប់៖ ឃ្លាំមើលឧបករណ៍ចាប់សញ្ញា ដើរតាមបន្ទាត់
    ឆ្លើយតបនឹងឧបករណ៍បញ្ជា។ កម្មវិធីរូបយន្តស្ទើរគ្រប់ទាំងអស់មានវាមួយនៅបេះដូង។
  caption: >
    បើកបរ ហើយបន្តមើល។ រាល់ពេលជញ្ជាំងចូលមកជិត បត់ចេញពីវា។
  watch: >
    គ្មានអ្វីនៅក្រោយរង្វិលជុំ forever ដំណើរការឡើយ ព្រោះរង្វិលជុំមិនចេះបញ្ចប់។
    បើអ្នកមានប្លុកនៅខាងក្រោមវា ប្លុកទាំងនោះស្លាប់។

control_repeat:
  what: >
    ដំណើរការអ្វីៗខាងក្នុងតាមចំនួនកំណត់ រួចបន្តទៅអ្វីបន្ទាប់។
  when: >
    ពេលអ្នកដឹងចំនួនជាមុន — បួនជ្រុងនៃការេ បីសំឡេងប៊ីប ដប់ជំហាន។
  caption: >
    ការេ សរសេរម្ដង ហើយដំណើរការបួនដង។

control_repeat_until:
  what: >
    បន្តរង្វិលជុំរហូតដល់លក្ខខណ្ឌក្លាយជាពិត។ វាពិនិត្យ មុន ជុំនីមួយៗ ដូច្នេះបើលក្ខខណ្ឌពិតរួចហើយ
    ខាងក្នុងមិនដំណើរការសោះឡើយ។
  when: >
    ពេលចំនួនមិនស្គាល់ តែខ្សែបញ្ចប់ច្បាស់៖ វារទៅមុខរហូតដល់ជញ្ជាំងជិត បង្វិលរហូតដល់រកបន្ទាត់ឃើញ។
  caption: >
    វារទៅមុខដរាបណាផ្លូវទំនេរ ហើយឈប់ពេលវាលែងទំនេរ។

control_if:
  what: >
    ដំណើរការប្លុកខាងក្នុងម្ដង ប៉ុន្តែតែពេលលក្ខខណ្ឌពិតឥឡូវនេះ។ បើវាមិនពិត ប្លុកទាំងនោះត្រូវរំលង។
  when: >
    សម្រាប់ការសម្រេចចិត្តដែលគ្មានអ្វីត្រូវធ្វើនៅម្ខាងទៀត។ ក្នុងរង្វិលជុំ forever វាក្លាយជា
    «ពិនិត្យរឿងនេះ រាល់ជុំ»។
  caption: >
    បន្លឺសំឡេងគ្រប់ពេលមានវត្ថុនៅជិត។ នៅស្ងៀមពេលគ្មាន។
  watch: >
    វាសាកល្បងម្ដង នៅពេលស្គ្រីបទៅដល់វា។ ដើម្បីបន្តសាកល្បង ត្រូវដាក់វាក្នុងរង្វិលជុំ។

control_if_else:
  what: >
    ផ្លូវពីរ ការសម្រេចចិត្តមួយ។ ផ្នែកខាងលើដំណើរការពេលលក្ខខណ្ឌពិត ផ្នែកខាងក្រោមពេលវាមិនពិត —
    តែងតែមួយ មិនដែលទាំងពីរទេ។
  when: >
    ពេលពិតជាមានអ្វីត្រូវធ្វើទាំងសងខាង៖ ទៅឆ្វេង ឬទៅស្តាំ ភ្លើងបៃតង ឬភ្លើងក្រហម។
  caption: >
    ក្រហមពេលផ្លូវជាប់ បៃតងពេលទំនេរ — ហើយមិនដែលគ្មានទាំងពីរទេ។

control_wait:
  what: >
    ទប់ស្គ្រីបឲ្យនៅស្ងៀមអស់រយៈពេលជាវិនាទី រួចបន្ត។
  when: >
    ដើម្បីឲ្យអ្វីមួយដែលគ្មាន «until done» ផ្ទាល់ខ្លួនបញ្ចប់ ដើម្បីដាក់គម្លាតបង្ហាញឲ្យមនុស្សអានទាន់
    ឬដើម្បីបន្ថយល្បឿនរង្វិលជុំដែលវិលលឿនជាងអ្វីៗអាចឆ្លើយតបបាន។
  caption: >
    បើកបរអស់ពីរវិនាទីជាក់លាក់ រួចឈប់។ ការរង់ចាំគឺជាអ្វីដែលធ្វើឲ្យវាពីរវិនាទី។

control_wait_until:
  what: >
    ទប់ស្គ្រីបឲ្យនៅស្ងៀមរហូតដល់លក្ខខណ្ឌក្លាយជាពិត ទោះយូរប៉ុណ្ណា រួចបន្ត។
  when: >
    ពេលអ្នកចង់រង់ចាំរឿងមួយ ជាជាងរង់ចាំពេលវេលា — រហូតដល់ប៊ូតុងត្រូវចុច រហូតដល់ជញ្ជាំងជិត
    រហូតដល់បន្ទាត់លេចឡើង។
  caption: >
    លំនាំដែលរារាំងកម្មវិធីអាប់ឡូតមិនឲ្យបើកបរធ្លាក់ពីតុ៖ វារង់ចាំមនុស្សមុនពេលធ្វើចលនា។
  watch: >
    បើលក្ខខណ្ឌមិនដែលពិត ស្គ្រីបរង់ចាំរហូត។ ត្រូវទុកផ្លូវចេញឲ្យខ្លួនឯង។

control_for_new:
  what: >
    រង្វិលជុំរាប់។ វាបង្កើតអថេរមួយ រាប់វាពីដើមទៅចុងតាមជំហានដែលអ្នកជ្រើស ហើយដំណើរការខាងក្នុងម្ដងក្នុងមួយចំនួន —
    ដូច្នេះប្លុកខាងក្នុងអាចប្រើលេខនោះ។
  when: >
    ពេលចំនួនធ្វើម្ដងទៀតក៏មានប្រយោជន៍នៅខាងក្នុងរង្វិលជុំដែរ៖ ដើរតាមបញ្ជីម្ដងមួយធាតុ
    គូររូបរាងដែលជ្រុងកាន់តែវែង បោះពុម្ពលំដាប់មានលេខ។
  caption: >
    បួនជើង ហើយរង្វិលជុំដឹងថាវាកំពុងនៅជើងណា។
  watch: >
    លេខចុងក្រោយមិនរាប់បញ្ចូលទេ។ ដើម្បីដើរពេញបញ្ជី ត្រូវរាប់ទៅដល់មួយលើសប្រវែងរបស់វា។

control_stop:
  what: >
    បញ្ឈប់ស្គ្រីបដែលកំពុងដំណើរការ។ «all» បញ្ឈប់កម្មវិធីទាំងមូល «this script» បញ្ឈប់តែស្គ្រីបដែលប្លុកនោះស្ថិតនៅ។
  when: >
