  caption: >
    សសរមួយក្នុងមួយការអាន ងាយប្រៀបធៀបដោយក្រឡេកមើល។

cyberpi.cyberpi_display_bar_chart_set_interval:
  what: >
    កំណត់ថាចំណុចនៃគំនូសតាងត្រូវគូរឆ្ងាយពីគ្នាប៉ុណ្ណា គិតជាភីកសែល។
  when: >
