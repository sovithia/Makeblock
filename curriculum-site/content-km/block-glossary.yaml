  when: >
    សម្រាប់ការអានមានឈ្មោះច្រើនក្នុងពេលតែមួយ — ផ្ទាំងព័ត៌មានតូចមួយ ដែលតម្លៃនីមួយៗមានផ្ទះថេររបស់វា។
  caption: >
    ស្លាកក្នុងក្រឡាមួយ និងតម្លៃរស់របស់វានៅក្បែរ។

cyberpi.cyberpi_display_set_brush_with_color:
  what: >
    ជ្រើសពណ៌ដែលអត្ថបទ និងការគូរនៅពេលក្រោយនឹងប្រើ ពីឧបករណ៍ជ្រើសពណ៌។
  when: >
    ដើម្បីធ្វើឲ្យបន្ទាត់មួយលេចធ្លោពីបន្ទាត់ដទៃ — ការព្រមានពណ៌ក្រហមក្នុងចំណោមការអានពណ៌ស។
  caption: >
    ជ្រើសពណ៌ រួចអ្វីៗដែលបោះពុម្ពក្រោយមកប្រើវា។
  watch: >
    វាប្ដូរអ្វីដែលមក បន្ទាប់។ អត្ថបទដែលនៅលើអេក្រង់រួចហើយ រក្សាពណ៌ដែលវាត្រូវបានគូរ។

cyberpi.cyberpi_display_set_brush_with_r_g_b:
