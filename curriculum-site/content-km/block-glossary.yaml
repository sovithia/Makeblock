operator_equals:
  what: >
    រាយការណ៍ពិត ពេលរបស់ទាំងពីរដូចគ្នាបេះបិទ។ វាដំណើរការលើពាក្យដូចលើលេខដែរ។
  when: >
    សម្រាប់ការផ្គូផ្គងតម្លៃពិតប្រាកដ — ពាក្យបញ្ជាដែលឮ លេខរបៀប ឧបករណ៍រាប់ឈានដល់គោលដៅ។
  caption: >
    ធ្វើចលនាតែពេលពាក្យដែលឮគឺ «go» ពិតប្រាកដ។
  watch: >
    បេះបិទមានន័យថាបេះបិទ។ ការអានឧបករណ៍ចាប់សញ្ញាដែលរេរាបន្តិច នឹងមិនដែលស្មើលេខថេរឡើយ —
    ប្រើតិចជាង ឬធំជាងសម្រាប់ករណីទាំងនោះ។

operator_and:
  what: >
    រាយការណ៍ពិត តែពេលសំណួរ ទាំងពីរ ខាងក្នុងវាពិត។
  when: >
    ពេលរឿងពីរត្រូវពិតក្នុងពេលតែមួយ — ជិតល្មម និង នៅលើបន្ទាត់ ប៊ូតុងសង្កត់ និង កំពុងធ្វើចលនា។
  caption: >
    ឆ្លើយតបតែពេលមានវត្ថុទាំងជិត និងទាំងមានសំឡេង។

operator_or:
  what: >
    រាយការណ៍ពិត ពេលសំណួរ ណាមួយ ខាងក្នុងវាពិត — ឬទាំងពីរ។
  when: >
    ពេលរឿងណាមួយក្នុងចំណោមច្រើនគួរបង្កឲ្យមានការឆ្លើយតបដូចគ្នា។ ឧបករណ៍ចាប់ការប៉ះពីរ ម្ខាងៗ។
  caption: >
    ប៊ូតុងស្មាណាមួយបញ្ឈប់រូបយន្ត។

operator_not:
  what: >
    ត្រឡប់សំណួរ៖ ពិតក្លាយជាមិនពិត មិនពិតក្លាយជាពិត។
  when: >
    ពេលរឿងដែលអ្នកអាចសួរបាន គឺផ្ទុយពីរឿងដែលអ្នកខ្វល់។ «មិននៅលើបន្ទាត់» ងាយសរសេរជាង
    បញ្ជីនៃគ្រប់វិធីដែលអាចនៅក្រៅវា។
  caption: >
    ស្វែងរកបន្ទាត់គ្រប់ពេលដែលឧបករណ៍ចាប់មើលមិនឃើញវា។

operator_join:
  what: >
    ភ្ជាប់អត្ថបទពីរបំណែកចូលគ្នា ហើយរាយការណ៍លទ្ធផល។
  when: >
    សម្រាប់សាងសារពីស្លាក និងតម្លៃ ដើម្បីឲ្យអេក្រង់អាន «dist=23» ជំនួស ២៣ ទទេ។
  caption: >
    ការអានដែលមានឈ្មោះភ្ជាប់ ដែលងាយអានឆ្លងកាត់ថ្នាក់ជាងឆ្ងាយណាស់។

operator_letter_of:
  what: >
    រាយការណ៍តួអក្សរតែមួយចេញពីអត្ថបទ ដោយរាប់ចាប់ពី ១។
  when: >
    កម្រណាស់ក្នុងវគ្គសិក្សានេះ។ វាសំខាន់ពេលពាក្យបញ្ជាមកជាអត្ថបទ ហើយមានតែអក្សរដំបូងទេដែលសម្រេចថាត្រូវធ្វើអ្វី។
  caption: >
    អក្សរទីមួយនៃ «forward» គឺ f។

operator_length:
  what: >
    រាយការណ៍ថាមានតួអក្សរប៉ុន្មានក្នុងអត្ថបទមួយ។
  when: >
    ពេលអ្នកត្រូវការទំហំរបស់ពាក្យ ជាជាងខ្លឹមសាររបស់វា។
  caption: >
    «forward» មានប្រវែងប្រាំពីរតួអក្សរ។
  watch: >
    នេះជាប្លុកសម្រាប់ អត្ថបទ។ មានប្លុកទីពីរដែលសរសេរស្ទើរដូចគ្នាបេះបិទក្នុងថតដដែលនេះ
    គឺ «length of my list» ដែលរាប់ធាតុក្នុងបញ្ជី។ ការដាក់ប្លុកអត្ថបទលើឈ្មោះបញ្ជី វាស់ ឈ្មោះ —
    បញ្ជីឈ្មោះ route រាយការណ៍ ៥ រាល់ពេល ទោះមានអ្វីនៅខាងក្នុងក៏ដោយ។

operator_contains:
  what: >
    រាយការណ៍ពិត ពេលអត្ថបទទីមួយមានអត្ថបទទីពីរនៅកន្លែងណាមួយខាងក្នុង។
  when: >
    សម្រាប់ការផ្គូផ្គងធូរ ជាកន្លែងដែល equals តឹងពេក — ពិនិត្យថាឃ្លាដែលឮមានពាក្យ «stop»
    ដោយមិនទាមទារឲ្យវាជាពាក្យតែមួយគត់។
  caption: >
    «please stop now» មាន «stop» ដូច្នេះវាបង្កឲ្យដំណើរការ ខណៈ equals មិនធ្វើ។

operator_mathop:
  what: >
    គ្រួសារអនុគមន៍គណិតវិទ្យាទាំងមូលក្នុងប្លុកតែមួយ — តម្លៃដាច់ខាត floor ceiling ឫសការ៉េ
    និងអនុគមន៍ត្រីកោណមាត្រ — ជ្រើសពីបញ្ជីទម្លាក់ចុះរបស់វា។
  when: >
    ភាគច្រើនគឺ «abs» ដែលបោះចោលសញ្ញាដក។ ឧបករណ៍ចាប់បន្ទាត់ដែលរាយការណ៍ -៤០ និងមួយដែលរាយការណ៍ ៤០
    គឺឆ្ងាយពីគ្នាស្មើគ្នា; abs អនុញ្ញាតឲ្យអ្នកសួរ «ឆ្ងាយប៉ុណ្ណា» ដោយមិនខ្វល់ខាងណា។
  caption: >
    ឈប់ពេលរូបយន្តឃ្លាតឆ្ងាយពីបន្ទាត់ខ្លាំង ទោះវារេទៅខាងណាក៏ដោយ។

cyberpi.cyberpi_operator_casts:
  what: >
    បម្លែងតម្លៃពីប្រភេទមួយទៅប្រភេទមួយទៀត — អត្ថបទទៅជាចំនួនគត់ លេខទៅជាអត្ថបទ។
  when: >
    ពេលអ្វីមួយមកជាអត្ថបទ តែត្រូវប្រើជាលេខ។ តម្លៃដែលទទួលតាមបណ្តាញ ឬអានពីអេក្រង់ គឺជាអត្ថបទ
    ទោះវាមើលទៅដូចលេខក៏ដោយ។
  caption: >
    អត្ថបទ «50» ក្លាយជាលេខ ៥០ ដែលប្លុកម៉ូទ័រអាចប្រើបាន។

