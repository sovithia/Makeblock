cyberpi.cyberpi_led_show_single_with_rgb_2:
  what: >
    បញ្ចេញពន្លឺ LED មួយក្នុងចំណោមប្រាំ ឬទាំងអស់ ក្នុងពណ៌ដែលអ្នកលាយពីតម្លៃក្រហម បៃតង និងខៀវ
    ចន្លោះ ០ និង ២៥៥។ ពន្លឺនៅតែបើក រហូតដល់មានអ្វីប្ដូរវា។
  when: >
    ភ្លើងស្ថានភាពដ៏សំខាន់។ ដោយសារពណ៌ធ្វើពីលេខ កម្មវិធីអាចគណនាវា — បៃតងពេលទំនេរ
    ក្រហមពេលជាប់ និងអ្វីៗនៅចន្លោះ។
  caption: >
    រូបយន្តប្រាប់ថាវាឃើញអ្វី ដោយគ្មាននរណាត្រូវអានអេក្រង់។
  watch: >
    ០, ០, ០ គឺបិទ។ ២៥៥, ២៥៥, ២៥៥ គឺពណ៌ស និងភ្លឺខ្លាំងណាស់។

cyberpi.cyberpi_led_show_single_with_rgb_and_time:
  what: >
    ដូចគ្នា តែពន្លឺបើកអស់រយៈពេលជាវិនាទី រួចរលត់ដោយខ្លួនឯង។ ស្គ្រីបរង់ចាំខណៈវាធ្វើ។
  when: >
    សម្រាប់ការភ្លឺមួយភ្លែតដែលមិនចាំបាច់សម្អាតក្រោយមក — ការភ្លឹបភ្លែតបញ្ជាក់ការចុចប៊ូតុង។
  caption: >
    ការភ្លឺបៃតងមួយវិនាទី រួចងងឹតវិញដោយខ្លួនឯង។

cyberpi.cyberpi_led_show_single_with_color_2:
  what: >
    បញ្ចេញពន្លឺ LED ក្នុងពណ៌ដែលអ្នកជ្រើសពីគំរូពណ៌ ជំនួសការលាយពីលេខ។
  when: >
    ពេលអ្នកគ្រាន់តែចង់បានពណ៌មួយ ហើយមិនត្រូវការឲ្យកម្មវិធីគណនាវា។ លឿនជាងកំណែ RGB។
  caption: >
    ចុចគំរូពណ៌ ជ្រើសពណ៌ ចប់។

cyberpi.cyberpi_led_show_single_with_color_and_time_2:
  what: >
    ពណ៌ដែលជ្រើស បើកអស់រយៈពេលកំណត់ រួចបិទដោយខ្លួនឯង។
  when: >
    កំណែរហ័សនៃការភ្លឺមួយភ្លែតតាមពេលវេលា។
  caption: >
    ការភ្លឺមួយវិនាទីក្នុងពណ៌ដែលអ្នកជ្រើស។

cyberpi.cyberpi_led_off_2:
  what: >
    បិទ LED មួយ ឬទាំងប្រាំ។
  when: >
    នៅចុងបញ្ចប់នៃអ្វីៗដែលបានបើកវា។ រូបយន្តដែលទុកឲ្យភ្លឺក្រោយកម្មវិធីបញ្ចប់ មើលទៅដូចរូបយន្ត
    ដែលនៅតែដំណើរការ។
  caption: >
    ភ្លើងបិទ។

cyberpi.cyberpi_play_led_animation_until:
  what: >
    ចាក់ការបង្ហាញភ្លើងដែលមានស្រាប់ — rainbow, spindrift, meteor, firefly — ហើយរង់ចាំរហូតដល់វាចប់។
  when: >
    សម្រាប់ការអបអរ និងសម្រាប់សញ្ញា «កំពុងធ្វើការ»។ ប្លុកមួយធ្វើអ្វីដែលប្លុក LED និងការរង់ចាំដប់ធ្វើ។
  caption: >
    ការតុបតែងខ្សែបញ្ចប់៖ ភ្លើងរត់ រួចទើបវាបន្លឺសំឡេង។
  watch: >
    ស្គ្រីបរង់ចាំ។ គ្មានអ្វីផ្សេងក្នុងវាកើតឡើងខណៈចលនាភ្លើងកំពុងចាក់។

cyberpi.cyberpi_show_led:
  what: >
    កំណត់ LED ទាំងប្រាំក្នុងពេលតែមួយ ពីជួរគំរូពណ៌តូចដែលអ្នកបំពេញលើប្លុកផ្ទាល់។
  when: >
    ពេលភ្លើងទាំងប្រាំជារូបភាព ជាជាងស្ថានភាពមួយ — មាត្រវាស់កម្រិត ទ្រនិចប្រាប់ទិស លំនាំមួយ។
  caption: >
    លាបភ្លើងទាំងប្រាំម្ដងមួយៗ ដោយផ្ទាល់លើប្លុក។

cyberpi.cyberpi_move_led:
  what: >
    រំកិលអ្វីដែលភ្លើងកំពុងបង្ហាញ ជុំវិញរង្វង់តាមចំនួនកន្លែង។
  when: >
    ដើម្បីធ្វើចលនាលំនាំដែលអ្នកបានកំណត់ — ចំណុចមួយដេញជុំវិញរង្វង់ ធ្វើដោយបញ្ចេញពន្លឺ LED មួយ
    ហើយរំកិលវា។
  caption: >
    អ្វីដែលនៅលើរង្វង់ធ្វើដំណើរជុំវិញវា។

cyberpi.cyberpi_set_led_brightness:
  what: >
    កំណត់ថា LED ភ្លឺប៉ុណ្ណា ជាភាគរយ ដោយមិនប្ដូរពណ៌របស់វា។
  when: >
    ជាធម្មតាម្ដងនៅដើម។ ភាពភ្លឺពេញគឺចាំងភ្នែកនៅក្នុងអគារ ហើយបង្ហូរថ្មលឿនជាង។
  caption: >
    ស្រួលមើល និងសន្សំថ្មជាង។

cyberpi.cyberpi_add_led_brightness:
  what: >
    បង្កើន ឬបន្ថយភាពភ្លឺ LED មួយជំហាន។ លេខអវិជ្ជមានធ្វើឲ្យស្រអាប់។
  when: >
    សម្រាប់ការភ្លឺបន្តិចម្ដងៗ និងសម្រាប់ភាពភ្លឺដែលឆ្លើយតបនឹងអ្វីមួយ ដោយអ្នកមិនចាំបាច់តាមដានកម្រិត។
  caption: >
    រង្វង់ភ្លឺឡើងបន្តិចម្ដងៗក្នុងរយៈពេលមួយវិនាទី។

cyberpi.cyberpi_get_led_brightness:
  what: >
    រាយការណ៍ភាពភ្លឺ LED បច្ចុប្បន្នជាភាគរយ។
  when: >
    ពេលការភ្លឺបន្តិចម្ដងៗត្រូវដឹងថាវាទៅដល់ណា ឬដើម្បីបង្ហាញការកំណត់លើអេក្រង់។
  caption: >
    អានភាពភ្លឺត្រឡប់មកវិញ។

# ----------------------------------------------------------------------- Audio
cyberpi.cyberpi_play_audio_3:
  what: >
    ចាក់សំឡេងមួយក្នុងចំណោមសំឡេងដែលមានស្រាប់របស់ CyberPi ហើយឲ្យស្គ្រីបបន្តភ្លាមខណៈវាចាក់។
  when: >
    សម្រាប់ការទទួលស្គាល់រហ័សដែលមិនត្រូវទប់អ្វី — សំឡេងខ្លីពេលចុចប៊ូតុង ខណៈរូបយន្តបន្តបើកបរ។
  caption: >
    សំឡេង និងការបើកបរចាប់ផ្ដើមជាមួយគ្នា។

cyberpi.cyberpi_play_audio_until_3:
  what: >
    ចាក់សំឡេងដែលមានស្រាប់ ហើយរង់ចាំរហូតដល់វាចប់ មុនពេលស្គ្រីបបន្ត។
  when: >
    ពេលសំឡេងជាចំណុចសំខាន់ — ការរាប់ថយក្រោយ ភ្លេងអបអរនៅខ្សែបញ្ចប់ — ហើយអ្វីបន្ទាប់មិនគួរជាន់លើវា។
  caption: >
    ទុកឲ្យសំឡេងចប់ រួចទើបងងឹត។

cyberpi.cyberpi_play_buzzer_tone:
  what: >
    បន្លឺសំឡេងតាមប្រេកង់ដែលអ្នកឲ្យជាហឺត្ស ហើយបន្តភ្លាម។ លេខធំជាងជាសំឡេងខ្ពស់ជាង។
  when: >
    ពេលកម្រិតសំឡេងគួរមានន័យអ្វីមួយ — សំឡេងដែលឡើងខ្ពស់ពេលរូបយន្តចូលមកជិតជញ្ជាំង
    គឺជាឧបករណ៍ចាប់សញ្ញាដែលអ្នកអាចស្តាប់ឮ។
  caption: >
    រូបយន្តហ៊ូទាបចុះពេលវាចូលមកជិតជញ្ជាំង។

cyberpi.cyberpi_play_buzzer_tone_with_time:
  what: >
    បន្លឺសំឡេងអស់រយៈពេលជាវិនាទី ហើយរង់ចាំខណៈវាធ្វើ។
  when: >
    សម្រាប់សំឡេងប៊ីបដែលមានប្រវែងច្បាស់លាស់ — ម៉ែត្រូណូម ការរាប់ថយក្រោយ។
  caption: >
    សំឡេងខ្លីបី មួយក្នុងមួយវិនាទី។

cyberpi.cyberpi_play_music_with_tone_and_note_2:
  what: >
    ចាក់ណូតតន្ត្រីអស់ចំនួនចង្វាក់ ដោយកម្រិតសំឡេងជ្រើសពីក្ដារចុចលើប្លុក។
  when: >
    សម្រាប់បទភ្លេង ជាជាងសំឡេងប៊ីប។ ណូត និងចង្វាក់ងាយតែងជាងប្រេកង់ និងវិនាទី។
  caption: >
    ណូតពីរនៃបទភ្លេងមួយ។

cyberpi.cyberpi_play_music_with_note:
  what: >
    ចាក់សំឡេងស្គរអស់ចំនួនចង្វាក់។
  when: >
    សម្រាប់ចង្វាក់ — សម្គាល់ពេលវេលា រាប់ជុំដោយសំឡេង។
  caption: >
    បួនចង្វាក់លើស្គរតូច។

cyberpi.cyberpi_start_record:
  what: >
    ចាប់ផ្ដើមថតសំឡេងតាមមីក្រូហ្វូនរបស់ CyberPi។
  when: >
    ពេលរូបយន្តគួរចាប់យកអ្វីមួយដើម្បីចាក់ឡើងវិញពេលក្រោយ — សារមួយ សំឡេងពីបន្ទប់។
  caption: >
    ការថតបីវិនាទី ចាប់ផ្ដើម និងបញ្ឈប់ដោយកម្មវិធី។

cyberpi.cyberpi_stop_record:
  what: >
    បញ្ឈប់ការថតដែលកំពុងដំណើរការ។
  when: >
    ជានិច្ច បន្ទាប់ពីចាប់ផ្ដើមថត។ ការថតមិនឈប់ដោយខ្លួនឯងទេ។
  caption: >
    B បញ្ចប់ការថត។

cyberpi.cyberpi_play_record:
  what: >
    ចាក់ការថតចុងក្រោយឡើងវិញ ហើយបន្តភ្លាម។
  when: >
    ពេលការចាក់ឡើងវិញគួរកើតឡើងស្របជាមួយអ្វីផ្សេង។
  caption: >
    រូបយន្តនិយាយ និងបើកបរក្នុងពេលតែមួយ។

cyberpi.cyberpi_play_record_until:
  what: >
    ចាក់ការថតចុងក្រោយឡើងវិញ ហើយរង់ចាំរហូតដល់វាចប់។
  when: >
    ពេលគ្មានអ្វីគួរកើតឡើងរហូតដល់សារត្រូវបានស្តាប់ឮ។
  caption: >
    សារចាក់ចប់ទាំងស្រុងមុនពេលពាក្យលា។

cyberpi.cyberpi_set_volume:
  what: >
    កំណត់កម្រិតសំឡេងឧបករណ៍បំពងជាភាគរយ។
  when: >
    ម្ដងនៅដើម។ រូបយន្តម្ភៃក្នុងកម្រិតសំឡេងពេញក្នុងថ្នាក់តែមួយ គឺជាបញ្ហាពិតប្រាកដ។
  caption: >
    ខ្លាំងល្មមសម្រាប់ក្រុមមួយ ស្ងាត់ល្មមសម្រាប់បន្ទប់។

cyberpi.cyberpi_add_volume:
  what: >
    បង្កើន ឬបន្ថយកម្រិតសំឡេងមួយជំហាន; លេខអវិជ្ជមានបន្ថយវា។
  when: >
    សម្រាប់កម្រិតសំឡេងដែលអ្នកប្រើអាចកែសម្រួលដោយប៊ូតុង។
  caption: >
    រុញដងឡើងលើដើម្បីបង្កើនសំឡេង។

cyberpi.cyberpi_get_volume:
  what: >
    រាយការណ៍កម្រិតសំឡេងបច្ចុប្បន្នជាភាគរយ។
  when: >
    ដើម្បីបង្ហាញការកំណត់លើអេក្រង់ខណៈមានអ្នកកែសម្រួលវា។
  caption: >
    បង្ហាញថាកម្រិតសំឡេងឥឡូវនេះជាអ្វី។

cyberpi.cyberpi_set_audio_speed:
  what: >
    កំណត់ល្បឿនចាក់សំឡេងជាភាគរយ; ក្រោម ១០០ គឺយឺតជាង និងទាបជាង លើសគឺលឿនជាង និងខ្ពស់ជាង។
  when: >
    សម្រាប់លក្ខណៈ — សំឡេងដែលបន្ថយល្បឿន សំឡេងស្រួចដូចកញ្ជ្រោង។
  caption: >
    សំឡេងដដែល ក្នុងល្បឿនពាក់កណ្ដាល។

cyberpi.cyberpi_add_audio_speed:
  what: >
    រុញល្បឿនចាក់ឡើង ឬចុះមួយជំហាន។
  when: >
    សម្រាប់ឥទ្ធិពលដែលប្ដូរបន្តិចម្ដងៗ។
  caption: >
    សំឡេងដដែល លឿនជាងរាល់លើក។

cyberpi.cyberpi_get_audio_speed:
  what: >
    រាយការណ៍ល្បឿនចាក់បច្ចុប្បន្នជាភាគរយ។
  when: >
    ដើម្បីបង្ហាញ ឬស្តារការកំណត់។
  caption: >
    អានល្បឿនត្រឡប់មកវិញ។

cyberpi.cyberpi_stop_audio:
  what: >
    បញ្ឈប់អ្វីៗទាំងអស់ដែលកំពុងបន្លឺសំឡេង ក្នុងពេលតែមួយ។
  when: >
    ដើម្បីកាត់សំឡេងវែងឲ្យចប់មុនកាល និងជាផ្នែកនៃប៊ូតុងបញ្ឈប់។
  caption: >
    ភាពស្ងាត់ និងភាពនឹងធឹងជាមួយគ្នា។

# --------------------------------------------------------------------- Sensing
cyberpi.cyberpi_button_press:
  what: >
    រាយការណ៍ពិត ខណៈប៊ូតុង A ឬ B ត្រូវសង្កត់។ វាជាសំណួរ មិនមែនប្លុកមួកទេ — វាប្រាប់អ្នកនូវស្ថានភាពឥឡូវនេះ។
  when: >
    ក្នុងរង្វិលជុំ ឬការរង់ចាំ ពេលអ្នកចង់សួរ ជាជាងត្រូវរំខាន។ វាជាអ្វីដែល «wait until button A pressed» សង់ពី។
  caption: >
    ច្រកទ្វារដែលរក្សាកម្មវិធីអាប់ឡូតឲ្យនៅស្ងៀម រហូតដល់មានអ្នកត្រៀមរួច។

cyberpi.cyberpi_button_count:
  what: >
    រាយការណ៍ថាប៊ូតុងមួយត្រូវបានចុចប៉ុន្មានដង ចាប់តាំងពីចំនួនត្រូវបានកំណត់ឡើងវិញចុងក្រោយ។
  when: >
    ដើម្បីវិលឆ្លងកាត់របៀបផ្សេងៗដោយមិនប្រើអថេរផ្ទាល់ខ្លួន — ចុច A បីដងសម្រាប់របៀបទីបី។
  caption: >
    បង្ហាញចំនួនសរុបនៃការចុច។

cyberpi.cyberpi_button_count_reset:
  what: >
    កំណត់ចំនួនចុចរបស់ប៊ូតុងត្រឡប់ទៅសូន្យ។
  when: >
    នៅដើមកម្មវិធី និងគ្រប់ពេលដែលវដ្តរបៀបគួរចាប់ផ្ដើមម្ដងទៀត។
  caption: >
    ចាប់ផ្ដើមរាប់ពីសូន្យ។

cyberpi.cyberpi_direction_key_press:
  what: >
    រាយការណ៍ពិត ខណៈឈ្នាន់របស់ CyberPi ផ្ទាល់ត្រូវសង្កត់ក្នុងទិសមួយ។
  when: >
    សម្រាប់ការបញ្ជាទិស ឬការរុករកម៉ឺនុយដោយប្រើដងលើផ្ទាំង ក្នុងរង្វិលជុំ។
  caption: >
    រូបយន្តបើកបរតែខណៈដងត្រូវសង្កត់ទៅមុខ។

cyberpi.cyberpi_direction_key_count:
  what: >
    រាយការណ៍ថាឈ្នាន់លើផ្ទាំងត្រូវបានរុញក្នុងទិសមួយប៉ុន្មានដង ចាប់តាំងពីចំនួនត្រូវកំណត់ឡើងវិញ។
  when: >
    សម្រាប់ការឈានឆ្លងកាត់បញ្ជីជម្រើសដោយប្រើដង។
  caption: >
    តើដងត្រូវបានរុញឡើងលើប៉ុន្មានដង?

cyberpi.cyberpi_direction_key_count_reset:
  what: >
    កំណត់ចំនួននៃទិសឈ្នាន់មួយត្រឡប់ទៅសូន្យ។
  when: >
    មុនពេលចាប់ផ្ដើមរាប់ថ្មី។
  caption: >
    កំណត់ឧបករណ៍រាប់ទៅសូន្យពេលចាប់ផ្ដើម។

cyberpi.cyberpi_loudness:
  what: >
    រាយការណ៍ថាបន្ទប់ខ្លាំងប៉ុណ្ណាឥឡូវនេះ ជាលេខ។ ស្ងាត់គឺជិតសូន្យ; ការទះដៃគឺខ្ពស់។
  when: >
    សម្រាប់ឥរិយាបថដែលបង្កដោយសំឡេង — ចាប់ផ្ដើមលើការទះដៃ ឈប់ពេលបន្ទប់ស្ងាត់។
    ក៏ជាវិធីត្រឹមត្រូវដើម្បីជ្រើសកម្រិតកំណត់ដែរ៖ បោះពុម្ពវាក្នុងថ្នាក់ពិតមុនពេលជ្រើសលេខ។
  caption: >
    រូបយន្តឆ្លើយតបនឹងសំឡេងខ្លាំង។
  watch: >
    បន្ទប់ស្ងាត់ និងសាលធំដែលមានសំឡេង ត្រូវការលេខខុសគ្នា។ ត្រូវវាស់មុនពេលជ្រើស។

cyberpi.cyberpi_brightness:
  what: >
    រាយការណ៍ថាពន្លឺដែលធ្លាក់លើ CyberPi ភ្លឺប៉ុណ្ណា ជាលេខ។
  when: >
    សម្រាប់ការដើរតាមពន្លឺ និងការគេចពីពន្លឺ និងសម្រាប់កត់សម្គាល់ការប្ដូរ — ដៃដែលឆ្លងកាត់លើរូបយន្ត
    ធ្វើឲ្យការអានធ្លាក់ចុះយ៉ាងខ្លាំង។
  caption: >
    រូបយន្តបំភ្លឺផ្លូវរបស់ខ្លួនពេលបន្ទប់ងងឹត។
  watch: >
    ភ្លើងបន្ទប់ប្ដូរពេញមួយថ្ងៃ។ កម្រិតកំណត់ដែលដំណើរការនៅព្រឹកនេះ អាចមិនដំណើរការនៅរសៀលនេះទេ។

cyberpi.cyberpi_timer_get:
  what: >
    រាយការណ៍ថាកន្លងផុតទៅប៉ុន្មានវិនាទី ចាប់តាំងពីនាឡិកាត្រូវកំណត់ឡើងវិញចុងក្រោយ។
  when: >
    សម្រាប់អ្វីៗដែលវាស់ជាពេលវេលាកន្លងផុត — ពេលវេលាមួយជុំ ការអស់ពេល ឥរិយាបថដែលប្ដូរបន្ទាប់ពីមួយរយៈ។
  caption: >
    តើវាចំណាយពេលប៉ុន្មានដើម្បីទៅដល់ជញ្ជាំង?

cyberpi.cyberpi_timer_reset:
  what: >
    កំណត់នាឡិកាត្រឡប់ទៅសូន្យ។
  when: >
    ភ្លាមមុនអ្វីដែលអ្នកកំពុងវាស់ពេល។
  caption: >
    ចាប់ផ្ដើមនាឡិកា។

cyberpi.cyberpi_name:
  what: >
    រាយការណ៍ឈ្មោះផ្ទាល់របស់ CyberPi ដែលវាបង្ហាញពេលភ្ជាប់។
  when: >
    ក្នុងថ្នាក់ដែលមានរូបយន្តដូចគ្នា ដើម្បីដាក់ឈ្មោះនីមួយៗលើអេក្រង់របស់វាផ្ទាល់។
  caption: >
    រូបយន្តនីមួយៗប្រាប់ថាវាជាមួយណា។

cyberpi.cyberpi_battery_macaddress_blename_and_so_on:
  what: >
    រាយការណ៍ការពិតមួយអំពីផ្ទាំងខ្លួនឯង ជ្រើសពីបញ្ជីទម្លាក់ចុះ — កម្រិតថ្ម អាសយដ្ឋាន MAC
    ឈ្មោះ Bluetooth ភាសាប្រព័ន្ធ។
  when: >
    កម្រិតថ្មជារបស់ដែលមានប្រយោជន៍។ រូបយន្តដែលមានឥរិយាបថចម្លែក ជាញឹកញាប់គឺរូបយន្តដែលថ្មជិតអស់។
  watch: >
    ប្លុកទាំងមូលជាបញ្ជីទម្លាក់ចុះមួយ ដូច្នេះការពិតណាដែលវារាយការណ៍ ត្រូវជ្រើសនៅលើប្លុកផ្ទាល់
    ជាជាងវាយចូលរន្ធ។

cyberpi.cyberpi_makex_mode:
  what: >
    រាយការណ៍ថារូបយន្តស្ថិតក្នុងដំណាក់កាលស្វ័យប្រវត្តិ ឬដំណាក់កាលដោយដៃ នៃជុំប្រកួត MakeX។
  when: >
    តែក្នុងការប្រកួត MakeX ដែលដំណើរការកម្មវិធីជាពីរដំណាក់កាល។
  caption: >
    មានឥរិយាបថខុសគ្នាអាស្រ័យលើដំណាក់កាលណាដែលជុំនោះស្ថិតនៅ។

# -------------------------------------------------------------- Motion Sensing
cyberpi.cyberpi_detect_attitude:
  what: >
    រាយការណ៍ពិត ខណៈ CyberPi ត្រូវបានកាន់នៅមុំជាក់លាក់មួយ។
  when: >
    ក្នុងរង្វិលជុំ ដើម្បីពិនិត្យទិសដៅ ជាជាងត្រូវរំខានដោយវា។ ក៏ជាវិធីកត់សម្គាល់ថារូបយន្តដួលដែរ។
  caption: >
    ផ្អៀងរូបយន្តទៅមុខ ហើយវាបើកបរ; ដាក់វាឲ្យរាបស្មើ ហើយវាឈប់។

cyberpi.cyberpi_detect_action:
  what: >
    រាយការណ៍ពិត ពេលកាយវិការមួយទើបត្រូវបានធ្វើ — ការគ្រវីក្នុងទិសមួយ ឬការបង្វិល។
  when: >
    ក្នុងរង្វិលជុំ ពេលកាយវិការគួរជាមួយក្នុងចំណោមរបស់ច្រើនដែលអ្នកកំពុងពិនិត្យ។
  caption: >
    ការគ្រវីឡើងលើទទួលបានចម្លើយ។

cyberpi.cyberpi_tilt_degree:
  what: >
    រាយការណ៍មុំផ្អៀងពិតជាដឺក្រេ ជាជាងបាទ ឬទេ។
  when: >
    ពេលបរិមាណសំខាន់ — រូបយន្តដែលបើកបរតាមសមាមាត្រនឹងកម្រិតដែលវាត្រូវផ្អៀង
    ឬសំណង់ដែលត្រូវរក្សាឲ្យរាបស្មើ។
  caption: >
    ផ្អៀងវាកាន់តែច្រើន ហើយវាបើកបរកាន់តែលឿន។

cyberpi.cyberpi_shaked_value:
  what: >
    រាយការណ៍ថាផ្ទាំងត្រូវបានអង្រួនខ្លាំងប៉ុណ្ណា ជាលេខ។
  when: >
    សម្រាប់ការអង្រួនដើម្បីចាប់ផ្ដើម ឬអង្រួនដើម្បីកំណត់ឡើងវិញ ជាកន្លែងដែលកម្រិតកំណត់
    ងាយស្រួលជាងកាយវិការបាទ/ទេ។
  caption: >
    អង្រួនវាឲ្យខ្លាំងដើម្បីធ្វើឲ្យវាចាប់ផ្ដើម។

cyberpi.cyberpi_wave_angle:
  what: >
    រាយការណ៍ទិសនៃការគ្រវី ជាដឺក្រេ។
  when: >
    ពេលកាយវិការគួរចង្អុលទៅកន្លែងណាមួយ ជាជាងជ្រើសពីឈ្មោះបួន។
  caption: >
    តើការគ្រវីនោះទៅទិសណា?

cyberpi.cyberpi_wave_speed:
  what: >
    រាយការណ៍ថាផ្ទាំងត្រូវបានគ្រវីលឿនប៉ុណ្ណា។
  when: >
    ដើម្បីបែងចែកចលនាថ្នមៗពីចលនាមុតស្រួច។
  caption: >
    តើនោះខ្លាំងក្លាប៉ុណ្ណា?

cyberpi.cyberpi_axis_acceleration:
  what: >
    រាយការណ៍សំទុះតាមអ័ក្សមួយ គិតជាម៉ែត្រក្នុងវិនាទីការ៉េ។ ពេលនៅស្ងៀម អ័ក្សដែលចង្អុលចុះក្រោម
    អានប្រហែល ៩.៨ ព្រោះទំនាញផែនដីមិនដែលឈប់ទាញ។
  when: >
    សម្រាប់ការរកឃើញការគោះ ការធ្លាក់ និងការឈប់ភ្លាមៗ — ការបុកគឺជាកំពូលធំមួយភ្លែត។
  caption: >
    មើលការលោតខណៈរូបយន្តបើកបរឆ្លងកាត់វា។

cyberpi.cyberpi_axis_angle_speed:
  what: >
    រាយការណ៍ថាផ្ទាំងកំពុងបង្វិលលឿនប៉ុណ្ណាជុំវិញអ័ក្សមួយ គិតជាដឺក្រេក្នុងមួយវិនាទី។
  when: >
    ដើម្បីវាស់ការបង្វិលខណៈវាកំពុងកើតឡើង ជាជាងចំនួនសរុបបន្ទាប់ពីវា។
  caption: >
    តើរូបយន្តកំពុងបង្វិលលឿនប៉ុណ្ណាឥឡូវនេះ?

cyberpi.cyberpi_axis_rotation_angle:
  what: >
    រាយការណ៍មុំសរុបដែលបានបង្វិលជុំវិញអ័ក្សមួយ ចាប់តាំងពីការកំណត់ឡើងវិញចុងក្រោយ
    ដោយបូកបន្ថែមខណៈរូបយន្តបង្វិល។
  when: >
    សម្រាប់ការបង្វិលតាមមុំដែលស្គាល់ ដោយមិនទុកចិត្តកង់។ នៅលើឥដ្ឋរអិល កង់កុហកអំពីការបង្វិល
    ហើយឧបករណ៍នេះមិនកុហកទេ។
  caption: >
    បង្វិលរហូតដល់រូបយន្តបានបង្វិលមុំកែងពិតប្រាកដ រួចឈប់។
  watch: >
    ចំនួនសរុបនៅតែកើនរហូតដល់កំណត់ឡើងវិញ ដូច្នេះត្រូវកំណត់ឡើងវិញមុនពេលអ្នកវាស់។

cyberpi.cyberpi_reset_axis_rotation_angle:
  what: >
    កំណត់ការបង្វិលដែលប្រមូលបានត្រឡប់ទៅសូន្យ សម្រាប់អ័ក្សមួយ ឬទាំងបី។
  when: >
    ភ្លាមមុនការបង្វិលដែលអ្នកមានបំណងវាស់។
  caption: >
    កំណត់ឧបករណ៍រាប់មុំទៅសូន្យ។

cyberpi.cyberpi_reset_yaw:
  what: >
    កំណត់ទិសក្បាលរបស់រូបយន្តទៅសូន្យ ដោយធ្វើឲ្យទិសណាដែលវាកំពុងចង្អុលក្លាយជាទិសមុខថ្មី។
  when: >
    នៅដើមដំណើរមួយ ដូច្នេះទិសក្បាលត្រូវវាស់ពីកន្លែងដែលរូបយន្តពិតជាចាប់ផ្ដើម
    ជាជាងពីកន្លែងដែលវាត្រូវបានបើក។
  caption: >
    ទិសនេះឥឡូវជាទិសខាងជើង។

cyberpi.cyberpi_follow_mblock_sprite:
  what: >
    ភ្ជាប់តួអង្គលើឆាក mBlock ទៅនឹងចលនារបស់ CyberPi ដូច្នេះការផ្អៀងផ្ទាំងធ្វើឲ្យតួអង្គផ្លាស់ទី។
  when: >
    តែរបៀប Live ប៉ុណ្ណោះ ពេលរូបយន្តត្រូវបានប្រើជាឧបករណ៍បញ្ជាសម្រាប់អ្វីមួយលើអេក្រង់។
  caption: >
    ផ្ទាំងក្លាយជាឧបករណ៍បញ្ជាតាមការផ្អៀងសម្រាប់ឆាក។

# ------------------------------------------------------------------------- LAN
cyberpi.cyberpi_set_wifi_broadcast:
  what: >
    ផ្ញើសារដែលមានឈ្មោះទៅ CyberPi គ្រប់គ្រឿងលើឆានែលបណ្តាញមូលដ្ឋានតែមួយ។
  when: >
    ពេលរូបយន្តត្រូវធ្វើការជាមួយគ្នា — មួយចាប់ផ្ដើម ហើយឯទៀតដើរតាម។
  caption: >
    រូបយន្តមួយប្រាប់រូបយន្តឯទៀតទាំងអស់ឲ្យចាប់ផ្ដើម។
  watch: >
    រូបយន្តទាំងពីរត្រូវកំណត់ទៅឆានែល LAN តែមួយ បើមិនដូច្នេះទេគ្មានមួយណាឮគ្នាទេ។

cyberpi.cyberpi_set_wifi_broadcast_with_value:
  what: >
    ផ្ញើសារដែលមានឈ្មោះ ព្រមទាំងលេខ ឬពាក្យមួយភ្ជាប់ជាមួយ។
  when: >
    ពេលសារត្រូវការខ្លឹមសារ — មិនត្រឹមតែ «go» ទេ តែ «go ក្នុងល្បឿន ៤០»។
  caption: >
    សេចក្ដីណែនាំ និងលេខរបស់វាធ្វើដំណើរជាមួយគ្នា។

cyberpi.cyberpi_wifi_broadcast_when_received_message:
  what: >
    ប្លុកមួកដែលដំណើរការពេលសារដែលមានឈ្មោះមកដល់តាមបណ្តាញ។
  when: >
    នៅលើរូបយន្តអ្នកទទួល ដើម្បីធ្វើសកម្មភាពលើអ្វីដែលរូបយន្តមួយទៀតបាននិយាយ។
  caption: >
    រូបយន្តនេះធ្វើចលនាពេលរូបយន្តមួយទៀតនិយាយ go។

cyberpi.cyberpi_wifi_broadcast_get_value:
  what: >
    រាយការណ៍តម្លៃដែលមកជាមួយសារចុងក្រោយនៃឈ្មោះនោះ។
  when: >
    ភ្លាមបន្ទាប់ពីប្លុកមួកដែលត្រូវគ្នា ដើម្បីអានអ្វីដែលត្រូវបានផ្ញើ។
  caption: >
    អ្នកផ្ញើជ្រើសល្បឿន; រូបយន្តនេះប្រើវា។

cyberpi.cyberpi_set_wifi_channels:
  what: >
    ជ្រើសឆានែលបណ្តាញណាដែលរូបយន្តនិយាយ និងស្តាប់។
  when: >
    ពេលក្រុមពីរក្នុងបន្ទប់តែមួយមិនត្រូវឮគ្នា។ ដាក់ក្រុមនីមួយៗលើឆានែលរបស់វា ហើយសាររបស់ពួកគេឈប់ឆ្លងគ្នា។
  caption: >
    ក្រុមនេះនៅលើឆានែល ១១។

# --------------------------------------------------- Upload Mode Broadcast
cyberpi_upload_message.BLOCK_1551748322055:
  what: >
    ផ្ញើសារដែលមានឈ្មោះពីកម្មវិធីដែលអាប់ឡូតរួច ត្រឡប់ទៅ mBlock នៅលើកុំព្យូទ័រ។
  when: >
    ដើម្បីមើលថារូបយន្តដែលអាប់ឡូតរួចកំពុងធ្វើអ្វី។ ពេលកម្មវិធីអាប់ឡូតរួច វានៅតែម្នាក់ឯង
    ហើយនេះជាខ្សែស្រឡាយត្រឡប់ទៅអេក្រង់វិញ។
  caption: >
    រូបយន្តប្រាប់កុំព្យូទ័រថាវាបានចាប់ផ្ដើម។

cyberpi_upload_message.BLOCK_1551748500023:
  what: >
    ផ្ញើសារដែលមានឈ្មោះ ព្រមទាំងតម្លៃភ្ជាប់ជាមួយ។
  when: >
    សម្រាប់ការផ្ញើការអានចេញពីកម្មវិធីដែលអាប់ឡូតរួច — ការកត់ត្រាឧបករណ៍ចាប់សញ្ញាខណៈរូបយន្តដំណើរការដោយឥតខ្សែ។
  caption: >
    ការបញ្ជូនផ្ទាល់នៃឧបករណ៍ចាប់ចម្ងាយ ពីរដងក្នុងមួយវិនាទី។

cyberpi_upload_message.BLOCK_1551748632732:
  what: >
    ប្លុកមួកដែលដំណើរការពេលសាររបៀប Upload ដែលមានឈ្មោះមកដល់។
  when: >
    នៅផ្នែកអ្នកទទួលនៃការតភ្ជាប់។
  caption: >
    ធ្វើសកម្មភាពលើសារពីម្ខាងទៀត។

cyberpi_upload_message.BLOCK_1551748721826:
  what: >
    រាយការណ៍តម្លៃដែលផ្ទុកដោយសារចុងក្រោយនៃឈ្មោះនោះ។
  when: >
    ភ្លាមបន្ទាប់ពីប្លុកមួកដែលត្រូវគ្នា ដើម្បីអានអ្វីដែលមកជាមួយវា។
  caption: >
    សារបានផ្ទុកល្បឿនដែលត្រូវប្រើ។

# -------------------------------------------------------------------------- AI
cyberpi.cyberpi_wifi_set:
  what: >
    ភ្ជាប់បណ្តាញ Wi-Fi ដោយឲ្យឈ្មោះ និងពាក្យសម្ងាត់របស់វា។ ស្គ្រីបរង់ចាំខណៈវាភ្ជាប់។
  when: >
    មុនគេ មុនអ្វីៗដែលត្រូវការអ៊ីនធឺណិត។ គ្រប់ប្លុក AI និង IoT — ការនិយាយ ការស្តាប់ ការបកប្រែ
    អាកាសធាតុ — ត្រូវការបណ្តាញជាមុនសិន។
  caption: >
    ភ្ជាប់ រង់ចាំរហូតដល់វាភ្ជាប់ពិតប្រាកដ រួចប្រាប់។
  watch: >
    តែរបៀប Upload ប៉ុណ្ណោះ។ បណ្តាញសាលាដែលត្រូវការទំព័រចូលតាមកម្មវិធីរុករក នឹងមិនដំណើរការទេ —
    រូបយន្តគ្មានកម្មវិធីរុករកទេ។

cyberpi.cyberpi_wifi_is_connect:
  what: >
    រាយការណ៍ពិត ពេលរូបយន្តនៅលើបណ្តាញរួចហើយ។
  when: >
    ភ្លាមបន្ទាប់ពីភ្ជាប់ ដើម្បីរង់ចាំឲ្យបានត្រឹមត្រូវ ជំនួសការទាយចំនួនវិនាទី។
  caption: >
    រង់ចាំរបស់ពិត ជាជាងការពន្យារពេលដោយក្តីសង្ឃឹម។

cyberpi.cyberpi_wifi_reconnect:
  what: >
    ភ្ជាប់បណ្តាញចុងក្រោយម្ដងទៀត ដោយអ្នកមិនចាំបាច់ឲ្យឈ្មោះ និងពាក្យសម្ងាត់ជាលើកទីពីរ។
  when: >
    បន្ទាប់ពីការដាច់ ឬនៅដើមកម្មវិធីដែលធ្លាប់ភ្ជាប់ពីមុន។
  caption: >
    ប៊ូតុងភ្ជាប់ឡើងវិញសម្រាប់ពេលបណ្តាញដាច់។

cyberpi.cyberpi_wifi_disconnect:
  what: >
    ចាកចេញពីបណ្តាញ។
  when: >
    ដើម្បីសន្សំថ្ម ឬដើម្បីបញ្ជាក់ថាអ្វីមួយដំណើរការដោយគ្មានអ៊ីនធឺណិត។
  caption: >
    ចេញពីបណ្តាញ។

cyberpi.cyberpi_speak_with_some_language_3:
  what: >
    អានអត្ថបទឮៗតាមឧបករណ៍បំពង ដោយប្រើសំឡេងដែលបង្កើតក្នុងពពក។
  when: >
    ពេលរូបយន្តគួរនិយាយអ្វីមួយដែលអេក្រង់មិនអាច — លទ្ធផលឆ្លងកាត់បន្ទប់ដែលមានសំឡេង
    ការស្វាគមន៍ ចម្លើយចំពោះសំណួរដែលវាត្រូវបានសួរ។
  caption: >
    ភ្ជាប់ជាមុនសិន រួចនិយាយ។
  watch: >
    ត្រូវការ Wi-Fi គណនី mBlock ដែលចូលរួច និង របៀប Upload។ បើប្លុកមើលទៅប្រផេះ ឬមានឆ្នូតក្នុងកម្មវិធីនិពន្ធ
    នោះមួយក្នុងចំណោមបីនោះខ្វះ។

cyberpi.cyberpi_speech_recognition_with_time_3:
  what: >
    ស្តាប់តាមមីក្រូហ្វូនអស់រយៈពេលជាវិនាទី ហើយផ្ញើអ្វីដែលឮទៅពពកដើម្បីប្ដូរជាអត្ថបទ។
    ស្គ្រីបរង់ចាំខណៈវាស្តាប់។
  when: >
    ដើម្បីទទួលពាក្យបញ្ជាដែលនិយាយ។ ផ្គូវាជាមួយប្លុកលទ្ធផល ដែលផ្ទុកអ្វីដែលត្រឡប់មកវិញ។
  caption: >
    ស្តាប់បីវិនាទី រួចបង្ហាញអ្វីដែលឮ។
  watch: >
    ជ្រើសភាសានៅលើប្លុក។ តម្រូវការបីដូចការនិយាយដែរ៖ Wi-Fi ចូលគណនី របៀប Upload។

cyberpi.cyberpi_speech_recognition_result:
  what: >
    រាយការណ៍អត្ថបទដែលត្រឡប់មកវិញពីការស្តាប់ចុងក្រោយ។
  when: >
    ភ្លាមបន្ទាប់ពីការស្គាល់សំឡេង ដើម្បីសាកល្បងអ្វីដែលត្រូវបាននិយាយ។
  caption: >
    និយាយពាក្យ ហើយរូបយន្តធ្វើចលនា។ «contains» ទន់ភ្លន់ជាង «equals» នៅទីនេះ
    ព្រោះមនុស្សនិយាយច្រើនជាងពាក្យតែមួយ។
  watch: >
    វាផ្ទុកលទ្ធផល ចុងក្រោយ។ ត្រូវអានវាមុនពេលស្តាប់ម្ដងទៀត។

cyberpi.cyberpi_translate_to_some_language_2:
  what: >
    ផ្ញើអត្ថបទទៅពពក ហើយរាយការណ៍វាត្រឡប់មកវិញជាភាសាមួយទៀត។
  when: >
    សម្រាប់រូបយន្តពីរភាសា — ឮពាក្យបញ្ជាជាភាសាមួយ ឆ្លើយជាភាសាមួយទៀត។
  caption: >
    បកប្រែ រួចនិយាយការបកប្រែឮៗ។

# ------------------------------------------------------------------------- IoT
cyberpi.cyberpi_set_cloud_broadcast:
  what: >
    ផ្ញើសារដែលមានឈ្មោះតាមអ៊ីនធឺណិតទៅរូបយន្តណាមួយដែលចូលក្នុងគណនីតែមួយ។
  when: >
    ពេលរូបយន្តមិននៅក្នុងបន្ទប់តែមួយ។ ការផ្សាយ LAN សម្រាប់រូបយន្តនៅក្បែរគ្នា; ប្លុកនេះទៅដល់
    កន្លែងណាក៏បានដែលមានបណ្តាញ។
  caption: >
    សារដែលអាចឆ្លងកាត់អគារ។
  watch: >
    Wi-Fi គណនីដែលចូលរួច និងរបៀប Upload។

cyberpi.cyberpi_set_cloud_broadcast_with_value:
  what: >
    ផ្ញើសារពពកដែលមានឈ្មោះ ព្រមទាំងតម្លៃភ្ជាប់ជាមួយ។
  when: >
    ដើម្បីផ្ញើការអាន មិនត្រឹមតែសញ្ញាទេ។
  caption: >
    សារផ្ទុកលេខរបស់វាទៅជាមួយ។

cyberpi.cyberpi_when_cloud_broadcast:
  what: >
    ប្លុកមួកដែលដំណើរការពេលសារពពកដែលមានឈ្មោះមកដល់។
  when: >
    នៅលើរូបយន្តអ្នកទទួល។
  caption: >
    រូបយន្តឆ្លើយតបនឹងសារពីកន្លែងផ្សេងទាំងស្រុង។

cyberpi.cyberpi_cloud_broadcast_get_value:
  what: >
    រាយការណ៍តម្លៃដែលមកជាមួយសារពពកចុងក្រោយនៃឈ្មោះនោះ។
  when: >
    ភ្លាមបន្ទាប់ពីប្លុកមួកដែលត្រូវគ្នា។
  caption: >
    បង្ហាញលេខដែលមកដល់។

cyberpi.cyberpi_get_weather_from_internet:
  what: >
    រាយការណ៍សីតុណ្ហភាពថ្ងៃនេះសម្រាប់កន្លែងដែលអ្នកដាក់ឈ្មោះ ទាញយកពីអ៊ីនធឺណិត។
  when: >
    សម្រាប់គម្រោងស្ថានីយ៍អាកាសធាតុ ឬកម្មវិធីណាដែលឥរិយាបថគួរអាស្រ័យលើពិភពខាងក្រៅថ្នាក់រៀន។
  watch: >
    កន្លែងស្ថិតក្នុងរន្ធទីមួយរបស់ប្លុក មុនបញ្ជីទម្លាក់ចុះ ដូច្នេះគ្មានវិធីសរសេរជាអត្ថបទធម្មតាទេ —
    ត្រូវសង់វាក្នុងកម្មវិធីនិពន្ធ។ ត្រូវការ Wi-Fi និងរបៀប Upload។

cyberpi.cyberpi_get_air_quality_from_internet:
  what: >
    រាយការណ៍តួលេខគុណភាពខ្យល់ — សន្ទស្សន៍ AQI ឬចំនួនភាគល្អិត PM2.5 និង PM10 —
    សម្រាប់កន្លែងដែលមានឈ្មោះ។
  when: >
    សម្រាប់គម្រោងបរិស្ថាន និងសម្រាប់ការប្រៀបធៀបការអានខាងក្រៅជាមួយការអានក្នុងបន្ទប់។
  caption: >
    គុណភាពខ្យល់ថ្ងៃនេះ លើអេក្រង់រូបយន្ត។
  watch: >
    Wi-Fi និងរបៀប Upload។

cyberpi.cyberpi_get_sun_time_from_internet:
  what: >
    រាយការណ៍ម៉ោងថ្ងៃរះ ឬថ្ងៃលិចសម្រាប់កន្លែងដែលមានឈ្មោះ។
  when: >
    សម្រាប់រូបយន្តដែលគួរមានឥរិយាបថខុសគ្នាបន្ទាប់ពីងងឹត។
  watch: >
    ដូចប្លុកអាកាសធាតុដែរ កន្លែងមកមុនក្នុងប្លុក ដូច្នេះប្លុកនេះត្រូវផ្គុំក្នុងកម្មវិធីនិពន្ធ
    ជាជាងសរសេរចេញ។ ត្រូវការ Wi-Fi និងរបៀប Upload។

cyberpi.cyberpi_cloud_get_time_data:
  what: >
    ទាញយកកាលបរិច្ឆេទ និងម៉ោងបច្ចុប្បន្នសម្រាប់តំបន់ម៉ោងមួយពីអ៊ីនធឺណិត។
  when: >
    មុនពេលអានផ្នែកដាច់ដោយឡែកណាមួយ។ រូបយន្តគ្មាននាឡិកាផ្ទាល់ខ្លួនដែលរស់រានពេលបិទថាមពលទេ។
  caption: >
    កាលបរិច្ឆេទ និងម៉ោងពិត ពីបណ្តាញ។

cyberpi.cyberpi_cloud_read_data:
  what: >
    រាយការណ៍ផ្នែកមួយនៃម៉ោងដែលទាញយកចុងក្រោយ — ឆ្នាំ ខែ ថ្ងៃ ម៉ោង។
  when: >
    បន្ទាប់ពីទាញយក ដើម្បីប្រើផ្នែកមួយ ជាជាងខ្សែអក្សរទាំងមូល។
  caption: >
    តែឆ្នាំប៉ុណ្ណោះ ចេញពីត្រាពេលវេលាទាំងមូល។

cyberpi.BLOCK_1610527804319:
  what: >
    រាយការណ៍ផ្នែកមួយនៃម៉ោងបច្ចុប្បន្នសម្រាប់តំបន់ម៉ោងដែលជ្រើស ក្នុងប្លុកតែមួយ។
  when: >
    ពេលអ្នកចង់បានតម្លៃតែមួយ ហើយមិនត្រូវការត្រាពេលវេលាទាំងមូល។
  caption: >
    លេខមួយ ដោយផ្ទាល់ពីនាឡិកាបណ្តាញ។

# ----------------------------------------------------------------- Magic emoji
cyberpi_ai_emotion.BLOCK_1716774550298:
  what: >
    បង្ហាញរូបភាពលើអេក្រង់ CyberPi ដែលបង្កើតដោយ AI Emoji Workshop — ប៊ូតុងនៅផ្នែកខាងលើនៃថតនេះ
    ដែលសុំឲ្យពពកគូរមុខពីការពិពណ៌នា។
  when: >
    ដើម្បីឲ្យរូបយន្តមានទឹកមុខដោយអ្នកមិនចាំបាច់គូរដោយខ្លួនឯង។ រូបភាពស្ថិតក្នុងរន្ធលើប្លុក;
    workshop ជាកន្លែងដែលអ្នកបង្កើតវា។
  caption: >
    មុខដែលបង្កើតរួច ដែលអ្នកទម្លាក់ចូលរន្ធ លេចឡើងលើអេក្រង់។
  watch: >
    Workshop ត្រូវការ Wi-Fi និងគណនីដែលចូលរួច។ ប្លុកខ្លួនឯងគ្រាន់តែបង្ហាញរូបភាពដែលបង្កើតរួចហើយ។

cyberpi_ai_emotion.BLOCK_1716776195766:
  what: >
    បង្ហាញមុខដែលអ្នកគូរដោយខ្លួនឯង ភីកសែលម្ដងមួយ លើក្រឡាចត្រង្គតូចដែលភ្ជាប់ក្នុងប្លុក។
  when: >
    ពេលអ្នកចង់បានទឹកមុខជាក់លាក់មួយ ហើយគ្មានអ៊ីនធឺណិត។ ការគូរដប់ប្រាំមួយគុណដប់ប្រាំមួយភីកសែល
    ក៏ជាមេរៀនល្អអំពីថាអេក្រង់ត្រូវការតិចប៉ុណ្ណាដើម្បីនិយាយអ្វីមួយ។
  caption: >
    គំនូររបស់អ្នកផ្ទាល់ ដោយផ្ទាល់លើមុខរូបយន្ត។

cyberpi_ai_emotion.show_dynamic_face:
  what: >
    ចាក់មុខមានចលនាដែលមានស្រាប់មួយក្នុងចំណោមប្រាំបី — cute, unhappy, sleepy, surprise,
    cool, angry, happy, love។
  when: >
    វិធីលឿនបំផុតដើម្បីឲ្យរូបយន្តមានអារម្មណ៍។ មិនត្រូវការការគូរ ឬបណ្តាញទេ។
  caption: >
    រូបយន្តញញឹម។

# -------------------------------------------------------- mBot2 Extension Port
mbot2.mbot2_servo_set_angle:
  what: >
    បង្វិលស៊ែវ៉ូនៅរន្ធបន្ថែមមួយក្នុងចំណោមបួន ទៅមុំពិតប្រាកដ ហើយទប់វានៅទីនោះ។
  when: >
    នេះជាប្លុកសម្រាប់អ្វីៗដែលត្រូវនៅក្នុង ទីតាំង ជាជាងធ្វើចលនា — ដង្កៀបបើក ឬបិទ ដៃលើក ឬចុះ
    ឧបករណ៍ចាប់សញ្ញាដែលតម្រង់។ ស៊ែវ៉ូមានការចងចាំមុំ តាមរបៀបដែលម៉ូទ័រកង់មិនមាន។
  caption: >
    បើកដង្កៀប ផ្អាក រួចបិទវាវិញ។
  watch: >
    ស៊ែវ៉ូនឹងតានតឹងទល់នឹងចំណុចឈប់ បើអ្នកសុំមុំដែលសំណង់មិនអាចទៅដល់។ ត្រូវរកមុំពីរដែលមានន័យថា
    បើក និងបិទ មុនពេលសរសេរកម្មវិធីជុំវិញវា។

mbot2.mbot2_servo_add_angle:
  what: >
    ផ្លាស់ទីស៊ែវ៉ូតាមចំនួនដឺក្រេពីកន្លែងដែលវានៅឥឡូវ ជាជាងទៅមុំថេរ។
  when: >
    សម្រាប់ការរុញបន្តិចក្រោមការបញ្ជារបស់នរណាម្នាក់ — ដង្កៀបដែលបិទបន្តិចទៀតរាល់ពេលប៊ូតុងត្រូវសង្កត់។
  caption: >
    សង្កត់ប៊ូតុង ហើយដៃវារឡើងបន្តិចម្ដងៗ។
  watch: >
    ការរុញបន្តិចគ្មានការចងចាំអំពីដែនកំណត់ទេ។ សង្កត់ប៊ូតុងយូរល្មម វានឹងរុញហួសអ្វីដែលសំណង់អនុញ្ញាត។

mbot2.mbot2_servo_get_angle:
  what: >
    រាយការណ៍មុំដែលស៊ែវ៉ូត្រូវបានកំណត់ទៅឥឡូវនេះ។
  when: >
    ដើម្បីបង្ហាញទីតាំងលើអេក្រង់ ឬដើម្បីគណនាការរុញបន្ទាប់ពីទីតាំងបច្ចុប្បន្ន។
  caption: >
    តើដៃនៅត្រង់ណាឥឡូវនេះ?

mbot2.mbot2_servo_driver:
  what: >
    កំណត់ស៊ែវ៉ូទាំងបួនទៅមុំរៀងៗខ្លួនក្នុងប្លុកតែមួយ។
  when: >
    ពេលសន្លាក់ច្រើនត្រូវផ្លាស់ទីជាមួយគ្នា — ដៃទាំងមូលទៅជាកាយវិការមួយ ជាជាងសន្លាក់ម្ដងមួយ។
  caption: >
    កាយវិការទាំងមូលក្នុងបន្ទាត់តែមួយ។

mbot2.mbot2_servo_release_angle:
  what: >
    ទុកឲ្យស៊ែវ៉ូធូរ ដូច្នេះវាឈប់ទប់មុំរបស់វា ហើយអាចផ្លាស់ទីដោយដៃ។
  when: >
    ដើម្បីសន្សំថាមពល និងដើម្បីបញ្ឈប់ស៊ែវ៉ូពីការញ័រ ខណៈវាប្រយុទ្ធនឹងទម្ងន់ដែលវាទប់មិនបាន។
    ក៏ជាវិធីដាក់ដៃជាកាយវិការដោយដៃ មុនពេលកត់ត្រាថាវាទៅដល់ណា។
  caption: >
    អ្វីៗទាំងអស់ធូរ ហើយអាចផ្លាស់ទីដោយដៃ។

mbot2.mbot2_servo_reset_angle_to_zero:
  what: >
    ចាត់ទុកទីតាំងបច្ចុប្បន្នរបស់ស៊ែវ៉ូជាសូន្យថ្មីរបស់វា។
  when: >
    បន្ទាប់ពីផ្គុំអ្វីមួយ ដូច្នេះមុំក្នុងកម្មវិធីរបស់អ្នកត្រូវវាស់ពីកន្លែងដែលសំណង់ពិតជាចាប់ផ្ដើម។
  caption: >
    ដៃនៅត្រង់ណាឥឡូវ ហៅទីនោះថាសូន្យ។

mbot2.mbot2_motor_set_power_cw:
  what: >
    បង្វិលម៉ូទ័រ DC ធម្មតានៅរន្ធបន្ថែម តាមភាគរយនៃកម្លាំង។ លេខអវិជ្ជមានបង្វិលវាទិសផ្ទុយ។
  when: >
    សម្រាប់ម៉ូទ័របន្ថែមដែលគ្រាន់តែត្រូវវិល — កង្ហារ រ៉ូល ខ្សែក្រវាត់។ ទាំងនេះមិនមែនជាម៉ូទ័រកង់ទេ
    ដែលមានប្លុករបស់វាផ្ទាល់ក្នុងថត Chassis។
  caption: >
    ម៉ូទ័របន្ថែមវិលក្នុងកម្លាំងពាក់កណ្ដាល។
  watch: >
    ម៉ូទ័រទាំងនេះគ្មានឧបករណ៍អ៊ិនកូឌ័រទេ ដូច្នេះវាមិនអាចរាប់ការបង្វិល ឬទប់ទីតាំងបានទេ។
    សម្រាប់រឿងនោះ អ្នកត្រូវការស៊ែវ៉ូ ឬម៉ូទ័រអ៊ិនកូឌ័រ។

mbot2.mbot2_motor_add_power_cw:
  what: >
    ប្ដូរកម្លាំងម៉ូទ័របន្ថែមមួយជំហាន ជំនួសការកំណត់វាដាច់ខាត។
  when: >
    សម្រាប់ការបង្កើនម៉ូទ័រឡើងថ្នមៗ ជាជាងការចាប់ផ្ដើមដោយការរញ្ជួយ។
  caption: >
    ការឡើងកម្លាំងមួយវិនាទីទៅដល់កម្លាំងពេញ។

mbot2.mbot2_motor_driver_power_cw:
  what: >
    កំណត់កម្លាំងម៉ូទ័របន្ថែមទាំងពីរក្នុងប្លុកតែមួយ។
  when: >
    ពេលម៉ូទ័របន្ថែមពីរធ្វើការជាគូ។
  caption: >
    ម៉ូទ័របន្ថែមទាំងពីរជាមួយគ្នា។

mbot2.mbot2_motor_get_power_cw:
  what: >
    រាយការណ៍កម្លាំងដែលម៉ូទ័របន្ថែមត្រូវបានកំណត់ទៅឥឡូវនេះ។
  when: >
    ដើម្បីបង្ហាញ ឬដើម្បីធ្វើមូលដ្ឋានសម្រាប់ការប្ដូរបន្ទាប់។
  caption: >
    អានការកំណត់កម្លាំងបច្ចុប្បន្ន។

mbot2.mbot2_motor_stop_power:
  what: >
    បញ្ឈប់ម៉ូទ័របន្ថែមមួយ ឬទាំងអស់។
  when: >
    នៅចុងបញ្ចប់នៃអ្វីៗដែលបានចាប់ផ្ដើមវា។ ដូចម៉ូទ័រកង់ដែរ វារក្សាបញ្ជាចុងក្រោយរបស់វា។
  caption: >
    អ្វីៗទាំងអស់នៅរន្ធបន្ថែមឈប់។

mbot2.mbot2_led_on_with_rgb:
  what: >
    បញ្ចេញពន្លឺ LED មួយ ឬទាំងអស់ លើខ្សែ LED បន្ថែមដែលដោតក្នុងរន្ធបន្ថែម
    ក្នុងពណ៌លាយពីក្រហម បៃតង និងខៀវ។
  when: >
    ពេលភ្លើងប្រាំលើផ្ទាំងមិនគ្រប់គ្រាន់ ឬមិននៅកន្លែងត្រឹមត្រូវ — ខ្សែតាមបណ្ដោយដៃ
    ឬជុំវិញខាងក្រៅសំណង់។
  caption: >
    ខ្សែបន្ថែមទាំងមូលក្លាយជាបៃតង។
  watch: >
    នេះជា ខ្សែ នៅរន្ធបន្ថែម មិនមែនរង្វង់លើ CyberPi ទេ។ រង្វង់នោះមានប្លុករបស់វាក្នុងថត LED។

mbot2.mbot2_led_on_with_color:
  what: >
    ដូចគ្នា ដោយពណ៌ជ្រើសពីគំរូ ជំនួសការលាយពីលេខ។
  when: >
    ពេលអ្នកគ្រាន់តែចង់បានពណ៌មួយ។
  caption: >
    ជ្រើសពណ៌នៅលើប្លុក។

mbot2.mbot2_led_show:
  what: >
    បញ្ចេញពន្លឺ LED ពីរបីដំបូងនៃខ្សែ ដូចសសរឡើងលើ។
  when: >
    សម្រាប់មាត្រវាស់កម្រិត — ថ្ម ល្បឿន ចម្ងាយ — ជាកន្លែងដែលចំនួនភ្លើងដែលបើក គឺជា ការអាន។
  caption: >
    ភ្លើងបីបើក៖ ការអានដែលអ្នកមើលឃើញឆ្លងកាត់បន្ទប់។

mbot2.mbot2_led_move_with_cycle:
  what: >
    រំកិលលំនាំតាមបណ្ដោយខ្សែ ដោយវិលជុំនៅចុង។
  when: >
    ដើម្បីធ្វើចលនាខ្សែ — ចំណុចមួយរត់តាមបណ្ដោយដៃ លំដាប់ដេញគ្នា។
  caption: >
    លំនាំធ្វើដំណើរទៅមុខ ហើយវិលត្រឡប់មកវិញ។

mbot2.mbot2_led_off:
  what: >
    បិទ LED មួយលើខ្សែ ឬខ្សែទាំងមូល។
  when: >
    នៅចុងបញ្ចប់នៃកម្មវិធី។
  caption: >
    ខ្សែបិទ។

mbot2.mbot2_led_set_brightness:
  what: >
    កំណត់ភាពភ្លឺរបស់ខ្សែជាភាគរយ។
  when: >
    ម្ដងនៅដើម។ ខ្សែវែងក្នុងភាពភ្លឺពេញ ទាំងចាំងភ្នែក ទាំងបង្ហូរថ្មយ៉ាងខ្លាំង។
  caption: >
    ភ្លឺល្មមមើលឃើញ ហើយសន្សំថ្ម។

mbot2.mbot2_led_add_brightness:
  what: >
    ប្ដូរភាពភ្លឺរបស់ខ្សែមួយជំហាន។
  when: >
    សម្រាប់ការភ្លឺបន្តិចម្ដងៗ។
  caption: >
    ខ្សែភ្លឺឡើងបន្តិចម្ដងៗ។

mbot2.mbot2_led_get_brightness:
  what: >
    រាយការណ៍ភាពភ្លឺបច្ចុប្បន្នរបស់ខ្សែ។
  when: >
    ដើម្បីបង្ហាញការកំណត់ ឬបន្តការភ្លឺបន្តិចម្ដងៗពីវា។
  caption: >
    អានភាពភ្លឺត្រឡប់មកវិញ។

mbot2.mbot2_pin_write_digtial:
  what: >
    កំណត់ម្ជុលរន្ធបន្ថែមឲ្យបើកពេញ ឬបិទពេញ — គ្មានអ្វីនៅចន្លោះទេ។
  when: >
    សម្រាប់អេឡិចត្រូនិកសាមញ្ញរបស់អ្នកផ្ទាល់៖ ស៊ីផ្លុំ រ៉ឺឡេ LED តែមួយដែលតដៅទៅរន្ធ។
  caption: >
    ម្ជុល S1 ត្រូវបានបើក។
  watch: >
    នេះជាម្ជុលដើម។ ត្រូវពិនិត្យវ៉ុលដែលគ្រឿងបន្លាស់ត្រូវការ មុនពេលតដៅវាចូល។

mbot2.mbot2_pin_read_digtial:
  what: >
    រាយការណ៍ថាម្ជុលកំពុងអានបើក ឬបិទឥឡូវនេះ។
  when: >
    សម្រាប់កុងតាក់ ឬប៊ូតុងផ្ទាល់ខ្លួនរបស់អ្នកដែលតដៅទៅរន្ធ។
  caption: >
    មើលស្ថានភាពនៃកុងតាក់ធ្វើដោយដៃ។

mbot2.mbot2_pin_is_high:
  what: >
    រាយការណ៍ពិត ពេលម្ជុលកំពុងអានបើក។ ជាទម្រង់បាទ/ទេនៃការអានម្ជុល។
  when: >
    ក្នុង if ឬការរង់ចាំ ជាកន្លែងដែលសំណួរអានធម្មជាតិជាងលេខ។
  caption: >
    រង់ចាំកុងតាក់ធ្វើដោយដៃឲ្យបិទ។

mbot2.mbot2_pin_use_5V_read_digtial:
  what: >
    រាយការណ៍វ៉ុលពិតលើម្ជុល ជាជាងត្រឹមតែបើក ឬបិទ។
  when: >
    សម្រាប់ឧបករណ៍ចាប់សញ្ញាដែលឆ្លើយដោយវ៉ុលជំនួសកុងតាក់ — រេស៊ីស្ទ័រអាស្រ័យពន្លឺ
    ប៉ូតង់ស្យូម៉ែត្រ ឬឧបករណ៍ចែកវ៉ុលធ្វើដោយដៃ។
  caption: >
    ឧបករណ៍ចាប់សញ្ញាធ្វើដោយដៃ គូរជាក្រាហ្វ។

mbot2.mbot2_pin_set_pwm_with_duty_and_frquency:
  what: >
    បិទបើកម្ជុលយ៉ាងលឿន ដោយអ្នកបញ្ជាសមាមាត្រនៃពេលដែលវាបើក និងល្បឿនបិទបើក។
  when: >
    ដើម្បីបន្ថយពន្លឺ LED ធម្មតា ឬបង្វិលម៉ូទ័រតូចក្នុងល្បឿនផ្នែក ពីម្ជុលដែលអាចតែបើក ឬបិទ។
    បើកពាក់កណ្ដាល ពាន់ដងក្នុងមួយវិនាទី មើលទៅដូចភាពភ្លឺពាក់កណ្ដាល។
  caption: >
    LED ក្នុងភាពភ្លឺពាក់កណ្ដាល ពីម្ជុលដែលគ្មានពាក់កណ្ដាល។

# ------------------------------------------------------------------- Sprites
cyberpi_sprite.cyberpi_sprite_draw_text:
  what: >
    បង្កើតតួអង្គដែលមានឈ្មោះពីអត្ថបទមួយ ហើយដាក់វាលើអេក្រង់។ ចាប់ពីពេលនោះ ប្លុកតួអង្គដទៃ
    អាចផ្លាស់ទី ដាក់ពណ៌ និងលាក់វាតាមឈ្មោះនោះ។
  when: >
    ពេលពាក្យមួយត្រូវផ្លាស់ទី ជាជាងអង្គុយក្នុងរន្ធថេរ — ពិន្ទុដែលរអិលចូល ស្លាកដែលដើរតាមអ្វីមួយ។
  caption: >
    អត្ថបទដែលមានឈ្មោះ ដាក់ត្រង់កន្លែងដែលអ្នកចង់បាន។

cyberpi_sprite.cyberpi_sprite_draw_pixel_with_matrix16:
  what: >
    បង្កើតតួអង្គពីរូបភាពដែលអ្នកគូរដោយខ្លួនឯងលើក្រឡាចត្រង្គតូចនៅលើប្លុក។
  when: >
    សម្រាប់មុខ ព្រួញ រូបតំណាងផ្ទាល់ខ្លួន — អ្វីៗដែលរូបភាពមានស្រាប់មិនគ្របដណ្ដប់។
  caption: >
    គូរវាលើប្លុក; វាលេចឡើងលើអេក្រង់។

cyberpi_sprite.cyberpi_sprite_draw_pixel_with_icon:
  what: >
    បង្កើតតួអង្គពីរូបតំណាងមួយក្នុងចំណោមរូបតំណាងដែលមានស្រាប់របស់ CyberPi។
  when: >
    ពេលនិមិត្តសញ្ញាមានស្រាប់គ្រប់គ្រាន់ ហើយអ្នកមិនចង់គូរ។
  caption: >
    និមិត្តសញ្ញាមានស្រាប់ មិនចាំបាច់គូរទេ។

cyberpi_sprite.cyberpi_sprite_draw_QR:
  what: >
    បង្កើតតួអង្គដែលជាកូដ QR ផ្ទុកអត្ថបទណាដែលអ្នកឲ្យវា។
  when: >
    ដើម្បីប្រគល់អ្វីមួយទៅទូរស័ព្ទ — តំណ ឈ្មោះរូបយន្ត លទ្ធផល។ វាប្ដូរអេក្រង់រូបយន្ត
    ទៅជាអ្វីមួយដែលភ្ញៀវអាចស្កេន។
  caption: >
    កូដដែលអាចស្កេនបាន នៅលើមុខរូបយន្ត។

cyberpi_sprite.cyberpi_sprite_move_to:
  what: >
    ដាក់តួអង្គនៅទីតាំង x និង y ពិតប្រាកដលើអេក្រង់។
  when: >
    សម្រាប់រៀបចំអេក្រង់ដោយចេតនា និងសម្រាប់បង្ហាញតម្លៃជាទីតាំង — សញ្ញាសម្គាល់ដែលផ្លាស់ទី
    ខណៈការអានប្ដូរ។
  caption: >
    ចំណុចមួយដែលរអិលឆ្លងកាត់អេក្រង់ ខណៈជញ្ជាំងចូលមកកាន់តែជិត។

cyberpi_sprite.cyberpi_sprite_move_x_and_y:
  what: >
    ផ្លាស់ទីតួអង្គចំនួនភីកសែលពីកន្លែងដែលវានៅឥឡូវ ក្នុងទិសដែលអ្នកជ្រើស។
  when: >
    សម្រាប់ចលនាតាមជំហាន ជាកន្លែងដែលចលនានីមួយៗតាមក្រោយចលនាមុន។
  caption: >
    តួអង្គដើរឆ្លងកាត់អេក្រង់។

cyberpi_sprite.cyberpi_sprite_move_random:
  what: >
    លោតតួអង្គទៅកន្លែងចៃដន្យលើអេក្រង់។
  when: >
    សម្រាប់ហ្គេម — គោលដៅដែលលេចឡើងកន្លែងថ្មីរាល់ជុំ។
  caption: >
    កន្លែងថ្មីរាល់ការចុច។

cyberpi_sprite.cyberpi_sprite_rotate:
  what: >
    បង្វិលតួអង្គចំនួនដឺក្រេពីទិសបច្ចុប្បន្នរបស់វា។
  when: >
    សម្រាប់ការបង្វិលអ្វីមួយ និងសម្រាប់ទ្រនិចដែលបង្វិលខណៈការអានប្ដូរ។
  caption: >
    ដៃមួយបោសជុំវិញដូចនាឡិកា។

cyberpi_sprite.cyberpi_sprite_rotate_to:
  what: >
    ចង្អុលតួអង្គទៅទិសពិតប្រាកដ ជាជាងបង្វិលវាតាមជំហាន។
  when: >
    សម្រាប់ត្រីវិស័យ ឬមុខនាឡិកា ជាកន្លែងដែលមុំ គឺជា តម្លៃ។
  caption: >
    ទ្រនិចលើអេក្រង់ដែលដើរតាមថារូបយន្តបានបង្វិលប៉ុណ្ណា។

cyberpi_sprite.cyberpi_sprite_set_size:
  what: >
    ធ្វើមាត្រដ្ឋានតួអង្គ ជាភាគរយនៃទំហំធម្មតារបស់វា។
  when: >
    ដើម្បីធ្វើឲ្យអ្វីមួយធំឡើង ឬតូចចុះ — សសរដែលបំពេញ ការជូនដំណឹងដែលរីកធំ។
  caption: >
    ធំពីរដង ដើម្បីទាក់ភ្នែក។

cyberpi_sprite.cyberpi_sprite_set_color_with_color:
  what: >
    ដាក់ពណ៌តួអង្គឡើងវិញដោយប្រើពណ៌ដែលអ្នកជ្រើស។
  when: >
    ដើម្បីប្ដូរអត្ថន័យរបស់តួអង្គ ដោយមិនគូរវាឡើងវិញ — រូបរាងដដែល ក្រហមសម្រាប់គ្រោះថ្នាក់
    បៃតងសម្រាប់ទំនេរ។
  caption: >
    ជ្រើសពណ៌នៅលើប្លុក។

cyberpi_sprite.cyberpi_sprite_set_color_with_rgb:
  what: >
    ដាក់ពណ៌តួអង្គឡើងវិញពីលេខក្រហម បៃតង និងខៀវ។
  when: >
    ពេលពណ៌ត្រូវគណនា — កាន់តែក្រហមពេលការអានឡើងខ្ពស់។
  caption: >
    ពណ៌ដែលកម្មវិធីអាចគណនា។

cyberpi_sprite.cyberpi_sprite_close_color:
  what: >
    ដាក់តួអង្គត្រឡប់ទៅពណ៌ដែលវាត្រូវបានគូរ។
  when: >
    បន្ទាប់ពីការបន្លិចបណ្ដោះអាសន្ន។
  caption: >
    ត្រឡប់ទៅធម្មតាវិញ។

cyberpi_sprite.cyberpi_sprite_show_and_hide:
  what: >
    បង្ហាញ ឬលាក់តួអង្គដោយមិនលុបវា។ តួអង្គដែលលាក់រក្សាទីតាំងរបស់វា ហើយអាចត្រឡប់មកវិញ។
  when: >
    សម្រាប់ការភ្លឹបភ្លែត និងសម្រាប់អេក្រង់ដែលប្ដូរ — លាក់ក្រុមនេះ បង្ហាញក្រុមនោះ។
  caption: >
    ចំណុចដែលភ្លឹបភ្លែត។

cyberpi_sprite.cyberpi_sprite_delete:
  what: >
    លុបតួអង្គចោលជាស្ថាពរ។
  when: >
    ពេលវានឹងលែងត្រូវការទៀត។ ការលាក់ប្រសើរជាង បើវាអាចត្រូវការ។
  caption: >
    បាត់ជាស្ថាពរ។

cyberpi_sprite.cyberpi_mirror_with_axis:
  what: >
    ត្រឡប់តួអង្គពីឆ្វេងទៅស្តាំ ឬពីលើទៅក្រោម។
  when: >
    ដើម្បីប្រើគំនូរតែមួយបែរទៅទាំងសងខាង — ព្រួញមួយ ចង្អុលបានទាំងពីរទិស។
  caption: >
    ព្រួញដដែល ឥឡូវចង្អុលទិសផ្ទុយ។

cyberpi_sprite.cyberpi_sprite_set_align:
  what: >
    ជ្រើសថាផ្នែកណានៃតួអង្គរាប់ជាទីតាំងរបស់វា — កណ្ដាល ជ្រុង ឬគែម។
  when: >
    ពេលរបស់ត្រូវតម្រង់ជួរ។ អត្ថបទដែលយោងលើគែមឆ្វេងចាប់ផ្ដើមនៅកន្លែងដដែល ទោះវាវែងប៉ុណ្ណា;
    អត្ថបទដែលយោងលើកណ្ដាលរអិលខណៈវាវែងឡើង។
  caption: >
    យោងលើជ្រុង ដូច្នេះវាវែងទៅស្តាំ ជំនួសការលាតទាំងសងខាង។

cyberpi_sprite.cyberpi_sprite_z_max_and_min:
  what: >
    បញ្ជូនតួអង្គទៅមុខគេ ឬក្រោយគេនៃគំនរ។
  when: >
    ពេលតួអង្គជាន់គ្នា ហើយមួយត្រូវអានឃើញលើតួអង្គដទៃ។
  caption: >
    ការព្រមានអង្គុយលើគេបំផុត។

cyberpi_sprite.cyberpi_sprite_z_up_and_down:
  what: >
    ផ្លាស់ទីតួអង្គមួយជំហានឡើងលើ ឬចុះក្រោមក្នុងគំនរ។
  when: >
    សម្រាប់ការបញ្ជាល្អិតជាងមុខ-ឬ-ក្រោយ ពេលតួអង្គបី ឬច្រើនជាងជាន់គ្នា។
  caption: >
    មួយជំហានកាន់តែជិតខាងមុខ។

cyberpi_sprite.cyberpi_sprite_is_touch_other_sprite:
  what: >
    រាយការណ៍ពិត ពេលតួអង្គពីរជាន់គ្នា។
  when: >
    សម្រាប់ហ្គេមលើអេក្រង់ផ្ទាល់របស់រូបយន្ត — ការចាប់ ការគេច ការប្រមូល។
  caption: >
    ការប៉ះមួយសមនឹងសំឡេងមួយ។

cyberpi_sprite.cyberpi_sprite_is_touch_edge:
  what: >
    រាយការណ៍ពិត ពេលតួអង្គទៅដល់គែមអេក្រង់។
  when: >
    ដើម្បីលោតវាត្រឡប់មកវិញ ឬដើម្បីទប់វាមិនឲ្យបាត់។
  caption: >
    វាដើរទៅគែម ហើយចាប់ផ្ដើមម្ដងទៀតពីកណ្ដាល។

cyberpi_sprite.cyberpi_sprite_get_x_y_rotation_size_align:
  what: >
    រាយការណ៍ការពិតមួយអំពីតួអង្គ — x របស់វា y របស់វា ទិសរបស់វា ទំហំរបស់វា។
  when: >
