    រាយការណ៍ថាមានធាតុប៉ុន្មានក្នុងបញ្ជី។
  when: >
    ដើម្បីដើរតាមបញ្ជីដោយមិនដឹងជាមុនថាវាវែងប៉ុណ្ណា និងដើម្បីពិនិត្យថាមានអ្វីត្រូវបានប្រមូលឬអត់។
  caption: >
    កត់សម្គាល់បញ្ជីទទេ មុនពេលព្យាយាមចាក់វាឡើងវិញ។
  watch: >
    មានប្លុកមួយក្នុងថត Operators ដែលសរសេរស្ទើរដូចគ្នា គឺ «length of» ដែលរាប់អក្សរក្នុងអត្ថបទ។
    ការទម្លាក់ឈ្មោះបញ្ជីចូល ប្លុកនោះ វាស់ឈ្មោះ៖ បញ្ជីឈ្មោះ route រាយការណ៍ ៥ ជានិច្ច។

data_deleteoflist:
  what: >
    លុបធាតុមួយចេញពីបញ្ជីតាមទីតាំងរបស់វា។ អ្វីៗនៅក្រោយវារំកិលឡើងលើ។
  when: >
    ដើម្បីយកធាតុដែលអ្នកទើបដោះស្រាយរួច ចេញពីជួររង់ចាំ។
  caption: >
    ទម្លាក់ធាតុទីមួយ; អ្វីដែលធ្លាប់ជាទីពីរក្លាយជាទីមួយ។

data_deletealloflist:
  what: >
    សម្អាតបញ្ជីឲ្យទទេទាំងស្រុង។
  when: >
    មុនពេលកត់ត្រាដំណើរថ្មី។ បើគ្មានវាទេ ការកត់ត្រាទីពីរត្រូវបានបន្ថែមទៅចុងទីមួយ
    ហើយរូបយន្តចាក់ឡើងវិញទាំងពីរ។
  caption: >
    សម្អាតក្ដារ រួចចាប់ផ្ដើមកត់ត្រា។
  watch: >
    កម្មវិធីដែលអាប់ឡូតរួច មិនចាប់ផ្ដើមដោយបញ្ជីទទេទេ បើវាធ្លាប់រក្សាទុកអ្វីមួយពីមុន។
    ត្រូវសម្អាតវាដោយខ្លួនឯង។

data_insertatlist:
  what: >
    ដាក់ធាតុចូលកណ្ដាលបញ្ជីនៅទីតាំងដែលអ្នកជ្រើស ដោយរុញអ្វីៗនៅសល់ចុះក្រោម។
  when: >
    ពេលលំដាប់សំខាន់ ហើយរបស់ថ្មីមិនស្ថិតនៅចុងទេ — ការបញ្ចូលការកែតម្រូវចូលក្នុងផ្លូវដែលកត់ត្រា។
  caption: >
    ធាតុទីមួយថ្មី; អ្វីៗផ្សេងទៀតរំកិលចុះក្រោមមួយ។

data_replaceitemoflist:
  what: >
    សរសេរជាន់លើធាតុនៅទីតាំងមួយដោយអ្វីផ្សេង។ បញ្ជីនៅមានប្រវែងដដែល។
  when: >
    ដើម្បីកែ ឬធ្វើបច្ចុប្បន្នភាពតម្លៃដែលរក្សាទុកនៅនឹងកន្លែង។
  caption: >
    ចលនាទីមួយខុស; ដាក់ចលនាត្រឹមត្រូវជំនួសវា។

data_itemnumoflist:
  what: >
    រាយការណ៍ទីតាំងនៃធាតុដំបូងដែលត្រូវនឹងអ្វីដែលអ្នកឲ្យ ឬ ០ ពេលបញ្ជីមិនមានវា។
  when: >
    ដើម្បីរកថាអ្វីមួយនៅឯណា មិនត្រឹមតែថាវាមានឬអត់។
  caption: >
    ការបត់ឆ្វេងដំបូងស្ថិតនៅត្រង់ណាក្នុងផ្លូវ?

data_listcontainsitem:
  what: >
    រាយការណ៍ពិត ពេលបញ្ជីមានធាតុនោះ និងមិនពិតពេលគ្មាន។
  when: >
    សម្រាប់ការពិនិត្យសមាជិកភាព — តើនេះជាពាក្យដែលយើងស្គាល់ទេ? តើកន្លែងនេះធ្លាប់ទៅដល់ហើយឬនៅ?
  caption: >
    ឆ្លើយតបតែពេលមានការបត់ឆ្វេងត្រូវបានកត់ត្រានៅចំណុចណាមួយ។

data_showlist:
  what: >
    បង្ហាញបញ្ជីលើឆាកខណៈកម្មវិធីដំណើរការ។
  when: >
    ការរកកំហុសក្នុងរបៀប Live ដើម្បីមើលបញ្ជីបំពេញឡើង។
  caption: >
    មើលផ្លូវកំពុងត្រូវកត់ត្រា ម្ដងមួយធាតុ។

data_hidelist:
  what: >
    យកការអានរបស់បញ្ជីចេញពីឆាកវិញ។
  when: >
    ដើម្បីសម្អាតឆាកពេលអ្នកមើលរួច។
  caption: >
    រៀបចំឆាកឲ្យស្អាត។

# ------------------------------------------------------------- Quad RGB Sensor
mbuild_quad_color_sensor.mbuild_quad_color_sensor_get_off_track:
  what: >
    រាយការណ៍ថារូបយន្តរេចេញពីបន្ទាត់ប៉ុណ្ណា ជាលេខពី -១០០ ដល់ +១០០។ សូន្យមានន័យថាកណ្ដាលពិត;
    សញ្ញាប្រាប់ថាវារេទៅខាងណា។
  when: >
    នេះជាប្លុកដើរតាមបន្ទាត់។ លេខតែមួយផ្ទុកទាំងឆ្ងាយប៉ុណ្ណា និងខាងណា ដែលពិតជាអ្វីដែល
    ការកែតម្រូវទិសត្រូវការ — មិនចាំបាច់មាន if ជាខ្សែសង្វាក់ទេ គ្រាន់តែនព្វន្ត។
  caption: >
    រេទៅឆ្វេង នោះកង់ឆ្វេងលឿនឡើង ខណៈកង់ស្តាំយឺតចុះ ដែលបញ្ជូនត្រឡប់មកវិញ។ រេកាន់តែច្រើន
    ការកែតម្រូវកាន់តែខ្លាំង។
  watch: >
    បើរូបយន្តរញ្ជួយខ្លាំង នោះការកែតម្រូវខ្លាំងពេក — ត្រូវចែកកំហុសមុនប្រើ។ បើវារេចេញនៅជ្រុង
    នោះវាខ្សោយពេក។

mbuild_quad_color_sensor.mbuild_quad_color_sensor_is_line_and_background:
  what: >
    សួរឧបករណ៍ចាប់មួយក្នុងចំណោមបួន នូវសំណួរបាទ/ទេ៖ តើអ្នកនៅលើបន្ទាត់ទេ? នៅលើផ្ទៃខាងក្រោយ?
    នៅលើពណ៌ជាក់លាក់មួយ?
  when: >
    ពេលអ្នកចង់បានការសម្រេចចិត្ត ជាជាងការវាស់ — «តើយើងដល់ចំណុចក្រហមហើយឬនៅ»
    «តើឧបករណ៍ចាប់ខាងក្រៅធ្លាក់ចេញពីបន្ទាត់ហើយឬនៅ»។ ងាយយល់ជាងលេខរេ ពេលចម្លើយពិតជាបាទ ឬទេ។
  caption: >
    ស្វែងរកទៅឆ្វេងគ្រប់ពេលដែលឧបករណ៍ចាប់ខាងស្តាំបាត់បន្ទាត់។
  watch: >
    ឧបករណ៍ចាប់មានលេខរាប់ពីស្តាំ៖ R2, R1, L1, L2។ បើបែរមុខទិសដូចរូបយន្ត R2 ជាឧបករណ៍ខាងស្តាំក្រៅបំផុត។

mbuild_quad_color_sensor.mbuild_quad_color_sensor_get_sta_with_inputMenu:
  what: >
    សួរថាតើឧបករណ៍ចាប់កណ្ដាលទាំងពីររួមគ្នាស្ថិតក្នុងលំនាំពិតប្រាកដមួយឬអត់ — ចេញទាំងពីរ
    តែឆ្វេង តែស្តាំ ឬចូលទាំងពីរ។
  when: >
    ពេលការអានជាគូសំខាន់ជាគូ។ «ចូលទាំងពីរ» មានន័យថាត្រង់ទៅមុខ; «តែឆ្វេង» មានន័យថារេទៅស្តាំ។
  caption: >
    ឧបករណ៍ចាប់កណ្ដាលទាំងពីរបាត់បន្ទាត់ ដូច្នេះឈប់ ជាជាងទាយ។

mbuild_quad_color_sensor.BLOCK_1618397596925:
  what: >
    រាយការណ៍ឧបករណ៍ចាប់កណ្ដាលទាំងពីរជាលេខតែមួយពី ០ ដល់ ៣ ជំនួសបាទ/ទេ។
  when: >
    ពេលអ្នកចង់ប្រៀបធៀបលេខ ជាជាងសរសេរសំណួរដាច់ដោយឡែកបួន។
  caption: >
    មើលគូឧបករណ៍ចាប់កណ្ដាលជាលេខតែមួយដែលកំពុងប្ដូរ។

mbuild_quad_color_sensor.BLOCK_1618364921511:
  what: >
    សួរថាតើឧបករណ៍ចាប់ ទាំងបួន ស្ថិតក្នុងលំនាំពិតប្រាកដមួយឬអត់ សរសេរជាលេខបួនខ្ទង់។
  when: >
    សម្រាប់អានសញ្ញាសម្គាល់លើឥដ្ឋ ជាជាងដើរតាមបន្ទាត់។ ខ្សែធំក្រោមឧបករណ៍ចាប់ទាំងបួន
    ជាលំនាំខុសពីបន្ទាត់ស្តើងក្រោមឧបករណ៍ចាប់កណ្ដាលពីរ ដូច្នេះរូបយន្តអាចប្រាប់ចំណុចប្រសព្វពីផ្លូវ។
  caption: >
    គ្មានឧបករណ៍ចាប់ណាមួយមើលឃើញបន្ទាត់សោះ — រូបយន្តចេញផុតពីផ្លូវហើយ។

mbuild_quad_color_sensor.BLOCK_1618397679204:
  what: >
    រាយការណ៍ឧបករណ៍ចាប់ទាំងបួនជាលេខតែមួយពី ០ ដល់ ១៥។
  when: >
    គំនិតដូចលំនាំបួនខ្ទង់ ជាលេខដែលអ្នកអាចប្រៀបធៀប ឬរក្សាទុក។ តម្លៃដប់ប្រាំមួយគ្របដណ្ដប់
    គ្រប់បន្សំនៃឧបករណ៍ចាប់បួន។
  caption: >
    ឧបករណ៍ចាប់ទាំងមូលជាលេខតែមួយ ប្ដូរខណៈរូបយន្តឆ្លងកាត់ផ្លូវ។

mbuild_quad_color_sensor.mbuild_quad_color_sensor_get_rgb_gray_light:
  what: >
    រាយការណ៍ការវាស់ដើមពីឧបករណ៍ចាប់មួយ — ឃើញក្រហម បៃតង ឬខៀវប៉ុណ្ណា ផ្ទៃប្រផេះប៉ុណ្ណា
    ឬបន្ទប់ភ្លឺប៉ុណ្ណា។
  when: >
    សម្រាប់បែងចែកពណ៌ ជាជាងដើរតាមបន្ទាត់ និងសម្រាប់ស្វែងយល់ថាហេតុអ្វីអ្នកដើរតាមបន្ទាត់បរាជ័យ។
    ការបោះពុម្ពតម្លៃប្រផេះលើកាសែតខ្មៅ និងលើក្រដាសស អ្នកឃើញគម្លាតដែលឧបករណ៍ចាប់ត្រូវធ្វើការជាមួយ។
  caption: >
    មើលការអានក្រហមដើមប្ដូរ ខណៈពណ៌ផ្សេងៗឆ្លងកាត់ក្រោមឧបករណ៍ចាប់។

mbuild_quad_color_sensor.BLOCK_1626250042594:
  what: >
    បង្រៀនពណ៌មួយដល់ឧបករណ៍ចាប់៖ អ្នកឲ្យតម្លៃក្រហម បៃតង និងខៀវ បូកនឹងកម្រិតអត់ឱនអំពីថា
    ការត្រូវគ្នាត្រូវជិតប៉ុណ្ណា។
  when: >
    ពេលផ្ទៃដែលអ្នកខ្វល់មិនមែនជាពណ៌ដែលមានស្រាប់ ឬពេលក្រដាសរបស់ថ្នាក់ជាពណ៌ដែលឧបករណ៍ចាប់ច្រឡំជាប់។
  caption: >
    បង្រៀនពណ៌ក្រហមជាក់លាក់របស់អ្នក ដោយទុកកន្លែងឲ្យពន្លឺប្រែប្រួល។
  watch: >
    កម្រិតអត់ឱនធំពេកត្រូវនឹងច្រើនពេក តូចពេកមិនត្រូវនឹងអ្វីទាល់តែសោះ។ ចាប់ផ្ដើមប្រហែល ៥០
    ហើយកែសម្រួលខណៈមើលតម្លៃដើម។

mbuild_quad_color_sensor.BLOCK_1663048571053:
  what: >
    ដំណើរការការក្រិតរបស់ឧបករណ៍ចាប់ផ្ទាល់៖ វារៀនថាបន្ទាត់ និងផ្ទៃខាងក្រោយមើលទៅដូចម្ដេច
    ក្រោមពន្លឺថ្ងៃនេះ។
  when: >
    ម្ដងនៅដើមវគ្គ និងម្ដងទៀតគ្រប់ពេលបន្ទប់ ឬផ្លូវប្ដូរ។ ពន្លឺថ្ងៃឆ្លងបង្អួចពេលរសៀល
    មិនមែនជាពន្លឺដែលឧបករណ៍ចាប់ត្រូវបានក្រិតក្នុងព្រឹកនោះទេ។
  caption: >
    ដាក់រូបយន្តលើផ្លូវ ចុច B ហើយទុកឲ្យវារៀនផ្ទៃ។
  watch: >
    ក្រិតលើផ្លូវពិត មិនមែនលើតុទេ។

mbuild_quad_color_sensor.BLOCK_1663048571165:
  what: >
    ប្ដូរឧបករណ៍ចាប់រវាងរបៀបរកឃើញពណ៌ Standard និង Color enhanced។
  when: >
    របៀប enhanced ពេលអ្នកបែងចែកពណ៌ស្រដៀងគ្នា; របៀប standard សម្រាប់ការដើរតាមបន្ទាត់ធម្មតា
    ដែលវាលឿនជាង។
  caption: >
    ដោះដូរល្បឿនបន្តិច ដើម្បីភ្នែកមើលពណ៌ប្រសើរជាង។

mbuild_quad_color_sensor.BLOCK_1618382823173:
  what: >
    កំណត់ពណ៌នៃចង្កៀងផ្ទាល់របស់ឧបករណ៍ចាប់ — ពន្លឺដែលវាបញ្ចាំងលើឥដ្ឋដើម្បីអាន។
  when: >
    ពេលពណ៌ផ្លូវ និងពណ៌ចង្កៀងប្រយុទ្ធគ្នា។ កាសែតក្រហមក្រោមចង្កៀងក្រហម មើលទៅដូចក្រដាសស។
  caption: >
    ចង្កៀងបៃតងធ្វើឲ្យកាសែតក្រហមលេចធ្លោយ៉ាងច្បាស់។

mbuild_quad_color_sensor.BLOCK_1620904215289:
  what: >
    បិទចង្កៀងរបស់ឧបករណ៍ចាប់។
  when: >
    ដើម្បីអានពន្លឺរបស់បន្ទប់ ជាជាងរបស់រូបយន្ត ឬដើម្បីសន្សំថាមពល។
  caption: >
    ចង្កៀងបិទ — ឥឡូវឧបករណ៍ចាប់ឃើញតែអ្វីដែលភ្លើងបន្ទប់បង្ហាញ។
  watch: >
    ការដើរតាមបន្ទាត់ដោយបិទចង្កៀងគឺមិនគួរឲ្យទុកចិត្តទេ ព្រោះការអានប្ដូរតាមស្រមោលនីមួយៗ។

# --------------------------------------------------------- Ultrasonic Sensor 2
cyberpi_mbuild_ultrasonic2.mbuild_ultrasonic2_get_distance:
  what: >
    រាយការណ៍ថាវត្ថុជិតបំផុតនៅមុខឧបករណ៍ចាប់នៅឆ្ងាយប៉ុណ្ណា គិតជាសង់ទីម៉ែត្រ។
  when: >
    គ្រប់ពេលដែលរូបយន្តមិនត្រូវបុកអ្វីមួយ ឬត្រូវឈប់នៅចម្ងាយកំណត់ពីវា។ វាជាអារម្មណ៍ចន្លោះ
    តែមួយគត់របស់រូបយន្តដែលមើលទៅមុខ។
  caption: >
    បើកបរឆ្ពោះទៅជញ្ជាំង ហើយឈប់ក្នុងចម្ងាយប្រហែលមួយបាតដៃពីវា។
  watch: >
    ឧបករណ៍ចាប់នេះជារបស់ mBot2 ស្តង់ដារ។ តួរូបយន្ត Rover គ្មានវាទេ ដែលជាមូលហេតុ
    ដែលវគ្គសិក្សាថ្នាក់ទី ៨ មិនប្រើវាឡើយ។

cyberpi_mbuild_ultrasonic2.mbuild_ultrasonic2_out_of_range:
  what: >
    រាយការណ៍ពិត ពេលគ្មានអ្វីនៅក្នុងចម្ងាយឲ្យវាស់។
  when: >
    ដើម្បីបែងចែក «នៅឆ្ងាយ» ពី «គ្មានការអានទាល់តែសោះ»។ ផ្ទៃទន់ ឬទ្រេត បញ្ជូនសំឡេងចេញ
    ជំនួសឲ្យត្រឡប់មកវិញ ហើយច្រករបៀងទទេផ្ដល់ភាពស្ងាត់ដូចខ្នើយដែរ។
  caption: >
    និយាយវាចេញ ជាជាងធ្វើសកម្មភាពលើចម្ងាយដែលមិនដែលបានវាស់។

cyberpi_mbuild_ultrasonic2.mbuild_ultrasonic2_show_emotion:
  what: >
    ចាក់មុខមួយក្នុងចំណោមមុខដែលមានស្រាប់របស់ឧបករណ៍ចាប់លើភ្លើងរង្វង់ទាំងពីររបស់វា —
    standby, happy, dizzy, raise eyebrows, think។
  when: >
    ដើម្បីឲ្យរូបយន្តមានទឹកមុខដែលមនុស្សទាំងបន្ទប់អានបានពីចម្ងាយ។ ភ្នែកនៅខាងមុខរូបយន្ត
    ដែលជាកន្លែងមនុស្សសម្លឹងមើល។
  caption: >
    មុខរបស់រូបយន្តភ្លឺឡើង។

cyberpi_mbuild_ultrasonic2.mbuild_ultrasonic2_set_bri:
  what: >
    កំណត់ភាពភ្លឺនៃភ្លើងរង្វង់របស់ឧបករណ៍ចាប់ ជាភាគរយ។
  when: >
    ដើម្បីបន្ថយភ្នែកក្នុងបន្ទប់ងងឹត ឬប្រើភាពភ្លឺខ្លួនឯងជាសញ្ញា — ភ្លឺឡើងពេលឧបសគ្គចូលមកជិត។
  caption: >
    រង្វង់ទាំងពីរនៅភាពភ្លឺមួយភាគបី។

cyberpi_mbuild_ultrasonic2.mbuild_ultrasonic2_add_bri:
  what: >
    បង្កើន ឬបន្ថយភាពភ្លឺរង្វង់មួយជំហាន ជាជាងកំណត់វាដាច់ខាត។
  when: >
    សម្រាប់ការរលត់បន្តិចម្ដងៗ ឬសម្រាប់ភាពភ្លឺដែលឆ្លើយតបនឹងអ្វីមួយ ដោយអ្នកមិនចាំបាច់តាមដានកម្រិតបច្ចុប្បន្ន។
  caption: >
    ភ្នែកភ្លឺឡើងបន្តិចម្ដងៗក្នុងរយៈពេលពីរវិនាទី។

cyberpi_mbuild_ultrasonic2.mbuild_ultrasonic2_get_bri:
  what: >
    រាយការណ៍ថារង្វង់មួយត្រូវបានកំណត់ភ្លឺប៉ុណ្ណាឥឡូវនេះ។
  when: >
    ពេលការរលត់បន្តិចម្ដងៗត្រូវដឹងថាវាទៅដល់ណាហើយ។
  caption: >
    អានភាពភ្លឺបច្ចុប្បន្នត្រឡប់មកពីឧបករណ៍ចាប់។

cyberpi_mbuild_ultrasonic2.mbuild_ultrasonic2_off_led:
  what: >
    បិទភ្លើងរង្វង់របស់ឧបករណ៍ចាប់។
  when: >
    នៅចុងបញ្ចប់នៃកម្មវិធី ឬពេលភ្នែករំខានពីអ្វីផ្សេង។
  caption: >
    ភ្នែកបិទ។

# -------------------------------------------------------- Bluetooth controller
firefly_bluetoothcontroller.getBluetoothJoystickValue:
  what: >
    រាយការណ៍ថាដងមួយលើឈ្នាន់បញ្ជា Bluetooth ត្រូវរុញឆ្ងាយប៉ុណ្ណា លើអ័ក្សមួយ ជាលេខសងខាងសូន្យ។
    LX និង LY ជាដងឆ្វេង, RX និង RY ជាដងស្តាំ។
  when: >
    សម្រាប់ការបើកបរដោយដៃ។ ការបញ្ជូនអ័ក្សបញ្ឈរទាំងពីរទៅកង់ទាំងពីរ ផ្ដល់ការបញ្ជាបែបរថក្រោះ
    ដែលជាការរៀបចំដែលវគ្គសិក្សានេះប្រើ។
  caption: >
    ដងនីមួយៗបើកបរកង់នៅខាងខ្លួន។
  watch: >
    ប្លុកទាំងនេះដំណើរការតែពី ផ្នែកបន្ថែម Bluetooth Controller និងតែក្នុងរបៀប Upload។
    ប្លុកដែលមើលទៅដូចគ្នាដែលមកជាមួយ ឧបករណ៍ បញ្ជាដែលភ្ជាប់មកស្រាប់ គ្មានកូដសម្រាប់រូបយន្តទេ
    ដូច្នេះវាអាប់ឡូតបាន តែមិនធ្វើអ្វីទេ។

firefly_bluetoothcontroller.CheckBluetoothKey:
  what: >
    រាយការណ៍ពិត ខណៈប៊ូតុងដែលមានឈ្មោះលើឈ្នាន់បញ្ជាត្រូវសង្កត់ — ប៊ូតុងលេខ ព្រួញ ប៊ូតុងស្មា ដងមេដៃ។
  when: >
    សម្រាប់អ្វីៗទាំងអស់ដែលមិនមែនជាការបញ្ជាទិស៖ ដង្កៀប ស៊ីផ្លុំ ភ្លើង ការប្ដូររបៀប។
    ក្នុងរង្វិលជុំ forever វាអានថា «ខណៈវាត្រូវសង្កត់»។
  caption: >
    ប៊ូតុងស្មាបន្លឺស៊ីផ្លុំដរាបណាវាត្រូវសង្កត់។
  watch: >
    របៀប Upload និងផ្នែកបន្ថែម ជាជាងឧបករណ៍ — ការព្រមានដូចប្លុកដងបញ្ជាដែរ។

# --------------------------------------------------------------------- Display
cyberpi.cyberpi_display_label_show_at_somewhere_with_size:
  what: >
    សរសេរអត្ថបទមួយបន្ទាត់នៅកន្លែងថេរលើអេក្រង់ CyberPi ក្នុងរន្ធមួយក្នុងចំណោមបួនដែលមានលេខ។
    ការសរសេរទៅរន្ធដដែលម្ដងទៀត ជំនួសអ្វីដែលមានពីមុន។
  when: >
    នេះជាប្លុកសម្រាប់សារដែល នៅជាប់ — សេចក្ដីណែនាំ ស្ថានភាព ការអានដែលអ្នកចង់តាមដាន។
    ដោយសាររន្ធនីមួយៗសរសេរជាន់លើខ្លួនឯង ស្លាកក្នុងរង្វិលជុំធ្វើបច្ចុប្បន្នភាពនៅនឹងកន្លែង
    ជំនួសការរមូរបាត់។
  caption: >
    អេក្រង់ប្រាប់អ្នកបើកបរថាត្រូវធ្វើអ្វី ហើយបន្តប្រាប់។
  watch: >
    មានរន្ធបួន លេខ ១ ដល់ ៤។ សារពីរខុសគ្នាក្នុងរន្ធតែមួយប្រយុទ្ធគ្នា; ត្រូវឲ្យនីមួយៗនូវលេខរបស់វា។

cyberpi.cyberpi_display_label_show_label_xy_with_size:
  what: >
    រឿងដដែល តែអ្នកឲ្យទីតាំង x និង y ជាក់លាក់លើអេក្រង់ ជំនួសការជ្រើសពីកន្លែងដែលមានឈ្មោះ។
  when: >
    ពេលកន្លែងដែលមានឈ្មោះមិនតម្រង់ជួរតាមអ្វីដែលអ្នកចង់បាន — ការអានច្រើនក្បែរគ្នា
    ឬតម្លៃដាក់នៅក្រោមចំណងជើងរបស់វា។
  caption: >
    ស្លាកពីរ ដាក់ជាន់គ្នាចម្ងាយម្ភៃភីកសែលពិតប្រាកដ។

cyberpi.cyberpi_display_print:
  what: >
    បន្ថែមអត្ថបទទៅអេក្រង់នៅកន្លែងដែលការបោះពុម្ពមុនបញ្ចប់ ដោយមិនចាប់ផ្ដើមបន្ទាត់ថ្មី។
  when: >
    ដើម្បីសាងបន្ទាត់មួយពីបំណែកច្រើន — ឈ្មោះមួយ រួចតម្លៃរបស់វា។
  caption: >
    ការបោះពុម្ពពីរ បន្ទាត់មួយ៖ «dist=23»។

cyberpi.cyberpi_display_println:
  what: >
    បោះពុម្ពអត្ថបទ រួចរំកិលទៅបន្ទាត់បន្ទាប់ ដូច្នេះការបោះពុម្ពបន្ទាប់ចាប់ផ្ដើមនៅខាងក្រោម។
  when: >
    សម្រាប់កំណត់ហេតុដែលរត់ ជាជាងការអានថេរ — បញ្ជីនៃការអានពេលវាមកដល់ ដានប្រាប់ថាកម្មវិធីធ្វើអ្វី។
  caption: >
    ការអានប្រាំ មួយក្នុងមួយបន្ទាត់ មួយក្នុងមួយវិនាទី។
  watch: >
    អេក្រង់រមូរពេលវាពេញ ដូច្នេះបន្ទាត់ចាស់បាត់។ សម្រាប់អ្វីដែលត្រូវនៅឲ្យឃើញ ត្រូវប្រើស្លាក។

cyberpi.cyberpi_console_set_font:
