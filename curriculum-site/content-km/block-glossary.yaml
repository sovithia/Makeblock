    កំណត់ទំហំអត្ថបទដែលបោះពុម្ព — small, middle, big ឬ super big។
  when: >
    ធំ សម្រាប់លេខដែលថ្នាក់ត្រូវអានពីកៅអីរបស់ពួកគេ; តូច ពេលបន្ទាត់ច្រើនត្រូវផ្ទុកក្នុងពេលតែមួយ។
  caption: >
    ការអានធំមួយ មើលឃើញឆ្លងកាត់បន្ទប់។

cyberpi.cyberpi_display_clear:
