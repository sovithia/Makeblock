    ប្លុកដែលដាក់ឈ្មោះបានល្អ ប្ដូរការបើកបរប្រាំមួយបន្ទាត់ ទៅជាបន្ទាត់តែមួយដែលប្រាប់ថាការបើកបរនោះ សម្រាប់អ្វី។
  caption: >
