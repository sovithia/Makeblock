    លុបអេក្រង់ទាំងមូល — បន្ទាត់ដែលបោះពុម្ព ស្លាក គំនូសតាង និងតារាងទាំងអស់។
  when: >
    នៅដើមកម្មវិធី ដើម្បីកុំឲ្យអ្នកអានសំណល់ពីដំណើរមុន និងរវាងអេក្រង់នៃការបង្ហាញដែលប្ដូរ។
  caption: >
    អេក្រង់ស្អាតមុនសារថ្មី។

cyberpi.cyberpi_display_line_chart_add_data:
  what: >
    បន្ថែមលេខមួយទៅគំនូសតាងបន្ទាត់ដែលគូរលើអេក្រង់ ដែលរមូរពេលចំណុចថ្មីមកដល់។
  when: >
    ពេល រូបរាង នៃការអានដែលប្ដូរ សំខាន់ជាងតម្លៃណាមួយ — ការមើលឧបករណ៍ចាប់ចម្ងាយខណៈរូបយន្ត
    ចូលទៅជិតជញ្ជាំង បង្ហាញការចូលជិតបានប្រសើរជាងលេខច្រើន។
  caption: >
    ជញ្ជាំងកំពុងមកដល់ គូរជាបន្ទាត់ធ្លាក់ចុះ។

cyberpi.cyberpi_display_bar_chart_add_data:
  what: >
    បន្ថែមលេខមួយទៅគំនូសតាងសសរលើអេក្រង់។
  when: >
