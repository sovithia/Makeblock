    ដូចគ្នា តែលាយពណ៌ពីលេខក្រហម បៃតង និងខៀវ ជំនួសការជ្រើស។
  when: >
    ពេលពណ៌ត្រូវគណនាជាជាងជ្រើស — ការបង្ហាញដែលកាន់តែក្រហមពេលការអានឡើងខ្ពស់។
  caption: >
    ការព្រមានក្រហម លាយដោយលេខ ដូច្នេះកម្មវិធីអាចប្រែប្រួលវា។

cyberpi.cyberpi_display_rotate_to_2:
  what: >
    បង្វិលរូបភាពអេក្រង់មួយភាគបួន ពាក់កណ្ដាល ឬបីភាគបួននៃការបង្វិល។
  when: >
    ពេល CyberPi ត្រូវបានតម្កល់ទទឹង ឬបញ្ច្រាសលើតួសំណង់របស់អ្នក ដូច្នេះអក្សរចេញមកត្រង់
    សម្រាប់អ្នកដែលកំពុងអាន។
  caption: >
    ផ្ទាំងត្រូវតម្កល់បញ្ច្រាស; ពាក្យមិនបញ្ច្រាសទេ។

