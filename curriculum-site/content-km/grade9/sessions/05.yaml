n: 5
title: ការយោល ពន្យល់រួច
goal: សិស្សយល់អំពីការគ្រប់គ្រងសមាមាត្រក្នុងន័យគំនិត — ការកែតម្រូវសមាមាត្រនឹងកំហុស។
builds_on:
- ថ្នាក់ទី ៧ ជំហានទី ១៤ · សំណួរអំពីការយោល ទីបំផុតមានចម្លើយ
teach:
- ដាស់សំណួរលើក្ដារពីថ្នាក់ទី ៧ ឡើងវិញ៖ <i>ហេតុអ្វីបានជាកម្មវិធីដើរតាមខ្សែវាឆាឆៅ?</i> ឥឡូវពួកគេអាចឆ្លើយបាន។
  ការគ្រប់គ្រងបែប bang-bang ស្គាល់ត្រឹមចម្លើយបី (ឆ្វេងខ្លាំង / ត្រង់ / ស្ដាំខ្លាំង) — វាកែតម្រូវហួសជានិច្ច
  ហួសគោលដៅ រួចកែត្រឡប់៖ ការយោលត្រូវបានសង់ចូលក្នុងតក្កវិជ្ជារបស់វាស្រាប់។ ដំណោះស្រាយជាគំនិតតែមួយ៖ <b>ធ្វើឲ្យការកែតម្រូវសមាមាត្រនឹងកំហុស</b>។
  ឃ្លាតបន្តិច → រុញចង្កូតតិចតួច; ឃ្លាតឆ្ងាយ → បង្វិលចង្កូតខ្លាំង។ ក្នុងកូដ វានឹងជាបន្ទាត់តែមួយ៖ <code>steer
  = error × gain</code>។
- បង្រៀនវាដោយការដើរបិទភ្នែក មុនពេលសរសេរកូដណាមួយ៖ សិស្សម្នាក់ដើរតាមខ្សែកាសែតដោយបិទភ្នែក; ដៃគូរបស់គេអាចនិយាយបានតែ
  «ឆ្វេង»/«ស្ដាំ» (bang-bang) — មើលពួកគេយោល។ រួចអនុញ្ញាតឲ្យនិយាយ «ឆ្វេងបន្តិច» / «ឆ្វេងខ្លាំង» (សមាមាត្រ)
  — ការដើររលូនឡើងឃើញច្បាស់។ ល្ខោនដប់នាទី មានតម្លៃស្មើពាក្យមួយពាន់។ បន្ទាប់មកកំណត់ន័យពាក្យលើក្ដារ៖ <b>កំហុស</b>
  (offset នៃខ្សែដែលពួកគេវាស់នៅមេរៀនទី ៣) <b>gain</b> (កម្រិតដែលយើងឆ្លើយតបខ្លាំងប៉ុនណា) ហើយទស្សន៍ទាយជាមួយគ្នាថា
  gain ទាបពេក (ធ្លាក់ចេញនៅកោង) និង gain ខ្ពស់ពេក (យោលម្ដងទៀត!) នឹងមើលទៅដូចម្ដេចនៅថ្ងៃស្អែក។
steps:
- time: 12′
  text: ការដើរតាមខ្សែបិទភ្នែក បញ្ជាបែប bang-bang ធៀបនឹងបែបសមាមាត្រ; ពិភាក្សាថាអ្វីបានផ្លាស់ប្ដូរ។
- time: 12′
  text: សរសេរគំរូលើក្ដារ៖ កំហុស → × gain → ចង្កូត; ភ្ជាប់កំហុសទៅនឹងលេខ offset នៃមេរៀនទី ៣។
- time: 14′
  text: តាមដានក្បួនដោះស្រាយលើក្រដាស តាមសេណារីយ៉ូដែលគូសទុក៖ offset −60, gain 0.5 → ម៉ូទ័រយ៉ាងណា? ក្រុមគណនាដោយដៃ។
- time: 7′
  text: ការទស្សន៍ទាយក្នុងកំណត់ហេតុ៖ គូសគន្លងដែល gain ទាបពេក និង gain ខ្ពស់ពេក នឹងមើលទៅដូចម្ដេច។
tips:
- កុំសរសេរកូដថ្ងៃនេះ — គំនិតនេះត្រូវការម៉ោងផ្ទាល់ខ្លួនរបស់វា; ការអនុវត្តនៅថ្ងៃស្អែកនឹងចំណាយត្រឹមប៉ុន្មាននាទីប៉ុណ្ណោះ។
- ការគណនាដោយដៃ (offset × gain → ល្បឿនម៉ូទ័រពីរ) ជាទ្វារនៃការយល់ដឹង; កុំរំលងវា។
result:
  scene: graph2
  params:
    caption: 'the prediction: proportional control should tame the wobble'
success:
- ថ្នាក់បានឆ្លើយសំណួរអំពីការយោលពីថ្នាក់ទី ៧ ដោយប្រើពាក្យនៃការគ្រប់គ្រង
- ក្រុមបានគណនាល្បឿនម៉ូទ័រពី offset × gain ដោយដៃបានត្រឹមត្រូវ
- ការទស្សន៍ទាយបរាជ័យទាំងពីរ (gain ទាប/ខ្ពស់) បានគូសរួច
parts:
- id: tape
  note: ខ្សែកាសែតលើឥដ្ឋ
- id: blindfold
  note: ល្ខោននៃទ្រឹស្ដីគ្រប់គ្រង
- id: cards
  note: សេណារីយ៉ូ offset បោះពុម្ព
long:
  goal: សំណួរអំពីការយោលពីថ្នាក់ទី ៧ មានចម្លើយក្នុងន័យការគ្រប់គ្រង ជាមួយល្បឿនម៉ូទ័រដែលគណនាដោយដៃ មុនពេលមានកូដមួយបន្ទាត់ណាកើតឡើង។
  recap:
    time: 10′
    text: ដើរម្ដងទៀត ឲ្យពិបាកជាងមុន។ ដៃគូបិទភ្នែកឥឡូវទទួលបានតែបញ្ជាបែបសមាមាត្រ — «ឆ្វេងបន្តិច» «ឆ្វេងខ្លាំង»
      — ហើយគូនោះត្រូវព្រមព្រៀងគ្នាជាមុនថា «បន្តិច» មានន័យប៉ុន្មានជំហាន។ ការដាក់លេខឲ្យពាក្យស្រពិចស្រពិលនោះ
      <i>គឺជា</i> gain ហើយការរកឃើញនោះមានតម្លៃច្រើនជាងការទទួលពាក្យបច្ចេកទេសពីគេឆ្ងាយណាស់។
  extend:
  - spec: ការគណនាដោយដៃ ៤
    text: ផ្ដល់ offset និង gain គណនាល្បឿនម៉ូទ័រទាំងពីរលើក្រដាស ត្រឹមត្រូវទាំងបួន ជាមួយដំណើរការគណនាបង្ហាញច្បាស់។
  - spec: គំនូសបរាជ័យ ២
    text: gain ទាបពេក និង gain ខ្ពស់ពេក គូសគន្លងទុកមុនពេលដំណើរការណាមួយ។
  - spec: សំណួរថ្នាក់ទី ៧ មានចម្លើយ
    text: ការយោលពន្យល់បានក្នុងកថាខណ្ឌតែមួយ ដោយប្រើពាក្យ កំហុស gain និងការកែតម្រូវហួស។
  log:
    time: 10′
    text: ការគណនាទាំងបួនជាមួយដំណើរការ និងគន្លងទស្សន៍ទាយទាំងពីរ។ ថ្ងៃស្អែក រូបយន្តនឹងត្រូវ ឬមិនត្រូវនឹងគំនូសទាំងនេះ
      — លទ្ធផលទាំងពីរមានប្រយោជន៍ ហើយគ្មានមួយណាទទួលបានទេ បើគំនូសមិនមានជាមុន។
  review:
    time: 15′
    text: គូនីមួយៗបង្ហាញចម្លើយរបស់ខ្លួនចំពោះសំណួរលើក្ដារដែលបើកចោលតាំងពីថ្នាក់ទី ៧។ លក្ខណៈវិនិច្ឆ័យ — តើការពន្យល់ប្រើពាក្យ
      កំហុស និងការកែតម្រូវ ជំនួសឲ្យ «វាឆាឆៅទេ» ដែរឬទេ? ការរង់ចាំពីរឆ្នាំសមនឹងទទួលចម្លើយពិតប្រាកដ។
  parts:
  - id: blindfold
  - id: tape
    note: ខ្សែដែលបានដើរតាម
  success:
  - ការគណនាល្បឿនម៉ូទ័របួន ត្រឹមត្រូវដោយដៃ ដោយគ្មានកូដសរសេរពេញមួយម៉ោង
  - គន្លងបរាជ័យទាំងពីរ គូសទុកមុនដំណើរការណាមួយ

