      offset ពិតទាំងបី ដាក់ជាប់គ្នា។ មេរៀនទី ៦ អានប្រអប់នេះ ដូច្នេះអនុសញ្ញាដែលកត់ត្រាមិនច្បាស់ នឹងចំណាយពេលលៃតម្រូវមួយមេរៀនទាំងមូល
      ដោយសារតួមួយបញ្ច្រាស។
