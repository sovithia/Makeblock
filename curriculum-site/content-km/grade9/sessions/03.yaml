long:
  goal: offset នៃខ្សែត្រូវបានយល់ក្នុងន័យរូបវន្ត — សញ្ញា និងទំហំប្រហាក់ប្រហែលរបស់វា ត្រូវបានទស្សន៍ទាយមុនពេលរុញរូបយន្តទៅណាមួយ។
  recap:
    time: 10′
    text: ទស្សន៍ទាយលេខជាមុនសិន។ មុនពេលរុញរូបយន្តតាមខ្សែ គូនីមួយៗសរសេរថា offset នឹងបង្ហាញអ្វីនៅទីតាំងបី៖
      ខ្សែឆ្វេងខ្លាំង កណ្ដាលត្រង់ ខ្សែស្ដាំខ្លាំង។ រួចរុញ ហើយពិនិត្យ។ ការយល់សញ្ញាបញ្ច្រាសកើតឡើងញឹកញាប់
      ហើយរកឃើញនៅទីនេះថោកជាងច្រើន បើប្រៀបនឹងនៅមេរៀនទី ៦ ដែលសញ្ញាបញ្ច្រាសធ្វើឲ្យរូបយន្តរត់គេចពីខ្សែ។
  extend:
