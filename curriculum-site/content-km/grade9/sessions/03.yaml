n: 3
title: ការយល់ដឹងតាមឧបករណ៍ចាប់ ក្នុង Python
goal: តម្លៃឧបករណ៍ចាប់បន្តផ្ទាល់ ត្រូវបានអាន បង្ហាញ និងកត់ត្រា — វិញ្ញាណរបស់រូបយន្តជាទម្រង់អក្សរ។
builds_on:
- មេរៀនទី ២ · អនុគមន៍ដែលទទួលប៉ារ៉ាម៉ែត្រ
teach:
- ឧបករណ៍ចាប់ក្នុង Python បញ្ជូនត្រឡប់នូវលេខដែលអ្នកអាចដាក់ក្នុងអថេរ៖ <code>off = cyberpi.quad_rgb_sensor.get_offset_track()</code>។
  បន្ទាត់តែមួយនោះផ្លាស់ប្ដូរទំនាក់ទំនង — ក្នុងប្លុក តម្លៃហូរដោយមើលមិនឃើញ; ក្នុង Python សិស្សចាប់យក បោះពុម្ព
  ប្រៀបធៀប និងគណនាជាមួយពួកវា។ សង់ឧបករណ៍វិនិច្ឆ័យបុរាណជាមុនសិន៖ រង្វិលជុំមួយដែលបោះពុម្ពតម្លៃបន្តផ្ទាល់ទៅអេក្រង់ដប់ដងក្នុងមួយវិនាទី
  (ជាផ្ទាំងគ្រប់គ្រង និងជាមិត្តល្អបំផុតក្នុងការបំបាត់កំហុសសម្រាប់ពេញឆ្នាំ)។
- រូបយន្តនេះមានវិញ្ញាណលើ<b>ឥដ្ឋ</b> និងលើ<b>កង់ខ្លួនឯង</b> — គ្មាន ultrasonic នៅកន្លែងណាមួយលើ Rover ទេ
  ដូច្នេះគ្មានអ្វីនៅទីនេះវាស់ខ្យល់នៅខាងមុខវាឡើយ។ លេខពីរមានសារៈសំខាន់ពេញមួយឆ្នាំ។ Quad RGB រាយការណ៍ថាខ្សែឃ្លាតពីកណ្ដាលប៉ុន្មាន
  (ជា <b>offset</b> ប្រហែល −100…+100)៖ រុញរូបយន្តតាមខ្សែដោយដៃ ហើយមើលវាយោលពីអវិជ្ជមាន ទៅសូន្យ ទៅវិជ្ជមាន
  — លេខនោះហើយ ជាសញ្ញាកំហុសសម្រាប់សប្ដាហ៍ក្រោយ។ Encoder រាយការណ៍ថាម៉ូទ័រនីមួយៗបានវិលប៉ុន្មានដឺក្រេ៖ រុញរូបយន្តទៅមុខដោយដៃ
  ហើយមើលមុំកើនឡើង — លេខនោះជាបន្ទាត់វាស់របស់មេរៀនទី ៩។
steps:
- time: 12′
  text: សង់ផ្ទាំងគ្រប់គ្រង; តម្លៃបន្តផ្ទាល់បីនៅលើអេក្រង់ក្នុងពេលតែមួយ ធ្វើបច្ចុប្បន្នភាពដោយមិនភ្លឹបភ្លែត។
- time: 12′
  text: លេងជាមួយកម្រិតកំណត់៖ បោះពុម្ព ‘MARKER!’ ពេល probe L1 ឃើញពណ៌ក្រហម — ជា if លើតម្លៃដែលចាប់យកបាន។
- time: 15′
  text: អ្នករុករក offset នៃខ្សែ៖ រុញរូបយន្តតាមខ្សែដោយដៃ មើល offset យោល; គូសពន្យល់អត្ថន័យរបស់វា។
- time: 6′
  text: កំណត់ហេតុ៖ តើ offset = −60 មានន័យយ៉ាងណាក្នុងន័យរូបវន្ត? គូសវាចេញមក។
code:
  lang: python
  source: "import cyberpi, mbot2, time\n\nmbot2.EM_reset_angle('EM1')\n\nwhile True:\n    off = cyberpi.quad_rgb_sensor.get_offset_track()\n\
    \    deg = mbot2.EM_get_angle('EM1')\n    cyberpi.display.show_label(\n        'off=' + str(off),\
    \ 16, 'top')\n    cyberpi.display.show_label(\n        'deg=' + str(deg), 16, 'center')\n    if cyberpi.quad_rgb_sensor.is_color('red',\
    \ 'l1'):\n        cyberpi.display.show_label(\n            'MARKER!', 24, 'bottom')\n    time.sleep(0.1)"
tips:
- ឈ្មោះអនុគមន៍ខាងក្រោមធ្វើតាម CyberPi Python API របស់ mBlock; ឈ្មោះតូចតាចខុសគ្នាតាមកំណែ — វិន័យរបស់ថ្នាក់គឺ៖
  ជឿលើការបំពេញស្វ័យប្រវត្តិរបស់កម្មវិធីនិពន្ធ។
- str(off) ធ្វើឲ្យគ្រប់គ្នាជំពប់ដួល — លេខត្រូវក្លាយជាអក្សរទើបបង្ហាញបាន; ទុកឲ្យពួកគេជួបកំហុសនោះសិន រួចទើបពន្យល់។
- ក្រិតឧបករណ៍ចាប់ខ្សែជាមុនសិន (ពិធីរបស់ថ្នាក់ទី ៧) បើមិនដូច្នេះទេ លេខ offset គ្រាន់តែជាសំឡេងរំខាន។
- នឹងមាននរណាម្នាក់ទៅរកឧបករណ៍ចាប់ចម្ងាយ៖ Rover មិនមានវាទេ ហើយអវត្តមាននោះហើយ ជាមូលហេតុដែលមេរៀនទី ៩ មាន។
