n: 6
title: ការគ្រប់គ្រងបែប P
goal: ការដើរតាមខ្សែបែបសមាមាត្រ អនុវត្ត និងលៃតម្រូវរួច — ការយោលត្រូវបានកម្ចាត់ឲ្យឃើញច្បាស់។
builds_on:
- មេរៀនទី ៥ · គំនិតនៃការគ្រប់គ្រងបែប P
teach:
- ថ្ងៃអនុវត្ត៖ អាន offset គុណនឹង gain បែងចែកលទ្ធផលទៅខ្សែក្រវាត់ទាំងពីរ។ ស្នូលរបស់វាមានត្រឹមបីបន្ទាត់ពិតៗ
  — សង្កត់ធ្ងន់ថាគំនិតធំមួយអាចជាកូដតូច។ បន្ទាប់មកការលៃតម្រូវ៖ ចាប់ផ្ដើមដោយ gain ទាប បង្កើនវារហូតដល់រូបយន្តតោងជាប់នឹងកោង
  ហើយបន្តទៀតរហូតដល់វាយោលម្ដងទៀត (ការទស្សន៍ទាយពីម្សិលមិញក្លាយជាការពិត — ទះដៃឲ្យវា វាមានន័យថាគំរូគំនិតត្រឹមត្រូវ)។
- នីតិវិធីលៃតម្រូវជាវិន័យរបស់មេរៀនទី ១៣ និង ១៥៖ តម្លៃ gain មួយ → ជុំមួយកត់ម៉ោង → កត់ត្រាវា → ប្ដូរម្ដងមួយ។
  ក្រុមផលិតតារាង gain តូចមួយ (gain / ម៉ោងជុំ / ការសង្កេត) ហើយជ្រើសតម្លៃជើងឯករបស់ខ្លួន។ ការលើកកម្ពស់វាក្យសព្ទ៖
  ពួកគេកំពុងលៃតម្រូវ <b>រង្វិលជុំគ្រប់គ្រង</b> — គណិតវិទ្យាដដែលដែលធ្វើឲ្យ drone នៅរាបស្មើ និងធ្វើឲ្យ cruise
  control នៅនឹងនរ។ ពួកគេគួរដឹងថាអ្វីដែលពួកគេសង់ថ្ងៃនេះ មិនមែនជាគំនិតលេងសើចទេ។
steps:
- time: 12′
  text: វាយកម្មវិធីដើរតាមខ្សែបែប P; ដំណើរការលើកដំបូងនៅ gain ≈ 0.3 — រំពឹងថាវាកាត់កោងខ្ជិល។
- time: 22′
  text: វគ្គលៃតម្រូវ៖ តារាង gain មាន ៥ តម្លៃឡើងទៅ ជុំកត់ម៉ោង ប្ដូរម្ដងមួយ។
- time: 8′
  text: ជុំជើងឯក៖ gain ល្អបំផុត បីជុំ ម៉ោងល្អបំផុតកត់ត្រាជាប់នឹងម៉ោង bang-bang ពីថ្នាក់ទី ៧។
- time: 3′
  text: កំណត់ហេតុ៖ តារាង gain របស់អ្នក បូកនឹងតម្លៃដែលការយោលត្រឡប់មកវិញ។
code:
  lang: python
  source: "import mbot2, cyberpi\n\nBASE = 45      # cruise RPM\nGAIN = 0.5     # tune me!\n\nwhile True:\n\
    \    err = cyberpi.quad_rgb_sensor.get_offset_track()\n    steer = err * GAIN   # the whole idea\n\
    \    mbot2.drive_speed(BASE + steer,\n                      BASE - steer)"
tips:
- ឈ្មោះអនុគមន៍ខាងក្រោមធ្វើតាម CyberPi Python API របស់ mBlock; ឈ្មោះតូចតាចខុសគ្នាតាមកំណែ — វិន័យរបស់ថ្នាក់គឺ៖
  ជឿលើការបំពេញស្វ័យប្រវត្តិរបស់កម្មវិធីនិពន្ធ។
- បើរូបយន្តរត់គេចពីខ្សែភ្លាមៗ នោះសញ្ញារបស់ offset បញ្ច្រាស — ប្ដូរ +/− ហើយបន្តទៅមុខ។
- ប្រើផ្លូវដដែល និងកម្រិតថ្មដដែលពេញគ្រប់ជុំលៃតម្រូវ បើមិនដូច្នេះទេ តារាងកុហក។
result:
  scene: line
  params:
    wobble: false
    kind: tank
    caption: 'P-control: the trajectory finally hugs the line'
success:
- កម្មវិធីដើរតាមខ្សែបែប P បញ្ចប់ជុំដោយរលូនជាង bang-bang ឃើញច្បាស់
- តារាង gain មាន ៥ តម្លៃឡើងទៅ ជាមួយវិន័យប្ដូរម្ដងមួយ
- រកឃើញ gain ដែលការយោលត្រឡប់មកវិញ ត្រូវនឹងការទស្សន៍ទាយ
parts:
- id: robot_tank
- id: tablet
- id: map
  note: ផ្លូវដដែលគ្រប់ជុំ
- id: timer
  note: ម៉ោងក្នុងមួយជុំ
- id: shield
  note: កម្រិតថ្មដដែលគ្រប់ជុំ
long:
  goal: gain ជើងឯកមួយ ជ្រើសចេញពីតារាង និង gain ដែលការយោលត្រឡប់មកវិញ រកឃើញ និងផ្ទៀងផ្ទាត់នឹងការទស្សន៍ទាយពីម្សិលមិញ។
  recap:
    time: 10′
    text: ដំណើរការការទស្សន៍ទាយពីម្សិលមិញ។ កំណត់ gain ឲ្យទាបពេកដោយចេតនា រួចខ្ពស់ពេកដោយចេតនា ហើយប្រៀបធៀបគន្លងពិតនឹងគំនូសដែលគូសពេលមិនទាន់មានកូដ។
      ការទស្សន៍ទាយដែលត្រូវ គួរឲ្យរីករាយ; ការទស្សន៍ទាយដែលខុស ជាកន្លែងដែលគំរូគំនិតត្រូវការជួសជុល ហើយនោះជាមួយដែលមានតម្លៃជាងក្នុងចំណោមទាំងពីរ។
  extend:
  - spec: gain ៥ ឡើងទៅ ប្ដូរម្ដងមួយ
    text: តារាង gain ជាមួយជុំកត់ម៉ោង និងការប្ដូរតែមួយក្នុងមួយជួរ។
  - spec: ឈ្នះ bang-bang ទាំងសងខាង
    text: រលូនជាង <i>និង</i> លឿនជាងម៉ោងថ្នាក់ទី ៧ ដែលនៅតែមានក្នុងកំណត់ហេតុ។
  - spec: រកឃើញ gain ដែលការយោលត្រឡប់
    text: តម្លៃដែលភាពមិននឹងនរត្រឡប់មកវិញ រកឃើញ និងកត់ត្រា ជំនួសឲ្យការគេចវេស។
  log:
    time: 10′
    text: តារាង gain — gain ម៉ោងជុំ ការសង្កេត — តម្លៃជើងឯកគូសរង្វង់ តម្លៃដែលការយោលត្រឡប់សម្គាល់ទុក។ ផ្លូវដដែល
      និងថ្មដដែលពេញតារាងទាំងមូល បើមិនដូច្នេះទេវាកុហក; កត់កម្រិតថ្មទុក ដើម្បីឲ្យអ្នកអាននាពេលអនាគតដឹងថាវាកុហកឬអត់។
  review:
    time: 15′
    text: គូនីមួយៗការពារ gain ជើងឯករបស់ខ្លួន។ លក្ខណៈវិនិច្ឆ័យ — តើជម្រើសនោះមានតារាងគាំទ្រទេ ហើយពួកគេអាចប្រាប់ថាមានអ្វីខុសនៅសងខាងវាដែរឬទេ?
      តម្លៃជើងឯកដែលមិនបានសាកល្បងតម្លៃជិតខាង គ្រាន់តែជាការស្មានសំណាង។
  parts:
  - id: timer
  - id: map
  success:
  - រកឃើញ gain ដែលការយោលត្រឡប់ ហើយប្រៀបធៀបនឹងការទស្សន៍ទាយពីមេរៀនទី ៥
  - gain ជើងឯកត្រូវបានការពារដោយផ្អែកលើតារាង មិនមែនលើអារម្មណ៍

