n: 2
title: អនុគមន៍
goal: ចលនាត្រូវបានរុំចូលក្នុងអនុគមន៍ដែលប្រើឡើងវិញបាន និងទទួលប៉ារ៉ាម៉ែត្រ — វាក្យសព្ទនៃកូដស្អាត។
builds_on:
- មេរៀនទី ១ · កម្មវិធី Python ដំបូង
teach:
- អនុគមន៍គឺជាឥរិយាបថដែលមានឈ្មោះ៖ កំណត់ <code>square(size)</code> ម្ដង ហៅវានៅកន្លែងណាក៏បាន ប្ដូរវានៅកន្លែងតែមួយ។
  ភ្ជាប់ថយក្រោយ៖ អនុគមន៍ទៅនឹងកូដ គឺដូចរង្វិលជុំទៅនឹងប្លុកដែលធ្វើម្ដងហើយម្ដងទៀតនៅថ្នាក់ទី ៧ — ជាកាំបន្ទាប់លើជណ្ដើរដដែល
  (កុំធ្វើអ្វីម្ដងហើយម្ដងទៀត)។ ប៉ារ៉ាម៉ែត្រជាចលនាដ៏មានឥទ្ធិពល៖ <code>square(20)</code>, <code>square(40)</code>
  — និយមន័យតែមួយ ការ៉េគ្មានទីបញ្ចប់។
- សង់បណ្ណាល័យផ្ទាល់ខ្លួនតូចមួយថ្ងៃនេះ៖ <code>square(size)</code>, <code>polygon(n, size)</code>, <code>celebrate()</code>
  (LED បូកសំឡេង)។ បណ្ណាល័យនេះនឹងត្រូវនាំចូលទៅក្នុងគម្រោងបញ្ចប់ពិតៗ — ប្រាប់ពួកគេឥឡូវនេះ ដើម្បីឲ្យ «សរសេរវាឲ្យល្អ»
  មានហេតុផល។ ការដាក់ឈ្មោះមានសារៈសំខាន់៖ <code>celebrate()</code> អានដូចភាសាអង់គ្លេស; <code>func2()</code>
  អានដូចការស្ដាយក្រោយ។
steps:
- time: 10′
  text: សរសេរកូដ square() ជាមួយគ្នាបន្តផ្ទាល់; ហៅវាបីដងជាមួយទំហំខុសៗគ្នា។
- time: 15′
  text: គូនីមួយៗសង់ polygon(n, size) — វិន័យ 360/N ក្លាយជាបន្ទាត់គណិតតែមួយក្នុងកូដ។
- time: 12′
  text: រចនា celebrate() ដោយសេរី៖ ភ្លើង បូកសំឡេង បូកការរញ្ជួយ; ត្រូវតែជាការហៅតែមួយ។
- time: 8′
  text: ពិនិត្យបណ្ណាល័យ៖ ប្ដូរកូដជាមួយគូផ្សេង; តើពួកគេអាចប្រើអនុគមន៍របស់អ្នកដោយមិនចាំបាច់សួរអ្នកបានទេ?
code:
  lang: python
  source: "import mbot2, cyberpi\n\ndef polygon(n, size):\n    for i in range(n):\n        mbot2.straight(size)\n\
    \        mbot2.turn(360 / n)\n\ndef celebrate():\n    cyberpi.led.on(255, 180, 0)\n    cyberpi.audio.play('yay')\n\
    \npolygon(5, 25)   # pentagon, one line\ncelebrate()"
tips:
- ការសាកល្បង «គូផ្សេងអាចប្រើវាបាន» គឺជានិយមន័យពិតប្រាកដនៃអនុគមន៍ល្អ។
- ប្រយ័ត្នការច្រឡំរវាងតក្កវិជ្ជា និងវាក្យសម្ព័ន្ធ៖ polygon(3, ...) បង្វិល 120° គឺត្រឹមត្រូវ — រំលឹកពួកគេអំពីមុំខាងក្រៅ។
result:
  scene: pyeditor
  params:
