    - '    mbot2.turn(360/n)'
    - ''
    - polygon(4, 30)
success:
- polygon(n, size) គូសបានយ៉ាងតិចរូបរាងបីផ្សេងគ្នា
- celebrate() ដំណើរការជាការហៅតែមួយ
- គូផ្សេងបានប្រើបណ្ណាល័យដោយគ្មានការពន្យល់
parts:
- id: robot_tank
- id: tablet
  note: កំណត់ត្រារចនាបណ្ណាល័យ
long:
  goal: បណ្ណាល័យអនុគមន៍ដែលគូផ្សេងអាចប្រើភ្លាមៗ ដោយគ្មានការពន្យល់ណាមួយ និងគ្មានសំណួរណាមួយត្រូវបានឆ្លើយ។
  recap:
    time: 10′
    text: ធ្វើការសាកល្បងប្ដូរឲ្យបានត្រឹមត្រូវ។ ប្រគល់បណ្ណាល័យរបស់អ្នកទៅគូផ្សេង ដោយគ្មាន README និងគ្មានការនិយាយ
      រួចមើលថាពួកគេយល់ខុសត្រង់ណា។ រាល់ការប្រើខុសគឺជាបញ្ហាឈ្មោះ ឬបញ្ហាប៉ារ៉ាម៉ែត្រ ហើយទាំងពីរមើលឃើញក្នុងរយៈពេលប៉ុន្មានវិនាទី
      — នេះហើយជាមូលហេតុដែលវាជានិយមន័យពិតនៃអនុគមន៍ល្អ មិនមែនជារឿងបន្ថែមទេ។
  extend:
  - spec: ប្រើភ្លាមៗ គ្មានសំណួរ
    text: គូផ្សេងហៅអនុគមន៍របស់អ្នក ដោយគ្មានការពន្យល់ណាមួយ និងគ្មានការសួរណាមួយ។
  - spec: polygon(n, size) រូបរាង ៣
    text: អនុគមន៍មួយ រូបរាងបីផ្សេងគ្នា មុំខាងក្រៅត្រឹមត្រូវគ្រប់ករណី។
  - spec: celebrate() ជាការហៅតែមួយ
    text: អ្វីៗគ្រប់យ៉ាងនៅខាងក្នុងអនុគមន៍; គ្មានអ្វីសល់នៅកន្លែងហៅទេ។
  log:
    time: 10′
    text: បណ្ណាល័យជាមួយមតិយោបល់មួយបន្ទាត់ក្នុងមួយអនុគមន៍ ប្រាប់ថាវាធ្វើអ្វី និងប៉ារ៉ាម៉ែត្រមានន័យអ្វី។
      កូដនេះត្រូវបាននាំចូលដោយគម្រោងបញ្ចប់នៅមេរៀនទី ១៥ ដូច្នេះវាកំពុងត្រូវបានសរសេរសម្រាប់អ្នកអានម្នាក់នៅដប់ប្រាំសប្ដាហ៍ទៀត
      — ហើយអ្នកអាននោះ ជាធម្មតាគឺជាអ្នកនិពន្ធវាផ្ទាល់។
  review:
    time: 15′
    text: គូដែលទទួលរាយការណ៍ថាពួកគេយល់ខុសត្រង់ណា។ លក្ខណៈវិនិច្ឆ័យ — តើការច្រឡំបណ្ដាលមកពីឈ្មោះ ឬពីប៉ារ៉ាម៉ែត្រ?
      ទាំងពីរកែដោយឥតគិតថ្លៃថ្ងៃនេះ ហើយថ្លៃណាស់ពេលកែក្នុងវគ្គសង់។
  parts:
  - id: tablet
  success:
  - គូផ្សេងបានប្រើបណ្ណាល័យភ្លាមៗ ដោយគ្មានការពន្យល់
  - អនុគមន៍នីមួយៗមានមតិយោបល់មួយបន្ទាត់ សំដៅទៅអ្នកអាននាពេលអនាគត

