n: 7
title: វាស់វា
goal: ការអះអាងក្លាយជាក្រាហ្វ៖ កំហុសតាមពេលវេលាបញ្ជាក់ថាបែបសមាមាត្រឈ្នះ bang-bang។
builds_on:
- មេរៀនទី ៦ · ឧបករណ៍គ្រប់គ្រងបែប P ដែលលៃតម្រូវរួច
- មេរៀនទី ៣ · ការកត់ត្រាទិន្នន័យ
teach:
- វិស្វករមិននិយាយថា «វាមើលទៅរលូនជាង» ទេ — ពួកគេបង្ហាញក្រាហ្វ។ ថ្ងៃនេះ៖ កត់ត្រាសញ្ញាកំហុសខណៈបើកបរ (បន្ថែមតម្លៃ
  offset ចូលក្នុងបញ្ជី ឬបោះពុម្ពពួកវារួចចម្លងចុះ) រួចគូសក្រាហ្វ កំហុសធៀបនឹងពេលវេលា សម្រាប់ bang-bang និងសម្រាប់ការគ្រប់គ្រងបែប
  P។ ក្រាហ្វ bang-bang ជារលកការ៉េដែលលោតទៅមកចន្លោះចុងទាំងពីរ; ក្រាហ្វបែប P តូចចុះ ហើយស្ងប់។ រូបតែមួយ អាគុយម៉ង់ទាំងមូល។
- ផ្គូផ្គងវាជាមួយទិន្នន័យម៉ោងជុំ៖ ការគ្រប់គ្រងបែប P ជាធម្មតារលូនជាង <b>និង</b> លឿនជាងផង — ជាអំណោយកម្រ
  ហើយសមនឹងកត់សម្គាល់។ ក្រុមដែលរួចលឿនទទួលបានការណែនាំអំពីតួ D៖ error × gain នៅតែហួសគោលដៅបន្តិច ព្រោះវាឆ្លើយតបទៅនឹងកន្លែងដែលរូបយន្ត
  <b>នៅ</b> មិនមែនកន្លែងដែលវា <b>កំពុងឆ្ពោះទៅ</b>; ការបន្ថែមតួមួយផ្អែកលើល្បឿននៃការប្រែប្រួលកំហុស (ដេរីវេ)
  ទប់ស្កាត់រឿងនោះ។ ទោះមិនអនុវត្តអ្វីសោះក៏ដោយ ការដឹងថា PID មាន — ហើយថាពួកគេបានសង់តួ P — គឺជាទ្វារចេញពីវគ្គសិក្សានេះ
  ទៅកាន់វិស្វកម្មគ្រប់គ្រងពិតប្រាកដ។
steps:
- time: 15′
  text: បន្ថែមការកត់ត្រាកំហុសទៅកម្មវិធីដើរតាមខ្សែទាំងពីរ; បើកបរ ២០ វិនាទីម្នាក់ៗ ចាប់យកស៊េរីទិន្នន័យ។
- time: 15′
  text: គូសក្រាហ្វស៊េរីទាំងពីរ (លើក្រដាសក្រឡា ឬតារាងទិន្នន័យ); ដាក់ត្រួតគ្នា ឬដាក់ជាប់គ្នា។
- time: 10′
  text: ប្រៀបធៀប បូកនឹងសរសេរសេចក្ដីសន្និដ្ឋានពីរប្រយោគផ្អែកលើភស្តុតាង នៅក្រោមក្រាហ្វ។
- time: 5′
  text: ការណែនាំអំពីតួ D សម្រាប់គ្រប់គ្នា; គូដែលរួចលឿនអាចសាកសង់គំរូវា។
code:
  lang: python
  source: "errors = []\nfor i in range(200):     # ~20 s of driving\n    err = cyberpi.quad_rgb_sensor.get_offset_track()\n\
    \    errors.append(err)\n    steer = err * GAIN\n    mbot2.drive_speed(BASE + steer,\n           \
    \           BASE - steer)\n    time.sleep(0.1)\n\nprint(errors)            # copy out to plot"
tips:
- ការចម្លងលេខ ២០០ ដោយដៃជាទុក្ខ — យកគំរូរៀងរាល់លេខទី ៥ ឬថតអេក្រង់ console។
- ប្រយោគសន្និដ្ឋានត្រូវតែយោងលើក្រាហ្វ («កំពូលកំហុសធ្លាក់ពីប្រហែល ៩០ មកប្រហែល ២៥») មិនមែនលើអារម្មណ៍ទេ។
result:
  scene: graph2
success:
- ក្រាហ្វកំហុស-ពេលវេលាទាំងពីរ ផលិតចេញពីទិន្នន័យកត់ត្រាពិត
- សេចក្ដីសន្និដ្ឋានសរសេរ យោងលេខចេញពីក្រាហ្វ
- ក្រុមអាចប្រាប់ថាតួ D ក្នុង PID នឹងបន្ថែមអ្វី
parts:
- id: robot_tank
- id: tablet
- id: map
  note: ក្រដាសក្រាហ្វ
- id: cards
  note: ឬតារាងទិន្នន័យ
long:
  goal: សេចក្ដីសន្និដ្ឋានសរសេរមួយ ដែលយោងលេខចេញពីក្រាហ្វដែលក្រុមផលិតពីទិន្នន័យកត់ត្រាផ្ទាល់ខ្លួន។
  recap:
    time: 10′
    text: គូសរូបរាងជាមុន មុនពេលគូសលេខ។ ដោយផ្អែកលើការចងចាំពីការបើកបរម្សិលមិញ គូសថាដាននៃកំហុស bang-bang
      និងដាននៃការគ្រប់គ្រងបែប P គួរមើលទៅដូចម្ដេច។ រួចគូសទិន្នន័យពិត។ រលកការ៉េធៀបនឹងខ្សែកោងដែលទប់ស្កាត់
      មើលឃើញច្បាស់មុនស្ថិតិណាមួយកើតឡើង — ហើយការទស្សន៍ទាយវាជាមុន ជាអ្វីដែលធ្វើឲ្យក្រាហ្វមានន័យ។
  extend:
  - spec: ស៊េរី ២ ទិន្នន័យពិត
    text: កម្មវិធីដើរតាមខ្សែទាំងពីរ កត់ត្រាលើសពី ២០ វិនាទី ហើយគូសក្រាហ្វជាមួយអ័ក្ស និងឯកតា។
  - spec: សន្និដ្ឋានយោងលេខ
    text: កំពូលកំហុសធ្លាក់ពី X មក Y; ម៉ោងជុំពី A មក B។ តួលេខមានឈ្មោះ យកចេញពីក្រាហ្វផ្ទាល់ខ្លួន។
  - spec: តួ D ជាពាក្យរបស់អ្នក
    text: អ្វីដែលតួដេរីវេនឹងបន្ថែម ក្នុងមួយប្រយោគ ដោយមិនសូត្រអក្សរកាត់ទេ។
  log:
    time: 10′
    text: ក្រាហ្វទាំងពីរ និងសេចក្ដីសន្និដ្ឋានពីរប្រយោគសរសេរនៅខាងក្រោម ដោយយោងតួលេខ។ «វាមើលទៅរលូនជាង» មិនមែនជាសេចក្ដីសន្និដ្ឋានទេ
      — វាជាប្រយោគដែលក្រាហ្វត្រូវបានបង្កើតឡើងដើម្បីជំនួសយ៉ាងជាក់លាក់។
  review:
    time: 15′
    text: ក្រុមប្រកួតប្រជែងសេចក្ដីសន្និដ្ឋានគ្នាទៅវិញទៅមក។ លក្ខណៈវិនិច្ឆ័យ — តើរាល់ការអះអាងអាចតាមដានទៅលេខមួយលើក្រាហ្វបានទេ
      ហើយតើអ័ក្សពិតជាវាស់អ្វីដែលអ្នកអះអាងគិតថាវាវាស់ដែរឬទេ?
  parts:
  - id: tablet
    note: តារាងទិន្នន័យ ឬក្រឡាក្រដាស
  - id: craft
  success:
  - សេចក្ដីសន្និដ្ឋានសរសេរ យោងតួលេខជាក់លាក់ចេញពីក្រាហ្វផ្ទាល់ខ្លួនរបស់ក្រុម
  - តួ D ពន្យល់ដោយពាក្យរបស់ក្រុមខ្លួនឯង មិនមែនសូត្រតាមគេ

