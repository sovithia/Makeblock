n: 4
title: តក្កវិជ្ជា និងការរៀបចំកូដឡើងវិញ
goal: របៀបដើរអន្ទោលរបស់ថ្នាក់ទី ៧ សង់ឡើងវិញក្នុង Python លើឧបករណ៍ចាប់ដែលវាមិនធ្លាប់មាន — រួចរៀបចំឡើងវិញជាអនុគមន៍ស្អាត។
builds_on:
- មេរៀនទី ៣ · ការអានឧបករណ៍ចាប់ក្នុង Python
- ថ្នាក់ទី ៧ ជំហានទី ១២ · តក្កវិជ្ជាដើរអន្ទោល
teach:
- លំហូរបញ្ជាពេញលេញ៖ <code>if / elif / else</code> និង <code>while</code>។ យានជំនិះត្រូវបានជ្រើសដោយចេតនាឲ្យនឹករលឹក
  — សរសេររបៀបដើរអន្ទោលរបស់ថ្នាក់ទី ៧ ឡើងវិញក្នុង Python។ ប៉ុន្តែរូបយន្តថ្នាក់ទី ៧ គេចពី<i>ចម្ងាយ</i> ហើយរូបយន្តនេះគ្មាន
  ultrasonic ទេ ដូច្នេះឥរិយាបថដដែលត្រូវសង់លើវិញ្ញាណផ្សេង៖ ព្រំដែនបិទកាសែតនៅលើឥដ្ឋ និង probe របស់ Quad
  RGB ដែលឃើញវា។ និយាយវាឲ្យឮជាមេរៀនពិតប្រាកដនៃថ្ងៃនេះ — <b>ឥរិយាបថមិនមែនជាឧបករណ៍ចាប់ទេ</b>។ ដើរអន្ទោល កត់សម្គាល់គែម
  ថយក្រោយ បង្វិលចេញ ដើរអន្ទោលម្ដងទៀត៖ រូបរាងនោះមិនផ្លាស់ប្ដូរតាំងពីថ្នាក់ទី ៧ ហើយមានតែបន្ទាត់មួយក្នុងវាទេ
  ដែលដឹងថាឧបករណ៍ចាប់ជាអ្វី។
- បន្ទាប់មកណែនាំ <b>ការរៀបចំកូដឡើងវិញ</b>៖ ធ្វើឲ្យរូបរាងកូដប្រសើរឡើង ដោយមិនប្ដូរឥរិយាបថរបស់វា។ ស្រង់ចលនាគេចចេញទៅក្នុង
  <code>escape()</code> ស្រង់ការចាប់វិញ្ញាណទៅក្នុង <code>on_edge()</code> ដាក់ឈ្មោះលេខវេទមន្តជាថេរ (<code>BACK_CM
  = 10</code>) រួចដំណើរការម្ដងទៀត — ឥរិយាបថរូបយន្តដូចគ្នាបេះបិទ តែកូដច្បាស់ជាងខ្លាំង។ រួចដាក់ចំណុចសំខាន់៖
  ព្រោះការចាប់វិញ្ញាណរស់នៅក្នុង <code>on_edge()</code> ការប្ដូរភ្នែករូបយន្តម្ដងទៀត នឹងប៉ះត្រឹមពីរបន្ទាត់។
  វិន័យ «ឥរិយាបថដដែល រូបរាងប្រសើរជាង» នោះ ជាបេះដូងនៃគុណភាពកូដ ហើយវាជាបន្ទាត់មួយក្នុងតារាងវាយតម្លៃការពិនិត្យកូដនៃគម្រោងបញ្ចប់។
steps:
- time: 15′
  text: សរសេររបៀបដើរអន្ទោលឡើងវិញក្នុង Python៖ while True បូកការពិនិត្យគែម បូកការគេចចេញ។
- time: 15′
  text: រៀបចំឡើងវិញ៖ ស្រង់ on_edge() និង escape() ដាក់ឈ្មោះថេរ បន្ថែមមតិយោបល់ពីរដែលប្រាប់ថា ហេតុអ្វី មិនមែន
    អ្វី។
- time: 10′
  text: សាកល្បងក្នុងទីលាន៖ តើការដើរអន្ទោលដែលរៀបចំឡើងវិញ មានឥរិយាបថដូចគ្នាបេះបិទទេ? (ត្រូវតែដូច — នោះជានិយមន័យរបស់វា។)
- time: 5′
  text: កំណត់ហេតុ៖ បំណែកកូដមុន និងក្រោយ — តើមួយណាដែលអ្នកចង់បំបាត់កំហុសនៅម៉ោង ១១ យប់?
code:
  lang: python
  source: "import mbot2, cyberpi, random\n\nCRUISE  = 40    # RPM: quick, but stoppable\nBACK_CM = 10\
    \    # far enough to clear tape\n\ndef sees(probe):\n    return cyberpi.quad_rgb_sensor.is_color(\n\
    \        'black', probe)\n\ndef on_edge():\n    # no ultrasonic: the edge is a colour\n    return\
    \ sees('l1') or sees('r1')\n\ndef escape():\n    mbot2.straight(-BACK_CM)\n    mbot2.turn(random.randint(60,\
    \ 120))\n\nwhile True:\n    if on_edge():\n        escape()\n    else:\n        mbot2.drive_speed(CRUISE,\
    \ CRUISE)"
tips:
- random.randint ត្រូវការការនាំចូល — ជាឱកាសល្អសម្រាប់ «អានសារកំហុស»។
- 'មតិយោបល់បែប «ហេតុអ្វី មិនមែនអ្វី»៖ # far enough to clear the tape មិនមែន # set BACK_CM to 10 ទេ។'
- បើរូបយន្តថយក្រោយឡើងលើព្រំដែន ហើយជាប់នៅទីនោះ នោះមានន័យថា BACK_CM តូចជាងចម្ងាយពី probe ទៅកង់ក្រោយ។ វាស់វា
  ជំនួសឲ្យការស្មាន។
- បិទកាសែតព្រំដែនឲ្យធំ — ខ្សែស្ដើងពេលបើកបរលឿន ត្រូវបានឆ្លងកាត់នៅចន្លោះការអានឧបករណ៍ចាប់ពីរដង ហើយនោះជាមេរៀនពិតអំពីអត្រាគំរូ
  មិនមែនជាកំហុសទេ។
result:
  scene: wander
success:
- ការដើរអន្ទោលក្នុង Python ដើរជុំវិញទីលាន ហើយបង្វិលត្រឡប់នៅព្រំដែនដោយជឿជាក់
- on_edge() និង escape() ត្រូវបានស្រង់ចេញ; ថេរមានឈ្មោះ; ឥរិយាបថមិនប្រែប្រួល
- មតិយោបល់ពន្យល់ថាហេតុអ្វី មិនមែនអ្វី
parts:
- id: robot_tank
- id: tablet
- id: tape
  note: ព្រំដែនទីលាន
long:
  goal: កូដដែលរៀបចំឡើងវិញ ហើយឥរិយាបថរបស់វាត្រូវបានបញ្ជាក់ថាមិនប្រែប្រួល ដោយការវាស់ មិនមែនដោយពាក្យរបស់អ្នកដែលបានប្ដូរវាទេ។
  recap:
    time: 10′
    text: កត់ត្រាឥរិយាបថមុននឹងប៉ះវា — បីជុំក្នុងទីលានជាមួយកូដដើម កត់ម៉ោង រាប់ចំនួនដងដែលឆ្លងព្រំដែន។ បើគ្មានមូលដ្ឋានវាស់នោះទេ
      «ឥរិយាបថមិនប្រែប្រួល» គ្រាន់តែជាមតិមួយ ហើយចំណុចសំខាន់ទាំងស្រុងនៃពាក្យ «រៀបចំឡើងវិញ» គឺថាការអះអាងនោះអាចត្រូវបានពិនិត្យ។
  extend:
  - spec: ដូចគ្នាបេះបិទ វាស់រួច
    text: ការវាស់បីជុំដដែលបន្ទាប់ពីរៀបចំឡើងវិញ ធ្លាក់ក្នុងចន្លោះនៃលទ្ធផលមុន។
  - spec: លេខវេទមន្ត ០
    text: រាល់កម្រិតកំណត់ជាថេរដែលមានឈ្មោះ កំណត់នៅកន្លែងតែមួយគត់។
  - spec: ការចាប់វិញ្ញាណក្នុងអនុគមន៍តែមួយ
    text: មានតែអនុគមន៍មួយគត់ដែលដឹងថារូបយន្តចាប់វិញ្ញាណដោយអ្វី។ ប្ដូរពណ៌កាសែត ហើយមានតែអនុគមន៍នោះទេដែលត្រូវអាន។
  log:
    time: 10′
    text: ការវាស់មុន និងក្រោយដាក់ជាប់គ្នា ជាមួយបំណែកកូដមុន និងក្រោយនៅពីក្រោមពួកវា។ សំណួរកំណត់ហេតុគឺជាសំណួរស្មោះត្រង់៖
      តើមួយណាក្នុងចំណោមទាំងពីរនេះ ដែលអ្នកចង់បំបាត់កំហុសនៅម៉ោង ១១ យប់?
  review:
    time: 15′
    text: គូផ្សេងអានកំណែដែលរៀបចំឡើងវិញភ្លាមៗ ហើយប្រាប់ថារូបយន្តធ្វើអ្វី។ លក្ខណៈវិនិច្ឆ័យ — តើពួកគេអាចប្រាប់បានដោយមិនបានឃើញកូដដើមទេ
      ហើយថេរដែលមានឈ្មោះបានជួយ ឬគ្រាន់តែបន្ថែមស្រទាប់មួយទៀតឲ្យដេញតាម?
  parts:
  - id: tape
  - id: timer
  success:
  - ឥរិយាបថត្រូវបានបញ្ជាក់ថាមិនប្រែប្រួល ដោយការវាស់ មិនមែនដោយការអះអាង
  - គ្មានលេខវេទមន្តណាមួយនៅសល់ក្នុងឯកសារទេ

