n: 1
title: រូបយន្តដដែល ភាសាថ្មី
goal: សិស្សគ្រប់រូបសរសេរ និងដំណើរការកម្មវិធី Python ដែលបើកបរជារាងការ៉េ — ធ្វើការជាគូ។
builds_on:
- ថ្នាក់ទី ៧–៨ · ពីរឆ្នាំនៃការសរសេរកូដដោយប្លុក
teach:
- ចាប់ផ្ដើមដោយរូបថតពិព័រណ៍ថ្នាក់ទី ៨ រួចប្រាប់ចេតនានៃឆ្នាំនេះ៖ រូបយន្តដដែល ប៉ុន្តែឧបករណ៍អាជីព។ របៀប Python
  របស់ mBlock ជាកម្មវិធីនិពន្ធពិតប្រាកដ — អក្សរ ការបំពេញស្វ័យប្រវត្តិ សារកំហុស។ កម្មវិធីទីមួយត្រូវបានជ្រើសដោយចេតនាឲ្យស៊ាំ៖
  ការ៉េ។ ពួកគេបានសង់វាដោយប្លុក (ថ្នាក់ទី ៧) ហើយបានអានវាជា Python (ថ្នាក់ទី ៨ ជំហានទី ១៧); ថ្ងៃនេះពួកគេវាយវាចេញពីឯកសារទទេ។
  បញ្ហាដែលស៊ាំ បូកនឹងមធ្យោបាយថ្មី ផ្ដល់ទំនុកចិត្ត មិនមែនការភ័យទេ។
- បង្កើត <b>ការសរសេរកូដជាគូ</b> ជាស្តង់ដារឆ្នាំនេះ៖ អ្នកបើកបរវាយ អ្នកនាំផ្លូវអានមុន ហើយចាប់កំហុស; ប្ដូរតួនាទីរៀងរាល់
  ១០ នាទី។ នេះជារបៀបដែលអ្នកជំនាញធ្វើការ ហើយវាកាត់បន្ថយការធុញទ្រាន់នឹងវាក្យសម្ព័ន្ធក្នុងសប្ដាហ៍ដំបូងមួយភាគពីរ។
  ដាក់វប្បធម៌សារកំហុសផងដែរ៖ សារកំហុសជាព័ត៌មាន មិនមែនជាការជេរប្រមាថទេ — អានវាឮៗ ចាប់ពីបន្ទាត់ក្រោមគេមុន។
steps:
- time: 8′
  text: ដំណើរកម្សាន្តក្នុងកម្មវិធីនិពន្ធ៖ ឯកសារ ដំណើរការ ឈប់ console ការបំពេញស្វ័យប្រវត្តិ។ បំបែកអ្វីមួយដោយចេតនា
    ហើយអានសារកំហុសជាមួយគ្នា។
- time: 20′
  text: គូនីមួយៗវាយការ៉េពីដំបូង; ដំណើរការលើរូបយន្ត; ប្ដូរតួនាទីពាក់កណ្ដាលផ្លូវ។
- time: 12′
  text: ជណ្ដើរបន្ថែម៖ ត្រីកោណ → ឆកោណ → ពហុកោណ N ជ្រុងណាក៏បាន (គំនិត 360/N ឥឡូវជាកូដ)។
- time: 5′
  text: កំណត់ហេតុ៖ សារកំហុសមួយដែលអ្នកបានជួប និងអ្វីដែលវាកំពុងប្រាប់អ្នក។
code:
  lang: python
  source: "import cyberpi\nimport mbot2\n\n# our old friend, typed from scratch\nfor i in range(4):\n\
    \    mbot2.straight(30)    # cm forward\n    mbot2.turn(90)        # degrees right\n\ncyberpi.display.show_label(\n\
    \    'done!', 24, 'center')"
tips:
- ឈ្មោះអនុគមន៍ខាងក្រោមធ្វើតាម CyberPi Python API របស់ mBlock; ឈ្មោះតូចតាចខុសគ្នាតាមកំណែ — វិន័យរបស់ថ្នាក់គឺ៖
  ជឿលើការបំពេញស្វ័យប្រវត្តិរបស់កម្មវិធីនិពន្ធ។
- IndentationError និងសញ្ញាចុចពីរ (:) ដែលភ្លេចដាក់ នឹងគ្របដណ្ដប់ថ្ងៃនេះ — ប្រាប់ទុកជាមុនឲ្យឮ ដើម្បីកុំឲ្យនរណាម្នាក់មានអារម្មណ៍ថានៅម្នាក់ឯង។
- គូនៅជាមួយគ្នារហូតពេញឯកតា Python Bootcamp។
result:
  scene: pyeditor
  params:
    shape: square
    caption: typed Python drives the same square as Grade 7’s blocks
    code_lines:
    - import mbot2
    - ''
    - 'for i in range(4):'
    - '    mbot2.straight(30)'
    - '    mbot2.turn(90)'
success:
- ការ៉េដំណើរការចេញពី Python ដែលវាយដោយដៃ
- តួនាទីសរសេរកូដជាគូបានអនុវត្ត ជាមួយការប្ដូរតួនាទី
- សារកំហុសយ៉ាងតិចមួយ ត្រូវបានអាន ឌិកូដ និងកែដោយគូនោះ
parts:
- id: robot_tank
  note: ពីថ្នាក់ទី ៨
- id: tablet
  note: របៀប Python របស់ mBlock
long:
  goal: ដៃគូទាំងពីរនាក់សរសេរ និងកែ Python ដោយគ្មានជំនួយ ហើយសារកំហុសត្រូវបានអានជាព័ត៌មាន មិនមែនជាជញ្ជាំងទេ។
  recap:
    time: 10′
    text: សង់សារមន្ទីរកំហុស។ គូនីមួយៗបង្កើតកំហុសបីផ្សេងគ្នាដោយចេតនា — ភ្លេចសញ្ញាចុចពីរ ចូលបន្ទាត់ខុស ឈ្មោះដែលមិនបានកំណត់
      — ហើយសរសេរចុះនូវអ្វីដែលសារនីមួយៗនិយាយពិតប្រាកដ។ ប្រមូលពួកវាទុកលើក្ដារ។ ថ្នាក់ដែលបានជួបសារបីដែលកើតញឹកញាប់បំផុតដោយចេតនា
      នឹងមិនបាត់បង់ម្ភៃនាទីជាមួយពួកវានៅសប្ដាហ៍ទីបួនទេ។
  extend:
  - spec: ពហុកោណ N ជ្រុង វាយដោយដៃ
    text: អនុគមន៍មួយ រូបរាងបី សរសេរជាអក្សរ ជំនួសឲ្យការអូស។
  - spec: ប្ដូរតួនាទី ស្ទាត់ទាំងពីរ
    text: អ្នកនាំផ្លូវយកក្ដារចុច ហើយល្បឿនរបស់គូមិនធ្លាក់ចុះទេ។ បើវាធ្លាក់ នោះមានន័យថាអ្នកនាំផ្លូវកំពុងមើល
      មិនមែនកំពុងអានទេ។
  - spec: ឌិកូដកំហុស ៣
    text: សារបីផ្សេងគ្នា ត្រូវបានអាន ពន្យល់ដោយពាក្យរបស់គូខ្លួនឯង និងកែរួច។
  log:
    time: 10′
    text: ទំព័រកំហុសមួយ — សារ អត្ថន័យរបស់វា និងអ្វីដែលកែវាបាន។ វាកើនធំពេញមួយឆ្នាំ ហើយក្លាយជាទ្រព្យសម្បត្តិបំបាត់កំហុសលឿនបំផុតដែលថ្នាក់មាន
      ព្រោះពេលសារមួយលេចឡើងជាលើកទីពីរ វាចំណាយត្រឹមសាមសិបវិនាទី ជំនួសឲ្យដប់នាទី។
  review:
    time: 15′
    text: គូនីមួយៗបង្រៀនសារកំហុសមួយទៅគូដែលមិនទាន់បានជួបវា។ លក្ខណៈវិនិច្ឆ័យ — តើការពន្យល់និយាយអំពីអ្វីដែល
      Python ព្យាយាមប្រាប់ ឬគ្រាន់តែថា «ដាក់សញ្ញាចុចពីរនៅទីនេះ»? មានតែទីមួយទេដែលអាចផ្ទេរទៅកំហុសបន្ទាប់បាន។
  parts:
  - id: tablet
  success:
  - អ្នកនាំផ្លូវបានផលិតកូដដែលដំណើរការ បន្ទាប់ពីការប្ដូរតួនាទី
  - សារកំហុសបី ពន្យល់ដោយពាក្យរបស់គូខ្លួនឯង

