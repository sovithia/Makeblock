# របៀបជ្រើសរើសសម្ភារៈថ្នាក់រៀន — មិនមែនអ្វីដែលមេរៀនប្រើវាសម្រាប់ទេ (នោះជា `note:`
# ក្នុងជំហាននីមួយៗ) តែជាអ្វីដែលធ្វើឲ្យវាល្អ ឬឥតប្រយោជន៍។ បង្ហាញម្ដង នៅលើទំព័រសម្ភារៈ។

boxes: >-
  ឧបសគ្គ និងជញ្ជាំង មិនមែនជារបស់ដែលរូបយន្តលើកទេ។ ប្រអប់កាតុង ទំហំស្មើ ឬធំជាងប្រអប់ស្បែកជើង។
  រឿងពីរសំខាន់ជាងទំហំ៖ ផ្ទៃមុខត្រូវតែ <b>ខ្ពស់គ្រប់គ្រាន់ដើម្បីបាំងបង្អួចអ៊ុលត្រាសោនិក</b>
  នៅខាងមុខរូបយន្ត — អ្វីដែលទាបជាងនោះ រូបយន្តនឹងបើកឆ្លងកាត់ — ហើយវាត្រូវតែ
  <b>ធ្ងន់គ្រប់គ្រាន់មិនឲ្យរអិល</b> ពេលប៉ះ បើមិនដូច្នេះទេ រាល់ចម្ងាយដែលថ្នាក់វាស់សុទ្ធតែមិនពិត។
  ដាក់សៀវភៅពីលើឲ្យធ្ងន់។ ផ្ទៃរាបអានបានច្បាស់; ផ្ទៃមូល ឬផ្អៀង ធ្វើឲ្យសញ្ញាខ្ចាត់ខ្ចាយ
  ហើយត្រឡប់មកវិញថា «គ្មានអ្វីនៅទីនោះ»។

foam: >-
  របស់ដែលដៃចាប់កាន់ពិតប្រាកដ — តូចល្មមចូលរវាងដៃ និងស្រាលល្មមលើកបាន។
  <b>ហ្វូមតែប៉ុណ្ណោះ។</b> ដុំឈើ ឬប្លាស្ទិករឹង នឹងកកិតធ្មេញសេវ៉ូ ពេលដៃចាប់បិទជ្រុលពេក
  ហើយការខូចនោះមិនអាចជួសជុលបានទេ។

tape: >-
  កាសែតក្រដាស (masking tape) មិនមែនកាសែតអគ្គិសនី ឬកាសែតធំទេ៖ វាត្រូវតែបកចេញពីឥដ្ឋ
  ដោយមិនទុកកាវ ហើយឧបករណ៍ចាប់សញ្ញា Quad RGB ត្រូវការផ្ទៃរដិប។ កាសែតភ្លឺឆ្លុះមិនទៀងទាត់
  ហើយកម្មវិធីដើរតាមខ្សែនឹងបាត់ខ្សែ។
