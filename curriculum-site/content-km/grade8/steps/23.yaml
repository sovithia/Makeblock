n: 23
stage: E
stage_title: បេសកកម្ម
kind: step
title: សាងសង់ការងារ
concept: ការរួមបញ្ចូល
hours: 2
project: G8-E-mission
goal: ការងារពេញលេញដំណើរការពីដើមដល់ចប់យ៉ាងតិចម្ដង ជាមួយកំណត់ហេតុសាកល្បងបង្ហាញកន្លែងដែលវាបរាជ័យ។
build: បេសកកម្ម ផ្គុំចេញពីបណ្ណាល័យរបស់អ្នកផ្ទាល់។
builds_on:
- ជំហានទី ២១ · ការបញ្ជាក់ចុះហត្ថលេខា
teach:
- សាងសង់តាមលំដាប់ដ្យាក្រាមរបស់អ្នក សាកល្បងព្រួញនីមួយៗមុនបន្ថែមមួយបន្ទាប់។ ថ្នេរជាកន្លែងដែលការបរាជ័យរស់នៅ
  — ការមកដល់ឲ្យបានត្រឹមត្រូវល្មមឲ្យដៃចាប់ដំណើរការ និងការដឹងថាតើដៃចាប់ពិតជាចាប់បានអ្វីមួយ — ហើយពួកវាសមនឹងទទួលការយកចិត្តទុកដាក់ច្រើនជាងផ្នែកនៅចន្លោះ។
- រក្សា <b>កំណត់ហេតុសាកល្បងលើជញ្ជាំង</b>៖ ការសាកល្បងទី ដំណាក់កាលដែលបញ្ចប់ កន្លែងដែលបរាជ័យ។ វាប្រែការខកចិត្តទៅជាទិន្នន័យ។
  "យើងបរាជ័យនៅការចាប់បីក្នុងបួនដង" ជាអ្វីដែលអ្នកអាចធ្វើការលើ; "វាបន្តខូច" ជាអារម្មណ៍ ហើយក្រោមសម្ពាធ
  ការចងចាំកុហក ខណៈក្រដាសមិនកុហកទេ។
guide:
- label: លំដាប់
  value: ព្រួញម្ដងមួយ សាកល្បងម្ដងមួយ
- label: ថ្នេរ
  value: ការមកដល់ · ការដឹងថាការចាប់ដំណើរការ
- label: កំណត់ហេតុ
  value: រាល់ការសាកល្បង លើជញ្ជាំង
steps:
- time: 10′
  text: ដ្យាក្រាមលើតុ សន្លឹកកំណត់ហេតុលើជញ្ជាំង។ ព្រមព្រៀងគោលដៅថ្ងៃនេះ ដោយបន្ទាត់កាត់មើលឃើញ។
  expect: ដ្យាក្រាមលើតុ សន្លឹកកំណត់ហេតុលើជញ្ជាំង និងគោលដៅថ្ងៃនេះព្រមព្រៀងដោយបន្ទាត់កាត់មើលឃើញ។
- time: 40′
  text: ការរុករកជាមុនសិន៖ រូបយន្តមកដល់កន្លែងដែលវាត្រូវនៅ បីដងជាប់គ្នា មុនការងារដៃចាប់ណាមួយ។
  expect: រូបយន្តទៅដល់កន្លែងដែលវាត្រូវទៅបីដងជាប់គ្នា មុនពេលនរណាម្នាក់ប៉ះដៃ។
- time: 35′
  text: បន្ថែមការចាប់ រួចសេចក្ដីណែនាំពីមនុស្ស។ ម្ដងមួយ នីមួយៗសាកល្បងមុនបន្ទាប់។
  expect: ការចាប់កាន់បន្ថែម និងសាកល្បង រួចការណែនាំពីមនុស្សបន្ថែម និងសាកល្បង។ មួយម្ដងៗ។
- time: 25′
  text: ការសាកល្បងពេញលេញ រាល់មួយកត់ត្រាជាមួយដំណាក់កាលដែលវាទៅដល់។
  expect: ការសាកល្បងពេញ រាល់ដងសរសេរទុកជាមួយដំណាក់កាលដែលវាទៅដល់។
- time: 10′
  text: អានកំណត់ហេតុរបស់អ្នកផ្ទាល់៖ ដំណាក់កាលណាធ្វើឲ្យអ្នកចំណាយច្រើនបំផុត? នោះជាការងារថ្ងៃស្អែក។
  expect: ដំណាក់កាលដែលចំណាយអ្នកច្រើនបំផុត អានចេញពីកំណត់ហេតុរបស់អ្នកផ្ទាល់។ នោះជាការងារថ្ងៃស្អែក។
blocks:
- My Blocks
- Variables
- Control
- AI
