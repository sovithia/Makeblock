- mBot2 Extension Port
tips:
- ការរុករកមុនការចាប់ ជានិច្ច។ កំហុសដៃចាប់ពីលើកំហុសការមកដល់ ជារបស់មិនស្គាល់ពីរ ហើយគ្មានមួយណាអាចធ្វើរោគវិនិច្ឆ័យបានទេ។
- បើដៃចាប់បិទលើអ្វីទាំងអស់ រូបយន្តគួរតែដឹង។ ការពិនិត្យក្រោយការចាប់ មានតម្លៃជាងការចាប់ដែលល្អជាង។
- អនុវត្តបន្ទាត់កាត់បើអ្នកត្រូវការ។ បេសកកម្មបន្ថយដែលដំណើរការ ល្អជាងបេសកកម្មពេញលេញដែលមិនដំណើរការ ហើយការបញ្ជាក់បាននិយាយដូច្នេះជាមុនរួចហើយ។
result:
  scene: work
success:
- ការងារពេញលេញបានបញ្ចប់ពីដើមដល់ចប់យ៉ាងតិចម្ដង
- ថ្នេរទាំងពីរកំណត់អត្តសញ្ញាណ ជាមួយរបៀបបរាជ័យដែលបានសង្កេត
- កំណត់ហេតុសាកល្បងកម្រិតដំណាក់កាលលើជញ្ជាំង
