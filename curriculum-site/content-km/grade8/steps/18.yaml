success:
- វាក្យសព្ទយ៉ាងតិចបួនបញ្ជា ផ្ទុកក្នុងបញ្ជី
- បញ្ជាសំដីកំណត់ការងារ ហើយរូបយន្តធ្វើតាម
- ជម្រើសដោយចេតនា និងការពារបាន រវាងការផ្គូផ្គងបេះបិទ និង contains
check:
- do: "A"
  see: Say fetch. It answers ok, fetch.
- do: "see"
  see: Say something else and nothing happens yet. That is Step 19.
