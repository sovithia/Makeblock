n: 21
stage: D
stage_title: សំឡេង
kind: checkpoint
title: ចំណុចត្រួតពិនិត្យទី ៤ — សំឡេង និងការរួមបញ្ចូល
concept: ច្រកតាមទាន់
hours: 1
project: G8-D-listens
goal: សិស្សគ្រប់រូបអាចធ្វើឲ្យរូបយន្តធ្វើតាមបញ្ជាសំដី ដោះស្រាយការឮខុស និងប្រាប់ថា AI សមនឹងលំនាំដែលពួកគេស្គាល់រួចយ៉ាងណា។
build: គ្មានអ្វីថ្មីទេ។ ថ្នាក់ទាំងមូលមកដល់កន្លែងតែមួយ។
builds_on:
- ជំហានទី ១៦–១៩
teach:
- '<b>ម៉ោងបម្រុង</b> មានផ្ដល់ជូននៅទីនេះ ហើយចេតនាមិនដាក់ក្នុងតារាងម៉ោងខាងលើទេ — បន្ថែមវាតែបើថ្នាក់មិនស្មើគ្នា។ ម៉ោងដែលបានប្រកាស គឺជាអ្វីដែលវគ្គសិក្សាត្រូវការ ពេលគ្មាននរណាត្រូវតាមទាន់។ បើថ្នាក់ស្មើគ្នា ចំណាយវាលើការពង្រីក៖ គ្រូបង្គោលធ្វើឲ្យរូបយន្តសួរសំណួរបន្តពេលវាមិនប្រាកដ — "អ្នកនិយាយថាទៅយកមែនទេ?" — ហើយធ្វើតាមចម្លើយ។'
- ច្រកចុងក្រោយមុនបេសកកម្ម។ ដំណាក់កាល E ផ្គុំការងារពិតចេញពីអ្វីៗទាំងអស់ខាងលើ ហើយសិស្សដែលពិបាកនៅទីនោះ
  តែងតែជាអ្នកដែលមិនដែលយល់ច្បាស់ថាធាតុចូលទៅដល់ម៉ាស៊ីនស្ថានភាពយ៉ាងណា។
- គ្រូបង្គោល ដៃចេញ ម៉ោងបម្រុងទៅកន្លែងដែលត្រូវការ។
guide:
- label: ឆ្លង
  value: ទាំងបីបញ្ហា បង្ហាញឲ្យឃើញ
- label: គ្រូបង្គោល
  value: ដៃចេញ សួរតែសំណួរ
- label: ម៉ោងបម្រុង
  value: +១ ម៉ោង — តែបើថ្នាក់ត្រូវការ មិនរាប់ក្នុងម៉ោងវគ្គសិក្សា
steps:
- time: 10′
  text: រៀបចំ។ និយាយត្រង់ៗថាបេសកកម្មចាប់ផ្ដើមបន្ទាប់។
  expect: ថ្នាក់មួយដែលដឹងថាបេសកកម្មចាប់ផ្ដើមបន្ទាប់។
- time: 30′
  text: បញ្ហាទាំងបី៖ <b>(១)</b> បន្ថែមបញ្ជាសំដីថ្មីទៅរូបយន្តដែលដំណើរការ ដោយមិនប្ដូរប្លុកណាមួយ។ <b>(២)</b>
    បង្ហាញអ្វីដែលរូបយន្តរបស់អ្នកធ្វើពេលវាឮខុស ហើយពន្យល់ថាហេតុអ្វីវាមិនត្រូវទាយ។ <b>(៣)</b> ពន្យល់ថាបញ្ជាសំដីទៅដល់អថេរការងារយ៉ាងណា
    — និងហេតុអ្វីនោះជាផ្លូវដដែលដែលការចុចប៊ូតុងទៅ។
  expect: បញ្ហាបីបង្ហាញ៖ បញ្ជាសំឡេងថ្មីបន្ថែមដោយមិនប្ដូរប្លុក ការឮខុសដែលមិនទាយ និងផ្លូវពីពាក្យនិយាយទៅដល់អថេរការងារ។
- time: 20′
  text: ផ្គូផ្គង៖ អ្នកគ្រប់គ្នាដែលឆ្លងទាំងបី បង្គោលអ្នកដែលមិនទាន់ឆ្លង។
  expect: គ្រប់គ្នាដែលឆ្លងទាំងបី កំពុងបង្គោលអ្នកដែលមិនទាន់ឆ្លង។
blocks:
- AI
- Variables
- Control
tips:
- បញ្ហាទី ១ ជាការសាកល្បងថាតើវាក្យសព្ទពិតជាទិន្នន័យឬអត់។ បើពួកគេត្រូវបន្ថែមប្លុក ការរចនារបស់ពួកគេមិនទាន់ដល់ទេ។
- បញ្ហាទី ៣ ជាបញ្ហាដែលបង្ហាញថា AI ត្រូវបានយល់ ឬគ្រាន់តែត្រូវបានប្រើ។
- ចំណុចត្រួតពិនិត្យចុងក្រោយ — បើនរណាម្នាក់នៅតែយឺតយ៉ាវ រៀបចំក្រុមបេសកកម្មឲ្យគេនៅជាមួយគ្រូបង្គោល ជំនួសឲ្យការទុកឲ្យគេត្រូវគេលី។
result:
