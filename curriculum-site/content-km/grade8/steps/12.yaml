n: 12
stage: C
stage_title: អន្តរកម្ម
kind: step
title: បើកបរវាដោយខ្លួនឯង
concept: ព្រឹត្តិការណ៍ ធៀបនឹងការសួរម្ដងហើយម្ដងទៀត
hours: 2
project: G8-C-connects
goal: ការបញ្ជាបែបរថក្រោះពីដងពីរ ប៊ូតុងបួនផ្គូផ្គង ហើយក្រុមអាចប្រាប់ថាហេតុអ្វីដងត្រូវសួរ ជាជាងរង់ចាំ។
build: Rover ដែលអ្នកបើកបរដោយមេដៃពីរ។
builds_on:
- ជំហានទី ៩ · ការងារ
- ជំហានទី ៨ · ល្បឿនពីលេខ
teach:
- បន្ថែមផ្នែកបន្ថែម <b>Bluetooth Controller</b> នោះដងក្លាយជាលេខដែលអ្នកអានបាន។ <b>joystick LY</b> មិនមែនបើក
  ឬបិទទេ — វាជា ច្រើនប៉ុណ្ណា ឥឡូវនេះ។ បញ្ជូនដងឆ្វេងទៅខ្សែក្រវាត់ឆ្វេង និងដងស្ដាំទៅខាងស្ដាំ នោះអ្នកបាន
  <b>ការបញ្ជាបែបរថក្រោះ</b> សាងសង់ពីលេខពីរ និងការធ្វើមាត្រដ្ឋានដែលអ្នករៀនក្នុងជំហានទី ៩។
- លេខដែលប្ដូរជាបន្តបន្ទាប់ត្រូវតែ <b>សួរ</b> ម្ដងហើយម្ដងទៀត ក្នុងរង្វិលជុំ forever។ គ្មានប្លុកមួកណាដែលបញ្ឆេះ
  «ពេលដងនៅត្រង់ ៤៧» ទេ។ នោះជា <b>ការសួរបន្ត</b> ហើយវាផ្ទុយនឹង <b>ព្រឹត្តិការណ៍</b> ដែលអ្នកប្រើពេញមួយឆ្នាំ៖
  <b>when button A pressed</b> អនុញ្ញាតឲ្យកូដអ្នកដេក រហូតដល់រូបយន្តដាស់វា។ ការបញ្ជាទិសដេកមិនបានទេ។ ប្រព័ន្ធពិតស្ទើរតែទាំងអស់ធ្វើទាំងពីរបន្តិច
  ហើយការដឹងថាការងារណាត្រូវការមួយណា ជាជំនាញ។
- ឧបករណ៍បញ្ជាក៏បើកបរ Rover នេះដោយគ្មានកម្មវិធីសោះដែរ — នោះជាអ្វីដែលភ្ជាប់មកជាមួយរូបយន្ត។ អ្វីដែលអ្នកធ្វើថ្ងៃនេះខុសគ្នា
  និងល្អជាង៖ ការផ្គូផ្គង <b>របស់អ្នក</b> ប្លុក <b>របស់អ្នក</b> លើប៊ូតុងដែលអ្នកជ្រើស។
guide:
- label: បន្ថែម
  value: ផ្នែកបន្ថែម Bluetooth Controller
- label: សួរ
  value: ⟨button 1 pressed⟩ — ក្នុង forever
- label: ដង
  value: LY → EM1 · RY → EM2 ចែកចុះ
- label: សរសេរទុក
  value: កាតផ្គូផ្គង ដូចអ្នកបើកយន្តហោះ
- label: ឥដ្ឋ
  value: ទំនេរ ៣ ម៉ែត្រ ឬឧបសគ្គជាជួរ
steps:
- time: 15′
  text: ភ្ជាប់ឧបករណ៍បញ្ជាទៅរូបយន្ត — កាន់វាឲ្យជិត ហើយចុចប៊ូតុង Bluetooth រហូតដល់រូបយន្តបន្លឺសំឡេង។ រួចបន្ថែមផ្នែកបន្ថែម
    <b>Bluetooth Controller</b> ក្នុង mBlock បើមិនដូច្នេះទេ គ្មានប្លុកថ្ងៃនេះមានទេ។
  expect: ឧបករណ៍បញ្ជាភ្ជាប់រួច — និងការរកឃើញថាវាមិនធ្វើអ្វីទេ រហូតដល់រូបយន្តកំពុងដំណើរការកម្មវិធីដែលសួរវា។
- time: 25′
  text: ការបញ្ជាបែបរថក្រោះ៖ ដងឆ្វេងទៅខ្សែក្រវាត់ឆ្វេង ដងស្ដាំទៅខាងស្ដាំ។ បើកបរវាមិនល្អមួយរយៈ; វាគួរតែមានអារម្មណ៍ចម្លែកដំបូង។
  expect: ខ្សែក្រវាត់ទាំងពីរឆ្លើយតបនឹងដងរបស់ខ្លួន ហើយរូបយន្តបន្តបើកបរ ទោះបិទថេប្លេតទាំងស្រុង។
- time: 25′
  text: ធ្វើមាត្រដ្ឋានតម្លៃដង ដើម្បីឲ្យរូបយន្តបើកបរបាន ជាជាងឃោរឃៅ។ នេះជានព្វន្តជំហានទី ៩ ធ្វើការងារថ្មី។
  expect: សំណួរដែលសួរម្ដង ក្រៅរង្វិលជុំ ឆ្លើយ «ទេ» ជារៀងរហូត។ រូបយន្តមិនធ្វើអ្វីទេ ហើយក្រុមអាចប្រាប់ថាហេតុអ្វី។
- time: 25′
  text: ផ្គូផ្គងប៊ូតុងបួនទៅអាកប្បកិរិយាដែលអ្នកមានស្រាប់ — grip release lift celebrate — ហើយសរសេរ <b>កាតផ្គូផ្គង</b>
    លើក្រដាស។
  expect: ប៊ូតុងបួនធ្វើរឿងបួនដែលអ្នកសាងសង់រួច និងកាតផ្គូផ្គងលើក្រដាសប្រាប់ថាមួយណាជាមួយណា។
  use:
  - cyberpi_when_direction_key_press
  - my:celebrate
  - cyberpi_led_show_single_with_rgb_2
  - cyberpi_play_audio_2
  - cyberpi_led_off_2
- time: 20′
  text: ប្រគល់ឧបករណ៍បញ្ជា និងកាតរបស់អ្នកទៅក្រុមផ្សេង ហើយឲ្យគេបើកបរ។ អ្វីដែលគេធ្វើខុស ជាកំហុសរបស់កាត
    មិនមែនរបស់អ្នកបើកបរទេ។
  expect: ក្រុមផ្សេងបើកបររូបយន្តអ្នកដោយប្រើតែកាតរបស់អ្នក។ អ្វីដែលគេធ្វើខុស ជាកំហុសរបស់កាត។
- time: 10′
  text: កំណត់ហេតុ៖ ធាតុចូលណារបស់អ្នកជាព្រឹត្តិការណ៍ និងណាត្រូវសួរ និងហេតុអ្វីដងត្រូវតែជាប្រភេទទីពីរ។
  expect: បន្ទាត់កំណត់ហេតុបែងចែកធាតុចូលជាព្រឹត្តិការណ៍ និងការសួរ និងហេតុអ្វីឧបករណ៍បញ្ជាត្រូវតែសួរ។
code:
  lang: blocks
  source: "define  celebrate\n  LED all displays R 0 G 255 B 0\n  play  hi\n  turns right  360  ° until\
    \ done\n  turn off LED  all\n\nwhen CyberPi starts up\n  show label 1  press A to drive  at x: 0\
    \ y: 0  by small pixel\n\nwhen button A pressed\n  forever\n    encoder motor EM1 rotates at ((joystick\
    \ LY) / 3) RPM, encoder motor EM2 rotates at ((joystick RY) / 3) RPM\n    if  button  L1  pressed\
    \  then\n      grip\n    if  button  R1  pressed  then\n      release\n    if  button  1  pressed\
    \  then\n      celebrate"
tips:
- ផ្នែកបន្ថែមមិនមានស្រាប់ទេ — នៅបាតផ្ទាំងប្លុក <b>+ extensions</b> រួច <b>Bluetooth Controller</b>។
  បើគ្មានវាទេ ប្លុកទាំងនោះមិនមានទាល់តែសោះ ហើយថ្នាក់នឹងរកមិនឃើញ។
- បញ្ជូនកម្មវិធីឡើង រួចចុច A។ ឧបករណ៍បញ្ជាភ្ជាប់ជាមួយ <i>រូបយន្ត</i> មិនមែនកុំព្យូទ័រទេ ដូច្នេះពេលបញ្ជូនរួច
  អ្នកអាចទុកថេប្លេតចោលទាំងស្រុង — នោះជាចំណុចសំខាន់ដែលមេរៀននេះជារបៀប upload។
- ចែកតម្លៃដងចុះ បើមិនដូច្នេះទេរូបយន្តបញ្ជាមិនបាន។ តួចែកត្រឹមត្រូវជាការសម្រួល មិនមែនជាតម្លៃដែលគេឲ្យទេ។
- កាតផ្គូផ្គងមិនមែនជាការងារឥតបានការទេ — អ្នកបើកយន្តហោះសរសេរវាដោយហេតុផលដូចគ្នា។ ក្រុមដែលមិនអាចប្រគល់កាតរបស់ខ្លួនទៅមនុស្សចម្លែក
  មិនទាន់បញ្ចប់ទេ។
