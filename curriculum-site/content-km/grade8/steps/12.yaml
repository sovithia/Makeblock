- ប៊ូតុងយ៉ាងហោចបួនផ្គូផ្គងទៅប្លុកដែលមានស្រាប់
- ក្រុមផ្សេងបានបើកបរវាពីកាតសរសេរ ដោយគ្មានការបង្គោល
