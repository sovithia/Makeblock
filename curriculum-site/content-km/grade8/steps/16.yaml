- សិស្សគ្រប់រូបបានបង្ហាញបញ្ហាទាំងបី
- សិស្សគ្រប់រូបអាចបែងចែកព្រឹត្តិការណ៍ពីការស្ទង់ ហើយប្រាប់ថាហេតុអ្វីនីមួយៗមាន
- ថ្នាក់ចាប់ផ្ដើមដំណាក់កាល D ជាមួយគ្នា
