n: 16
stage: C
stage_title: អន្តរកម្ម
kind: checkpoint
title: ចំណុចត្រួតពិនិត្យទី ៣ — ចំណុចប្រទាក់ និងសារ
concept: ច្រកតាមទាន់
hours: 1
project: G8-C-connects
goal: សិស្សគ្រប់រូបអាចទទួលធាតុចូលពីមនុស្ស ពីរូបយន្តផ្សេង និងប្រែការសាកល្បងទៅជាទិន្នន័យ — មុនពេលរូបយន្តត្រូវបានផ្ដល់សំឡេង។
build: គ្មានអ្វីថ្មីទេ។ ថ្នាក់ទាំងមូលមកដល់កន្លែងតែមួយ។
builds_on:
- ជំហានទី ១១–១៤
teach:
- <b>ម៉ោងបម្រុង</b> មានផ្ដល់ជូននៅទីនេះ ហើយចេតនាមិនដាក់ក្នុងតារាងម៉ោងខាងលើទេ — បន្ថែមវាតែបើថ្នាក់មិនស្មើគ្នា។
  ម៉ោងដែលបានប្រកាស គឺជាអ្វីដែលវគ្គសិក្សាត្រូវការ ពេលគ្មាននរណាត្រូវតាមទាន់។ បើថ្នាក់ស្មើគ្នា ចំណាយវាលើការពង្រីក៖
  គ្រូបង្គោលសាងសង់ការងាររូបយន្តពីរ ដែលនីមួយៗធ្វើពាក់កណ្ដាលខុសគ្នា ហើយប្រគល់គ្នាពីរដង។
- ដំណាក់កាល D បន្ថែមធាតុចូលមួយទៀត — សំដី — ទៅរូបយន្តដែលទទួលធាតុចូលពីឧបករណ៍បញ្ជា ម៉ឺនុយ និងដៃគូរួចហើយ។
  លំនាំដូចគ្នាគ្រប់ដង៖ អ្វីមួយមកដល់ វាត្រូវបានផ្គូផ្គងនឹងអ្វីដែលរូបយន្តស្គាល់ ហើយវាប្ដូរការងារ។ សិស្សដែលមានលំនាំនោះនឹងឃើញដំណាក់កាល
  AI ងាយ; អ្នកដែលមិនមាន នឹងឃើញវាជាមន្តអាគម ដែលអាក្រក់ជាងពិបាក។
- គ្រូបង្គោល ដៃចេញ ម៉ោងបម្រុងទៅកន្លែងដែលត្រូវការ។
guide:
- label: ឆ្លង
  value: ទាំងបីបញ្ហា បង្ហាញឲ្យឃើញ
- label: គ្រូបង្គោល
  value: ដៃចេញ សួរតែសំណួរ
- label: ម៉ោងបម្រុង
  value: +១ ម៉ោង — តែបើថ្នាក់ត្រូវការ មិនរាប់ក្នុងម៉ោងវគ្គសិក្សា
steps:
- time: 10′
  text: រៀបចំស្ថានីយបី។
  expect: ស្ថានីយបីរួចរាល់ មួយក្នុងមួយបញ្ហា។
- time: 30′
  text: បញ្ហាទាំងបី៖ <b>(១)</b> បើកបរផ្លូវវៀចពីកាតភ្ជាប់សរសេររបស់ក្រុមផ្សេង។ <b>(២)</b> ផ្ញើសារជាមួយតម្លៃទៅរូបយន្តផ្សេង
    ហើយឲ្យវាធ្វើតាមតម្លៃ មិនមែនតាមសារទេ។ <b>(៣)</b> ពន្យល់ថាហេតុអ្វីឧបករណ៍បញ្ជាត្រូវស្ទង់ ខណៈពេលប៊ូតុងផ្ទាល់របស់
    CyberPi មិនចាំបាច់។
  expect: បញ្ហាបីបង្ហាញ៖ ការបើកឆ្លងឧបសគ្គតាមកាតផ្គូផ្គងក្រុមផ្សេង សារមួយដែលតម្លៃរបស់វាត្រូវបានប្រើ និងការពន្យល់ថាហេតុអ្វីឧបករណ៍បញ្ជាត្រូវតែសួរ។
- time: 20′
  text: ផ្គូផ្គង៖ អ្នកគ្រប់គ្នាដែលឆ្លងទាំងបី បង្គោលអ្នកដែលមិនទាន់ឆ្លង។
  expect: គ្រប់គ្នាដែលឆ្លងទាំងបី កំពុងបង្គោលអ្នកដែលមិនទាន់ឆ្លង។
blocks:
- Bluetooth controller
- LAN
- Display
- Variables
tips:
- បញ្ហាទី ៣ ជាបញ្ហាគំនិត។ "ព្រោះវាធ្វើដូច្នេះ" មិនឆ្លងទេ — សួរថារូបយន្តត្រូវធ្វើអ្វីដើម្បីកត់សម្គាល់ការចុចដែលវាមិនបានសួរ។
- បញ្ហាទី ២ ងាយក្លែងបន្លំដោយមិនអើពើតម្លៃ។ សុំពួកគេផ្ញើលេខផ្សេង ហើយបង្ហាញការប្ដូរអាកប្បកិរិយា។
- បង្វិលគូបង្គោលម្ដងទៀត។
result:
