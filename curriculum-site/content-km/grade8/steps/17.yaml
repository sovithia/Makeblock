n: 17
stage: D
stage_title: សំឡេង
kind: step
title: Rover និយាយ និងស្ដាប់
concept: សំដីចូល សំដីចេញ
hours: 2
project: G8-D-listens
goal: Rover និយាយឡើងវិញនូវអ្វីដែលអ្នកបាននិយាយទៅវា ហើយអាចនិយាយវាជាភាសាផ្សេង។
build: រូបយន្តដែលអ្នកអាចនិយាយជាមួយ។
builds_on:
- ជំហានទី ១២ · អេក្រង់
- ជំហានទី ១៥ · ធាតុចូលទាំងអស់មានរូបរាងដូចគ្នា
teach:
- ប្លុកបី ហើយរូបយន្តមានសំឡេង។ <b>speak</b> និយាយអ្វីមួយឮៗ។ <b>recognize</b> ស្ដាប់ពីរបីវិនាទី។ <b>speech
  recognition result</b> ប្រគល់អ្វីដែលវាឮ ជា <b>អក្សរ</b> — ជាប្រភេទរបស់ដដែលដែលអ្នកបានដាក់ក្នុងបញ្ជីពេញមួយឆ្នាំ។
  នោះជាចំណុចប្រទាក់ទាំងមូល។
- វាត្រូវការ <b>Wi-Fi</b> ព្រោះការស្ដាប់ និងការនិយាយកើតឡើងលើម៉ាស៊ីនបម្រើ មិនមែនលើរូបយន្តទេ។ និយាយវាត្រង់ៗ៖
  រូបយន្តមិនឆ្លាតទេ វា <i>ត្រូវបានតភ្ជាប់</i>។ ពិនិត្យ <b>network connected?</b> មុនអ្វីៗទាំងអស់ ហើយបង្ហាញវាលើអេក្រង់
  — រូបយន្តដែលមើលទៅដូចថ្លង់ ជាធម្មតាជារូបយន្តដែលផ្ដាច់តំណ។
guide:
- label: មុននោះ
  value: ចូលគណនី mBlock · របៀប Upload
- label: ជាមុនសិន
  value: connect to Wi-Fi · network connected?
- label: ស្ដាប់
  value: recognize … for 3 secs
- label: អានវា
  value: speech recognition result — វាជាអក្សរ
steps:
- time: 20′
  text: ចូលគណនី mBlock និងប្ដូរទៅរបៀប Upload រួចភ្ជាប់ Wi-Fi ហើយដាក់ <b>network connected?</b> លើអេក្រង់។
    គ្មានអ្វីក្នុងដំណាក់កាលនេះដំណើរការទេ បើខ្វះមួយក្នុងចំណោមបី។
  expect: អេក្រង់ប្រាប់ថារូបយន្តនៅលើបណ្ដាញ។ គ្មានអ្វីផ្សេងក្នុងដំណាក់កាលនេះដំណើរការទេ រហូតដល់វាភ្ជាប់។
- time: 20′
  text: ធ្វើឲ្យរូបយន្តនិយាយ។ ឲ្យវាណែនាំខ្លួនឯងដោយសំឡេងខ្លួនឯង — ថ្នាក់នឹងមិនស្ងាត់មួយរយៈទេ ហើយវាមិនអីទេ។
  expect: រូបយន្តណែនាំខ្លួនឯងឮៗ ដោយសំឡេងរបស់វាផ្ទាល់។
- time: 25′
  text: ឥឡូវស្ដាប់៖ recognize បីវិនាទី ហើយបង្ហាញអ្វីដែលវាឮលើអេក្រង់។ និយាយរបស់ដដែលបីដង ហើយប្រៀបធៀប។
  expect: អ្វីដែលវាបានឮ នៅលើអេក្រង់ — និងការសាកបីដងនៃប្រយោគដដែលដើម្បីធៀប។
- time: 25′
  text: និយាយតាមខ្ញុំ៖ វាឮអ្នក ហើយនិយាយវាត្រឡប់មកវិញ។ រួចបកប្រែវា ហើយនិយាយវាជាភាសាផ្សេង។
  expect: វាឮអ្នក ហើយនិយាយវិញ រួចនិយាយម្ដងទៀតជាភាសាផ្សេង។
- time: 20′
  text: សាកល្បងវាលើមនុស្សបីនាក់ខុសគ្នា។ កត់ត្រាថាពាក្យរបស់អ្នកណាត្រឡប់មកត្រឹមត្រូវ និងអ្នកណាមិន — អ្នកនឹងត្រូវការកំណត់ត្រាទាំងនេះនៅជំហានទី
    ១៨។
  expect: កំណត់ត្រាលើមនុស្សបីនាក់ខុសគ្នា៖ ពាក្យអ្នកណាត្រឡប់មកត្រូវ និងអ្នកណាមិនត្រូវ។ ជំហានទី ១៩ ត្រូវការកំណត់ត្រានេះ។
- time: 10′
  text: កត់ត្រាឃ្លាបីដែលវាឮត្រូវ និងបីដែលវាឮខុស។ ជំហានទី ១៩ ត្រូវការវា។
  expect: ឃ្លាបីដែលវាឮត្រូវ និងបីដែលវាឮខុស ក្នុងកំណត់ហេតុ។ ជំហានទី ១៩ បំបែករូបយន្តដោយចេតនាដោយប្រើឃ្លាទាំងនេះ។
code:
  lang: blocks
  source: "when CyberPi starts up\n  connect to Wi-Fi  ssid  password  password\n  wait until  network\
    \ connected?\n  speak  auto  I am awake\n\nwhen button A pressed\n  recognize  (4) English  3  secs\n\
    \  set  heard  to  (speech recognition result)\n  show label 1  join  heard:   (heard)  at x: 0\
    \ y: 0  by small pixel\n  speak  auto  (heard)\n\nwhen button B pressed\n  speak  auto  (translate\
    \  (heard)  into  French)"
tips:
- បើ <b>recognize</b> និង <b>speak</b> លេចឡើងជាពណ៌ប្រផេះមានឆ្នូត នោះគ្មាននរណាចូលគណនីទេ។ mBlock និយាយច្បាស់ពេលដាក់ទស្សន៍ទ្រនិចលើវា៖
  <i>ប្លុកនេះមានតែក្រោយពេលអ្នកចូលគណនី និងបើករបៀប Upload</i>។ ប្លុកទាំងបួននេះជាសេវាកម្មលើពពករបស់ Makeblock
  មិនមែនកូដដែលរត់លើរូបយន្តទេ — ដែលជាមូលហេតុដែលដំណាក់កាលនេះត្រូវការអ៊ីនធឺណិត មិនមែនត្រឹមបណ្ដាញមូលដ្ឋាន។
- ពិនិត្យបណ្ដាញជាមុនគ្រប់ដង។ ប្រាំបួនក្នុងដប់ដង រូបយន្តដែលមិនស្ដាប់ ជារូបយន្តដែលមិនបានតភ្ជាប់ ហើយក្រុមនឹងកែកំហុសប្លុករបស់ខ្លួនម្ភៃនាទីជំនួសវិញ។
- រូបយន្តដប់ពីរស្ដាប់ក្នុងពេលតែមួយ គឺជាភាពវឹកវរ។ ព្រមព្រៀងពិធីការវេនគ្នា មុននរណាម្នាក់ចុចប៊ូតុង។
- រក្សាកំណត់ត្រាក្នុងមួយនាក់ពីសកម្មភាពចុងក្រោយ។ ជំហានទី ១៨ សាងសង់លើពួកវា ហើយពួកវាមិនអាចបង្កើតឡើងវិញក្រោយមកទេ។
result:
  scene: screen
  params:
    lines:
    - ["heard: hello", "#7dd3fc", 10, true]
    - ["says: hello", "#facc15", 10, false]
    - ["French: bonjour", "#22c55e", 9, false]
    caption: the Rover shows, repeats, and translates what it heard
success:
- រូបយន្តនិយាយ និងបង្ហាញស្ថានភាពបណ្ដាញលើអេក្រង់
- វានិយាយឡើងវិញនូវអ្វីដែលវាឮ បានត្រឹមត្រូវ យ៉ាងតិចជួនកាល
- វានិយាយអ្វីមួយជាភាសាទីពីរ
- កំណត់ត្រាអំពីអ្នកណាដែលសំដីរបស់គេត្រូវបានដោះស្រាយបានល្អ
check:
- do: A
  see: Say something. It writes it on the screen and says it back.
- do: B
  see: It says the same thing again in French.
parts:
- id: robot_tank
- id: router
  note: Wi-Fi with internet
