n: 19
stage: D
stage_title: សំឡេង
kind: step
title: ពេលវាមិនយល់
concept: អ្វីដែលម៉ាស៊ីនធ្វើពេលមិនប្រាកដ
hours: 2
project: G8-D-listens
goal: Rover ប្រព្រឹត្តសមរម្យពេលវាឮខុស — ហើយក្រុមអាចប្រាប់ថាអ្វីធ្វើឲ្យការស្គាល់សំដីបរាជ័យ។
build: រូបយន្តដែលទទួលស្គាល់ថាវាមិនបានឮ។
builds_on:
- ជំហានទី ១៧ · វាក្យសព្ទ
- ជំហានទី ១៦ · ឃ្លាដែលវាឮខុស
teach:
- រាល់ប្រព័ន្ធស្គាល់សំដីបរាជ័យ ហើយសំណួរគួរឲ្យចាប់អារម្មណ៍មិនមែន <i>តើ</i> ទេ តែជា <i>វាធ្វើអ្វីអំពីវា</i>។
  បើគ្មានអ្វីក្នុងបញ្ជីត្រូវគ្នា រូបយន្តត្រូវធ្វើអ្វីមួយដោយចេតនា៖ និយាយថា "ខ្ញុំមិនបានឮ" សួរម្ដងទៀត
  ហើយ — សំខាន់ — <b>មិនផ្លាស់ទី</b>។ រូបយន្តដែលទាយពេលវាមិនប្រាកដ គ្រោះថ្នាក់ជាងរូបយន្តដែលទទួលស្គាល់ថាខ្លួនមិនដឹង។
- រួចរកមូលហេតុដែលវាបរាជ័យ ដោយប្រើកំណត់ត្រាពីជំហានទី ១៦។ សំនៀង។ សំឡេងរំខានផ្ទៃខាងក្រោយ។ ពាក្យដែលស្តាប់ទៅដូចគ្នា។
  ការនិយាយពីចម្ងាយពេក ឬលឿនពេក។ គ្មានមួយណាជាការឆ្កួតរបស់រូបយន្តទេ៖ វាត្រូវបានបង្វឹកលើសំឡេងខ្លះ មិនមែនសំឡេងផ្សេងទេ
  ហើយវាជួបព្រំដែនដដែលនឹងមនុស្សក្នុងបន្ទប់ដែលមានសំឡេងរំខាន — លើកលែងតែវាមិនអាចសុំអ្នកនិយាយម្ដងទៀត លុះត្រាតែអ្នកសាងសង់វាចូល។
guide:
- label: គ្មានការត្រូវគ្នា
  value: និយាយវា សួរម្ដងទៀត កុំផ្លាស់ទី
- label: សាកល្បង
  value: សំនៀង សំឡេងរំខាន ពាក្យស្រដៀង
- label: រាប់
  value: ជោគជ័យក្នុងមួយនាក់ សរសេរចុះ
steps:
- time: 15′
  text: បន្ថែម else៖ គ្មានអ្វីត្រូវគ្នា ដូច្នេះនិយាយថា "ខ្ញុំមិនបានឮ" ហើយនៅស្ងៀម។ សាកល្បងវាដោយនិយាយអ្វីគ្មានន័យ។
  expect: និយាយអ្វីដែលគ្មានន័យ ហើយរូបយន្តប្រាប់ថាវាមិនបានឮច្បាស់ — ហើយវាមិនផ្លាស់ទីទេ។
- time: 25′
  text: បំបែកវាដោយចេតនាដោយប្រើឃ្លាពីជំហានទី ១៦ បូកនឹងសំឡេងរំខាន បូកនឹងការឈរឆ្ងាយ។
  expect: រូបយន្តត្រូវបំបែកដោយចេតនាដោយឃ្លាជំហានទី ១៧ ដោយសំឡេងរំខាន និងពីចម្ងាយឆ្លងបន្ទប់។
- time: 25′
  text: ពាក្យស្រដៀងគ្នា៖ រកបញ្ជាពីរក្នុងវាក្យសព្ទរបស់អ្នកដែលត្រូវច្រឡំ ហើយប្ដូរមួយ។
  expect: បញ្ជាពីរដែលច្រឡំគ្នា រកឃើញ ហើយមួយក្នុងនោះត្រូវប្ដូរ។
- time: 25′
  text: វាស់វា៖ សមាជិកក្រុមនីមួយៗឲ្យបញ្ជាប្រាំដដែល។ រាប់ជោគជ័យក្នុងមួយនាក់ ហើយដាក់លេខលើក្ដារ។
  expect: ចំនួនជោគជ័យក្នុងមួយនាក់សម្រាប់បញ្ជាប្រាំដដែល នៅលើក្ដារជាលេខ។
- time: 20′
  text: ការពិភាក្សាថ្នាក់ចេញពីក្ដារ មិនមែនចេញពីមតិទេ៖ វាដំណើរការល្អបំផុតសម្រាប់អ្នកណា ហើយអ្នកនឹងត្រូវប្ដូរអ្វីដើម្បីកែវា?
  expect: ការពិភាក្សាឈរលើលេខនៅលើក្ដារ ជាជាងលើមតិ៖ វាដំណើរការល្អបំផុតសម្រាប់អ្នកណា និងអ្វីត្រូវប្ដូរ។
- time: 10′
  text: កត់ត្រាតារាងក្នុងមួយនាក់ និងប្រយោគមួយអំពីកន្លែងដែលរឿងនេះនឹងសំខាន់នៅក្រៅថ្នាក់រៀន។
  expect: តារាងតាមមនុស្សក្នុងកំណត់ហេតុ និងឃ្លាមួយអំពីកន្លែងដែលរឿងនេះនឹងសំខាន់នៅក្រៅថ្នាក់រៀន។
code:
  lang: blocks
  source: |-
    when CyberPi starts up
      connect to Wi-Fi  ssid  password  password
      wait until  network connected?
      speak  auto  I am awake
      delete all of  commands
      add  forward  to  commands
      add  stop  to  commands
      add  fetch  to  commands

    when button A pressed
      recognize  (4) English  3  secs
      set  heard  to  (speech recognition result)
      show label 1  join  heard:   (heard)  at x: 0 y: 0  by small pixel
      set  matched  to 0
      set  stop  to  ((length of commands) + 1)
      count with  i  from 1 to (stop) by step 1 repeat
        if  ((heard) contains  (item (i) of commands) ?)  then
          set  job  to  (item (i) of commands)
          set  matched  to 1
          speak  auto  join  ok,   (item (i) of commands)
          break
      if  (matched) = 0  then
        stop encoder motor  all
        speak  auto  I did not catch that

    when button B pressed
      speak  auto  (translate  (heard)  into  French)
tips:
- ការបង្ហាញអ្វីដែលវា <i>គិតថា</i> វាឮ គឺជាឧបករណ៍កែកំហុសល្អបំផុតក្នុងដំណាក់កាលនេះ។ បើគ្មានវា សិស្សស្តីបន្ទោសមីក្រូហ្វូន។
- រក្សាការពិភាក្សាជាការស៊ើបអង្កេត។ ប្រព័ន្ធមិនអយុត្តិធម៌ដោយចេតនាទេ — វាត្រូវបានសាងសង់ពីសំឡេងខ្លះ មិនមែនសំឡេងផ្សេង
  ហើយនោះជាការពិតដែលមានផលវិបាក។
- លេខក្នុងមួយនាក់ធ្វើឲ្យរឿងនេះជាក់ស្តែងតាមរបៀបដែលមតិមិនអាចធ្វើបាន។ តម្រូវឲ្យរាប់។
result:
  scene: debug
success:
- ផ្លូវគ្មានការត្រូវគ្នាច្បាស់លាស់ ដែលនិយាយ ហើយមិនផ្លាស់ទី
- បញ្ជាស្រដៀងគ្នាពីររកឃើញ ហើយមួយត្រូវបានប្ដូរ
- តារាងជោគជ័យក្នុងមួយនាក់លើក្ដារ ចេញពីការសាកល្បងដែលរាប់
check:
- do: "A"
  see: Say nonsense. It stops, says it did not catch that, and shows what it heard.
