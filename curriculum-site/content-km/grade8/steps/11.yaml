- សិស្សគ្រប់រូបបានបង្ហាញបញ្ហាទាំងបី
- ដ្យាក្រាមការងារគ្រប់មួយមានព្រួញចេញពីការបរាជ័យ
- ថ្នាក់ចាប់ផ្ដើមដំណាក់កាល C ជាមួយគ្នា
