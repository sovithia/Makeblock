n: 11
stage: B
stage_title: ក្បួនដោះស្រាយលើផ្នែករឹងថ្មី
kind: checkpoint
title: ចំណុចត្រួតពិនិត្យទី ២ — បញ្ជី រង្វិលជុំ សញ្ញាប្រមាណវិធី ស្ថានភាព
concept: ច្រកតាមទាន់
hours: 1
project: G8-B-thinks
goal: សិស្សគ្រប់រូបអាចផ្ទុកលំដាប់ ទាយរង្វិលជុំជាន់គ្នា គណនាពីឧបករណ៍ចាប់សញ្ញា និងប្រាប់ថាអ្វីសម្រេចការងារបច្ចុប្បន្នរបស់រូបយន្ត។
build: គ្មានអ្វីថ្មីទេ។ ថ្នាក់ទាំងមូលមកដល់កន្លែងតែមួយ។
builds_on:
- ជំហានទី ៦–៩
teach:
- '<b>ម៉ោងបម្រុង</b> មានផ្ដល់ជូននៅទីនេះ ហើយចេតនាមិនដាក់ក្នុងតារាងម៉ោងខាងលើទេ — បន្ថែមវាតែបើថ្នាក់មិនស្មើគ្នា។ ម៉ោងដែលបានប្រកាស គឺជាអ្វីដែលវគ្គសិក្សាត្រូវការ ពេលគ្មាននរណាត្រូវតាមទាន់។ បើថ្នាក់ស្មើគ្នា ចំណាយវាលើការពង្រីក៖ គ្រូបង្គោលបន្ថែមការងារទីប្រាំតាមការរចនាខ្លួនឯង ធ្វើបច្ចុប្បន្នភាពដ្យាក្រាម រួចប្រគល់រូបយន្តទៅក្រុមផ្សេងឲ្យព្យាយាមធ្វើឲ្យជាប់គាំង។'
- ដំណាក់កាល C ប្រគល់ឧបករណ៍បញ្ជា ម៉ឺនុយ រូបយន្តទីពីរ និងកំណត់ហេតុទិន្នន័យដល់រូបយន្ត — ហើយរាល់មួយក្នុងចំណោមនោះសាងសង់លើអ្វីដែលច្រកនេះពិនិត្យ។
  ជាពិសេសម៉ាស៊ីនស្ថានភាព៖ ដំណាក់កាល C បន្ថែមធាតុចូលទៅវា ហើយដំណាក់កាល D បន្ថែមសំឡេងទៅវា។
- គ្រូបង្គោល ដៃចេញ ម៉ោងបម្រុងទៅកន្លែងដែលត្រូវការ។
guide:
- label: ឆ្លង
  value: ទាំងបីបញ្ហា បង្ហាញឲ្យឃើញ
- label: គ្រូបង្គោល
  value: ដៃចេញ សួរតែសំណួរ
- label: ម៉ោងបម្រុង
  value: +១ ម៉ោង — តែបើថ្នាក់ត្រូវការ មិនរាប់ក្នុងម៉ោងវគ្គសិក្សា
steps:
- time: 10′
  text: រៀបចំស្ថានីយបី។
  expect: ស្ថានីយបីរួចរាល់ មួយក្នុងមួយបញ្ហា។
- time: 30′
  text: បញ្ហាទាំងបី៖ <b>(១)</b> ផ្ទុកទីតាំងដៃចាប់យ៉ាងតិចប្រាំក្នុងបញ្ជី ហើយចាក់ពួកវាឡើងវិញ។ <b>(២)</b>
    ទាយចំនួនរង្វិលជុំក្នុងនៃរង្វិលជុំជាន់គ្នាដែលគ្រូសរសេរ មុនវាដំណើរការ។ <b>(៣)</b> បង្ហាញដ្យាក្រាមការងាររបស់អ្នក
    ហើយឆ្លើយថាកើតអ្វីបើដៃចាប់បិទលើអ្វីទាំងអស់។
  expect: បញ្ហាបីបង្ហាញ៖ ឥរិយាបថដៃប្រាំរក្សាទុកនិងចាក់ឡើងវិញ ចំនួនរង្វិលជុំក្នុងរង្វិលជុំទាយមុនវារត់ និងដ្យាក្រាមការងារឆ្លើយថាមានអ្វីកើតឡើងពេលដៃចាប់បិទលើអវត្តមាន។
- time: 20′
  text: ផ្គូផ្គង៖ អ្នកគ្រប់គ្នាដែលឆ្លងទាំងបី បង្គោលអ្នកដែលមិនទាន់ឆ្លង។
  expect: គ្រប់គ្នាដែលឆ្លងទាំងបី កំពុងបង្គោលអ្នកដែលមិនទាន់ឆ្លង។
blocks:
- Variables
- Control
- My Blocks
tips:
- បញ្ហាទី ៣ ជាបញ្ហាសំខាន់។ សិស្សដែលមិនអាចឆ្លើយករណីបរាជ័យ មានដ្យាក្រាម មិនមែនម៉ាស៊ីនស្ថានភាពទេ។
- សម្រាប់បញ្ហាទី ២ សរសេររង្វិលជុំជាន់គ្នាដែលមានលេខមិនស្មើគ្នា — 3 × 5 មិនមែន 4 × 4 — ដើម្បីឲ្យចម្លើយមិនអាចទាយពីភាពស៊ីមេទ្រី។
- បង្វិលគូបង្គោលពីចំណុចត្រួតពិនិត្យទី ១។
