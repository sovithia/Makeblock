- ម៉ូឌុលទាំងពីរបញ្ចប់ និងផ្ទៀងផ្ទាត់ថាបញ្ច្រាសគ្នាដោយក្រុមផ្សេង
- កង់គ្រប់មួយវិលដោយសេរីបន្ទាប់ពីបង្វិលថយ 90°
- ថាសតម្រៀប និងថតរូប គ្មានអ្វីបាត់
