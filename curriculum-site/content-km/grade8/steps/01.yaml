build_caption: សៀវភៅបោះពុម្ព · តង្កៀបកង់ កង់ឆ្វេង កង់ស្ដាំ ទិសសរសៃខ្សែក្រវាត់
tips:
- មគ្គុទ្ទេសក៍ Rover គឺជា <b>សៀវភៅបោះពុម្ពក្នុងប្រអប់បន្ថែម</b> ពីដើមដល់ចប់។ គ្មានកំណែឌីជីថលទេ — រូបភាពខាងលើជាការថតពីវា។
  សាងសង់ពីសៀវភៅក្នុងដៃអ្នក; រូបថតបង្ហាញត្រឹមថាអ្នកនៅត្រង់ណា។ កុំប្រើ <code>mbot2_addons.pdf</code>៖
  ទោះបីចំណងជើងគម្របយ៉ាងណា ឯកសារនោះជាមគ្គុទ្ទេសក៍ <b>Ranger</b> ដែលជារូបយន្តផ្សេង មានខ្សែម៉ូទ័រត្រង់ជំនួសឆ្លាស់
  និងសេវ៉ូនៅ S3/S4 ជំនួស S1។
- កំហុសបញ្ច្រាសជាកំហុសបុរាណ ហើយវាស្ទើរតែមើលមិនឃើញរហូតដល់រូបយន្តបើកបរ។ តម្រូវឲ្យមានការពិនិត្យឆ្លង —
  អ្នកសាងសង់មើលកំហុសខ្លួនឯងមិនឃើញនៅដំណាក់កាលនេះទេ។
- បន្ទាប់ពីរឹតវីសកង់នីមួយៗ បង្វិលខ្ចៅថយ 90° ច្រាសទ្រនិចនាឡិកា។ កង់ត្រូវវិលដោយសេរី បើមិនដូច្នេះទេម៉ូទ័រតានតឹងពេញមួយឆ្នាំ។
- ទិសរបស់ខ្សែក្រវាត់សំខាន់; ខ្សែក្រវាត់ទាំងពីរចង្អុលទៅទិសដដែល។ មានរូបពង្រីកក្នុងមគ្គុទ្ទេសក៍បង្ហាញវា។
