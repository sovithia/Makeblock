n: 1
stage: A
stage_title: ម៉ាស៊ីនថ្មី
kind: step
title: ការរុះរើ និងខ្សែក្រវាត់
concept: ការផ្គុំបញ្ច្រាស
hours: 2
project: G8-A-rebuilt
goal: ម៉ូឌុលខ្សែក្រវាត់ទាំងពីរសាងសង់រួច បញ្ច្រាសគ្នាត្រឹមត្រូវ វិលដោយសេរី និងតឹងល្មម — ពិនិត្យដោយក្រុមដែលមិនបានសាងសង់ពួកវា។
build: ម៉ូឌុលកង់ខ្សែក្រវាត់ពីរ ដែលជារូបភាពបញ្ច្រាសគ្នា មិនមែនភ្លោះទេ។
builds_on:
- ថ្នាក់ទី ៧ · រូបយន្តដែលអ្នកចេះបើកបរ
teach:
- រុះរើរូបយន្តឆ្នាំមុនឲ្យបានត្រឹមត្រូវ។ ការរុះរើជាជំនាញ មិនមែនការបំផ្លាញទេ៖ គ្រឿងមួយចាកចេញពីរូបយន្តតែពេលវាធ្លាក់ចូលថាសដែលមានស្លាកត្រឹមត្រូវ។
  ការអានមគ្គុទ្ទេសក៍ថយក្រោយ គឺជាជំនាញអានដ្យាក្រាមដដែលនឹងការអានទៅមុខ ហើយសប្ដាហ៍ក្រោយអ្នកនឹងរីករាយដែលវីសត្រូវបានតម្រៀប។
- រួចមកកំហុសតែមួយដែលចំណាយពេលពេញមួយវគ្គបើវារស់រាន៖ ម៉ូឌុលខ្សែក្រវាត់ទាំងពីរ <b>បញ្ច្រាស</b> គ្នា។ ការសាងសង់ពីរដូចគ្នាបេះបិទមានអារម្មណ៍ត្រឹមត្រូវ
  តែវាខុស ហើយវាមិនច្បាស់រហូតដល់ Rover បើកបរជារង្វង់។ ពិនិត្យម៉ូឌុលនីមួយៗធៀបនឹងទំព័រមគ្គុទ្ទេសក៍ មុនអ្នកបញ្ចប់វា
  — ហើយឲ្យក្រុមផ្សេងពិនិត្យផងដែរ ព្រោះអ្នកឈប់ឃើញការងារខ្លួនឯងបន្ទាប់ពីម្ភៃនាទី។
guide:
- label: មគ្គុទ្ទេសក៍
  value: សៀវភៅបោះពុម្ព · តង្កៀប → កង់ឆ្វេង → កង់ស្ដាំ
- label: ខ្ចៅ
  value: បង្វិលថយ 90° ច្រាសទ្រនិចនាឡិកា — ត្រូវវិលដោយសេរី
- label: ពិនិត្យ
  value: សង្កត់ដោយម្រាមដៃ ចុះហត្ថលេខាដោយក្រុមផ្សេង
steps:
- time: 15′
  text: រំលឹករហ័សជាក្រុម៖ រាយរបស់ប្រាំដែលរូបយន្តឆ្នាំមុនធ្វើបាន។ រក្សាបញ្ជីនោះ — ជំហានទី ២ សួរថាមួយណានៅដំណើរការ។
  expect: បញ្ជីសរសេរនៃរឿងប្រាំដែលរូបយន្តឆ្នាំមុនធ្វើបាន ទុកសម្រាប់ជំហានទី ២។
- time: 20′
  text: ការរុះរើមានរបៀបចូលថាសមានស្លាក។ គ្រឿងអេឡិចត្រូនិកដាក់ដាច់ដោយឡែក មានស្រទាប់ការពារ។ ថតរូបថាសពេញ។
  expect: គ្រប់គ្រឿងក្នុងថាសមានស្លាក អេឡិចត្រូនិកមានស្រទាប់ការពារ និងដាក់ដាច់ដោយឡែក និងរូបថតថាសពេញ។
- time: 45′
  text: សាងសង់ម៉ូឌុលកង់ខ្សែក្រវាត់ទាំងពីរពីមគ្គុទ្ទេសក៍។ ពិនិត្យនីមួយៗធៀបនឹងទំព័រ <i>មុន</i> អ្នកបញ្ចប់វា
    មិនមែនក្រោយទេ។
  expect: ម៉ូឌុលកង់ខ្សែក្រវាត់ពីរបានសាងសង់ នីមួយៗត្រួតពិនិត្យនឹងទំព័រមុនពេលបញ្ចប់។
- time: 20′
  text: ការពិនិត្យឆ្លង៖ ក្រុមផ្សេងកាន់ម៉ូឌុលទាំងពីររបស់អ្នកជាប់គ្នាធៀបនឹងមគ្គុទ្ទេសក៍ ហើយចុះហត្ថលេខាថាពួកវាបញ្ច្រាសគ្នា។
  expect: ក្រុមផ្សេងបានកាន់ម៉ូឌុលពីររបស់អ្នកជាប់គ្នាធៀបនឹងមគ្គុទ្ទេសក៍ ហើយចុះហត្ថលេខាថាវាឆ្លុះគ្នា។
- time: 15′
  text: ការសាកល្បងវិលសេរី និងភាពតឹងលើទាំងពីរ។ បង្វិលខ្ចៅថយ 90° ហើយស្គាល់ភាពខុសគ្នារវាងជាប់ និងសេរី។
  expect: ម៉ូឌុលទាំងពីរវិលដោយសេរី ហើយអ្នកមានអារម្មណ៍ដល់ភាពខុសគ្នារវាងខ្ចៅតឹង និងខ្ចៅសេរី។
- time: 5′
  text: ថាសត្រឡប់ជាសណ្ដាប់ធ្នាប់។ កត់ត្រាគ្រឿងណាដែលអ្នកមិនអាចហៅឈ្មោះ។
  expect: ថាសរៀបចាំវិញ និងបន្ទាត់កំណត់ហេតុដាក់ឈ្មោះគ្រឿងដែលអ្នកហៅឈ្មោះមិនកើត។
