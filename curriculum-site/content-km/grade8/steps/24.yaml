success:
- ការសាកល្បងផ្លូវការពីរដងបានពិន្ទុធៀបនឹងលក្ខណៈវិនិច្ឆ័យចុះហត្ថលេខាផ្ទាល់របស់ក្រុម
- ការកំណត់បង្កកជាលាយលក្ខណ៍អក្សរមុនការសាកល្បងដំបូង
- ក្រុមគ្រប់ក្រុមបានប្រាប់រឿងបរាជ័យស្មោះត្រង់មួយ និងអ្វីដែលវាបង្រៀនពួកគេ
