n: 24
stage: E
stage_title: បេសកកម្ម
kind: step
title: បង្កក ហើយបង្ហាញវា
concept: ភាពជឿជាក់ក្រោមសម្ពាធ
hours: 1
project: G8-E-mission
goal: ការសាកល្បងបានពិន្ទុពីរដងធៀបនឹងលក្ខណៈវិនិច្ឆ័យផ្ទាល់របស់ក្រុម ដោយការកំណត់បង្កកជាមុន និងរបាយការណ៍ស្មោះត្រង់អំពីអ្វីដែលបរាជ័យ។
build: Rover ដែលបញ្ចប់ — ហើយគម្រោងនេះជាការបង្ហាញ។
builds_on:
- ជំហានទី ២២ · ការងារដំណើរការ
teach:
- ដាក់ពិន្ទុក្រុមនីមួយៗធៀបនឹង <b>លក្ខណៈវិនិច្ឆ័យចុះហត្ថលេខាផ្ទាល់របស់ពួកគេ</b> ព្រោះបេសកកម្មខុសគ្នា។
  នោះមិនមែនជាការសម្របសម្រួលទេ; នោះជារបៀបដែលវិស្វកម្មត្រូវបានវិនិច្ឆ័យពិត — ធៀបនឹងការបញ្ជាក់ដែលអ្នកបានប្ដេជ្ញា
  មិនមែនធៀបនឹងរបស់អ្នកដទៃទេ។
- បង្កកមុនការសាកល្បងដំបូង៖ រាល់លេខសរសេរចុះ គម្រោងរក្សាទុកក្រោមឈ្មោះចុងក្រោយ គ្មានការកែក្រោយបន្ទាត់នោះ។
  រួចបង្ហាញ ហើយរួមបញ្ចូលការបរាជ័យស្មោះត្រង់មួយ។ ក្រុមដែលរូបយន្តខូច តែអាចពន្យល់ច្បាស់លាស់ថាហេតុអ្វី
  បានរៀនច្រើនជាងក្រុមដែលរូបយន្តដំណើរការ តែពួកគេមិនដឹងថាដំណើរការយ៉ាងណា។
guide:
- label: បង្កក
  value: សរសេរលេខ រក្សាទុកគម្រោង ឈប់កែ
- label: រក្សាទុកជា
  value: G8-E-mission-<ក្រុម> — នេះជាការបង្ហាញ
- label: ពិន្ទុ
  value: ធៀបនឹងលក្ខណៈវិនិច្ឆ័យផ្ទាល់របស់អ្នក តាមដំណាក់កាល
steps:
- time: 10′
  text: ពិនិត្យភាពជឿជាក់៖ ដំណើរការវាពីរដង ហើយរាប់។ កែតែអ្វីដែលការរាប់ចង្អុលទៅ។
  expect: ការសាកល្បងពីរដង ចំនួនជោគជ័យ និងការជួសជុលតែលើអ្វីដែលចំនួននោះចង្អុលបង្ហាញ។
- time: 10′
  text: បង្កក។ លេខចូលកំណត់ហេតុ គម្រោងរក្សាទុកក្រោមឈ្មោះចុងក្រោយ គ្មានការកែក្រោយបន្ទាត់នេះទេ។
  expect: គ្រប់លេខក្នុងកំណត់ហេតុ និងគម្រោងរក្សាទុកក្រោមឈ្មោះចុងក្រោយ។ គ្មានការកែក្រោយបន្ទាត់នេះទេ។
- time: 25′
  text: ការសាកល្បងផ្លូវការ — ពីរដងក្នុងមួយក្រុម ដាក់ពិន្ទុធៀបនឹងលក្ខណៈវិនិច្ឆ័យផ្ទាល់របស់ក្រុមនោះ
    ជាមួយពេលជួសជុលរវាងដង។
  expect: ការសាកល្បងផ្លូវការពីរដងក្នុងមួយក្រុម ដាក់ពិន្ទុតាមលក្ខណៈវិនិច្ឆ័យរបស់ក្រុមនោះ ជាមួយពេលជួសជុលរវាងគ្នា។
- time: 15′
  text: ការបង្ហាញ៖ ការងារជាអ្វី វាដំណើរការយ៉ាងណា ការបរាជ័យស្មោះត្រង់មួយ និងអ្វីដែលវាបង្រៀនអ្នក។
  expect: បទបង្ហាញអំពីអ្វីដែលការងារនោះជា របៀបដែលវាដំណើរការ និងការបរាជ័យស្មោះមួយ និងអ្វីដែលវាបង្រៀន។
blocks:
- My Blocks
- Variables
- Control
- AI
- mBot2 Extension Port
tips:
- ដាក់ពិន្ទុធៀបនឹងលក្ខណៈវិនិច្ឆ័យផ្ទាល់របស់ក្រុមនីមួយៗ។ បេសកកម្មខុសគ្នា; យុត្តិធម៌រស់នៅក្នុងការបញ្ជាក់ដែលពួកគេចុះហត្ថលេខានៅជំហានទី
  ២១។
- រឿងបរាជ័យជាផ្នែកដែលបង្ហាញភាពចាស់ទុំវិស្វកម្ម។ ដាក់ទម្ងន់វា ហើយបង្គោលប្រយោគចុងក្រោយឲ្យបញ្ចប់លើមេរៀន
  ជាជាងលើលេសដោះសា។
- ថតរូបលេខដែលបង្កក និងក្ដារពិន្ទុ។ ថ្នាក់ទី ៩ ចាប់ផ្ដើមដោយសួរថារូបយន្តនេះធ្វើអ្វីមិនបាន។
result:
