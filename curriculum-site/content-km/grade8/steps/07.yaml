n: 7
stage: B
stage_title: ក្បួនដោះស្រាយលើផ្នែករឹងថ្មី
kind: step
title: បញ្ជីនៃទីតាំង
concept: បញ្ជីនៃទិន្នន័យមានរចនាសម្ព័ន្ធ
hours: 2
project: G8-B-thinks
goal: លំដាប់ទីតាំងដៃចាប់ផ្ទុកក្នុងបញ្ជី ហើយចាក់ឡើងវិញតាមបញ្ជា។
build: របាំដែលដៃចាប់អាចធ្វើម្ដងទៀតបានបេះបិទ។
builds_on:
- ជំហានទី ៤ · ប្លុកដៃចាប់
- ថ្នាក់ទី ៧ · បញ្ជី
teach:
- ឆ្នាំមុនបញ្ជីផ្ទុកផ្លូវមួយ។ ឆ្នាំនេះវាផ្ទុក <b>ទីតាំង</b> — ហើយវាជាគំនិតដដែលពាក់សម្លៀកបំពាក់ខុស
  ដែលគួរនិយាយឲ្យឮ ព្រោះការស្គាល់លំនាំដែលធ្លាប់ស្គាល់ក្នុងផ្នែករឹងថ្មី គឺជាភាគច្រើននៃអ្វីដែលបទពិសោធន៍ជា។
- <b>add</b> ទីតាំងមួយទៅបញ្ជី, <b>count with i</b> ដើរតាមវា, <b>item (i) of poses</b> យកនីមួយៗ។ ឥឡូវដៃចាប់មានទម្លាប់ដែលវាអាចធ្វើម្ដងទៀតបានដូចគ្នាបេះបិទគ្រប់ដង
  — ហើយការប្ដូរទម្លាប់មានន័យថាប្ដូរទិន្នន័យ មិនមែនកូដទេ។
guide:
- label: ផ្ទុក
  value: add <មុំ> to poses
- label: ចាក់
  value: count with i · item (i) of poses
- label: កែ
  value: replace item n — គ្មានការកត់ត្រាឡើងវិញ
steps:
- time: 15′
  text: ធ្វើការគោរពបីទីតាំងដោយដៃ ដោយហៅ lift() ជាមួយលេខបី។ កត់សម្គាល់ថាអ្នកបានសរសេរទម្លាប់ជាប់ក្នុងកូដ។
  expect: ការគោរពបីឥរិយាបថបានធ្វើ — និងការដឹងថាលំដាប់នោះជាប់រឹងក្នុងកម្មវិធី។
- time: 25′
  text: ដាក់មុំទាំងបីក្នុងបញ្ជីជំនួសវិញ ហើយចាក់ពួកវាឡើងវិញដោយ count with i។
  expect: ការគោរពដដែល ប៉ុន្តែមុំទាំងបីឥឡូវនៅក្នុងបញ្ជីដែលរង្វិលជុំអាន។
- time: 25′
  text: ធ្វើឲ្យវាវែងជាង — ប្រាំបីទីតាំង — ហើយបន្ថែមការរង់ចាំដើម្បីឲ្យចលនាអានបាន។ ការប្ដូររបាំឥឡូវជាការប្ដូរលេខ។
  expect: លំដាប់ប្រាំបីឥរិយាបថដែលអានទៅដូចចលនា — ហើយការប្ដូររបាំឥឡូវជាការប្ដូរលេខ មិនមែនប្លុក។
- time: 25′
  text: កត់ត្រាទីតាំងរស់៖ joystick រំកិលដៃចាប់ ប៊ូតុងបន្ថែមមុំបច្ចុប្បន្នទៅបញ្ជី។ បង្រៀនវាដោយដៃ រួចមើលវាធ្វើម្ដងទៀត។
  expect: អ្នកបញ្ជាដៃដោយឧបករណ៍បញ្ជា ចុចប៊ូតុង ហើយរូបយន្តធ្វើម្ដងទៀតនូវអ្វីដែលអ្នកបង្រៀន។
- time: 20′
  text: កែដោយមិនកត់ត្រាឡើងវិញ៖ ជំនួសទីតាំងដែលអ្នកមិនចូលចិត្ត លុបចុងក្រោយ ស៊កថ្មីនៅកណ្ដាល។
  expect: ឥរិយាបថមួយជំនួស មួយលុប និងមួយបញ្ចូលនៅកណ្ដាល ដោយគ្មានការថតឡើងវិញ។
- time: 10′
  text: កត់ត្រា៖ អ្វីផ្សេងទៀតលើរូបយន្តនេះអាចផ្ទុកជាបញ្ជីបាន?
  expect: ចម្លើយកំណត់ហេតុដាក់ឈ្មោះរបស់ផ្សេងលើរូបយន្តនេះ ដែលអាចរក្សាទុកជាបញ្ជី។
code:
  lang: blocks
  source: |-
    when CyberPi starts up
      delete all of  poses

    when joystick  middle pressed
      add  (servo (1) S1 current angle (°))  to  poses
      show label 1  join  poses:   (length of poses)  at x: 0 y: 0  by small pixel

    when button A pressed
      set  stop  to  ((length of poses) + 1)
      count with  i  from 1 to (stop) by step 1 repeat
        lift  (item (i) of poses)
        wait 0.4 seconds
tips:
- ការអានមុំ <i>បច្ចុប្បន្ន</i> របស់ servo ដើម្បីកត់ត្រាវា គឺជាល្បិចដែលធ្វើឲ្យការបង្រៀន-ដោយ-ដៃដំណើរការ។
  ចង្អុលទៅប្លុក; ក្រុមកម្រនឹងរកវាឃើញដោយខ្លួនឯង។
- សម្អាតបញ្ជីមុនកត់ត្រា បើមិនដូច្នេះទេ ទម្លាប់ទីពីរត្រូវបានផ្សាភ្ជាប់ទៅទីមួយ។
- រក្សារាល់មុំក្នុងព្រំដែនជំហានទី ៣។ ទីតាំងដែលកត់ត្រា នៅតែជាទីតាំងដែលអ្នកយាមត្រូវពិនិត្យ។
result:
  scene: screen
  params:
    lines:
    - ["poses: 25, 60, 95", "#7dd3fc", 10, true]
    - ["saved: 6", "#facc15", 10, false]
    caption: the arm replays every saved pose in order
success:
- ទម្លាប់យ៉ាងតិចប្រាំមួយទីតាំងផ្ទុកក្នុងបញ្ជី និងចាក់ឡើងវិញដូចគ្នាបេះបិទ
- ទីតាំងកត់ត្រាដោយរំកិលដៃចាប់ដោយដៃ មិនមែនវាយចូល
- ទម្លាប់កែដោយមិនកត់ត្រាវាឡើងវិញ
check:
- do: "mid"
  see: The arm's position is saved and the counter goes up.
- do: "A"
  see: The arm plays back every pose you saved, in order.
parts:
