tips:
- សាងសង់ពី <b>សៀវភៅបោះពុម្ព</b> — មិនមែនពី <code>mbot2_addons.pdf</code> ដែលសាងសង់ Ranger
  ទេ។ ខ្សែម៉ូទ័រឆ្លាស់ខាងក្រោមជារបស់ Rover; Ranger ភ្ជាប់ត្រង់ ហើយរូបយន្តដែលសាងសង់ពីមគ្គុទ្ទេសក៍ខុស
  នឹងមិនដំណើរការកម្មវិធីវគ្គសិក្សានេះទេ។
- The motor cables are CROSSED on the Rover. If you built last year's mBot2, your hands will do it wrong
  from memory — check the page, not your memory.
- Back the wheel-hub nuts off 90° after tightening. A bound track looks like a weak motor and wastes an
  afternoon.
- Metal shock absorbers, not the plastic ones. The plastic ones are spares.
- Peel the film off the boards while you sort, not while you build.
- Do not power the servos yet. Their safe range gets measured by hand, unpowered, in Step 4.
result:
  scene: roverbuild
  params: {stage: full}
success:
- Both tracks turn freely by hand, neither binding
- Motor cables crossed correctly, checked by another team
- All eight body boards fitted, film peeled, cables tucked
check:
- do: "see"
  see: Turn both tracks by hand. They move freely and feel the same as each other.
- do: "see"
  see: The left motor goes to EM2 and the right to EM1. Crossed, on purpose.
- do: "see"
  see: Shake it. Nothing rattles, and no cable is trapped under a track.
