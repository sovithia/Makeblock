n: 8
stage: B
stage_title: ក្បួនដោះស្រាយលើផ្នែករឹងថ្មី
kind: step
title: រង្វិលជុំក្នុងរង្វិលជុំ
concept: រង្វិលជុំជាន់គ្នា
hours: 2
project: G8-B-thinks
goal: ក្រុមទាយបានពិតប្រាកដថាប្លុកខាងក្នុងដំណើរការប៉ុន្មានដង មុនចុចដំណើរការ។
build: លំនាំល្បាតសាងសង់ពីរង្វិលជុំក្នុងរង្វិលជុំ។
builds_on:
- ជំហានទី ៦ · បញ្ជី និង count with i
- ថ្នាក់ទី ៧ · repeat
teach:
- រង្វិលជុំក្នុងរង្វិលជុំគុណគ្នា។ <b>repeat 3</b> រុំជុំវិញ <b>repeat 4</b> ដំណើរការខាងក្នុងដប់ពីរដង
  ហើយសំណួរដែលត្រូវសួរមុនរាល់ការដំណើរការគឺ "ប្លុកខាងក្នុងកើតឡើងប៉ុន្មានដង?" សិស្សដែលអាចឆ្លើយវាបានជឿជាក់
  បានយល់រង្វិលជុំ; អ្នកដែលមិនអាច នឹងទាយពេញមួយឆ្នាំ។
- វាក៏ជារបៀបដែលលំនាំត្រូវបានសាងសង់ដោយគ្មានការធ្វើម្ដងទៀត។ ជុំបីនៃការ៉េ ជាមួយការបញ្ចាំងភ្លើងរវាងជុំ គឺជារង្វិលជុំពីរ
  និងប្លុកបួន — ជម្រើសផ្សេងគឺប្លុកសាមសិបប្រាំមួយ និងកំហុសមួយកន្លែងនៅកណ្ដាលពួកវា។
guide:
- label: សួរជាមុន
  value: ខាងក្នុងដំណើរការប៉ុន្មានដង?
- label: ក្រៅ × ក្នុង
  value: 3 × 4 = 12
- label: បញ្ជាក់វា
  value: រាប់វាក្នុងអថេរ
- label: ឥដ្ឋ
  value: ទំនេរ ១ ម៉ែត្រ — ការេបី ជ្រុង ២០ ស.ម.
steps:
- time: 15′
  text: ទាយ៖ repeat 3 ជុំវិញ repeat 4 — គូរជ្រុងប៉ុន្មាន? អ្នកគ្រប់គ្នាសរសេរលេខមុនអ្វីៗដំណើរការ។
  expect: គ្រប់គ្នាបានសរសេរលេខទុកមុនពេលប្លុកណាមួយដំណើរការ។
- time: 25′
  text: សាងសង់វា ហើយរាប់ពិត ដោយអថេរដែលកើនខាងក្នុងរង្វិលជុំក្នុង។ ប្រៀបធៀបនឹងការទាយរបស់អ្នក។
  expect: កម្មវិធីរាប់ដែលប្រាប់ថាជ្រុងប៉ុន្មានពិតជាបានបើក ក្បែរលេខដែលអ្នកបានទាយ។
- time: 25′
  text: ធ្វើឲ្យលំនាំមានន័យ៖ ការល្បាតការ៉េក្នុងមួយជុំ ជាមួយបន្ទះ LED ប្ដូរពណ៌រវាងជុំ។
  expect: ការល្បាតជាការេក្នុងមួយជុំ ដោយបន្ទះ LED ប្ដូរពណ៌រវាងជុំ ដូច្នេះអ្នកឃើញរង្វិលជុំខាងក្រៅវិល។
- time: 25′
  text: ការទាយបីជាប់គ្នា នីមួយៗលេខខុសគ្នា ទាំងអស់ហៅមុនដំណើរការ។ បីក្នុងបីជាគោលដៅ។
  expect: ការទាយបីលើកមុនការសាកល្បងបី។ បីលើបីជាគោលដៅ។
- time: 20′
  text: ប្ដូរកម្មវិធី ហើយទាយចំនួនរបស់ក្រុមផ្សេងដោយអានវា ដោយមិនដំណើរការវា។
  expect: ចំនួនរបស់ក្រុមផ្សេងទាយបានដោយអានកម្មវិធីគេ ដោយមិនដំណើរការវា។
- time: 10′
  text: កត់ត្រាច្បាប់ជាពាក្យរបស់អ្នកផ្ទាល់ ជាមួយឧទាហរណ៍ដែលធ្វើរួចមួយ។
  expect: ច្បាប់ជាពាក្យរបស់អ្នក ជាមួយឧទាហរណ៍មួយគណនារួចនៅក្បែរ។
code:
  lang: blocks
  source: "when CyberPi starts up\n  delete all of  poses\n\nwhen joystick  middle pressed\n  add  (servo\
    \ (1) S1 current angle (°))  to  poses\n  show label 1  join  poses:   (length of poses)  at x:\
    \ 0 y: 0  by small pixel\n\nwhen button A pressed\n  set  stop  to  ((length of poses) + 1)\n  count\
    \ with  i  from 1 to (stop) by step 1 repeat\n    lift  (item (i) of poses)\n    wait 0.4 seconds\n\
    \nwhen button B pressed\n  set  sides  to 0\n  repeat 3\n    repeat 4\n      moves forward  20 \
    \ cm  until done\n      turns right  90  ° until done\n      change  sides  by 1\n    LED strip\
    \ all LED all displays R  (pick random 0 to 255)  G 0 B 120\n  show label 2  join  sides driven:\
    \   (sides)  at x: 0 y: 20  by small pixel"
tips:
- សួរ "ប៉ុន្មានដង?" មុនរាល់ការដំណើរការ គ្រប់ដង រហូតដល់វាក្លាយជាស្វ័យប្រវត្តិ។ វាជាការពិនិត្យការយល់ដឹងដ៏ល្អបំផុតក្នុងវគ្គនេះ។
- ឧបករណ៍រាប់ខាងក្នុងរង្វិលជុំក្នុង ដោះស្រាយការតវ៉ាភ្លាមៗ។ តម្រូវឲ្យមាន ជំនួសឲ្យការទុកឲ្យក្រុមជជែក។
- សម្អាតកន្លែងលើឥដ្ឋ។ ជុំបីនៃការ៉េ ជាការធ្វើដំណើរច្រើនជាងដែលក្រុមរំពឹង។
result:
  scene: screen
  params:
    lines:
    - ["outer loops: 3", "#7dd3fc", 10, true]
    - ["inner sides: 4", "#facc15", 10, false]
    - ["total: 12", "#22c55e", 11, true]
    caption: three square laps make twelve inner-loop runs
success:
- ចំនួនរង្វិលជុំក្នុងទាយត្រឹមត្រូវមុនដំណើរការ បីដង
- លំនាំសាងសង់ពីរង្វិលជុំជាន់គ្នា ជំនួសឲ្យប្លុកធ្វើម្ដងទៀត
- ចំនួនរបស់ក្រុមផ្សេងទាយបានដោយអានកម្មវិធីរបស់គេ
check:
- do: B
  see: It drives three squares, changes colour after each, and shows 12.
parts:
- id: robot_tank
