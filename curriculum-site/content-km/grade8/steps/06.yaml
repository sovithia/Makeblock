n: 6
stage: A
stage_title: ម៉ាស៊ីនថ្មី
kind: checkpoint
title: ចំណុចត្រួតពិនិត្យទី ១ — ការសាងសង់ឡើងវិញ
concept: ច្រកតាមទាន់
hours: 1
project: G8-A-rebuilt
goal: សិស្សគ្រប់រូបមាន Rover ដែលបង្វិលបានត្រឹមត្រូវ និងដៃចាប់ដែលមិនអាចធ្វើបាបខ្លួនឯង — មុនពេលក្បួនដោះស្រាយណាមួយត្រូវសាងសង់ពីលើ។
build: គ្មានអ្វីថ្មីទេ។ ថ្នាក់ទាំងមូលមកដល់កន្លែងតែមួយ។
builds_on:
- ជំហានទី ១–៤
teach:
- '<b>ម៉ោងបម្រុង</b> មានផ្ដល់ជូននៅទីនេះ ហើយចេតនាមិនដាក់ក្នុងតារាងម៉ោងខាងលើទេ — បន្ថែមវាតែបើថ្នាក់មិនស្មើគ្នា។ ម៉ោងដែលបានប្រកាស គឺជាអ្វីដែលវគ្គសិក្សាត្រូវការ ពេលគ្មាននរណាត្រូវតាមទាន់។ បើថ្នាក់ស្មើគ្នា ចំណាយវាលើការពង្រីក៖ គ្រូបង្គោលសាងសង់លំដាប់ចាប់-និង-ដាក់ — ចាប់ លើក បើកបរ ចុះ បញ្ចេញ — ជាប្លុកមានឈ្មោះតែមួយ។'
- ច្រកនេះនិយាយអំពីម៉ាស៊ីន មិនមែនកូដទេ។ អ្វីៗទាំងអស់ក្នុងដំណាក់កាល B, C និង D សន្មតថាមាន Rover ដែលបង្វិលទៅកន្លែងដែលគេប្រាប់
  និងដៃចាប់ដែលមានព្រំដែន។ ក្រុមដែលខ្សែក្រវាត់ជាភ្លោះជំនួសឲ្យបញ្ច្រាស នឹងបរាជ័យរាល់ជំហានក្រោយ ដោយមូលហេតុដែលមើលទៅដូចកម្មវិធី។
- គ្រូបង្គោល ដៃចេញពីរូបយន្តអ្នកដទៃ ម៉ោងបម្រុងទៅកន្លែងដែលត្រូវការ — ដូចថ្នាក់ទី ៧។
guide:
- label: ឆ្លង
  value: ទាំងបី បង្ហាញលើរូបយន្តខ្លួនឯង
- label: គ្រូបង្គោល
  value: ដៃចេញ សួរតែសំណួរ
- label: ម៉ោងបម្រុង
  value: +១ ម៉ោង — តែបើថ្នាក់ត្រូវការ មិនរាប់ក្នុងម៉ោងវគ្គសិក្សា
steps:
- time: 10′
  text: រៀបចំ។ ច្រកនេះជាមេកានិកដូចដែលវាជាកូដ។
  expect: ថ្នាក់មួយដែលយល់ថាច្រកនេះជាមេកានិកដូចដែលវាជាកូដដែរ។
- time: 30′
  text: បញ្ហាទាំងបី៖ <b>(១)</b> បង្ហាញម៉ូឌុលខ្សែក្រវាត់ទាំងពីររបស់អ្នកធៀបនឹងមគ្គុទ្ទេសក៍ ហើយបញ្ជាក់ថាពួកវាបញ្ច្រាសគ្នា។
    <b>(២)</b> បង្វិល 90° ក្នុងរង្វង់ 5° បីដងជាប់គ្នា វាស់។ <b>(៣)</b> ប្រាប់ជួរសុវត្ថិភាពនៃដៃចាប់របស់អ្នក
    ហើយបង្ហាញអ្នកយាមដែលអនុវត្តវា — រួចព្យាយាមបំបែកវានៅចំពោះមុខគ្រូ។
  expect: បញ្ហាបីបង្ហាញ៖ ម៉ូឌុលខ្សែក្រវាត់ឆ្លុះគ្នាធៀបនឹងមគ្គុទ្ទេសក៍ ការបង្វិល ៩០° បីដងក្នុង ៥° និងជួរសុវត្ថិភាពដៃ
    ជាមួយអ្នកយាមដែលរួចពីការព្យាយាមបំបែក។
- time: 20′
  text: ផ្គូផ្គង៖ អ្នកគ្រប់គ្នាដែលឆ្លងទាំងបី បង្គោលអ្នកដែលមិនទាន់ឆ្លង។
  expect: គ្រប់គ្នាដែលឆ្លងទាំងបី កំពុងបង្គោលអ្នកដែលមិនទាន់ឆ្លង។
blocks:
- mBot2 Chassis
- mBot2 Extension Port
- My Blocks
tips:
- កែបញ្ហាមេកានិកមុនបញ្ហាកូដ។ រូបយន្តដែលបង្វិលមិនល្អ នឹងធ្វើឲ្យរាល់មេរៀនក្រោយមើលទៅដូចការបរាជ័យកម្មវិធី។
- បញ្ហាទី ៣ ជាច្រកសុវត្ថិភាព ដូចដែលវាជាច្រករៀនសូត្រ។ កុំឲ្យវាឆ្លងដោយងាយ។
- បើក្រុមច្រើនមានការបង្វិលខុសដូចគ្នា នោះការក្រិតជាបញ្ហា មិនមែនក្រុមទេ។
result:
  scene: healthcheck
  params:
    checks: [mirrored track modules, 90° turn within 5°, guarded arm range]
    caption: every Rover passes the mechanical and safety gate
success:
- ម៉ូឌុលក្រុមគ្រប់ក្រុមផ្ទៀងផ្ទាត់ថាបញ្ច្រាសគ្នា
- រូបយន្តគ្រប់គ្រឿងបង្វិល 90° ក្នុងរង្វង់ 5° បីដងជាប់គ្នា
- ដៃចាប់គ្រប់មួយមានព្រំដែនវាស់ដោយដៃ និងអ្នកយាមដែលរឹងមាំ
