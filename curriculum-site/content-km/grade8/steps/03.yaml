n: 3
stage: A
stage_title: ម៉ាស៊ីនថ្មី
kind: step
title: Rover បើកបរ
concept: ការបង្វិលដោយរអិល · ការក្រិតឡើងវិញ
hours: 2
project: G8-A-rebuilt
goal: Rover បង្វិលក្នុងរង្វង់ 5° បីដងជាប់គ្នា — ហើយក្រុមអាចប្រាប់ថាហេតុអ្វីលេខបង្វិលឆ្នាំមុនខុសហើយ។
build: រូបយន្តខ្សែក្រវាត់ដែលបង្វិលបានត្រឹមត្រូវលើឥដ្ឋរបស់អ្នក។
builds_on:
- ជំហានទី ១ · ម៉ូឌុល
- ថ្នាក់ទី ៧ · ការបង្វិលដែលអ្នកទុកចិត្ត
teach:
- Rover គ្មានកង់ចង្កូតទេ។ វាបង្វិលដោយបើកខ្សែក្រវាត់ទាំងពីរក្នុង <b>ល្បឿនខុសគ្នា</b> — បើកពួកវាទៅទិសផ្ទុយគ្នា
  ហើយវាបង្វិលនឹងកន្លែង ដែលរូបយន្តឆ្នាំមុនមិនដែលធ្វើបាន។ នោះជា <b>ការបង្វិលដោយរអិល</b> ហើយឈ្មោះនេះស្មោះត្រង់៖
  ខ្សែក្រវាត់រអិលទទឹងលើឥដ្ឋកំឡុងពេលនោះ។
- ដែលពិតជាមូលហេតុដែលរាល់តម្លៃបង្វិលពីថ្នាក់ទី ៧ ឥឡូវខុសហើយ។ ការរអិលអាស្រ័យលើឥដ្ឋ ភាពតឹងខ្សែក្រវាត់ និងទម្ងន់ខាងលើ។
  ដំណើរការ <b>calibrate chassis parameters</b> ដើម្បីឲ្យរូបយន្តរៀនធរណីមាត្រថ្មី រួចវាស់ការបង្វិល 90°
  ដោយឧបករណ៍វាស់មុំ ហើយមើលថាវាជិតប៉ុនណា។ កុំទុកចិត្តលេខដែលអ្នកមិនបានវាស់លើរូបយន្តនេះ លើឥដ្ឋនេះ។
guide:
- label: បង្វិល
  value: EM1 ទៅមុខ, EM2 ថយក្រោយ — នឹងកន្លែង
- label: ជាមុនសិន
  value: calibrate chassis parameters
- label: វាស់
  value: ឧបករណ៍វាស់មុំ បីដង មិនមែនមួយ
- label: ឥដ្ឋ
  value: ទំនេរ ១ ម៉ែត្រ — វាបង្វិលនឹងកន្លែង
steps:
- time: 10′
  text: ពិនិត្យមុនបើកថាមពល៖ ប្រើការចុះហត្ថលេខាពីជំហានទី ២ ដើម្បីបញ្ជាក់ថាខ្សែក្រវាត់បង្វិលដោយសេរី ខ្សែត្រូវបានរៀបចំល្អ ហើយការតភ្ជាប់ម៉ូទ័រឆ្លាស់មិនបានផ្លាស់ទី។
  expect: ការចុះហត្ថលេខាពីជំហានទី ២ ត្រូវបានពិនិត្យម្ដងទៀត មុនបើកថាមពល។
- time: 20′
  text: ការបើកបរដំបូងលើឥដ្ឋ — មិនមែនលើតុទេ។ រួចបង្វិលនឹងកន្លែង ហើយមើលរបស់មួយដែលរូបយន្តឆ្នាំមុនធ្វើមិនបាន។
  expect: វាបើកលើឥដ្ឋ ហើយវិលនឹងកន្លែង — អ្វីដែលរូបយន្តកង់ឆ្នាំមុនធ្វើមិនបាន។
- time: 25′
  text: ដំណើរការ <b>calibrate chassis parameters</b>។ សួរថាអ្នកគិតថាវាកំពុងវាស់អ្វី មុនអ្នកដំណើរការវា។
  expect: ការក្រិតបានដំណើរការ និងចម្លើយក្រុមថាវាកំពុងវាស់អ្វី ដែលឆ្លើយមុនវារត់។
- time: 30′
  text: វាស់ការបង្វិល 90° ដោយឧបករណ៍វាស់មុំ បីដង។ ប្រៀបធៀបនឹងលេខថ្នាក់ទី ៧ របស់អ្នក។ ពួកវាខុសប៉ុនណា?
  expect: រង្វាស់មុំបីនៃការបង្វិល ៩០° និងចំនួនអង្សាដែលការកំណត់ថ្នាក់ទី ៧ របស់អ្នកខុស។
- time: 25′
  text: លៃតម្រូវរហូតដល់ការបង្វិលបីដងជាប់គ្នាធ្លាក់ក្នុង 5°។ កត់ត្រាតម្លៃ — អ្វីៗទាំងអស់ឆ្នាំនេះអង្គុយពីលើពួកវា។
  expect: ការបង្វិលបីជាប់គ្នាធ្លាក់ក្នុង ៥° និងតម្លៃក្នុងកំណត់ហេតុ។ អ្វីៗឆ្នាំនេះឈរលើវា។
- time: 10′
  text: កត់ត្រារបស់ពីរដែលខ្សែក្រវាត់ធ្វើបានល្អជាងកង់ និងពីរដែលកង់ធ្វើបានល្អជាង។ បញ្ជីទាំងពីរជាការពិត។
  expect: រឿងពីរដែលខ្សែក្រវាត់ធ្វើបានល្អជាង និងពីរដែលកង់ធ្វើបានល្អជាង ក្នុងកំណត់ហេតុ។ បញ្ជីទាំងពីរជាការពិត។
code:
  lang: blocks
  source: "when button A pressed\n  calibrate  chassis parameters\n\nwhen button B pressed\n  turns\
    \ right  90  ° until done\n  wait 1 seconds\n  turns left  90  ° until done"
tips:
- មគ្គុទ្ទេសក៍ <b>បញ្ច្រាស</b> ខ្សែម៉ូទ័រលើ Rover — ឆ្វេងទៅច្រកស្ដាំ។ បើរូបយន្តក្រុមណាបង្វិលពេលគេប្រាប់ឲ្យទៅត្រង់
  នោះជាមូលហេតុ។
- ក្រិតលើឥដ្ឋដែលថ្នាក់ប្រើពិត។ រូបយន្តដែលក្រិតលើកម្រាល ហើយដំណើរការលើក្បឿន គឺជារូបយន្តដែលកុហក។
- រក្សាលេខបង្វិលថ្នាក់ទី ៧ ក្នុងកំណត់ហេតុ ជំនួសឲ្យការលុប។ ការប្រៀបធៀបជាមេរៀន។
result:
  scene: tank_compare
success:
- ការបង្វិល 90° បីដងជាប់គ្នាក្នុងរង្វង់ 5° វាស់ដោយឧបករណ៍វាស់មុំ
- ការក្រិតតួបានដំណើរការ ហើយឥទ្ធិពលរបស់វាត្រូវបានសង្កេត
- ការជួញដូររវាងខ្សែក្រវាត់និងកង់ បញ្ជាក់ដោយលេខមួយក្នុងម្ខាងៗ
