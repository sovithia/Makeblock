n: 9
stage: B
stage_title: ក្បួនដោះស្រាយលើផ្នែករឹងថ្មី
kind: step
title: រលូន មិនមែនជាជំហាន
concept: សញ្ញាប្រមាណវិធីលើតម្លៃឧបករណ៍ចាប់សញ្ញា
hours: 2
project: G8-B-thinks
goal: ល្បឿនរបស់ Rover ត្រូវបានគណនាពីចម្ងាយដែលនៅសល់ត្រូវទៅ ដូច្នេះវាបន្ថយល្បឿនរហូតឈប់ ជំនួសឲ្យការលោតរវាងការកំណត់ថេរ។
build: រូបយន្តដែលបន្ថយល្បឿនបន្តិចម្ដងៗ ជំនួសឲ្យការហ្វ្រាំងភ្លាម។
builds_on:
- ថ្នាក់ទី ៧ · តំបន់
- ជំហានទី ៣ · ការដាក់កម្រិត
teach:
- ឆ្នាំមុនរូបយន្តមានល្បឿនបី ហើយលោតរវាងវា។ ថ្ងៃនេះវាមានល្បឿនច្រើនដូចទីតាំង ព្រោះល្បឿនត្រូវបាន <b>គណនា</b>៖
  អង់កូឌ័របប្រាប់ថាវាបានទៅឆ្ងាយប៉ុនណា ដកចេញពីគោលដៅ នោះអ្នកបាន <b>ចម្ងាយដែលនៅសល់</b>។ គុណវានឹងលេខមួយ
  ហើយបើកតាមចម្លើយ។ ឆ្ងាយពីគោលដៅ លឿន។ ជិតដល់ យឺត។ គ្មានជំហាន គ្មានរញ្ជួយ។
- រឿងពីរធ្វើឲ្យវាពិត។ <b>កំណត់ព្រំដែន</b> បើមិនដូច្នេះទេ ការរត់វែងផ្ដល់ល្បឿន ៤០០ ហើយសង់ទីម៉ែត្រចុងក្រោយផ្ដល់ល្បឿនសូន្យ។
  ហើយ <b>សម្រួលមេគុណ</b>៖ តូចពេកវាវារពេញផ្លូវ ធំពេកវាត្រឡប់ទៅហ្វ្រាំងភ្លាមវិញ។ លេខនោះជារបស់អ្នកត្រូវរក
  ហើយការរកដោយសាកល្បងជាចំណុចសំខាន់។
guide:
- label: សាកល្បង
  value: ឧបករណ៍បញ្ជាឡើង → ការចូលរលូន
- label: គណនា
  value: ល្បឿន = (គោលដៅ − ដែលបានទៅ) × មេគុណ
- label: ព្រំដែន
  value: រវាង ១៥ និង ៨០ RPM
- label: សម្រួល
  value: មេគុណមួយតម្លៃក្នុងមួយជុំ សរសេរទុក
- label: ឥដ្ឋ
  value: ទំនេរ ២ ម៉ែត្រ ត្រង់ មានខ្សែបញ្ចប់
steps:
- time: 15′
  text: បើកការល្បាតជំហានទី ៧ ក្នុងល្បឿនថេរទៅកាន់ខ្សែបញ្ចប់បិទកាសែត ហើយមើលវាហួស ឬឈប់ភ្លាម។ ដាក់ឈ្មោះថាអ្វីខុសនឹងវា។
  expect: ការល្បាតដែលបុកពីល្បឿនពេញទៅសូន្យ និងក្រុមមួយដែលអាចដាក់ឈ្មោះថាអ្វីខុសនឹងវា។
- time: 25′
  text: កំណត់អង់កូឌ័រឡើងវិញ កំណត់គោលដៅ ហើយគណនាល្បឿនពីអ្វីដែលនៅសល់។ បង្ហាញលេខទាំងពីរលើអេក្រង់ ដើម្បីឲ្យអ្នកឃើញទំនាក់ទំនង។
  expect: លេខពីរលើអេក្រង់ក្នុងពេលតែមួយ — ចម្ងាយនៅសល់ និងល្បឿនដែលវាបង្កើត — ហើយទីពីរធ្លាក់តាមទីមួយ។
- time: 25′
  text: កំណត់ព្រំដែនលើនិងក្រោម។ រួចដាក់គោលដៅវែងខ្លាំង និងខ្លីខ្លាំងដោយចេតនា ដើម្បីសាកល្បងព្រំដែនទាំងពីរ។
  expect: គោលដៅវែងខ្លាំងមិនអាចធ្វើឲ្យវារត់គេចបានទេ ហើយសង់ទីម៉ែត្រចុងក្រោយមិនអាចធ្វើឲ្យវាជាប់បានទេ។ ព្រំដែនទាំងពីរសាកល្បងដោយចេតនា។
- time: 25′
  text: សម្រួលមេគុណ៖ មួយតម្លៃក្នុងមួយជុំ សរសេរទុក រហូតដល់ការចូលមានអារម្មណ៍ត្រឹមត្រូវ។ គ្មានចម្លើយត្រូវទេ
    មានតែការដោះដូរ។
  expect: មេគុណតែមួយប្ដូរក្នុងមួយជុំ សរសេរទុករាល់ដង រហូតដល់ការចូលមានអារម្មណ៍ត្រឹមត្រូវ។ គ្មានចម្លើយត្រូវទេ
    មានតែការដោះដូរ។
- time: 20′
  text: ការប្រកួត៖ ពី ២ ម៉ែត្រ ឈប់ក្នុង ១០ ស.ម. ពីខ្សែ ឲ្យលឿនតាមដែលអាច ដោយមិនឆ្លងកាត់។ បីលើក។
  expect: ការសាកល្បងបីដងឈប់ក្នុង ១០ ស.ម. ពីជញ្ជាំង ដោយចាប់ផ្ដើមពី ២ ម៉ែត្រ ដោយមិនប៉ះ។
- time: 10′
  text: សរសេរមេគុណរបស់អ្នក និងអ្វីដែលកើតឡើងនៅទ្វេដង និងពាក់កណ្ដាល។ ជំហានទី ១០ បើកការងារយកឥវ៉ាន់ក្នុងល្បឿននេះ។
  expect: មេគុណរបស់អ្នកក្នុងកំណត់ហេតុ ជាមួយអ្វីដែលកើតឡើងនៅទ្វេដង និងពាក់កណ្ដាល។ ជំហានទី ១០ បើកការងារយកឥវ៉ាន់ក្នុងល្បឿននេះ។
code:
  lang: blocks
  source: "when CyberPi starts up\n  delete all of  poses\n\nwhen joystick  middle pressed\n  add  (servo\
    \ (1) S1 current angle (°))  to  poses\n  show label 1  join  poses:   (length of poses)  at x:\
    \ 0 y: 0  by small pixel\n\nwhen button A pressed\n  set  stop  to  ((length of poses) + 1)\n  count\
    \ with  i  from 1 to (stop) by step 1 repeat\n    lift  (item (i) of poses)\n    wait 0.4 seconds\n\
    \nwhen button B pressed\n  set  sides  to 0\n  repeat 3\n    repeat 4\n      moves forward  20 \
    \ cm  until done\n      turns right  90  ° until done\n      change  sides  by 1\n    LED strip\
    \ all LED all displays R  (pick random 0 to 255)  G 0 B 120\n  show label 2  join  sides driven:\
    \   (sides)  at x: 0 y: 20  by small pixel\n\nwhen joystick  pulled↑\n  reset encoder motor  (1)\
    \ EM1  rotated angle\n  set  target  to 1200\n  forever\n    set  left  to  ((target) - (encoder\
    \ motor (1) EM1 rotated angle (°)))\n    set  speed  to  ((left) * 0.06)\n    if  (speed) > 80 \
    \ then\n      set  speed  to 80\n    if  (speed) < 15  then\n      set  speed  to 15\n    show label\
    \ 3  join  spd:   (speed)  at x: 0 y: 40  by small pixel\n    moves forward  at (speed)  RPM\n \
    \   if  (left) < 40  then\n      stop encoder motor  all\n      stop  this script"
tips:
- នេះជាល្បឿនពី <i>ចម្ងាយដែលនៅសល់</i> មិនមែនការបញ្ជាទិសពីកំហុសខ្សែទេ។ ថ្នាក់ទី ៩ ធ្វើកំណែបញ្ជាទិស ហើយវាជាមេរៀនក្បាលរបស់គេ
  — កុំយកមុននៅទីនេះ។
- ព្រំដែនទាំងពីរ ឬគ្មានសោះ។ ក្រុមដែលកំណត់តែខាងលើ នឹងបើកថយក្រោយនៅទីបំផុត។
- ការបង្ហាញអ្វីដែលនៅសល់ និងល្បឿនជាមួយគ្នាលើអេក្រង់ ជាអ្វីដែលធ្វើឲ្យទំនាក់ទំនងមើលឃើញ។ បើគ្មានវាទេ នេះគ្រាន់តែជារូបមន្ត។
- Rover គ្មានឧបករណ៍ចាប់ចម្ងាយទេ — នោះជាអ៊ុលត្រាសោនិករបស់ mBot2 ហើយវានៅក្នុងថាស។ អ្វីដែល Rover ដឹងគឺម៉ូទ័ររបស់វាបានវិលប៉ុន្មាន
  ដែលគ្រប់គ្រាន់ដើម្បីបន្ថយល្បឿនរហូតឈប់លើការរត់ដែលបានវាស់។
