success:
- ល្បឿនគណនាពីចម្ងាយដែលនៅសល់ មិនមែនជ្រើសពីតម្លៃថេរ
- កំណត់ព្រំដែនទាំងសងខាង ហើយសាកល្បងព្រំដែនទាំងពីរដោយចេតនា
- មេគុណដែលបានសម្រួល ជាមួយតម្លៃសងខាងវាសរសេរទុក
