n: 14
stage: C
stage_title: អន្តរកម្ម
kind: step
title: រូបយន្តពីរ ការងារតែមួយ
concept: សារជាមួយបន្ទុកទិន្នន័យ
hours: 2
project: G8-C-connects
goal: Rover ពីរប្រគល់ការងារគ្នាទៅវិញទៅមក ដោយបញ្ជូនតម្លៃ — ហើយគូពីរដំណើរការក្នុងបន្ទប់តែមួយដោយមិនរំខានគ្នា។
build: ការបញ្ជូនបន្ត៖ រូបយន្តមួយរកឃើញវា មួយទៀតទៅយក។
builds_on:
- ជំហានទី ៩ · ការងារ
- ជំហានទី ១២ · ម៉ឺនុយ
teach:
- រូបយន្តអាចនិយាយគ្នា។ <b>broadcast "found" on LAN</b> បញ្ជូនសារទៅរាល់រូបយន្តដែលកំពុងស្ដាប់ ហើយ <b>when
  receiving "found" broadcast on LAN</b> ដាស់មួយទៀត។ តែប៉ុណ្ណឹងធ្វើឲ្យការបញ្ជូនបន្តអាចធ្វើបាន៖ A បញ្ចប់
  B ចាប់ផ្ដើម គ្មាននរណាប៉ះមួយណាទេ។
- ល្អជាងនេះ សារមួយអាចផ្ទុក <b>តម្លៃ</b>។ <b>broadcast "found" with value 42</b> ហើយអ្នកទទួលអានវាដោយ
  <b>LAN broadcast value received</b>។ ឥឡូវ A អាចផ្ញើទៅ B នូវចម្ងាយដែលវាវាស់បាន ឬតំបន់ណាត្រូវទៅ។ ឈ្មោះបូកនឹងបន្ទុកទិន្នន័យ
  គឺជាអ្វីដែល <b>ពិធីការ</b> ជា ហើយក្រុមពីរត្រូវព្រមព្រៀងមួយ មុនណាមួយសរសេរប្លុក។
- រួចមកបញ្ហាថ្នាក់រៀន៖ ជាមួយអ្នកគ្រប់គ្នានៅលើឆានែលតែមួយ រូបយន្តគ្រប់គ្រឿងឮសារគ្រប់សារ។ <b>set LAN channel</b>
  ជាដំណោះស្រាយ ហើយការរកឃើញតម្រូវការសម្រាប់វាដោយការប៉ះទង្គិច ល្អជាងការត្រូវគេព្រមានច្រើន។
guide:
- label: សាកល្បង
  value: button B → find it and broadcast
- label: ផ្ញើ
  value: broadcast "msg" with value n on LAN
- label: ទទួល
  value: when receiving "msg" · value received
- label: ព្រមព្រៀងជាមុន
  value: ឈ្មោះសារ សរសេរចុះ
- label: ឥដ្ឋ
  value: ផ្លូវទំនេរ ២ ម៉ែត្រ មានបំណះក្រហមនៅចុង
steps:
- time: 20′
  text: ក្រុមពីរព្រមព្រៀងពិធីការលើក្រដាស៖ ឈ្មោះសារ អ្វីដែលនីមួយៗមានន័យ តម្លៃអ្វីធ្វើដំណើរជាមួយវា។ គ្មានប្លុករហូតដល់វាត្រូវបានសរសេរ។
  expect: ពិធីការសរសេររវាងក្រុមពីរ៖ ឈ្មោះសារ អត្ថន័យ និងតម្លៃដែលធ្វើដំណើរជាមួយនីមួយៗ។ គ្មានប្លុករហូតដល់វាមាន។
- time: 25′
  text: កំណែសាមញ្ញបំផុត៖ A ផ្សាយ B បំភ្លឺ។ បញ្ជាក់ថាតំណដំណើរការ មុនបន្ថែមអ្វីផ្សេង។
  expect: រូបយន្ត A ផ្សាយ រូបយន្ត B ភ្លឺ។ តំណភ្ជាប់បញ្ជាក់មុនពេលសាងសង់អ្វីលើវា។
- time: 25′
  text: ឥឡូវបន្ទុកទិន្នន័យ៖ A ផ្ញើលេខដែលវាវាស់បាន B បង្ហាញវាលើអេក្រង់។ ពិនិត្យថាវាជាលេខដដែល។
  expect: លេខវាស់លើ A លេចឡើងលើអេក្រង់ B — ហើយពិនិត្យថាជាលេខដដែល។
- time: 25′
  text: ការបញ្ជូនបន្ត៖ A ស្វែងរក ហើយផ្សាយអ្វីដែលវារកឃើញ; B ទៅយកវា។ គ្មានក្រុមណាប៉ះរូបយន្តរបស់ក្រុមផ្សេងទេ។
  expect: A រកឃើញអ្វីមួយ ហើយប្រាប់ថារកឃើញអ្វី; B ទៅយកវា។ គ្មានក្រុមណាប៉ះរូបយន្តគ្នាទេ។
  use:
  - control_wait_until
  - cyberpi_timer_reset
- time: 15′
  text: គូពីរដំណើរការក្នុងពេលតែមួយ ហើយរកឃើញថាពួកគេឮគ្នាទៅវិញទៅមក។ កែវាដោយឆានែល។
  expect: គូពីរដំណើរការក្នុងពេលតែមួយដោយមិនលឺគ្នា ព្រោះគូនីមួយៗនៅលើឆានែលរបស់ខ្លួន។
- time: 10′
  text: កត់ត្រាតារាងពិធីការ — សារ អត្ថន័យ តម្លៃ។
  expect: តារាងពិធីការក្នុងកំណត់ហេតុ៖ សារ អត្ថន័យ តម្លៃ។
