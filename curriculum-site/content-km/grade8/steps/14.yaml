tips:
- ធ្វើឲ្យពួកគេសរសេរពិធីការមុនពួកគេសរសេរកូដ។ ក្រុមពីរសរសេរកូដទៅតាមការសន្មតខុសគ្នា គឺជាមេរៀនទាំងមូល ហើយវាថោកជាងលើក្រដាស។
- ទុកឲ្យការប៉ះទង្គិចឆានែលកើតឡើង។ គូពីរនៅលើឆានែលតែមួយ គឺជាប្រាំនាទីដែលច្រឡំមែនទែន ហើយដំណោះស្រាយមានន័យច្រើនជាងក្រោយមក។
- ឈ្មោះសារប្រកាន់អក្សរធំតូច និងអក្ខរាវិរុទ្ធ។ "found" និង "Found" ជាសារពីរខុសគ្នា ហើយនោះជារសៀលកែកំហុសពិត
  បើមិននិយាយមុន។
result:
  scene: relay
success:
- សារជាមួយតម្លៃបានផ្ញើ និងទទួលបានត្រឹមត្រូវ
- ការបញ្ជូនបន្តពេញលេញដោយគ្មាននរណាប៉ះរូបយន្តណាមួយ
- គូពីរដំណើរការក្នុងបន្ទប់តែមួយលើឆានែលដាច់ដោយឡែក
check:
