  see: រូបយន្ត A បើករហូតដល់រកឃើញបំណះក្រហម ហើយឈប់។
- do: hear
  see: រូបយន្ត B ភ្ញាក់ឡើង ហើយបង្ហាញថា A ចំណាយពេលប៉ុន្មានវិនាទីដើម្បីរកឃើញ។
