success:
- ម៉ឺនុយយ៉ាងតិចបីជម្រើស អាចរុករក និងជ្រើសបាន
- ការសម្រេចចិត្តដោយចេតនា និងការពារបាន អំពីអ្វីដែលកើតឡើងនៅចុងបញ្ជី
- មនុស្សចម្លែកបានប្រើវាដោយគ្មានការប្រាប់ថាធ្វើដូចម្ដេច
