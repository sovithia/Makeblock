n: 4
stage: A
stage_title: ម៉ាស៊ីនថ្មី
kind: step
title: ដៃចាប់ផ្លាស់ទី
concept: Servo · ព្រំដែនជាថេរ
hours: 2
project: G8-A-rebuilt
goal: ដៃចាប់បើកនិងបិទតាមបញ្ជា ហើយមិនអាចត្រូវបានបញ្ជូនចេញក្រៅជួរដែលក្រុមបានវាស់ដោយដៃ។
build: ដៃចាប់ដែលមានព្រំដែនដែលវាមិនអាចបំបែក។
builds_on:
- ជំហានទី ២ · Rover បើកបរ
- ថ្នាក់ទី ៧ · អថេរ
teach:
- Servo ទៅកាន់ <b>មុំ</b> មួយ ហើយកាន់វា — មិនមែនល្បឿនទេ តែជាទីតាំង។ <b>set servo S1 angle to 80°</b>
  ហើយវាទៅទីនោះ ហើយនៅទីនោះ។ នោះជាម៉ូទ័រប្រភេទផ្សេងពីកង់ ហើយវាចង់បានការគិតប្រភេទផ្សេង។
- រកជួរសុវត្ថិភាព <b>ដោយដៃ ពេលបិទភ្លើង ជាមុនសិន</b>។ រំកិលដៃចាប់ថ្នមៗ ហើយស្គាល់កន្លែងដែលវាឈប់ចង់ទៅ។
  លេខទាំងពីរនោះជារបស់អ្នក សម្រាប់រូបយន្តនេះ — ហើយពួកវាចូលទៅក្នុងអថេរពីរ <b>ARM_OPEN</b> និង <b>ARM_SHUT</b>
  ដែលរាល់ប្លុកផ្សេងអាន។ កុំបើក servo ហួសការទប់ជាដាច់ខាត៖ ធ្មេញកង់ស៊ីគ្នាបាក់ស្ងាត់ៗ ពួកវាមិននៅក្នុងកញ្ចប់បម្រុងទេ
  ហើយគ្មានកូដឆ្លាតណាកែកង់ដែលបាក់បានឡើយ។
guide:
- label: សាកល្បង
  value: joystick ← shut · → open · ↑ nudge
- label: ជាមុនសិន
  value: រកជួរដោយដៃ ពេលបិទភ្លើង
- label: រួចមក
  value: អថេរពីរផ្ទុកព្រំដែន
- label: កុំដាច់ខាត
  value: កុំបង្ខំហួសការទប់ — ធ្មេញបាក់
- label: ឥដ្ឋ
  value: ទំនេរ ៥០ ស.ម. — ដៃយោល រូបយន្តបង្វិល
steps:
- time: 20′
  text: បិទភ្លើង។ រំកិលដៃចាប់ដោយដៃ ហើយរកកន្លែងដែលវាឈប់ផ្លាស់ទីដោយសេរី។ សរសេរមុំទាំងពីរ — ពួកវាជារបស់អ្នក
    មិនមែនរបស់ថ្នាក់ទេ។
  expect: មុំពីរសរសេរទុក រកឃើញដោយដៃពេលបិទថាមពល — លេខរបស់រូបយន្តអ្នក មិនមែនរបស់ថ្នាក់។
- time: 20′
  text: បើកភ្លើង។ បញ្ជូន servo ទៅមុំទាំងពីររបស់អ្នក ហើយពិនិត្យថាពួកវាត្រូវនឹងអ្វីដែលដៃអ្នករកឃើញ។
  expect: សេវ៉ូបើកទៅមុំទាំងពីររបស់អ្នក ហើយឈប់ត្រង់កន្លែងដែលដៃអ្នកបាននិយាយ។
- time: 25′
  text: ដាក់ព្រំដែនចូល ARM_OPEN និង ARM_SHUT ហើយធ្វើឲ្យរាល់ប្លុកអានអថេរ ជំនួសឲ្យលេខដែលវាយចូល។
  expect: គ្មានមុំវាយបញ្ចូលនៅសល់ទេ៖ គ្រប់ប្លុកអាន ARM_OPEN ឬ ARM_SHUT។
- time: 25′
  text: ការសាកល្បងវាយប្រហារ៖ ព្យាយាមបញ្ជូន servo ទៅកន្លែងឆ្កួត។ បន្ថែមអ្នកយាមដែលបញ្ឈប់វា។ រួចព្យាយាមម្ដងទៀតហើយបរាជ័យ។
  expect: អ្នកព្យាយាមបញ្ជូនសេវ៉ូទៅកន្លែងឆ្កួតៗ ហើយអ្នកយាមបដិសេធ។ សាកម្ដងទៀត វាបដិសេធម្ដងទៀត។
- time: 20′
  text: ចាប់អ្វីមួយ — ដុំហ្វូម។ រលុងពេកធ្លាក់ តឹងពេកកោង។ រកលេខនៅចន្លោះ ហើយសរសេរវាចុះ។
  expect: ដុំហ្វូមកាន់ជាប់ដោយមិនធ្លាក់ និងមិនកោង — និងលេខដែលធ្វើវាបាន សរសេរទុក។
- time: 10′
  text: កត់ត្រាមុំទាំងពីរ ចុះកាលបរិច្ឆេទ ជាមួយឈ្មោះរូបយន្តលើពួកវា។ ជំហានទី ៥ ត្រូវការវា។
  expect: មុំទាំងពីរក្នុងកំណត់ហេតុ មានកាលបរិច្ឆេទ និងឈ្មោះរូបយន្ត។ ជំហានទី ៥ ប្ដូរវាទៅជា ARM_OPEN និង
    ARM_SHUT។
code:
  lang: blocks
  source: "when CyberPi starts up\n  set  ARM_OPEN  to 20\n  set  ARM_SHUT  to 75\n\nwhen button A pressed\n\
    \  calibrate  chassis parameters\n\nwhen button B pressed\n  turns right  90  ° until done\n  wait\
    \ 1 seconds\n  turns left  90  ° until done\n\nwhen joystick  pulled←\n  set servo  S1  angle to\
    \ (ARM_SHUT)  °\n\nwhen joystick  pulled→\n  set servo  S1  angle to (ARM_OPEN)  °\n\nwhen joystick\
    \  pulled↑\n  increase servo  S1  angle by 5  °\n  if  (servo (1) S1 current angle (°)) > (ARM_SHUT)\
    \  then\n    set servo  S1  angle to (ARM_SHUT)  °"
tips:
- ដៃលែងផ្លាស់ទីដោយខ្លួនឯងពេលរូបយន្តបើកថាមពលទៀតហើយ។ ពីមុនវាលោតទៅ ARM_OPEN ពេលចាប់ផ្ដើម ដែលជាសេវ៉ូយោលនៅលើតុមមាញឹកមុនពេលនរណាម្នាក់រៀបចំរួច;
  ការច្រានឧបករណ៍បញ្ជាទៅស្ដាំ ធ្វើរឿងដដែលតាមតម្រូវការ។ គ្មានអ្វីលើរូបយន្តនេះគួរផ្លាស់ទី រហូតដល់មនុស្សម្នាក់ស្នើសុំ។
- វាស់ជួរដោយដៃមុនបើកភ្លើង servo គ្រប់ដង លើរូបយន្តគ្រប់គ្រឿង។ ពួកវាខុសគ្នា ហើយលេខខ្ចីពីតុជាប់នឹងគ្នា
  នឹងធ្វើឲ្យធ្មេញកង់បាក់។
- បើដៃរញ្ជួយនៅគែមនៃជួររបស់វា បន្ថយថេរទាំងពីរ 5°។ គម្លាតមេកានិកជាប្រាជ្ញា មិនមែនភាពកំសាកទេ។
- ដុំហ្វូមតែប៉ុណ្ណោះ។ ដុំឈើបូកនឹងការចាប់តឹងពេក គឺជារបៀបដែលធ្មេញកង់ស្លាប់។
result:
  scene: arm
success:
- ជួរសុវត្ថិភាពវាស់ដោយដៃ និងកត់ត្រាសម្រាប់រូបយន្តនេះ
- ព្រំដែនទាំងពីរផ្ទុកក្នុងអថេរដែលរាល់ប្លុកអាន
- បញ្ជាហួសជួរដោយចេតនាត្រូវបានបញ្ឈប់ដោយអ្នកយាម
check:
- do: left
  see: The gripper closes.
- do: right
  see: The gripper opens.
- do: up
  see: It opens a little more each push, and refuses to go too far.
parts:
