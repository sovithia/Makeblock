tips:
- ហាមលក្ខណៈវិនិច្ឆ័យដែលគ្មានលេខ។ វាជាច្បាប់មានប្រយោជន៍បំផុតក្នុងជំហាននេះ ហើយក្រុមនឹងតតាំងនឹងវា។
- ដឹកនាំផ្នែកបញ្ជាដោយមនុស្ស ទៅរកសំឡេង ឬឧបករណ៍បញ្ជា ណាមួយដែលក្រុមនោះធ្វើដំណើរការបានល្អបំផុត។ នេះមិនមែនជាថ្ងៃសម្រាប់ចំណុចខ្សោយបំផុតរបស់គេទេ។
- ក្រុមដែលគ្មានបន្ទាត់កាត់ នឹងបោះបង់អ្វីមួយដោយចៃដន្យក្រោមសម្ពាធ។ ធ្វើឲ្យពួកគេជ្រើសឥឡូវ។
