n: 22
stage: E
stage_title: បេសកកម្ម
kind: step
title: រចនាការងារដែលសមនឹងធ្វើ
concept: ការបញ្ជាក់ដោយលេខ
hours: 1
project: G8-E-mission
goal: ការបញ្ជាក់បេសកកម្មចុះហត្ថលេខា ដែលលក្ខណៈវិនិច្ឆ័យជោគជ័យមានលេខ ហើយរាល់កិច្ចការដាក់ឈ្មោះប្លុកដែលក្រុមមានរួច។
build: ការបញ្ជាក់មួយ និងគ្មានអ្វីផ្សេង។
builds_on:
- ជំហានទី ១៦–១៩ · រាល់ធាតុចូលដែលរូបយន្តមាន
teach:
- រចនាការងារដែលរូបយន្តពិតអាចធ្វើ៖ តម្រៀបតាមពណ៌ ប្រគល់រវាងតំបន់ពីរ ទៅយកតាមបញ្ជា ល្បាតនិងរាយការណ៍។ វាត្រូវតែ
  <b>រុករក</b>, <b>ចាប់</b> អ្វីមួយដោយដៃចាប់ និងទទួល <b>សេចក្ដីណែនាំពីមនុស្ស</b> — សំឡេងឬឧបករណ៍បញ្ជា
  តាមជម្រើសរបស់អ្នក។
- ការបញ្ជាក់ត្រូវតែវាស់វែងបាន។ "ដំណើរការល្អ" មិនមែនជាលក្ខណៈវិនិច្ឆ័យទេ; "ប្រគល់ដុំពីរទៅតំបន់ត្រឹមត្រូវក្នុងរយៈពេលក្រោម
  ៩០ វិនាទី ពីរដងក្នុងបី" ជាលក្ខណៈវិនិច្ឆ័យ។ ហើយសរសេរ <b>បន្ទាត់កាត់</b> របស់អ្នកថ្ងៃនេះ៖ លក្ខណៈពិសេសដែលអ្នកនឹងបោះបង់មុនគេបើពេលវេលាខ្លី។
  ការសម្រេចវាឥឡូវ ខណៈពេលវានៅអរូបី ងាយស្រួលជាងការសម្រេចវាក្នុងម្ភៃនាទីចុងក្រោយនៃជំហានទី ២២។
guide:
- label: ត្រូវតែ
  value: រុករក · ចាប់ · ទទួលសេចក្ដីណែនាំ
- label: លក្ខណៈវិនិច្ឆ័យ
  value: លេខ មិនមែនគុណនាម
- label: បន្ទាត់កាត់
  value: សម្រេចថ្ងៃនេះ ជាលាយលក្ខណ៍អក្សរ
steps:
- time: 10′
  text: សេចក្ដីសង្ខេប និងលក្ខណៈវិនិច្ឆ័យ។ ការងារឧទាហរណ៍ពីរឬបីបង្ហាញរហ័ស ដើម្បីឲ្យលួចយក។
  expect: ការងារឧទាហរណ៍ពីរ ឬបីឮយ៉ាងលឿន និងការអនុញ្ញាតឲ្យលួចយកគំនិតពីវា។
- time: 20′
  text: សរសេរបញ្ហា និងលក្ខណៈវិនិច្ឆ័យជោគជ័យ។ រាល់លក្ខណៈវិនិច្ឆ័យត្រូវការលេខក្នុងវា។
  expect: បញ្ហា និងលក្ខណៈវិនិច្ឆ័យជោគជ័យសរសេរទុក ដែលរាល់លក្ខណៈវិនិច្ឆ័យមានលេខនៅក្នុង។
- time: 20′
  text: ការបំបែកកិច្ចការ៖ កិច្ចការនីមួយៗដាក់ឈ្មោះប្លុកដែលនឹងធ្វើវា។ គូររង្វង់ជុំវិញអ្វីដែលគ្មានប្លុកនៅពីក្រោយ។
  expect: បញ្ជីភារកិច្ចមានប្លុកដែលនឹងធ្វើវានៅក្បែរនីមួយៗ និងរង្វង់ជុំវិញអ្វីដែលនៅគ្មានប្លុក។
- time: 10′
  text: ការចុះហត្ថលេខា៖ កិច្ចការណាហានិភ័យបំផុត ហើយបន្ទាត់កាត់របស់អ្នកជាអ្វី? ចម្លើយមិនច្បាស់ ការបញ្ជាក់ត្រូវបញ្ជូនត្រឡប់វិញ។
  expect: ភារកិច្ចប្រថុយបំផុតដាក់ឈ្មោះ និងបន្ទាត់កាត់ច្បាស់លាស់។ ចម្លើយស្រពិចស្រពិលបញ្ជូនលក្ខណៈបច្ចេកទេសត្រឡប់វិញ។
blocks:
