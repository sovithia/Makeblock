n: 24
stage: E
stage_title: បេសកកម្ម
kind: step
title: សាងសង់បេសកកម្ម
concept: ការរួមបញ្ចូល
hours: 2
project: G7-E-mission
goal: បេសកកម្មពេញលេញដំណើរការពីដើមដល់ចប់យ៉ាងតិចម្ដង ហើយក្រុមដឹងថាដំណាក់កាលណាបរាជ័យច្រើនបំផុត។
build: Rescue Run ផ្គុំចេញពីប្លុករបស់អ្នកផ្ទាល់។
builds_on:
- ជំហានទី ២១ · ផែនការចុះហត្ថលេខា
teach:
- សាងសង់តាមលំដាប់ដ្យាក្រាមរបស់អ្នក ហើយសាកល្បងព្រួញនីមួយៗមុនបន្ថែមមួយបន្ទាប់។ ការល្បួងគឺសាងសង់ទាំងអស់រួចកែកំហុសទាំងអស់
  ហើយវាមិនដែលដំណើរការទេ — ពេលរបស់បីជាថ្មីក្នុងពេលតែមួយ អ្នកមិនអាចប្រាប់ថាមួយណាខូច។
- ផ្នែកថ្មីតែមួយគត់គឺការវាងជុំវិញឧបសគ្គ ហើយរកខ្សែឃើញវិញ។ ថយក្រោយ វាងជុំវិញវា រួចវារទៅមុខរហូតដល់ឧបករណ៍មួយឃើញខ្សែ
  ហើយត្រឡប់ទៅការដើរតាមវិញ។ ការវាងតាមពេលវេលាកំណត់ជាការគ្រប់គ្រាន់; លៃតម្រូវវាជាមួយឧបសគ្គនៅកន្លែងពីរផ្សេងគ្នា
  ព្រោះការវាងដែលដំណើរការនៅកន្លែងតែមួយ ត្រូវបានលៃតម្រូវទៅតាមផ្លូវ ជាជាងសរសេរជាអាកប្បកិរិយា។
guide:
- label: លំដាប់
  value: ព្រួញម្ដងមួយ សាកល្បងម្ដងមួយ
- label: ថ្មី
  value: ថយក្រោយ → វាង → វាររហូតដល់ឃើញខ្សែ
- label: លៃតម្រូវ
  value: ឧបសគ្គនៅកន្លែងពីរ មិនមែនមួយ
- label: ឥដ្ឋ
  value: វគ្គពេញ៖ ខ្សែ ឧបសគ្គ តំបន់ក្រហម
steps:
- time: 10′
  text: ដ្យាក្រាមលើតុ។ ព្រមព្រៀងគោលដៅថ្ងៃនេះ៖ ដើរតាម ឈប់ក្នុងតំបន់ អបអរ — ឧបសគ្គនៅក្រៅកន្លែងសាកល្បង។
  expect: គោលដៅសម្រាប់ថ្ងៃនេះ សរសេរលើដ្យាក្រាម៖ ដើរតាមខ្សែ ឈប់ក្នុងតំបន់ អបអរ។ ឧបសគ្គនៅក្រៅវគ្គសិន។
- time: 35′
  text: សាងសង់ និងសាកល្បងដំណាក់កាល ១ និង ៤។ បីដងជាប់គ្នាមុនបន្ថែមអ្វីផ្សេង។
  expect: ការសាកល្បងស្អាតបីដងនៃ ដើរតាម-និង-អបអរ មុនពេលបន្ថែមប្លុកណាមួយ។
- time: 40′
  text: ឥឡូវឧបសគ្គ។ សាងសង់ការវាង-និង-រកឃើញវិញជាប្លុករបស់វាផ្ទាល់ ហើយសាកល្បងវាជាមួយឧបសគ្គនៅទីតាំងពីរខុសគ្នា។
  expect: ប្លុកមួយដែលវាងជុំវិញឧបសគ្គ ហើយរកខ្សែឃើញវិញ — សាកល្បងជាមួយឧបសគ្គនៅទីតាំងពីរខុសគ្នា។
- time: 25′
  text: ការសាកល្បងពេញលេញ។ កត់ត្រាថាដំណាក់កាលណាបរាជ័យ គ្រប់ដង ដើម្បីឲ្យលំនាំឃើញច្បាស់ ជាជាងចងចាំ។
  expect: តារាងសាកល្បងបង្ហាញថាដំណាក់កាលណាបរាជ័យរាល់ដង ដូច្នេះលំនាំនៅលើក្រដាស មិនមែនក្នុងការចងចាំ។
- time: 10′
  text: កត់ត្រាតារាងសាកល្បង និងដំណាក់កាលដែលធ្វើឲ្យអ្នកចំណាយច្រើនបំផុត។ ជំហានទី ២៥ ត្រូវការវា។
  expect: ដំណាក់កាលដែលចំណាយអ្នកច្រើនបំផុត ដាក់ឈ្មោះក្នុងកំណត់ហេតុ។ ជំហានទី ២៥ សម្រួលរវាងការសាកល្បងដោយប្រើតារាងនេះ។
code:
  lang: blocks
  source: "define  avoid_and_refind\n  moves backward  10  cm  until done\n  turn_by  -45\n  moves forward\
    \  25  cm  until done\n  turn_by  45\n  repeat until  quad rgb sensor 1 probe (3) L1 detects  line\
    \ ?\n    moves forward  at 20  RPM\n\nwhen button B pressed\n  quad rgb sensor 1 performs calibration\n\
    \  set  speed  to 40\n  set  mode  to  follow\n  forever\n    if  (mode) = follow  then\n      follow_line\n\
    \      if  (ultrasonic 2 1 distance to an object (cm)) < 12  then\n        avoid_and_refind\n  \
    \    if  quad rgb sensor 1 probe (3) L1 detects  red ?  then\n        set  mode  to  arrived\n \
    \   if  (mode) = arrived  then\n      stop encoder motor  all\n      celebrate\n      stop all"
tips:
- ទុកឧបសគ្គនៅក្រៅកន្លែងសាកល្បង ខណៈពេលដំណាក់កាល ១ និង ៤ កំពុងសាងសង់។ អថេរថ្មីម្ដងមួយ បើមិនដូច្នេះទេ រាល់កំហុសមិនច្បាស់។
- ការវាងត្រូវតែធំល្មមឆ្លងឧបសគ្គ តែចុះចតជិតខ្សែ។ នោះជាការលៃតម្រូវសុទ្ធ ហើយវាគួរតែចំណាយពេល។
- កត់ត្រារាល់ការសាកល្បង។ ក្រោមសម្ពាធ ការចងចាំកុហក តែក្រដាសមិនកុហកទេ — "យើងបរាជ័យនៅតំបន់បីក្នុងបួនដង"
  ជាការងារ, "វាបន្តខូច" ជាអារម្មណ៍។
result:
  scene: rescue
success:
- បេសកកម្មពេញលេញបានបញ្ចប់ពីដើមដល់ចប់យ៉ាងតិចម្ដង
- ការវាង-និង-រកឃើញវិញដំណើរការជាមួយឧបសគ្គនៅទីតាំងពីរខុសគ្នា
- កំណត់ហេតុសាកល្បងបង្ហាញថាដំណាក់កាលណាបរាជ័យញឹកញាប់បំផុត
check:
- do: B
  see: It follows the line, goes around the box, finds the line again.
- do: see
  see: It stops on the red patch and celebrates. That is the mission.
parts:
