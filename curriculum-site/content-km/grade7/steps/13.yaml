tips:
- កំណត់អថេរជា 0 <i>ម្ដង</i> មុនរង្វិលជុំ forever។ នៅខាងក្នុងវា ការរាប់កំណត់ឡើងវិញរាល់ជុំ ហើយមិនដែលឡើងលើស
  1 — កំហុសដែលកើតញឹកញាប់ទីពីរនៃថ្ងៃនេះ។
- ការកែដោយ wait until ល្អជាង wait ធម្មតា ព្រោះវាដំណើរការគ្រប់ល្បឿន។ ទុកឲ្យក្រុមសាកល្បង wait ថេរជាមុន
  ហើយរកករណីដែលវាបរាជ័យ។
- ការរាប់ដែលគ្មានស្លាកលើអេក្រង់ អានមិនបានក្នុងមួយសប្ដាហ៍។ តម្រូវឲ្យប្រើ join តាំងពីដើម។
result:
  scene: counter
success:
- ការរាប់កើនម្ដងក្នុងមួយជញ្ជាំង មិនមែនម្ដងក្នុងមួយរង្វិលជុំ
- ផលបូកនៅលើអេក្រង់ និងមានស្លាក
- ក្រុមអាចប្រាប់ថាហេតុអ្វី button press counts មិនគ្រប់គ្រាន់
check:
- do: A
  see: វាបើក បង្វិលនៅជញ្ជាំងនីមួយៗ ហើយលេខកើនម្ដងមួយ។
- do: see
  see: ជញ្ជាំងមួយ រាប់មួយ — ទោះវាឈរនៅទីនោះមួយរយៈ។
