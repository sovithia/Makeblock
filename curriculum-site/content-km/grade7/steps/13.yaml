n: 13
stage: C
stage_title: រូបយន្តចងចាំ
kind: step
title: រូបយន្តរក្សាពិន្ទុ
concept: អថេរ
hours: 2
project: G7-C-remembers
goal: រូបយន្តរាប់អ្វីមួយដែលគ្មាននរណាសាងសង់ប្លុកសម្រាប់វា ហើយបង្ហាញផលបូកលើអេក្រង់ខ្លួនឯង។
build: រូបយន្តដែលរាប់ជញ្ជាំងដែលវាជួប។
builds_on:
- ជំហានទី ៧ · if
- ជំហានទី ៦ · អេក្រង់ជារបស់អ្នក
teach:
- CyberPi រាប់របស់ខ្លះរួចហើយ — <b>button A press counts</b> នៅទីនោះក្នុងផ្ទាំងប្លុក។ ចុះហេតុអ្វីត្រូវសាងសង់របស់ខ្លួន?
  ព្រោះវារាប់អ្វីដែល Makeblock ជ្រើសរើសឲ្យរាប់។ ពេលអ្នកចង់រាប់ជញ្ជាំងដែលជួប ជុំដែលរត់ ឬពិន្ទុដែលបាន
  គ្មាននរណាធ្វើប្លុកឲ្យអ្នកទេ។ អ្នកត្រូវការ <b>អថេរ</b>៖ ប្រអប់មានឈ្មោះដែលផ្ទុកលេខដែលរូបយន្តចងចាំ។ <b>set</b>
  ដាក់តម្លៃចូល, <b>change by</b> កែវា។
- ការរាប់ដំបូងដែលថ្នាក់គ្រប់ថ្នាក់សាងសង់គឺខុស ហើយវាមានតម្លៃទុកឲ្យវាខុស។ រង្វិលជុំ forever ដំណើរការរាប់ដងក្នុងមួយវិនាទី
  ដូច្នេះជញ្ជាំងមួយត្រូវបានរាប់ម្ភៃដង។ ការកែវា — រង់ចាំរហូតដល់ជញ្ជាំងបាត់មុនរាប់ម្ដងទៀត — ជាមេរៀនពិត
  ហើយវាជាកំហុសដដែលដែលនឹងខាំពួកគេនៅបេសកកម្ម។
guide:
- label: ប្រអប់ថ្មី
  value: Variables → Make a Variable
- label: កំណត់
  value: set walls to 0 — ម្ដង នៅដើម
- label: អន្ទាក់
  value: ជញ្ជាំងមួយរាប់ ២០ ដងបើគ្មានការឈប់
- label: ឥដ្ឋ
  value: កន្លែងប្រហែល ១,៥ ម៉ែត្រ មានជញ្ជាំងជុំវិញ
steps:
- time: 15′
  text: ដាក់ <b>button A press counts</b> លើអេក្រង់ ហើយចុចប៊ូតុង។ វារាប់បានល្អឥតខ្ចោះ។ ឥឡូវព្យាយាមរាប់ជញ្ជាំង
    — ទៅរកប្លុកមើល។ គ្មានទេ។
  expect: កម្មវិធីរាប់ប៊ូតុងដំណើរការល្អ — និងថ្នាក់មួយដែលបានរកប្លុករាប់ជញ្ជាំងក្នុងផ្ទាំង ហើយរកមិនឃើញ។
- time: 25′
  text: បង្កើតអថេរ កំណត់ជា 0 ប្ដូរវាដោយ 1 ពេលរូបយន្តជួបជញ្ជាំង។ ដំណើរការវា។ មើលវាលោតម្ភៃ ហើយរកមូលហេតុ។
  expect: កម្មវិធីរាប់ដែលលោតម្ដងម្ភៃនៅជញ្ជាំងតែមួយ និងក្រុមមួយដែលអាចប្រាប់ថាហេតុអ្វី មុនគេប្រាប់។
- time: 20′
  text: កែវា៖ រាប់ម្ដងក្នុងមួយជញ្ជាំង មិនមែនម្ដងក្នុងមួយរង្វិលជុំ។ រង់ចាំរហូតដល់ជញ្ជាំងចេញផុតព្រំដែន
    មុនពេលអ្នកអនុញ្ញាតឲ្យរាប់ម្ដងទៀត។
  expect: ជញ្ជាំងមួយ រាប់មួយ។ បើកឆ្លងកាត់ជញ្ជាំងប្រាំ ហើយអេក្រង់សរសេរ 5។
- time: 20′
  text: 'បង្ហាញការរាប់ដោយ <b>join</b> ឲ្យអានថា "walls: 4" ហើយអបអរពេលដល់ប្រាំ។'
  expect: 'អេក្រង់អាន «walls: 4» មិនមែន «4» ហើយរូបយន្តអបអរពេលដល់ប្រាំ។'
- time: 20′
  text: ការសាកល្បងក្នុងទីលាន៖ ជញ្ជាំងប៉ុន្មានក្នុងហុកសិបវិនាទី? ប្រៀបធៀបទូទាំងថ្នាក់ — កូដដូចគ្នា ផលបូកខុសគ្នា
    ជជែកគ្នាថាហេតុអ្វី។
  expect: ចំនួនជញ្ជាំងក្នុងហុកសិបវិនាទី ធៀបគ្នាទូទាំងថ្នាក់ — កូដដូចគ្នា លទ្ធផលខុសគ្នា ហើយជជែកថាហេតុអ្វី។
- time: 10′
  text: កត់ត្រាកំហុសដែលអ្នកជួប និងការកែ។ វាត្រឡប់មកវិញនៅជំហានទី ២២។
  expect: កំហុសនិងដំណោះស្រាយសរសេរក្នុងកំណត់ហេតុ។ វាត្រឡប់មកវិញក្នុងជំហានទី ២៤។
