  source: "when CyberPi starts up\n  set print size to  big\n  print  Team Rocket  and move to a newline\n\
    \  LED all displays R 0 G 128 B 255\n  play LED animation  rainbow  until done\n\nwhen button A\
    \ pressed\n  play recording\n  ultrasonic 2 1 displays emotion  happy\n\nwhen button B pressed\n\
    \  clear screen\n  print  bye!\n  turn off LED all"
tips:
- <b>ពិនិត្យឧបករណ៍ មុនអ្វីៗទាំងអស់។</b> វគ្គនេះត្រូវការ mBlock ជាមួយឧបករណ៍ <b>mBot2</b>។ វាដំណើរការលើ
  <b>កុំព្យូទ័រយួរដៃ</b> ឬលើ <b>ថេប្លេត Android ក្នុង Chrome</b> នៅ ide.mblock.cc — និងគ្មានកន្លែងផ្សេងទេ។
  <b>iPad មិនអាចដំណើរការវាបានទេ ក្នុងកម្មវិធីរុករកណាមួយ</b> ហើយកម្មវិធី mBlock លើទូរសព្ទ <b>ទាំង iOS
  និង Android គាំទ្រតែ mBot ជំនាន់ដំបូង</b> មិនមែន mBot2 ទេ។ ដោះស្រាយរឿងនេះមុនមេរៀនដំបូង មិនមែនកំឡុងពេលមេរៀនទេ។
- ឧបករណ៍ត្រូវតែជា <b>mBot2</b>។ បើក្រុមណាជ្រើស CyberPi ពួកគេនឹងឆ្លងផុតថ្ងៃនេះដោយរីករាយ ហើយជាប់គាំងនៅជំហានទី
  ២ ពេលគ្មានប្លុកចលនា — ពិនិត្យអេក្រង់គ្រប់គ្នាឥឡូវនេះ។
- ការថតសំឡេងសរសេរជាន់លើការថតមុន។ ព្រមព្រៀងសញ្ញាមួយសម្រាប់ "កំពុងថត" បើមិនដូច្នេះទេ រូបយន្តដប់ពីរនឹងថតគ្នាទៅវិញទៅមក។
- គ្មានទង់បៃតងលើរូបយន្តទេ។ ក្រុមដែលសួររកវាបានយល់សំណួរហើយ — ឆ្លើយដោយ <b>when CyberPi starts up</b>។
result:
  scene: hello
success:
- ការស្វាគមន៍ដំណើរការពីពេលបើកភ្លើង ដោយគ្មានខ្សែភ្ជាប់
- ប៊ូតុង A និង B ធ្វើអ្វីខុសគ្នាឲ្យឃើញច្បាស់
- ក្រុមអាចប្រាប់ថាហេតុអ្វីរូបយន្តគ្មានទង់បៃតង និងគ្មានឆាក
- ឧបករណ៍របស់រូបយន្តគ្រប់គ្រឿងកំណត់ជា mBot2 មិនមែន CyberPi
