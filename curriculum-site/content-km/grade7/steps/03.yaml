n: 3
stage: A
stage_title: រូបយន្តស្តាប់បង្គាប់
kind: step
title: សួស្តី រូបយន្ត
concept: លំដាប់ · ព្រឹត្តិការណ៍
hours: 1.5
project: G7-A-obeys
goal: រូបយន្តបើកដំណើរការ ហើយស្វាគមន៍ថ្នាក់ដោយខ្លួនឯង ដោយគ្មានកុំព្យូទ័រភ្ជាប់ — ហើយឆ្លើយតបទៅប៊ូតុងទាំងពីរខុសគ្នា។
build: រូបយន្តដែលណែនាំខ្លួនឯងពេលបើកភ្លើង ហើយចាក់សំឡេងរបស់អ្នកឡើងវិញ។
builds_on:
- គ្មានអ្វីទេ — នេះជាម៉ោងទី ០
teach:
- កម្មវិធីគឺជាបញ្ជីនៃសេចក្ដីណែនាំដែលដំណើរការ <b>តាមលំដាប់</b>។ នោះហៅថា <b>លំដាប់</b> ហើយការប្ដូរជួរពីរនឹងផ្លាស់ប្ដូរអ្វីដែលកើតឡើង
  — សិស្សគួរតែធ្វើវាម្ដង ដោយចេតនា ក្នុងដប់នាទីដំបូង។
- គ្មានអ្វីដំណើរការទេ រហូតដល់មានអ្វីមួយ <b>ចាប់ផ្ដើម</b> វា។ នោះហៅថា <b>ព្រឹត្តិការណ៍</b>។ លើរូបយន្តនេះ
  គ្មានទង់បៃតង និងគ្មានក្ដារចុចទេ៖ វាចាប់ផ្ដើមដោយខ្លួនឯងជាមួយ <b>when CyberPi starts up</b> ឬអ្នកចុច
  <b>button A</b> ឬ <b>B</b> នៅលើរូបយន្ត។ និយាយរឿងនេះឲ្យឮ ព្រោះអ្វីៗទាំងអស់ក្នុងឆ្នាំនេះពឹងលើវា — <i>រូបយន្តគ្មានឆាកទេ។
  បើអ្នកចង់ឃើញអ្វីមួយ អ្នកត្រូវដាក់វាលើអេក្រង់របស់វា។</i>
- មានវិធីពីរដើម្បីដំណើរការកម្មវិធី ហើយឆ្នាំនេះអ្នកប្រើមួយក្នុងចំណោមនោះ។ ក្នុងរបៀប <b>Upload</b> mBlock
  បកប្រែប្លុករបស់អ្នក ហើយបញ្ជូនវា <i>ចូល</i> ក្នុងរូបយន្ត; រូបយន្តបន្ទាប់មកដំណើរការវាដោយខ្លួនឯង។ បិទកុំព្យូទ័រ
  ដើរចេញ ត្រឡប់មកវិញថ្ងៃស្អែក — កម្មវិធីនៅតែមាន។ ក្នុងរបៀប <b>Live</b> កម្មវិធីនៅលើកុំព្យូទ័រ ហើយផ្ញើទៅរូបយន្តម្ដងមួយសេចក្ដីណែនាំ
  ដូច្នេះរូបយន្តឈប់ភ្លាមពេលការតភ្ជាប់ដាច់។ Upload ដូចជាការប្រគល់រូបមន្តអាហារសរសេរឲ្យនរណាម្នាក់ រួចចាកចេញពីផ្ទះបាយ;
  Live ដូចជាការឈរក្បែរគេ ហើយអានម្ដងមួយជំហាន។ អ្នកនឹងបញ្ជាក់ភាពខុសគ្នានៅចុងបញ្ចប់មេរៀននេះ ដោយដកខ្សែចេញ។
guide:
- label: ឧបករណ៍
  value: mBot2 — មិនមែន CyberPi ទេ (CyberPi តែឯងគ្មានកង់)
- label: របៀប
  value: Upload — កម្មវិធីរស់នៅលើរូបយន្ត មិនមែនលើកុំព្យូទ័រ
- label: ភស្តុតាង
  value: ដកខ្សែចេញ; វាត្រូវតែនៅដំណើរការ
steps:
- time: 10′
  text: ភ្ជាប់៖ បន្ថែមឧបករណ៍ <b>mBot2</b> ជ្រើសរើសរបៀប <b>Upload</b> ហើយដំណើរការការសាកល្បងប្លុកតែមួយ
    (បញ្ចាំងភ្លើង LED) មុននឹងទុកចិត្តអ្វីផ្សេង។ អ្នកណាដែលឧបករណ៍សរសេរថា CyberPi គឺខុសរូបយន្ត — ពួកគេនឹងគ្មានម៉ូទ័រនៅជំហានក្រោយ។
  expect: LED មួយភ្លឺតាមបញ្ជា — ហើយបញ្ជីឧបករណ៍សរសេរថា mBot2 មិនមែន CyberPi ទេ។
- time: 20′
  text: លំដាប់៖ ពេលបើកដំណើរការ បង្ហាញឈ្មោះក្រុម ហើយបំភ្លឺ LED។ បន្ទាប់មកប្ដូរប្លុកពីរហើយដំណើរការម្ដងទៀត។
    សរសេរអ្វីដែលបានផ្លាស់ប្ដូរ — នោះជាគំនិតទាំងមូលនៃលំដាប់។
  expect: ឈ្មោះក្រុមលើអេក្រង់ និង LED ភ្លឺពេលចាប់ផ្ដើម។ បន្ទាប់ពីប្ដូរប្លុកពីរ មានកំណត់ត្រាថាអ្វីបានផ្លាស់ប្ដូរ។
- time: 20′
  text: សំឡេងរបស់អ្នក៖ <b>start recording</b> និយាយអ្វីមួយ <b>stop recording</b> រួចចាក់វាឡើងវិញពេលចុច
    button A។ ឥឡូវរូបយន្តជារបស់អ្នកហើយ។
  expect: ចុច A ហើយរូបយន្តចាក់សំឡេងរបស់អ្នកវិញ។
- time: 20′
  text: ប៊ូតុងពីរ អាកប្បកិរិយាពីរ។ ទាយឲ្យឮថា B នឹងធ្វើអ្វី <i>មុន</i> ចុចវា។ បន្ទាប់មកធ្វើឲ្យភ្នែករបស់
    ultrasonic sensor បង្ហាញអារម្មណ៍ដែលត្រូវគ្នា។
  expect: A និង B ធ្វើរឿងពីរខុសគ្នា អ្នកបាននិយាយឮៗមុនចុច B ថាវានឹងធ្វើអ្វី ហើយអ្នកនិយាយត្រូវ។
- time: 15′
  text: ធ្វើឲ្យវាជារបស់អ្នក៖ ឈ្មោះ ពណ៌ សំឡេង មុខ។ បង្ហាញរូបយន្តទៅក្រុមផ្សេង ដោយមិនប៉ះតុរបស់គេ។
  expect: រូបយន្តមានឈ្មោះ ពណ៌ សំឡេង និងមុខរបស់អ្នក — បង្ហាញដល់ក្រុមផ្សេងដោយមិនប៉ះតុគេ។
- time: 5′
  text: ដកខ្សែ USB ចេញ ហើយចុចប៊ូតុង។ វានៅតែដំណើរការ — នោះជារបៀប Upload ហើយនោះជាមូលហេតុដែលគ្មាននរណាម្នាក់ជាប់នឹងកុំព្យូទ័រក្នុងឆ្នាំនេះ។
  expect: ដក USB ចុចប៊ូតុង រូបយន្តនៅតែដំណើរការ។ គ្មាននរណាជាប់នឹងកុំព្យូទ័រទេ។
code:
