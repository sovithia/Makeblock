n: 22
stage: D
stage_title: រូបយន្តមានរបៀបរៀបរយ
kind: checkpoint
title: ចំណុចត្រួតពិនិត្យទី ៤ — អនុគមន៍ ស្ថានភាព
concept: ច្រកតាមទាន់
hours: 1
project: G7-D-organised
goal: សិស្សគ្រប់រូបអាចដាក់ឈ្មោះឲ្យអាកប្បកិរិយា ផ្ដល់ធាតុចូលឲ្យវា និងពន្យល់ថាអ្វីសម្រេចថាអាកប្បកិរិយាណាដំណើរការ
  — មុនពេលបេសកកម្មត្រូវបានរចនា។
build: គ្មានអ្វីថ្មីទេ។ ថ្នាក់ទាំងមូលមកដល់កន្លែងតែមួយ។
builds_on:
- ជំហានទី ១៦–១៩
teach:
- '<b>ម៉ោងបម្រុង</b> មានផ្ដល់ជូននៅទីនេះ ហើយចេតនាមិនដាក់ក្នុងតារាងម៉ោងខាងលើទេ — បន្ថែមវាតែបើថ្នាក់មិនស្មើគ្នា។ ម៉ោងដែលបានប្រកាស គឺជាអ្វីដែលវគ្គសិក្សាត្រូវការ ពេលគ្មាននរណាត្រូវតាមទាន់។ បើថ្នាក់ស្មើគ្នា ចំណាយវាលើការពង្រីក៖ គ្រូបង្គោលបន្ថែមរបៀបទីបួនតាមការរចនាខ្លួនឯង ធ្វើបច្ចុប្បន្នភាពដ្យាក្រាមឲ្យត្រូវគ្នា រួចប្រគល់រូបយន្តទៅក្រុមផ្សេងឲ្យព្យាយាមធ្វើឲ្យជាប់គាំង។'
- នេះជាច្រកចុងក្រោយមុនបេសកកម្ម ហើយវាជាច្រកសំខាន់បំផុត។ ដំណាក់កាល E ផ្គុំ Rescue Run ចេញពីប្លុកដែលសិស្សដាក់ឈ្មោះខ្លួនឯង។
  សិស្សដែលមិនទាន់អាចសាងសង់ ឬអានអនុគមន៍ នឹងចំណាយពេលបេសកកម្មមើលអ្នកដទៃធ្វើ។
- គ្រូបង្គោល ដៃចេញ ម៉ោងបម្រុងទៅកន្លែងដែលថ្នាក់ត្រូវការ — ដូចមុន។
guide:
- label: ឆ្លង
  value: ទាំងបីបញ្ហា បង្ហាញឲ្យឃើញ
- label: គ្រូបង្គោល
  value: ដៃចេញ សួរតែសំណួរ
- label: ម៉ោងបម្រុង
  value: +១ ម៉ោង — តែបើថ្នាក់ត្រូវការ មិនរាប់ក្នុងម៉ោងវគ្គសិក្សា
steps:
- time: 10′
  text: រៀបចំ។ និយាយត្រង់ៗថាបេសកកម្មចាប់ផ្ដើមបន្ទាប់ ហើយច្រកនេះជាអ្វីដែលធ្វើឲ្យវារស់រាន។
  expect: ថ្នាក់មួយដែលដឹងថាបេសកកម្មចាប់ផ្ដើមបន្ទាប់ ហើយច្រកនេះជាអ្វីដែលធ្វើឲ្យវារស់រានបាន។
- time: 30′
  text: បញ្ហាទាំងបី៖ <b>(១)</b> កំណត់ប្លុកមួយមានធាតុចូលជាលេខ ហើយប្រើវាជាមួយតម្លៃបីខុសគ្នា។ <b>(២)</b>
    ពន្យល់អ្វីដែលប្លុករបស់អ្នកមួយធ្វើ ដល់អ្នកដែលមិនបានសរសេរវា ដោយមិនបង្ហាញខាងក្នុង។ <b>(៣)</b> បង្ហាញដ្យាក្រាមរបៀបរបស់អ្នក
    ហើយឆ្លើយសំណួរ "កើតអ្វីបើ X កំឡុងពេលរបៀប Y?" ពីគ្រូ។
  expect: បញ្ហាបីបង្ហាញ៖ ប្លុកមានលេខបញ្ចូលប្រើបីរបៀប ប្លុករបស់អ្នកពន្យល់ដោយមិនបើកមើលខាងក្នុង និងសំណួរ
    «បើ X ពេលនៅរបៀប Y?» ឆ្លើយពីដ្យាក្រាម។
- time: 20′
  text: ផ្គូផ្គង៖ អ្នកគ្រប់គ្នាដែលឆ្លងទាំងបី បង្គោលអ្នកដែលមិនទាន់ឆ្លង។
  expect: គ្រប់គ្នាដែលឆ្លងទាំងបី កំពុងបង្គោលអ្នកដែលមិនទាន់ឆ្លង។
blocks:
- My Blocks
- Variables
- Control
tips:
- បញ្ហាទី ២ ជាការសាកល្បងពិត។ សិស្សដែលអាចសាងសង់អនុគមន៍ តែពន្យល់វាមិនបាន នឹងមិនអាចប្រើវាឡើងវិញក្រោមសម្ពាធសប្ដាហ៍ក្រោយទេ។
- សម្រាប់បញ្ហាទី ៣ សួរអំពីការផ្លាស់ប្ដូរដែលពួកគេ <i>មិន</i> បានគូរ។ ចម្លើយល្អគឺ "ដ្យាក្រាមមិននិយាយទេ
  — នោះជាព្រួញដែលបាត់"។
- នេះជាចំណុចត្រួតពិនិត្យចុងក្រោយ។ បើសិស្សណានៅតែយឺតយ៉ាវត្រង់នេះ រៀបចំក្រុមបេសកកម្មឲ្យគេនៅជាមួយគ្រូបង្គោល
  ជំនួសឲ្យការទុកឲ្យគេត្រូវគេលី។
result:
  scene: healthcheck
  params:
    checks: [block takes a number, block explained to a peer, state transition explained]
    caption: every student clears the final mission-readiness gate
success:
- សិស្សគ្រប់រូបបានបង្ហាញបញ្ហាទាំងបី
- សិស្សគ្រប់រូបបានពន្យល់ប្លុករបស់ខ្លួនមួយដល់អ្នកដទៃ
- ថ្នាក់ចាប់ផ្ដើមបេសកកម្មជាមួយគ្នា
