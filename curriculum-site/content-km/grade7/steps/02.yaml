n: 2
stage: '0'
stage_title: Build the robot
kind: step
title: Finish it — sensors, shield, first power-on
concept: Quality control before it matters
hours: 2
goal: A finished robot that another team has inspected and signed off, powered on for the first time.
build: A robot that is yours, checked by somebody else, and switched on.
builds_on:
- Step 1 · chassis, motors, wheels
teach:
- 'Finish the build: the two sensors underneath and in front, then the mBot2 Shield on top — its battery
  is <b>built in</b>, so charge it before this lesson — and the CyberPi last. Cables go in with the
  <b>10 cm</b> mBuild leads; the guide crosses the 20 cm one out in red, and a cable left loose near a
  wheel is the commonest cause of a robot that "randomly stops" in week nine.'
- 'Then <b>quality control</b>, which is a real engineering practice and not a tidying-up ritual. Each
  team inspects <i>another</i> team''s robot against four points and signs it. You stop seeing your own
  mistakes after twenty minutes with a screwdriver; somebody else sees them in ten seconds. Everything
  the class finds today is a fault that does not eat a lesson later.'
