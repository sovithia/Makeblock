n: 9
stage: B
stage_title: រូបយន្តសម្រេចចិត្ត
kind: step
title: ការសម្រេចចិត្តដំបូង
concept: លក្ខខណ្ឌ — if
hours: 2
project: G7-B-decides
goal: រូបយន្តឈប់ដោយខ្លួនឯងមុនជញ្ជាំង ពីចម្ងាយចាប់ផ្ដើមណាមួយ ដោយគ្មាននរណាប៉ះវា។
build: រូបយន្តដែលនឹងមិនបុក។
builds_on:
- ជំហានទី ៦ · ឧបករណ៍ចាប់សញ្ញាឲ្យលេខ
- ជំហានទី ៤ · forever
teach:
- រហូតមកដល់ពេលនេះ រូបយន្តបានធ្វើតាមអ្វីដែលគេប្រាប់ តាមលំដាប់។ ថ្ងៃនេះវា <b>សម្រេចចិត្ត</b>។ <b>if (distance
  &lt; 15) then stop</b> នៅក្នុងរង្វិលជុំ forever គឺជារូបយន្តពិនិត្យពិភពលោករាប់ដងក្នុងមួយវិនាទី ហើយជ្រើសរើសអ្វីត្រូវធ្វើ។
  ចង្អុលទៅផ្ទាំងពីជំហានទី ៦៖ វាបានអានលេខនោះរួចហើយ — ឥឡូវលេខនោះប្ដូរអាកប្បកិរិយារបស់វា។
- កំហុសបុរាណគឺដាក់ <b>if</b> នៅខាងក្រៅរង្វិលជុំ forever។ បន្ទាប់មករូបយន្តពិនិត្យតែម្ដង នៅដើម ហើយមិនពិនិត្យទៀតទេ។
  បើរូបយន្តក្រុមណាបើកបរចូលជញ្ជាំងដោយរីករាយ នោះស្ទើរតែតែងតែជាមូលហេតុ ហើយការរកឃើញដោយខ្លួនឯងមានតម្លៃជាងការប្រាប់។
guide:
- label: រូបរាង
  value: forever → if → ធ្វើ
- label: អន្ទាក់
  value: if ខាងក្រៅ forever = ពិនិត្យតែម្ដង
- label: គោលដៅ
  value: ឈប់ដោយមានគម្លាតដែលអ្នកអាចវាស់
- label: ឥដ្ឋ
  value: ទំនេរ ២ ម៉ែត្រ មានជញ្ជាំង ឬប្រអប់ឲ្យបើកទៅរក
steps:
- time: 15′
  text: ទាយជាមុន៖ នៅ 50 RPM វានឹងចូលជិតប៉ុនណាមុនឈប់? សរសេរលេខមួយ។ បន្ទាប់មកសាងសង់វា ហើយដឹង។
  expect: លេខមួយសរសេរទុកមុនសាងសង់អ្វីទាំងអស់ ដើម្បីឲ្យរូបយន្តបញ្ជាក់ថាអ្នកត្រូវ ឬខុស។
- time: 25′
  text: សាងសង់ការឈប់ពេលជិត។ ដំណើរការវាពីចម្ងាយចាប់ផ្ដើមបីខុសគ្នា។ វាស់គម្លាតម្ដងៗ។
  expect: រូបយន្តបើកទៅជញ្ជាំង ហើយឈប់ដោយខ្លួនឯងមុនប៉ះ ពីចម្ងាយចាប់ផ្ដើមបីខុសគ្នា។
- time: 25′
  text: បង្កើនល្បឿន។ វាស់ម្ដងទៀត។ គម្លាតធំឡើង — គិតថាហេតុអ្វី មុនពេលនរណាម្នាក់ពន្យល់។
  expect: គម្លាតវាស់ដែលធំឡើងតាមល្បឿន និងការពន្យល់ដោយក្រុមថាហេតុអ្វី — គិតឃើញខ្លួនឯង មិនមែនគេប្រាប់។
- time: 25′
  text: ការសាកល្បងផ្លូវការ៖ ដប់ដងចូលមកពីកន្លែងណាក៏បានក្នុងបន្ទប់ ដោយមិនប៉ះជញ្ជាំង។ រាប់ដោយស្មោះត្រង់។
  expect: ការចូលទៅដប់ដងពីកន្លែងណាក៏បានក្នុងបន្ទប់ ដោយមិនប៉ះជញ្ជាំង រាប់ដោយស្មោះ។
- time: 20′
  text: បន្ថែមភ្នែករបស់ឧបករណ៍ចាប់សញ្ញា៖ ស្ងប់ពេលឆ្ងាយ ភ័យពេលជិត។ ឥឡូវរូបយន្តបង្ហាញអ្វីដែលវាកំពុងគិត។
  expect: ភ្នែកស្ងប់ពេលជញ្ជាំងឆ្ងាយ ភ្នែកតក់ស្លុតពេលវាជិត។ អ្នកមើលឃើញអ្វីដែលរូបយន្តកំពុងគិត។
- time: 10′
  text: កត់ត្រាលេខល្បឿនធៀបនឹងគម្លាត។ ជំហានទី ៨ ប្រើពួកវា។
  expect: លេខល្បឿន-ធៀប-គម្លាតក្នុងកំណត់ហេតុ។ ជំហានទី ១០ ប្រើវា។
code:
  lang: blocks
  source: "when CyberPi starts up\n  forever\n    show label 1  join  dist:   (ultrasonic 2 1 distance\
    \ to an object (cm))  at x: 0 y: 0  by small pixel\n    show label 2  join  light:  (ambient light\
    \ intensity)  at x: 0 y: 20  by small pixel\n    show label 3  join  loud:   (loudness)  at x: 0\
    \ y: 40  by small pixel\n    line chart, add data  (ultrasonic 2 1 distance to an object (cm))\n\
    \nwhen button A pressed\n  forever\n    if  (ultrasonic 2 1 distance to an object (cm)) < 15  then\n\
    \      stop encoder motor  all\n      ultrasonic 2 1 displays emotion  dizzy\n    else\n      moves\
    \ forward  at 50  RPM\n      ultrasonic 2 1 displays emotion  standby"
tips:
- រូបយន្តដែលមិនឈប់សោះ មាន if នៅខាងក្រៅរង្វិលជុំ forever។ វាជាកំហុសប្រចាំថ្ងៃ រាល់ឆ្នាំ។
- រក្សាល្បឿនទាបជាមុនសិន។ រូបយន្តលឿនមិនអាចឈប់ទាន់ ហើយតក្កវិជ្ជាមើលទៅដូចខូច ទាំងដែលវាល្អ។
- ប្រើប្រអប់រាបជាជញ្ជាំង មិនមែនបាតដៃមនុស្សទេ — ដៃរើ ហើយទិន្នន័យក្លាយជាភ្លុក។
result:
  scene: sonar
success:
- រូបយន្តឈប់ដោយខ្លួនឯងពីចម្ងាយចាប់ផ្ដើមណាក៏បាន ដប់ដងជាប់គ្នា
- ក្រុមបានវាស់ថាគម្លាតប្រែប្រួលយ៉ាងណាតាមល្បឿន
- គ្មាននរណាចាប់រូបយន្តដើម្បីសង្គ្រោះវាទេ
check:
- do: A
  see: It drives at the wall and stops before it touches.
- do: see
  see: Move the wall anywhere. It still stops.
parts:
- id: robot_wheel
- id: boxes
  note: the wall
- id: ruler

