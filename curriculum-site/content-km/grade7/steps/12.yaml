n: 12
stage: B
stage_title: រូបយន្តសម្រេចចិត្ត
kind: checkpoint
title: ចំណុចត្រួតពិនិត្យទី ២ — លក្ខខណ្ឌ សញ្ញាប្រមាណវិធី
concept: ច្រកតាមទាន់
hours: 1
project: G7-B-decides
goal: សិស្សគ្រប់រូបអាចសរសេរការសម្រេចចិត្តដែលអានឧបករណ៍ចាប់សញ្ញា ហើយធ្វើតាមវា និងអាចផ្សំលក្ខខណ្ឌពីរ
  — មុនពេលដំណាក់កាល C បន្ថែមការចងចាំ។
build: គ្មានអ្វីថ្មីទេ។ ថ្នាក់ទាំងមូលមកដល់កន្លែងតែមួយ។
builds_on:
- ជំហានទី ៦–៩
teach:
- '<b>ម៉ោងបម្រុង</b> មានផ្ដល់ជូននៅទីនេះ ហើយចេតនាមិនដាក់ក្នុងតារាងម៉ោងខាងលើទេ — បន្ថែមវាតែបើថ្នាក់មិនស្មើគ្នា។ ម៉ោងដែលបានប្រកាស គឺជាអ្វីដែលវគ្គសិក្សាត្រូវការ ពេលគ្មាននរណាត្រូវតាមទាន់។ បើថ្នាក់ស្មើគ្នា ចំណាយវាលើការពង្រីក៖ គ្រូបង្គោលសាងសង់រូបយន្តដែលអាកប្បកិរិយាប្រែប្រួលតាមលក្ខខណ្ឌបីផ្សំគ្នា ហើយព្យាយាមពន្យល់វាដល់ក្រុមដែលមិនបានសរសេរ។'
- ដំណាក់កាល C ផ្ដល់ការចងចាំដល់រូបយន្ត ហើយការចងចាំគួរឲ្យចាប់អារម្មណ៍តែពេលរូបយន្តអាចសម្រេចចិត្តរួចហើយ។
  សិស្សដែលមិនរឹងមាំលើ <b>if</b> នឹងមិនអាចទ្រាំនឹងអថេរដែលប្ដូរអ្វីដែល <b>if</b> ធ្វើទេ។
- ច្បាប់ដូចចំណុចត្រួតពិនិត្យទី ១៖ បញ្ហាដោយដៃ គ្រូបង្គោលដាក់ដៃចេញពីរូបយន្តអ្នកដទៃ ហើយម៉ោងបម្រុងចំណាយលើអ្វីដែលថ្នាក់ត្រូវការ។
guide:
- label: ឆ្លង
  value: ទាំងបីបញ្ហា បង្ហាញឲ្យឃើញ
- label: គ្រូបង្គោល
  value: ដៃចេញ សួរតែសំណួរ
- label: ម៉ោងបម្រុង
  value: +១ ម៉ោង — តែបើថ្នាក់ត្រូវការ មិនរាប់ក្នុងម៉ោងវគ្គសិក្សា
steps:
- time: 10′
  text: រៀបចំ៖ ស្ថានីយបី មួយសម្រាប់បញ្ហានីមួយៗ។
  expect: ស្ថានីយបី មួយក្នុងមួយបញ្ហា ដូច្នេះគ្មាននរណាឈរជួរ។
- time: 30′
  text: បញ្ហាទាំងបី៖ <b>(១)</b> ធ្វើឲ្យរូបយន្តធ្វើអ្វីមួយខុសគ្នាពេលវត្ថុនៅជិត ធៀបនឹងពេលឆ្ងាយ ហើយពន្យល់ថា
    if ត្រូវនៅទីណាធៀបនឹង forever។ <b>(២)</b> សរសេរលក្ខខណ្ឌដែលពិតតែពេលរបស់ពីរពិតក្នុងពេលតែមួយ ហើយបង្ហាញករណីទាំងបួន។
    <b>(៣)</b> បង្ហាញ "យ៉ាងតិច 30 cm" ដោយគ្មានប្លុក ≥។
  expect: បញ្ហាបីបង្ហាញ៖ អាកប្បកិរិយាជិត-ធៀប-ឆ្ងាយដោយ if ត្រូវកន្លែង លក្ខខណ្ឌពីរផ្នែកបង្ហាញទាំងបួនករណី
    និង «យ៉ាងហោច ៣០ ស.ម.» ដោយគ្មានប្លុក ≥។
- time: 20′
  text: ផ្គូផ្គង៖ អ្នកគ្រប់គ្នាដែលឆ្លងទាំងបី បង្គោលអ្នកដែលមិនទាន់ឆ្លង។
  expect: សិស្សគ្រប់រូបដែលឆ្លងទាំងបី កំពុងបង្គោលអ្នកដែលមិនទាន់ឆ្លង។
blocks:
- Control
- Operators
- Sensing
- Ultrasonic Sensor 2
tips:
- បញ្ហាទី ៣ ជាបញ្ហាដែលបែងចែកការទន្ទេញពីការយល់។ កុំទទួល "x > 29" ដោយមិនសួរថាកើតអ្វីនៅ 29.5។
- បើសិស្សអាចធ្វើឲ្យវាដំណើរការ តែមិនអាចប្រាប់ថា if ទៅណា និងហេតុអ្វី ពួកគេមិនទាន់ឆ្លងបញ្ហាទី ១ ទេ។
- រក្សាគូបង្គោលដដែលពីចំណុចត្រួតពិនិត្យទី ១ តែពេលវាដំណើរការល្អ។ ការបង្វិលជាធម្មតាល្អជាង។
result:
  scene: healthcheck
  params:
    checks: [near / far decision, two conditions combined, at least without a ≥ block]
    caption: every student clears all three decision challenges
success:
- សិស្សគ្រប់រូបបានបង្ហាញបញ្ហាទាំងបី
- សិស្សគ្រប់រូបអាចប្រាប់ថាហេតុអ្វី if ជាកម្មសិទ្ធិនៅក្នុងរង្វិលជុំ forever
- ថ្នាក់ចាប់ផ្ដើមដំណាក់កាល C ជាមួយគ្នា
