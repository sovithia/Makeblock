n: 8
stage: B
stage_title: រូបយន្តសម្រេចចិត្ត
kind: step
title: អ្វីដែលរូបយន្តអាចដឹង
concept: ឧបករណ៍ចាប់សញ្ញាជាតម្លៃរស់
hours: 2
project: G7-B-decides
goal: ផ្ទាំងឧបករណ៍លើអេក្រង់របស់រូបយន្តខ្លួនឯង បង្ហាញឧបករណ៍ចាប់សញ្ញាទាំងអស់ក្នុងពេលតែមួយ ធ្វើបច្ចុប្បន្នភាពរស់។
build: ផ្ទាំងព័ត៌មានដែលរូបយន្តយកទៅជាមួយខ្លួន។
builds_on:
- ជំហានទី ៤ · forever
- ជំហានទី ១ · គ្មានឆាកទេ
teach:
- ឧបករណ៍ចាប់សញ្ញាគ្រប់មួយឆ្លើយជា <b>លេខ</b> គ្រប់ពេល ទោះអ្នកមើលឬអត់។ ចម្ងាយជាសង់ទីម៉ែត្រ ពន្លឺជាកម្រិត
  សំឡេងឮជាកម្រិត។ ថ្ងៃនេះរូបយន្តឈប់ជារបស់ដែលអ្នកបញ្ជា ហើយចាប់ផ្ដើមជារបស់ដែល <i>ដឹងអ្វីៗ</i>។
- គ្មានបង្អួចឃ្លាំមើលទេ ដូច្នេះអ្នកសាងសង់ផ្ទាំងដោយខ្លួនឯង — ហើយមានបីរបៀបបង្ហាញលេខ ដែលជាជម្រើសពិត។
  <b>print</b> រំកិល ដូច្នេះវាសមសម្រាប់កំណត់ហេតុដែលអ្នកចង់អានថយក្រោយ។ <b>show label</b> សរសេរជាន់លើកន្លែងដដែល
  ដូច្នេះវាសមសម្រាប់តម្លៃរស់។ <b>តារាងក្រាហ្វ</b> បង្ហាញប្រវត្តិ ដូច្នេះវាសមពេលរូបរាងតាមពេលសំខាន់ជាងលេខឥឡូវ។
  <b>join</b> ភ្ជាប់ពាក្យទៅលេខ ដើម្បីឲ្យតម្លៃមួយប្រាប់ថាវាជាអ្វី។
guide:
- label: តម្លៃរស់
  value: show label n … at x, y
- label: កំណត់ហេតុ
  value: print … and move to a newline
- label: ប្រវត្តិ
  value: line chart, add data
steps:
- time: 15′
  text: ឧបករណ៍ចាប់សញ្ញាមួយ ស្លាកមួយ៖ ចម្ងាយលើអេក្រង់ ធ្វើបច្ចុប្បន្នភាព forever។ គ្រវីដៃទៅវា។
  expect: លេខចម្ងាយលើអេក្រង់ដែលប្ដូរភ្លាមពេលអ្នកគ្រវីដៃទៅឧបករណ៍ចាប់សញ្ញា។
- time: 25′
  text: បន្ថែមពន្លឺ និងសំឡេងឮលើជួររៀងៗខ្លួន។ ប្រើ join ដើម្បីឲ្យតម្លៃនីមួយៗមានស្លាក — លេខទទេលើអេក្រង់គ្មានប្រយោជន៍ក្នុងមួយខែទេ។
  expect: បន្ទាត់បីមានស្លាកលើអេក្រង់ — ចម្ងាយ ពន្លឺ សំឡេង — នីមួយៗប្រាប់ថាវាជាអ្វី មិនមែនត្រឹមលេខទទេ។
- time: 25′
  text: បន្ថែមតារាងក្រាហ្វសម្រាប់ចម្ងាយ។ ដើរទៅរកមេ៉ន់រូបយន្តយឺតៗ ហើយមើលខ្សែ។ ឥឡូវដើរលឿន។ ក្រាហ្វបង្ហាញអ្វីមួយដែលលេខមិនអាចបង្ហាញ។
  expect: ក្រាហ្វិកគូរជម្រាលថ្នមៗពេលអ្នកដើរយឺត និងជម្រាលចោតពេលអ្នកដើរលឿន។ លេខតែឯងបង្ហាញរឿងនេះមិនបានទេ។
- time: 25′
  text: មន្ទីរពិសោធន៍ព្រំដែន៖ ជិតប៉ុនណាមុនចម្ងាយឈប់មានន័យ? ឆ្ងាយប៉ុនណា? អាវយឺតទន់អានបានយ៉ាងណាធៀបនឹងសៀវភៅ?
    កត់ត្រាវា។
  expect: តារាងសរសេរប្រាប់កន្លែងដែលឧបករណ៍ចាប់សញ្ញាឈប់និយាយការពិត៖ ជិតពេក ឆ្ងាយពេក និងអាវយឺតទន់អានប៉ុន្មានធៀបនឹងសៀវភៅ។
- time: 20′
  text: ប្ដូររូបយន្តជាមួយក្រុមផ្សេង ហើយអានផ្ទាំងរបស់គេ។ បើអ្នកមិនអាចប្រាប់ថាលេខមួយមានន័យអ្វី ស្លាករបស់គេត្រូវការកែ។
  expect: អ្នកអានផ្ទាំងក្រុមផ្សេងបានដោយមិនចាំបាច់សួរគេថាលេខមួយមានន័យអ្វី។ បើមិនបាន ស្លាករបស់គេត្រូវកែ។
- time: 10′
  text: កត់ត្រាតារាងព្រំដែន។ ជំហានទី ៧ ពឹងលើការដឹងថាឧបករណ៍ចាប់សញ្ញាកុហកនៅទីណា។
  expect: តារាងព្រំដែនក្នុងកំណត់ហេតុ — ជំហានទី ៩ ពឹងលើការដឹងកន្លែងដែលឧបករណ៍នេះកុហក។
code:
  lang: blocks
  source: |-
    when CyberPi starts up
      forever
        show label 1  join  dist:   (ultrasonic 2 1 distance to an object (cm))  at x: 0 y: 0  by small pixel
        show label 2  join  light:  (ambient light intensity)  at x: 0 y: 20  by small pixel
        show label 3  join  loud:   (loudness)  at x: 0 y: 40  by small pixel
        line chart, add data  (ultrasonic 2 1 distance to an object (cm))
tips:
- ប្រើ show label ជំនួសឲ្យ print សម្រាប់តម្លៃរស់ បើមិនដូច្នេះទេ អេក្រង់រំកិលលឿនពេកមិនអាចអាន ហើយសិស្សនឹងសន្និដ្ឋានថាឧបករណ៍ចាប់សញ្ញាខូច។
- ក្រោម ៤ cm និងលើស ៣ m តម្លៃចម្ងាយប្លែក។ ទុកឲ្យក្រុមរកព្រំដែនទាំងនោះដោយខ្លួនឯង ជំនួសឲ្យការប្រកាស។
- ផ្ទៃទន់ និងផ្ទៃទ្រេត បំបែកសំឡេងអេកូ។ អាវយឺតគឺជាតម្លៃខុសពីសៀវភៅមែនទែន ហើយនោះជាមេរៀនឧបករណ៍ចាប់សញ្ញាពិត
  មិនមែនកំហុសទេ។
result:
  scene: screen
  params:
    lines:
    - ["distance: 24 cm", "#7dd3fc", 10, true]
    - ["light: 63", "#facc15", 10, false]
    - ["loudness: 18", "#22c55e", 10, false]
    caption: three labelled sensor readings update live on the robot
success:
- ឧបករណ៍ចាប់សញ្ញាបីឃើញក្នុងពេលតែមួយ មានស្លាក ធ្វើបច្ចុប្បន្នភាពរស់
- តារាងក្រាហ្វដែលឆ្លើយតបនឹងចលនាឲ្យឃើញច្បាស់
- កំណត់ត្រាសរសេរអំពីកន្លែងដែលឧបករណ៍ចម្ងាយឈប់គួរឲ្យទុកចិត្ត
check:
- do: "on"
  see: Three numbers appear and keep changing as you move your hand.
- do: "see"
  see: The wiggly line on the screen is the sensor being noisy.
parts:
- id: robot_wheel
- id: ultra
- id: foam
  note: a soft target
- id: ruler
