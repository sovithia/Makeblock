n: 6
stage: A
stage_title: រូបយន្តស្តាប់បង្គាប់
kind: step
title: វាដំណើរការដោយខ្លួនឯង
concept: Forever · ចាប់ផ្ដើម និងឈប់
hours: 1.5
project: G7-A-obeys
goal: ការល្បាតដែលចាប់ផ្ដើមពីប៊ូតុង A ស្ថិតនៅក្នុងសង្វៀនដោយចាប់សញ្ញាព្រំកាសែតក្រហម ហើយដំណើរការរហូតដល់ត្រូវបញ្ឈប់ ដោយមិនត្រូវការកុំព្យូទ័រ។
build: រូបយន្តដែលបើករហូតដល់ឃើញបន្ទះក្រហម ថយក្រោយ បត់ ហើយបន្តល្បាតរហូតដល់អ្នកបញ្ឈប់វា។
builds_on:
- ជំហានទី ៣ · រង្វិលជុំ
- ជំហានទី ១ · ព្រឹត្តិការណ៍
teach:
- <b>repeat 4</b> រាប់ ហើយបញ្ចប់។ <b>forever</b> មិនបញ្ចប់ទេ។ នោះជាភាពខុសគ្នាទាំងមូល ហើយវាសំខាន់ជាងដែលស្តាប់ទៅ៖
  រូបយន្តដែលត្រូវឃ្លាំមើលពិភពលោកជានិច្ច ត្រូវការរង្វិលជុំដែលគ្មានទីបញ្ចប់ ហើយរាល់អាកប្បកិរិយាស្វ័យប្រវត្តិពេញមួយឆ្នាំសុទ្ធតែស្ថិតនៅក្នុងវា។
- អ្វីមួយត្រូវតែអាចបញ្ឈប់វា។ <b>stop all</b> លើ button B គឺជាចម្លើយថ្ងៃនេះ — ព្រឹត្តិការណ៍ទីពីរ ដែលធ្វើផ្ទុយពីទីមួយ។
  ចាប់ពីពេលនេះទៅ រាល់កម្មវិធីដែលក្រុមសរសេរ គួរតែអាចចាប់ផ្ដើម និងបញ្ឈប់បាន ដោយមិនប៉ះខ្សែ។
- ចម្ងាយកំណត់មិនអាចពណ៌នាសង្វៀននេះបានទេ ព្រោះរូបយន្តអាចចាប់ផ្ដើមពីកន្លែងណាក៏បាន។ ឲ្យរូបយន្តបើក ខណៈ <b>Quad RGB sensor</b> ដែលបែរចុះក្រោមមើលឥដ្ឋ។ <b>wait until red</b> ប្រើកាសែតជាសញ្ញាឲ្យឈប់ ថយក្រោយ និងបត់ ជំនួសឲ្យការស្មានចម្ងាយ។ ការថយមុនជួយឲ្យ sensor ចាកពីបន្ទះដដែល។
steps:
- time: 10′
  text: យកការ៉េពីជំហានទី ៣ មករុំក្នុង forever។ មើលវាមិនឈប់។ បន្ទាប់មកពន្យល់ថាហេតុអ្វីជ្រុងថេរ ៣០ ស.ម. មិនអាចរក្សាវាក្នុងសង្វៀនបាន នៅពេលចាប់ផ្ដើមពីទីតាំងផ្សេង។
  expect: ការេមិនឈប់ទេ។ អ្នកត្រូវចុចឈប់ដើម្បីបញ្ចប់វា។
- time: 25′
  text: សាងសង់ការល្បាតក្នុងសង្វៀន៖ ទៅមុខក្នុងល្បឿន ៣០ RPM រង់ចាំរហូតដល់ probe L1 ឃើញពណ៌ក្រហម ឈប់ ថយក្រោយ ៥ ស.ម. ហើយបត់ស្ដាំ ៩០°។ ដាក់លំដាប់នេះក្នុង forever។ ចាប់ផ្ដើមជិតកណ្ដាល ដោយបែរទៅព្រំ មិនមែនលើកាសែតទេ។
  expect: រូបយន្តទៅដល់បន្ទះក្រហម ឈប់មុនឆ្លង ថយចូលក្នុងសង្វៀន បត់ ហើយបើកទៅរកព្រំមួយទៀត។
- time: 25′
  text: បន្ថែមការឈប់៖ button B បញ្ចប់អ្វីៗទាំងអស់។ សាកល្បងពេលរូបយន្តកំពុងផ្លាស់ទី មិនមែនពេលវាចត។
  expect: ប៊ូតុង B បញ្ឈប់រូបយន្តពេលវាកំពុងផ្លាស់ទី — មិនមែនតែពេលវាចត។
- time: 20′
  text: ដកខ្សែចេញ ហើយដំណើរការវាក្នុងសង្វៀនកាសែតក្រហមពីរនាទី។ បើវាឆ្លងព្រំ បន្ថយល្បឿន ពិនិត្យថា sensor បែរចុះត្រង់ ហើយបញ្ជាក់ថា L1 រាយការណ៍ពណ៌ក្រហមលើកាសែត។
  expect: ដំណើរការដោយគ្មានខ្សែពីរនាទី ដោយមិនឆ្លងព្រំក្រហម ហើយមានអ្នកមើលពេញមួយពេល។
- time: 10′
  text: កត់ត្រា៖ កម្មវិធីណាខ្លះរបស់អ្នករហូតមកដល់ពេលនេះ អាចដំណើរការដោយគ្មានកុំព្យូទ័រក្នុងបន្ទប់? គួរតែទាំងអស់។
  expect: បន្ទាត់កំណត់ហេតុឆ្លើយថា៖ កម្មវិធីមួយណារបស់អ្នកអាចរត់ដោយគ្មានកុំព្យូទ័រក្នុងបន្ទប់?
