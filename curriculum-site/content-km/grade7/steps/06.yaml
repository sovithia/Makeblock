n: 6
stage: A
stage_title: រូបយន្តស្តាប់បង្គាប់
kind: step
title: វាដំណើរការដោយខ្លួនឯង
concept: Forever · ចាប់ផ្ដើម និងឈប់
hours: 1.5
project: G7-A-obeys
goal: ការល្បាតដែលចាប់ផ្ដើមពីប៊ូតុង A ដំណើរការរហូតដល់ត្រូវបញ្ឈប់ ហើយមិនត្រូវការកុំព្យូទ័រនៅចំណុចណាមួយទេ។
build: រូបយន្តដែលបើកជាការេដដែលម្ដងហើយម្ដងទៀត ភ្លឺ រហូតដល់អ្នកបញ្ឈប់វា។
builds_on:
- ជំហានទី ៣ · រង្វិលជុំ
- ជំហានទី ១ · ព្រឹត្តិការណ៍
teach:
- <b>repeat 4</b> រាប់ ហើយបញ្ចប់។ <b>forever</b> មិនបញ្ចប់ទេ។ នោះជាភាពខុសគ្នាទាំងមូល ហើយវាសំខាន់ជាងដែលស្តាប់ទៅ៖
  រូបយន្តដែលត្រូវឃ្លាំមើលពិភពលោកជានិច្ច ត្រូវការរង្វិលជុំដែលគ្មានទីបញ្ចប់ ហើយរាល់អាកប្បកិរិយាស្វ័យប្រវត្តិពេញមួយឆ្នាំសុទ្ធតែស្ថិតនៅក្នុងវា។
- អ្វីមួយត្រូវតែអាចបញ្ឈប់វា។ <b>stop all</b> លើ button B គឺជាចម្លើយថ្ងៃនេះ — ព្រឹត្តិការណ៍ទីពីរ ដែលធ្វើផ្ទុយពីទីមួយ។
  ចាប់ពីពេលនេះទៅ រាល់កម្មវិធីដែលក្រុមសរសេរ គួរតែអាចចាប់ផ្ដើម និងបញ្ឈប់បាន ដោយមិនប៉ះខ្សែ។
steps:
- time: 10′
  text: យកការ៉េពីជំហានទី ៣ មករុំក្នុង forever។ មើលវាមិនឈប់។ រីករាយបន្តិច។
  expect: ការេមិនឈប់ទេ។ អ្នកត្រូវចុចឈប់ដើម្បីបញ្ចប់វា។
- time: 25′
  text: សាងសង់ការល្បាត៖ ទៅមុខ បង្វិល ទៅមុខ បង្វិល — ជាមួយភ្លើងប្ដូរជារាល់ជុំ ដើម្បីឲ្យអ្នកឃើញរង្វិលជុំកំពុងវិល។
  expect: រូបយន្តល្បាតជុំវិញចតុកោណដោយខ្លួនឯង ប្ដូរពណ៌និងសំឡេងរាល់ជុំ ដូច្នេះអ្នកឃើញរង្វិលជុំវិល។
- time: 25′
  text: បន្ថែមការឈប់៖ button B បញ្ចប់អ្វីៗទាំងអស់។ សាកល្បងពេលរូបយន្តកំពុងផ្លាស់ទី មិនមែនពេលវាចត។
  expect: ប៊ូតុង B បញ្ឈប់រូបយន្តពេលវាកំពុងផ្លាស់ទី — មិនមែនតែពេលវាចត។
- time: 20′
  text: ដកខ្សែចេញ ហើយដំណើរការវាលើឥដ្ឋពីរនាទី។ អ្វីដែលខុសក្នុងពីរនាទី នឹងខុសក្នុងបេសកកម្មនៅពេលក្រោយ។
  expect: ពីរនាទីនៃការរត់ដោយគ្មានខ្សែ ដោយគ្មានអ្វីខុស ហើយមានអ្នកមើលពេញមួយពេល។
- time: 10′
  text: កត់ត្រា៖ កម្មវិធីណាខ្លះរបស់អ្នករហូតមកដល់ពេលនេះ អាចដំណើរការដោយគ្មានកុំព្យូទ័រក្នុងបន្ទប់? គួរតែទាំងអស់។
  expect: បន្ទាត់កំណត់ហេតុឆ្លើយថា៖ កម្មវិធីមួយណារបស់អ្នកអាចរត់ដោយគ្មានកុំព្យូទ័រក្នុងបន្ទប់?
code:
  lang: blocks
  source: "when CyberPi starts up\n  set print size to  big\n  print  Team Rocket  and move to a newline\n\
    \  LED all displays R 0 G 128 B 255\n  play LED animation  rainbow  until done\n  show label 1 \
    \ press A to start  at x: 0 y: 0  by small pixel\n  wait until  button  A  pressed?\n  forever\n\
    \    moves forward  30  cm  until done\n    turns right  90  ° until done\n    LED all displays\
    \ R  (pick random 0 to 255)  G 0 B 255\n    play  hi\n\nwhen button A pressed\n  play recording\n\
    \  ultrasonic 2 1 displays emotion  happy\n\nwhen button B pressed\n  clear screen\n  print  bye!\n\
    \  turn off LED all\n  stop all\n\nwhen joystick  middle pressed\n  reset encoder motor  (1) EM1\
    \  rotated angle\n  moves forward  100  cm  until done\n  show label 1  join  robot says:  (encoder\
    \ motor (1) EM1 rotated angle (°))  at x: 0 y: 0  by small pixel\n\nwhen joystick  pulled↑\n  set\
    \  sides  to  5\n  repeat  (sides)\n    moves forward  30  cm  until done\n    turns right  (360\
    \ / (sides))  ° until done"
tips:
- គ្មានអ្វីផ្លាស់ទីរហូតដល់ចុច <b>ប៊ូតុង A</b>។ ការបញ្ជូនឡើងចាប់ផ្ដើមកម្មវិធីលើរូបយន្តភ្លាមៗ ហើយរូបយន្តដែលបើកភ្លាមពេលបញ្ជូនរួច
  នឹងធ្លាក់ចុះពីតុ — ដូច្នេះគ្រប់កម្មវិធីដែលស្គ្រីបចាប់ផ្ដើមបើកបរ ឥឡូវបង្ហាញ <i>press A to start</i>
  ហើយរង់ចាំ។ វាជាគំនិតដូចប៊ូតុងឈប់ក្នុងមេរៀននេះ មួយជំហានមុន៖ មនុស្សសម្រេចថាពេលណាចាប់ផ្ដើម ហើយមនុស្សសម្រេចថាពេលណាបញ្ចប់។
- សម្អាតតំបន់ឥដ្ឋ។ រង្វិលជុំ forever លើតុ គឺជារូបយន្តលើឥដ្ឋសាមសិបវិនាទីក្រោយមក។
- ព្រមព្រៀងកម្រិតសំឡេងជាមុន មុនរូបយន្តដប់ពីររកឃើញឧបករណ៍បំពងសំឡេង។
- បើប៊ូតុងឈប់របស់ក្រុមណាមិនធ្វើអ្វីទេ ការឈប់របស់គេស្ថិតនៅ<i>ក្នុង</i> រង្វិលជុំ forever ជំនួសឲ្យនៅក្បែរវា
  — កំហុសដ៏មានប្រយោជន៍ដែលគួរទុកឲ្យពួកគេរកឃើញ។
result:
  scene: patrol
success:
- ការល្បាតដំណើរការដោយគ្មានខ្សែ ចាប់ផ្ដើមពី A ហើយមិនឈប់ដោយខ្លួនឯង
- ប៊ូតុង B បញ្ឈប់វាពាក់កណ្ដាលចលនា រាល់ដង
- ក្រុមអាចប្រាប់ថាពេលណាប្រើ forever និងពេលណាប្រើ repeat
check:
- do: A
  see: វាបើកជាការេដោយខ្លួនឯង — ៣០ ស.ម. បង្វិល បន្លឺសំឡេង ប្ដូរពណ៌ — ហើយបន្តទៅទៀត។
- do: B
  see: អ្វីៗឈប់ទាំងអស់ ពាក់កណ្ដាលចលនា។
parts:
- id: robot_wheel
- id: tape
  note: patrol area

guide:
- label: ឥដ្ឋ
  value: ទំនេរ ១ ម៉ែត្រ — វាបើកជាការេ ៣០ ស.ម.
