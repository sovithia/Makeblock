    \  cm  until done\n    else\n      turns left  90  ° until done"
tips:
- សម្អាតបញ្ជីមុនកត់ត្រា បើមិនដូច្នេះទេ ផ្លូវទីពីរត្រូវបានផ្សាភ្ជាប់ទៅផ្លូវទីមួយ — កំហុសដែលមើលទៅដូចមន្តអាគម
  រហូតដល់ពួកគេរកឃើញ។
- ចាប់ផ្ដើមរាប់ពី 1 មិនមែន 0។ Item 0 នៃបញ្ជីមិនមែនជារបស់ទេ។
- ការខុសពេលចាក់ឡើងវិញជារឿងពិត ហើយវាមិនមែនកំហុសក្នុងកូដរបស់ពួកគេទេ — វាជាគម្លាតបញ្ជា-ធៀប-ជាក់ស្តែងដដែលពីជំហានទី
  ២ ឥឡូវជាន់គ្នាដប់ដង។
result:
  scene: path
success:
- ផ្លូវយ៉ាងតិចដប់ចលនា កត់ត្រា និងចាក់ឡើងវិញបាន
- ប្រវែងបញ្ជីឃើញលើអេក្រង់ពេលកត់ត្រា
- ក្រុមអាចពន្យល់ថា i កំពុងធ្វើអ្វីក្នុងរង្វិលជុំចាក់ឡើងវិញ
check:
