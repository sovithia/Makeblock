n: 18
stage: D
stage_title: រូបយន្តមានរបៀបរៀបរយ
kind: step
title: ដាក់ឈ្មោះឲ្យអាកប្បកិរិយា
concept: អនុគមន៍ — My Blocks
hours: 2
project: G7-D-organised
goal: កម្មវិធីរបស់ក្រុមសាងសង់ពីប្លុកដែលពួកគេដាក់ឈ្មោះខ្លួនឯង ហើយក្រុមផ្សេងអាចអានវាបាន។
build: ប្លុករបស់អ្នកផ្ទាល់៖ celebrate, scan, park។
builds_on:
- ជំហានទី ១១–១៤ · ការចងចាំ
- ជំហានទី ៣ · រង្វិលជុំ
teach:
- រកក្រុមប្លុកដែលអ្នកបានចម្លងលើសពីម្ដង។ នោះជា <b>អនុគមន៍</b> ដែលកំពុងរង់ចាំកើត។ <b>Make a Block</b>
  ដាក់ឈ្មោះឲ្យវា ដាក់ប្លុកចូលក្នុង ហើយឥឡូវកម្មវិធីនិយាយថា <b>celebrate</b> ជំនួសឲ្យប្លុកប្រាំបួន — ហើយការប្ដូរការអបអរមានន័យថាប្ដូរវានៅកន្លែងតែមួយ
  ជំនួសឲ្យបី។
- ព្រំដែនមួយដែលគួរនិយាយត្រង់ៗ ជាជាងទុកឲ្យពួកគេរកឃើញជាការខកចិត្ត៖ ប្លុកទាំងនេះជា <b>បែបបទ មិនមែនចម្លើយ</b>។
  គ្មាន "return" ទេ។ ប្លុកមួយមិនអាចប្រគល់តម្លៃមកវិញបានទេ។ បើ <b>scan</b> ត្រូវរាយការណ៍ថាតើវារកឃើញអ្វីមួយឬអត់
  វាកំណត់ <b>អថេរ</b> ហើយអ្នកហៅអានវា។ នោះជាលំនាំពិត មិនមែនផ្លូវវាងទេ។
guide:
- label: បង្កើត
  value: My Blocks → Make a Block
- label: ដាក់ឈ្មោះ
  value: អ្វីដែលវាធ្វើ មិនមែនរបៀបដែលវាធ្វើ
- label: គ្មាន return
  value: ប្រគល់ចម្លើយតាមរយៈអថេរ
- label: ឥដ្ឋ
  value: រង្វង់ទំនេរប្រហែល ៦០ ស.ម. — វាបង្វិល
steps:
- time: 15′
  text: រំកិលកម្មវិធីរបស់អ្នក ហើយរកប្លុកដែលអ្នកបានចម្លង។ គូររង្វង់ជុំវិញពួកវាលើក្រដាស។ ទាំងនោះជាអនុគមន៍ពីរដំបូងរបស់អ្នក។
  expect: រង្វង់លើក្រដាសជុំវិញប្លុកដែលអ្នកបានចម្លង។ រង្វង់ទាំងនោះជាអនុគមន៍ពីរដំបូងរបស់អ្នក។
- time: 25′
  text: កំណត់ <b>celebrate</b> ហើយហៅវាពីកន្លែងបីខុសគ្នា។ រួចប្ដូរការអបអរម្ដង ហើយមើលទាំងបីប្ដូរ។
  expect: ការអបអរតែមួយហៅពីបីកន្លែង — ប្ដូរវាម្ដង ហើយទាំងបីប្ដូរជាមួយគ្នា។
- time: 25′
  text: កំណត់ <b>scan</b> — បង្វិលពេញជុំដើម្បីរកអ្វីមួយ។ រកឃើញថាវាមិនអាចប្រាប់អ្នកពីអ្វីដែលវារកឃើញទេ
    ហើយប្រើអថេរ។
  expect: ប្លុក scan ដែលបង្វិលពេញជុំ និងអថេរមួយកាន់អ្វីដែលវារកឃើញ ព្រោះប្លុកតែឯងប្រាប់អ្នកមិនបានទេ។
- time: 20′
  text: ប្ដូរឈ្មោះប្លុកដែលដាក់ឈ្មោះអាក្រក់បំផុតទៅជាអ្វីមួយដែលប្រាប់ថាវាធ្វើអ្វី។ អានកម្មវិធីមេឮៗ; វាគួរតែស្តាប់ទៅដូចប្រយោគ។
  expect: កម្មវិធីមេអានឮៗ ស្ដាប់ទៅដូចប្រយោគ ជាជាងបញ្ជីនៃការកំណត់។
- time: 20′
  text: ប្ដូរកម្មវិធីជាមួយក្រុមផ្សេង ហើយអានរបស់គេដោយមិនសួរសំណួរ។ អ្វីដែលអ្នកមិនអាចតាមបាន គឺជាបញ្ហាឈ្មោះ។
  expect: កម្មវិធីក្រុមផ្សេងអានតាមបានដោយមិនសួរគេសោះ។ អ្វីដែលអ្នកតាមមិនបាន ជាបញ្ហាឈ្មោះ មិនមែនបញ្ហាអ្នកទេ។
- time: 10′
  text: កត់ត្រាឈ្មោះប្លុករបស់អ្នក និងអ្វីដែលនីមួយៗធ្វើ មួយជួរម្នាក់។ ជំហានទី ២៣ ត្រូវការវា។
  expect: ឈ្មោះប្លុករបស់អ្នកក្នុងកំណត់ហេតុ មួយបន្ទាត់ក្នុងមួយ។ ជំហានទី ២៣ សាងសង់បេសកកម្មពីឈ្មោះទាំងនេះ
    — មិនសរសេរ គឺមិនមាន។
code:
  lang: blocks
  source: "define  celebrate\n  LED all displays R 0 G 255 B 0\n  play  hi\n  turns right  360  ° until\
    \ done\n  turn off LED  all\n\ndefine  scan\n  set  found  to 0\n  repeat 4\n    turns right  90\
    \  ° until done\n    if  (ultrasonic 2 1 distance to an object (cm)) < 30  then\n      set  found\
    \  to 1\n\nwhen button A pressed\n  scan\n  if  (found) = 1  then\n    celebrate"
tips:
- ដាក់ឈ្មោះប្លុកតាមអ្វីដែលពួកវាធ្វើ មិនមែនរបៀបដែលពួកវាធ្វើទេ។ <b>celebrate</b> រស់រានពីការសរសេរឡើងវិញ;
  <b>spin_and_beep</b> មិនរស់ទេ។
- ព្រំដែនគ្មាន return ចាប់អ្នកគ្រប់គ្នា។ បង្រៀនលំនាំអថេរម្ដង ឲ្យបានត្រឹមត្រូវ ហើយវានឹងត្រូវប្រើឡើងវិញក្នុងជំហានទី
  ១៧–២៣។
- ក្រុមដែលកម្មវិធីមេឥឡូវវែងតែប្រាំប្លុក បានយល់ចំណុចទាំងមូល។ បង្ហាញវាដល់ថ្នាក់។
result:
  scene: myblock
success:
- ប្លុកផ្ទាល់ខ្លួនយ៉ាងតិចពីរ ប្រើលើសពីម្ដងម្នាក់
- មួយក្នុងចំណោមពួកវារាយការណ៍លទ្ធផលតាមរយៈអថេរ
- ក្រុមផ្សេងបានអានកម្មវិធីមេ ដោយមិនចាំបាច់ពន្យល់
check:
- do: A
  see: It spins to look around, and dances if it finds something.
