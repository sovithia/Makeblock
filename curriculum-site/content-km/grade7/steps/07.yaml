n: 7
stage: A
stage_title: រូបយន្តស្តាប់បង្គាប់
kind: checkpoint
title: ចំណុចត្រួតពិនិត្យទី ១ — លំដាប់ ព្រឹត្តិការណ៍ រង្វិលជុំ
concept: ច្រកតាមទាន់
hours: 1
project: G7-A-obeys
goal: សិស្សគ្រប់រូបអាចចាប់ផ្ដើមកម្មវិធីបីរបៀប រៀបលំដាប់សេចក្ដីណែនាំដោយចេតនា និងប្រើរង្វិលជុំ — មុនពេលនរណាម្នាក់ឈានទៅដំណាក់កាល
  B។
build: គ្មានអ្វីថ្មីទេ។ ថ្នាក់ទាំងមូលមកដល់កន្លែងតែមួយ។
builds_on:
- ជំហានទី ១–៤
teach:
- '<b>ម៉ោងបម្រុង</b> មានផ្ដល់ជូននៅទីនេះ ហើយចេតនាមិនដាក់ក្នុងតារាងម៉ោងខាងលើទេ — បន្ថែមវាតែបើថ្នាក់មិនស្មើគ្នា។ ម៉ោងដែលបានប្រកាស គឺជាអ្វីដែលវគ្គសិក្សាត្រូវការ ពេលគ្មាននរណាត្រូវតាមទាន់។ បើថ្នាក់ស្មើគ្នា ចំណាយវាលើការពង្រីក៖ កម្មវិធីមួយដែលលេខតែមួយប្ដូររូបរាង ល្បឿន និងពណ៌ក្នុងពេលតែមួយ។'
- នេះជា <b>ច្រក</b> មិនមែនការប្រឡងទេ។ គ្មាននរណាឈានទៅមុខ រហូតដល់ថ្នាក់ស្មើគ្នា ព្រោះដំណាក់កាល B សាងសង់ដោយផ្ទាល់លើគំនិតទាំងបី
  ហើយសិស្សដែលមិនរឹងមាំលើរង្វិលជុំ នឹងវង្វេងក្នុងរយៈពេលពីរជំហាន។
- ដំណើរការវាជាបញ្ហាប្រកួតបីដោយដៃ មិនមែនក្រដាសសរសេរទេ។ សិស្សដែលឆ្លងទាំងបីក្លាយជា <b>គ្រូបង្គោល</b>
  — ហើយការបង្គោលមិនមែនធ្វើជំនួសពួកគេទេ៖ ដៃចេញពីរូបយន្តក្រុមផ្សេង សួរតែសំណួរ។ សិស្សដែលអាចនាំអ្នកដទៃទៅដល់
  យល់ច្បាស់ជាងសិស្សដែលគ្រាន់តែបញ្ចប់មុនគេ។
guide:
- label: ឆ្លង
  value: ទាំងបីបញ្ហា បង្ហាញឲ្យឃើញ
- label: គ្រូបង្គោល
  value: ដៃចេញ សួរតែសំណួរ
- label: ម៉ោងបម្រុង
  value: +១ ម៉ោង — តែបើថ្នាក់ត្រូវការ មិនរាប់ក្នុងម៉ោងវគ្គសិក្សា
steps:
- time: 10′
  text: ពន្យល់ច្រក និងច្បាប់បង្គោល។ គ្មាននរណាយឺតយ៉ាវទេ; ថ្នាក់ផ្លាស់ទីជាមួយគ្នា។
  expect: គ្រប់គ្នាដឹងថាច្រកនេះមានសម្រាប់អ្វី និងថាការបង្គោលមានន័យថាសួរសំណួរ មិនមែនប្រើដៃទេ។
- time: 30′
  text: បញ្ហាទាំងបី តាមលំដាប់ណាក៏បាន បង្ហាញដល់គ្រូ ឬដល់គ្រូបង្គោល៖ <b>(១)</b> ធ្វើឲ្យរូបយន្តធ្វើរបស់បីតាមលំដាប់ដែលអ្នកជ្រើស
    រួចប្ដូរពីរ ហើយទាយអ្វីដែលនឹងផ្លាស់ប្ដូរ។ <b>(២)</b> ចាប់ផ្ដើមកម្មវិធីតែមួយបីរបៀបខុសគ្នា — បើកភ្លើង
    button A, button B។ <b>(៣)</b> គូររូបរាងដែលគ្រូប្រាប់ ដោយប្រើរង្វិលជុំ ក្នុងការសាកល្បងលើកទីមួយ។
  expect: បញ្ហាបីបង្ហាញលើរូបយន្តពិត — លំដាប់ ការចាប់ផ្ដើមបីរបៀប និងរូបរាងដែលគ្រូប្រាប់ គូរដោយរង្វិលជុំក្នុងលើកទីមួយ។
- time: 20′
  text: ផ្គូផ្គង៖ អ្នកគ្រប់គ្នាដែលឆ្លងទាំងបី យកសិស្សម្នាក់ដែលមិនទាន់ឆ្លង។ ដៃចេញពីរូបយន្ត សួរតែសំណួរ។
  expect: គ្មាននរណាត្រូវបោះបង់៖ សិស្សគ្រប់រូបដែលឆ្លងទាំងបី អង្គុយជាមួយសិស្សម្នាក់ដែលមិនទាន់ឆ្លង។
blocks:
- Events
- Control
- mBot2 Chassis
tips:
- ទប់ទល់នឹងការទុកឲ្យក្រុមលឿនរត់ទៅមុខចូលដំណាក់កាល B។ ច្រកដំណើរការតែពេលវារឹងមាំ។
- បើសិស្សលើសមួយភាគបីជាប់គាំងលើរឿងតែមួយ នោះជាបញ្ហាបង្រៀន មិនមែនបញ្ហាសិស្ស — បង្រៀនឡើងវិញដល់អ្នកគ្រប់គ្នា
  ជំនួសឲ្យការផ្គូផ្គងជុំវិញវា។
- សរសេរថាអ្នកណាបង្គោលអ្នកណា។ លើសពីចំណុចត្រួតពិនិត្យបួន លំនាំនោះប្រាប់អ្នកច្រើនអំពីថ្នាក់។
result:
  scene: healthcheck
  params:
    checks: [ordered sequence, three start events, shape built with a loop]
