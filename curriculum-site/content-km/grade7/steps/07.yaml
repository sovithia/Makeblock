success:
- សិស្សគ្រប់រូបបានបង្ហាញបញ្ហាទាំងបី
- សិស្សគ្រប់រូបដែលយឺតយ៉ាវ ត្រូវបានបង្គោលដោយមិត្តរួមថ្នាក់ មិនមែនសង្គ្រោះដោយមនុស្សពេញវ័យ
- ថ្នាក់ចាប់ផ្ដើមដំណាក់កាល B ជាមួយគ្នា
