n: 5
stage: A
stage_title: រូបយន្តស្តាប់បង្គាប់
kind: step
title: ឈប់ចម្លងប្លុក
concept: រង្វិលជុំ — repeat
hours: 2
project: G7-A-obeys
goal: រូបយន្តគូររាល់រូបរាងបិទជិតដែលគ្រូប្រាប់ ដោយប្រើប្លុក repeat តែមួយ ជាលើកដំបូង។
build: ម៉ាស៊ីនរូបរាង៖ ប្ដូរលេខពីរ បានរាល់ពហុកោណ។
builds_on:
- ជំហានទី ២ · វាបើកបររយៈចម្ងាយដែលវាស់បាន
teach:
- សាងសង់រូបការ៉េតាមរបៀបវែងជាមុនសិន — បើកបរ បង្វិល បើកបរ បង្វិល ប្រាំបីប្លុក — ព្រោះការឈឺចាប់នៃការអូសប្លុកទីប្រាំបី
  គឺជាហេតុផលសម្រាប់អ្វីដែលមកបន្ទាប់។ បន្ទាប់មកជំនួសទាំងប្រាំបីដោយ <b>repeat 4</b> រុំជុំវិញពីរ។ អាកប្បកិរិយាដូចគ្នា
  កូដតិចជាង ហើយកន្លែងតែមួយដើម្បីកែ។
- ការបង្វិលគឺជាមុំ <b>ខាងក្រៅ</b> មិនមែនខាងក្នុងទេ។ ដើរវា៖ នៅជ្រុងនីមួយៗនៃការ៉េ អ្នកបង្វិល 90° ហើយបន្ទាប់ពីបួនជ្រុង
  អ្នកបានបង្វិលពេញមួយជុំ — 360°។ ដូច្នេះសម្រាប់រូបរាងបិទជិតណាមួយ ការបង្វិលនីមួយៗគឺ <b>360 ÷ ចំនួនជ្រុង</b>។
  ទុកឲ្យក្រុមសាកល្បង 60° សម្រាប់ត្រីកោណជាមុន ហើយមើលវាវិលជាគួច; ការបរាជ័យបង្រៀនច្បាប់លឿនជាងច្បាប់ខ្លួនឯង។
guide:
- label: សាកល្បង
  value: joystick up → draw the polygon
- label: ការ៉េ
  value: repeat 4 · បង្វិល 90°
- label: ត្រីកោណ
  value: repeat 3 · បង្វិល 120° (មិនមែន 60°)
- label: ច្បាប់
  value: ការបង្វិល = 360 ÷ ចំនួនជ្រុង
- label: ឥដ្ឋ
  value: ទំនេរ ១ ម៉ែត្រ — រូបរាងមានជ្រុង ៣០ ស.ម.
steps:
- time: 10′
  text: សាងសង់ការ៉េដោយគ្មានរង្វិលជុំ។ រាប់ប្លុក។ ត្អូញត្អែរ។
  expect: ការេគូរដោយប្លុកប្រាំបី និងថ្នាក់មួយដែលធុញនឹងការចម្លងវា។
- time: 20′
  text: សាងសង់ឡើងវិញដោយ repeat 4។ បញ្ជាក់ថាអាកប្បកិរិយាដូចគ្នា ដោយដំណើរការទាំងពីរហើយមើល។
  expect: ការេដដែលពីប្លុកពីរក្នុងរង្វិលជុំ។ ដំណើរការទាំងពីរ៖ អ្នកមើលមិនដឹងថាមួយណាជាមួយណាទេ។
- time: 25′
  text: ត្រីកោណ។ ទាយមុំបង្វិលជាមុន ហើយសរសេរវាចុះ។ បើអ្នកសរសេរ 60 ដំណើរការវាចុះ — គួចនោះគួរតែឃើញ។
  expect: ការទាយមុំបង្វិលរបស់ត្រីកោណសរសេរទុកមុនដំណើរការ — រួចទើបដឹងការពិត។
- time: 25′
  text: ពហុកោណណាមួយ៖ ដាក់ការចែកចូលក្នុងប្លុកខ្លួនឯង ដើម្បីឲ្យកម្មវិធីតែមួយគូរបញ្ចកោណ ឆកោណ អដ្ឋកោណ ដោយប្ដូរលេខតែមួយ។
  expect: កម្មវិធីតែមួយដែលគូរប៉ង់តាហ្គោន ហិចសាហ្គោន ឬអុកតាហ្គោន ពេលអ្នកប្ដូរលេខតែមួយ។
- time: 15′
  text: ការប្រកួតបិទជិត៖ រូបរាងដែលចំណុចបញ្ចប់នៅជិតចំណុចចាប់ផ្ដើមបំផុតឈ្នះ។ វាស់គម្លាតដោយបន្ទាត់។
  expect: គម្លាតវាស់រវាងកន្លែងរូបរាងចាប់ផ្ដើម និងកន្លែងវាបញ្ចប់ ជាមិល្លីម៉ែត្រ។
- time: 5′
  text: កត់ត្រាច្បាប់ជាពាក្យរបស់អ្នកផ្ទាល់ ជាមួយរូបគំនូរ។ ជំហានទី ១៩ ត្រូវការវា។
  expect: ច្បាប់សរសេរជាពាក្យរបស់អ្នកផ្ទាល់ ជាមួយរូបគូរនៅក្បែរ។
code:
  lang: blocks
  source: "when CyberPi starts up\n  set print size to  big\n  print  Team Rocket  and move to a newline\n\
    \  LED all displays R 0 G 128 B 255\n  play LED animation  rainbow  until done\n\nwhen button A\
    \ pressed\n  play recording\n  ultrasonic 2 1 displays emotion  happy\n\nwhen button B pressed\n\
    \  clear screen\n  print  bye!\n  turn off LED all\n\nwhen joystick  middle pressed\n  reset encoder\
    \ motor  (1) EM1  rotated angle\n  moves forward  100  cm  until done\n  show label 1  join  robot\
    \ says:  (encoder motor (1) EM1 rotated angle (°))  at x: 0 y: 0  by small pixel\n\nwhen joystick\
    \  pulled↑\n  set  sides  to  5\n  repeat  (sides)\n    moves forward  30  cm  until done\n    turns\
    \ right  (360 / (sides))  ° until done"
tips:
- ការបង្វិលយឺតបិទជិតបានល្អជាងការបង្វិលលឿន។ ក្រុមដែលបន្ថយល្បឿននឹងឈ្នះក្រុមដែលមិនបន្ថយ ហើយការកត់សម្គាល់រឿងនោះគឺពាក់កណ្ដាលនៃមេរៀន។
- ក្រុមដែលឈោងទៅរកអថេរនៅទីនេះ បានបង្កើតជំហានទី ១១ មុនកាលកំណត់។ ទុកឲ្យពួកគេធ្វើ ហើយប្រាប់ថាដូច្នេះ។
- 60° សម្រាប់ត្រីកោណ គឺជាចម្លើយខុសដែលមានផលិតភាពបំផុតក្នុងវគ្គនេះ។ កុំរារាំងវា។
result:
  scene: repeat
success:
- ការ៉េដំណើរការពីប្លុក repeat ដោយអាកប្បកិរិយាមិនប្រែប្រួល
- ត្រីកោណបង្វិល 120° ដែលទាញចេញដោយខ្លួនឯង មិនមែនប្រាប់
- រូបរាងដែលក្រុមមិនធ្លាប់សាកល្បង បិទជិតក្នុងការសាកល្បងលើកទីមួយ
