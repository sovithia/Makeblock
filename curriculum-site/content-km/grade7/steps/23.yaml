n: 23
stage: E
stage_title: បេសកកម្ម
kind: step
title: រចនា Rescue Run
concept: ការផ្គុំអ្វីដែលអ្នកមានរួច
hours: 1
project: G7-E-mission
goal: ផែនការចុះហត្ថលេខាសម្រាប់បេសកកម្មពេញលេញ ដែលរាល់ប្រអប់ដាក់ឈ្មោះប្លុកដែលក្រុមបានសាងសង់រួច។
build: ផែនការលើក្រដាស និងគ្មានអ្វីផ្សេង។
builds_on:
- ជំហានទី ១៦–១៩ · ប្លុក និងរបៀបរបស់អ្នក
teach:
- បេសកកម្មពេញលេញ៖ <b>ដើរតាមខ្សែ → ជួបឧបសគ្គដែលអង្គុយលើវា → វាងជុំវិញហើយរកខ្សែឃើញវិញ → ឈប់ក្នុងតំបន់ក្រហម
  → អបអរ។</b> រាល់មួយក្នុងចំណោមនោះមានជាប្លុកដែលអ្នកបានសរសេររួច លើកលែងតែផ្លូវជុំវិញឧបសគ្គ។ ថ្ងៃនេះជា
  <b>ការផ្គុំ</b> ដែលជាអ្វីដែលវិស្វកម្មពិតភាគច្រើនជា។
- គ្មានប្លុកថ្ងៃនេះទេ ដោយចេតនា។ គូររបៀប និងព្រួញ ហើយនៅជាប់រាល់ប្រអប់ សរសេរឈ្មោះប្លុកដែលនឹងដំណើរការនៅទីនោះ។
  ប្រអប់ដែលគ្មានប្លុកនៅពីក្រោយ គឺជាប្រអប់ដែលនឹងមិនមាននៅថ្ងៃប្រកួតទេ — រកពួកវាឥឡូវនេះ ខណៈពេលការរកឃើញនៅឥតគិតថ្លៃ។
guide:
- label: បេសកកម្ម
  value: ដើរតាម → វាង → រកឃើញវិញ → ឈប់ក្នុងតំបន់ → អបអរ
- label: វិន័យ
  value: រាល់ប្រអប់ដាក់ឈ្មោះប្លុកដែលមានស្រាប់
- label: ថ្មីថ្ងៃនេះ
  value: តែផ្លូវជុំវិញឧបសគ្គប៉ុណ្ណោះ
steps:
- time: 10′
  text: សេចក្ដីសង្ខេបបេសកកម្ម និងសន្លឹកពិន្ទុ។ ដើរជុំវិញកន្លែងសាកល្បងជាថ្នាក់ ដើម្បីឲ្យអ្នកគ្រប់គ្នាបានឃើញវា។
  expect: ថ្នាក់ទាំងមូលបានដើរលើវគ្គពិត និងបានអានសន្លឹកដាក់ពិន្ទុ។
- time: 20′
  text: បំបែក៖ រាយដំណាក់កាល ហើយនៅជាប់នីមួយៗសរសេរប្លុកដែលអ្នកមានរួច។ គូររង្វង់ជុំវិញអ្វីដែលគ្មានប្លុកនៅពីក្រោយ។
  expect: បញ្ជីដំណាក់កាលបេសកកម្ម មានប្លុកដែលអ្នកមានស្រាប់សរសេរក្បែរនីមួយៗ — និងរង្វង់ជុំវិញអ្វីដែលនៅគ្មានប្លុក។
- time: 20′
  text: គូរដ្យាក្រាមរបៀបជាមួយព្រួញ រួមទាំងអ្វីដែលកើតឡើងពេលដំណាក់កាលមួយបរាជ័យ។
  expect: ដ្យាក្រាមរបៀបមានព្រួញ រួមទាំងអ្វីដែលរូបយន្តធ្វើពេលដំណាក់កាលមួយបរាជ័យ។
- time: 10′
  text: ការចុះហត្ថលេខា៖ គ្រូសួរសំណួរ "បើ…" ពីរក្នុងមួយក្រុម។ ការឆ្លើយមិនច្បាស់ ផែនការត្រូវបញ្ជូនត្រឡប់វិញ។
  expect: សំណួរ «បើ» ពីរឆ្លើយក្នុងមួយក្រុមដោយមិនរេរា។ ចម្លើយស្រពិចស្រពិលបញ្ជូនផែនការត្រឡប់វិញ។
blocks:
- My Blocks
- Variables
tips:
- បដិសេធប្រអប់ដូចជា "ធ្វើការវាង"។ រាល់ប្រអប់ត្រូវដាក់ឈ្មោះប្លុកដែលមាន ឬត្រូវសម្គាល់ច្បាស់ជារបស់ថ្មីតែមួយ។
- ឧបសគ្គអង្គុយ <b>លើ</b> ខ្សែ — ក្រុមត្រូវដឹងថាការវាងមានន័យថាចាកចេញពីខ្សែ ហើយត្រូវរកវាឃើញវិញ។
- សួរក្រុមនីមួយៗថាដំណាក់កាលណាដែលពួកគេគិតថានឹងបរាជ័យច្រើនបំផុត។ ជាធម្មតាពួកគេត្រឹមត្រូវ ហើយវាប្រាប់ពួកគេថាត្រូវចំណាយជំហានទី
  ២២ នៅត្រង់ណា។
result:
  scene: storyboard
success:
- រាល់ប្រអប់លើផែនការដាក់ឈ្មោះប្លុកដែលក្រុមបានសាងសង់រួច
- អាកប្បកិរិយាថ្មីតែមួយគត់ត្រូវបានកំណត់ និងព្រមព្រៀង
- សំណួរ "បើ…" ពីរឆ្លើយចេញពីដ្យាក្រាម គ្រូចុះហត្ថលេខា
