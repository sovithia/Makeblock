n: 14
stage: C
stage_title: រូបយន្តចងចាំ
kind: step
title: លេខតែមួយ រូបយន្តទាំងមូល
concept: អថេរជាការកំណត់
hours: 2
project: G7-C-remembers
goal: រាល់ល្បឿនក្នុងកម្មវិធីមកពីអថេរតែមួយ ដែលអាចលៃតម្រូវដោយ joystick ពេលរូបយន្តកំពុងដំណើរការ។
build: រូបយន្តដែលអ្នកអាចលៃតម្រូវឡើងវិញដោយមិនចាំបាច់ upload ម្ដងទៀត។
builds_on:
- ជំហានទី ១១ · អថេរ
teach:
- អថេរមិនមែនតែជាឧបករណ៍រាប់ទេ។ ដាក់ល្បឿនរបស់អ្នកក្នុងវា ហើយរាល់កន្លែងដែលធ្លាប់វាយ 40 ចូល ឥឡូវអាន <b>speed</b>។
  ប្ដូរវាម្ដង ហើយរូបយន្តទាំងមូលប្ដូរ។ ក្រុមដែលបានវាយ 40 ចូលក្នុងប្លុកប្រាំមួយ រួចចង់បាន 45 នឹងយល់វាភ្លាមៗ។
- បន្ទាប់មកធ្វើឲ្យវារស់៖ joystick រុញតម្លៃឡើងចុះ <i>ពេលរូបយន្តកំពុងបើកបរ</i> ដូច្នេះការលៃតម្រូវឈប់ជាវដ្តកែ-upload-មើល។
  ហើយ <b>ដាក់កម្រិត</b> វា — បើគ្មានព្រំដែន ល្បឿននឹងឡើងដល់ 300 ឬចុះជាអវិជ្ជមាន ហើយរូបយន្តធ្វើអ្វីមួយគួរឲ្យភ្ញាក់ផ្អើល។
guide:
- label: លៃតម្រូវរស់
  value: joystick ឡើង / ចុះ គ្មាន upload ថ្មី
- label: ដាក់កម្រិត
  value: if speed > 100 → set speed to 100
- label: បង្កក
  value: សរសេរលេខឈ្នះចុះ
- label: ឥដ្ឋ
  value: កន្លែងប្រហែល ១,៥ ម៉ែត្រ មានជញ្ជាំងជុំវិញ
steps:
- time: 15′
  text: រាប់ថាអ្នកបានវាយល្បឿនចូលក្នុងកម្មវិធីរបស់អ្នកប៉ុន្មានកន្លែង។ លេខនោះជាបញ្ហា។
  expect: លេខមួយសរសេរក្នុងកំណត់ហេតុ៖ តើអ្នកត្រូវកែប្លុកប៉ុន្មានកន្លែង ដើម្បីប្ដូរល្បឿនតែមួយ។
- time: 25′
  text: ជំនួសពួកវាទាំងអស់ដោយអថេរតែមួយ។ បញ្ជាក់ថាវាដំណើរការដោយប្ដូរតម្លៃចាប់ផ្ដើមម្ដង ហើយមើលអ្វីៗទាំងអស់ប្ដូរ។
  expect: អ្នកប្ដូរលេខចាប់ផ្ដើមតែមួយ ហើយគ្រប់ល្បឿនក្នុងកម្មវិធីប្ដូរតាមវា។
- time: 25′
  text: Joystick ឡើងចុះកែវារស់ពេលបើកបរ។ បង្ហាញតម្លៃលើអេក្រង់ ដើម្បីឲ្យអ្នកឃើញអ្វីដែលអ្នកកំពុងធ្វើ។
  expect: រូបយន្តលឿនឡើង និងយឺតចុះ ខណៈវានៅតែបើក ហើយលេខលើអេក្រង់ប្ដូរតាមពេលអ្នកច្រានឧបករណ៍បញ្ជា។ គ្មានការបញ្ជូនឡើងវិញទេ។
- time: 20′
  text: ដាក់កម្រិតវារវាង 10 និង 100។ រួចព្យាយាមបំបែកព្រំដែនដោយចេតនា — សង្កត់ joystick ចុះដប់វិនាទី។
  expect: ការសង្កត់ឧបករណ៍បញ្ជាចុះដប់វិនាទី មិនអាចរុញល្បឿនលើស ១០០ ឬក្រោម ១០ បានទេ។
- time: 20′
  text: លៃតម្រូវលើកន្លែងសាកល្បងពិតតាមអារម្មណ៍ រហូតដល់វាបើកបរបានល្អ រួចសរសេរលេខឈ្នះក្នុងកំណត់ហេតុ។ លេខនោះជារបស់អ្នកហើយ។
  expect: លេខសម្រួលមួយ សរសេរក្នុងកំណត់ហេតុ ដែលបើកលើវគ្គបានល្អ។
- time: 10′
  text: កត់ត្រា៖ កម្មវិធីណារបស់អ្នកនឹងងាយកែជាង បើវាប្រើអថេរបែបនេះ? ជំហានទី ២០ ត្រូវការវា។
  expect: ចម្លើយសរសេរដែលដាក់ឈ្មោះកម្មវិធីមុនមួយ ដែលអថេរនឹងធ្វើឲ្យវាងាយប្ដូរជាង។
code:
  lang: blocks
  source: "when CyberPi starts up\n  set  walls  to 0\n  set  speed  to 40\n  show label 1  press A\
    \ to start  at x: 0 y: 0  by small pixel\n  wait until  button  A  pressed?\n  forever\n    show\
    \ label 1  join  walls:   (walls)  at x: 0 y: 0  by small pixel\n    if  (ultrasonic 2 1 distance\
    \ to an object (cm)) < 15  then\n      change  walls  by 1\n      turns right  90  ° until done\n\
    \      wait until  (ultrasonic 2 1 distance to an object (cm)) > 25\n    else\n      moves forward\
    \  at (speed)  RPM\n\nwhen joystick  pulled↑\n  change  speed  by 5\n  if  (speed) > 100  then\n\
    \    set  speed  to 100\n\nwhen joystick  pulled↓\n  change  speed  by -5\n  if  (speed) < 10  then\n\
    \    set  speed  to 10"
tips:
- ការដាក់កម្រិតត្រូវការការពិនិត្យពីរ មិនមែនមួយ។ ក្រុមដែលដាក់កម្រិតតែខាងលើ នឹងបើកបរថយក្រោយនៅទីបំផុត ហើយច្រឡំយ៉ាងខ្លាំង។
- នេះជាកម្មវិធីដំបូងដែលរូបយន្តពិតជាងាយប្រើជាងកុំព្យូទ័រ។ និយាយដូច្នេះ — នោះជាមូលហេតុដែលអ្នកជំនាញសាងសង់ការកំណត់។
- រក្សាលេខដែលលៃតម្រូវរួច។ ជំហានទី ១៨ និងទី ២៣ ចង់បានវាទាំងពីរ។
result:
  scene: joystick
success:
- រាល់ល្បឿនក្នុងកម្មវិធីអានពីអថេរតែមួយ
- Joystick ប្ដូរវារស់ ដោយគ្មាន upload ថ្មី
- តម្លៃមិនអាចរុញចេញក្រៅព្រំដែនរបស់វា
check:
- do: up
  see: It speeds up.
- do: down
  see: It slows down.
- do: see
  see: The speed number on the screen changes with it.
parts:
