n: 25
stage: E
stage_title: បេសកកម្ម
kind: step
title: បង្កក ហើយដំណើរការវាពិត
concept: ភាពជឿជាក់ក្រោមសម្ពាធ
hours: 2
project: G7-E-mission
goal: ការសាកល្បងបានពិន្ទុពីរដងក្រោមលក្ខខណ្ឌព្រឹត្តិការណ៍ ដោយការកំណត់ត្រូវបានបង្កកមុនដងទីមួយ។
build: រូបយន្តដែលបញ្ចប់ — ហើយគម្រោងនេះជាការបង្ហាញ។
builds_on:
- ជំហានទី ២២ · បេសកកម្មដំណើរការ
teach:
- ភាពជឿជាក់មិនដូចគ្នានឹងការដំណើរការទេ។ ការសាកល្បងស្អាតមួយដងជាការបង្ហាញ; បីដងជាប់គ្នាជាម៉ាស៊ីន។ ចំណាយពាក់កណ្ដាលដំបូងនៃថ្ងៃនេះដំណើរការបេសកកម្មម្ដងហើយម្ដងទៀត
  ហើយរាប់ ហើយកែតែអ្វីដែលការរាប់ប្រាប់ឲ្យកែ។
- រួចមក <b>បង្កក</b>៖ សរសេររាល់ល្បឿន ព្រំដែន និងតម្លៃវាងចូលកំណត់ហេតុ រក្សាទុកគម្រោងក្រោមឈ្មោះចុងក្រោយ
  ហើយឈប់កែ។ ការកែច្នៃក្នុងនាទីមុនការសាកល្បងផ្លូវការ គឺជារបៀបដែលរូបយន្តល្អស្លាប់ ហើយច្បាប់នេះងាយរក្សាជាង
  បើវាត្រូវបានព្រមព្រៀងមុនពេលនរណាម្នាក់ភ័យ។
guide:
- label: បង្កក
  value: សរសេរលេខចុះ រួចឈប់កែ
- label: រក្សាទុកជា
  value: G7-rescue-run-<ក្រុម> — នេះជាការបង្ហាញ
- label: ពិន្ទុ
  value: តាមដំណាក់កាល ដើម្បីឲ្យការសាកល្បងផ្នែកនៅរាប់
steps:
- time: 30′
  text: ប្លុកភាពជឿជាក់៖ ដំណើរការបេសកកម្មប្រាំដង ហើយរាប់ជោគជ័យ។ កែតែអ្វីដែលការរាប់ចង្អុលទៅ។
  expect: ការសាកល្បងប្រាំដង ចំនួនជោគជ័យ និងការជួសជុលតែលើអ្វីដែលចំនួននោះចង្អុលបង្ហាញ។
- time: 15′
  text: បង្កក៖ រាល់លេខចូលកំណត់ហេតុ គម្រោងរក្សាទុកក្រោមឈ្មោះចុងក្រោយ។ គ្មានការកែក្រោយបន្ទាត់នេះទេ។
  expect: គ្រប់លេខក្នុងកំណត់ហេតុ និងគម្រោងរក្សាទុកក្រោមឈ្មោះចុងក្រោយ។ គ្មានការកែក្រោយបន្ទាត់នេះទេ។
- time: 40′
  text: ការសាកល្បងផ្លូវការ — ពីរដងក្នុងមួយក្រុម ពិន្ទុតាមដំណាក់កាល ជាមួយពេលជួសជុលរវាងដង។ ដងល្អបំផុតរាប់។
  expect: ការសាកល្បងផ្លូវការពីរដងក្នុងមួយក្រុម មានពេលជួសជុលរវាងគ្នា។ លើកល្អជាងគេរាប់។
- time: 25′
  text: ពីរនាទីក្នុងមួយក្រុម៖ អ្វីដំណើរការ អ្វីបរាជ័យ អ្វីដែលអ្នកនឹងធ្វើបន្ទាប់។ ក្រុមដែលរូបយន្តបរាជ័យ
    តែអាចពន្យល់ថាហេតុអ្វី ទទួលបានការទះដៃ។
  expect: ពីរនាទីក្នុងមួយក្រុមអំពីអ្វីដែលដំណើរការ អ្វីដែលបរាជ័យ និងអ្វីបន្ទាប់ — និងការទះដៃដល់ក្រុមដែលពន្យល់ការបរាជ័យបាន។
- time: 10′
  text: កំណត់ហេតុចុងក្រោយ៖ ពិន្ទុរបស់អ្នក និងរបស់មួយដែលអ្នកនឹងប្ដូរអំពីរបៀបធ្វើការ — មិនមែនអំពីលេខទេ។
  expect: កំណត់ហេតុចុងក្រោយមានពិន្ទុរបស់អ្នក និងរឿងមួយដែលអ្នកនឹងប្ដូរអំពីរបៀបធ្វើការ មិនមែនអំពីលេខទេ។
blocks:
- My Blocks
- Variables
- Control
- Quad RGB Sensor
- Ultrasonic Sensor 2
tips:
- ដាក់ពិន្ទុតាមដំណាក់កាល មិនមែនតែជោគជ័យពេញលេញ។ រូបយន្តដែលវាងឧបសគ្គ តែខកតំបន់ បានពិន្ទុភាគច្រើនហើយក្រុមគួរតែមានអារម្មណ៍ដូច្នេះ។
- ក្រិតឡើងវិញលើឥដ្ឋពិតមុនការសាកល្បងផ្លូវការដំបូង ហើយកុំក្រិតម្ដងទៀតរវាងដង លុះត្រាតែពន្លឺប្ដូរ។
- ថតរូបក្ដារពិន្ទុ និងលេខដែលបង្កក។ ថ្នាក់ទី ៨ ចាប់ផ្ដើមដោយសួរថារូបយន្តនេះធ្វើអ្វីមិនបាន។
result:
  scene: rescue
success:
- ការសាកល្បងផ្លូវការពីរដងបានបញ្ចប់ និងបានពិន្ទុតាមដំណាក់កាល
- ការកំណត់ត្រូវបានបង្កកជាលាយលក្ខណ៍អក្សរ មុនដងទីមួយ
- សិស្សគ្រប់រូបអាចប្រាប់ថារូបយន្តខ្លួនធ្វើអ្វី និងហេតុអ្វីវាបរាជ័យត្រង់នោះ
