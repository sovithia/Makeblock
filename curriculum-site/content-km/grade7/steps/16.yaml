n: 16
stage: C
stage_title: រូបយន្តចងចាំ
kind: step
title: ការកែ និងការស្វែងរកផ្លូវ
concept: បញ្ជី៖ កែ និងស្វែងរក · break
hours: 2
project: G7-C-remembers
goal: ក្រុមអាចដកវិញ បិទភ្ជាប់ និងស្វែងរកផ្លូវដែលកត់ត្រា ដោយមិនចាំបាច់បើកបរឡើងវិញ។
build: ផ្លូវដែលអ្នកអាចកែដូចឯកសារ។
builds_on:
- ជំហានទី ១៣ · បញ្ជី
teach:
- ផ្លូវដែលកត់ត្រាគឺជាទិន្នន័យ ដូច្នេះវាអាច <b>កែ</b> បាន។ <b>delete n of</b> ដក, <b>insert … at n</b>
  ស៊កចូល, <b>replace item n</b> ប្ដូរចេញ។ ការដកវិញគឺគ្រាន់តែ <b>delete (length of route) of route</b>
  — ដករបស់អ្វីក៏ដោយដែលនៅចុង ដោយមិនចាំបាច់ដឹងថាបញ្ជីវែងប៉ុនណា។
- វាក៏អាច <b>ស្វែងរក</b> បានដែរ។ <b>route contains …?</b> ឆ្លើយថាបាទឬទេ។ ដើម្បីរក <i>កន្លែង</i> ដើរតាមវាដោយ
  count-with-i — ហើយពេលអ្នករកឃើញ <b>break</b> ចេញ។ គ្មានប្រយោជន៍ពិនិត្យរបស់សែសិបផ្សេងទៀតពេលអ្នកមានចម្លើយហើយ
  ហើយនោះជាទម្លាប់ដែលគួរបង្កើតតាំងពីដំបូង។
guide:
- label: សាកល្បង
  value: joystick middle undoes · button B searches
- label: ដកវិញ
  value: delete (length of route) of route
- label: ស្វែងរក
  value: 'contains …? · item # of … in …'
- label: ឈប់មុន
  value: break នៅក្នុងរង្វិលជុំ
- label: ឥដ្ឋ
  value: ទំនេរ ១,៥ ម៉ែត្រ ដើម្បីបើកផ្លូវ
steps:
- time: 15′
  text: កត់ត្រាផ្លូវមួយដែលមានកំហុសមួយដោយចេតនានៅកណ្ដាល។ កុំបើកបរឡើងវិញ — អ្នកនឹងកែទិន្នន័យ។
  expect: ផ្លូវថតមួយដែលមានចលនាខុសមួយនៅកណ្ដាល ទុកដោយចេតនា។ គ្មាននរណាបើកឡើងវិញទេ។
- time: 25′
  text: ដកចលនាចុងក្រោយវិញដោយ delete។ រួចដកបី។ កត់សម្គាល់ថាអ្នកមិនដែលត្រូវដឹងថាបញ្ជីវែងប៉ុនណាទេ។
  expect: ចលនាចុងក្រោយបាត់ រួចបីទៀតបាត់ — ហើយអ្នកមិនដែលចាំបាច់ដឹងថាបញ្ជីវែងប៉ុនណាទេ។
- time: 25′
  text: បិទភ្ជាប់កណ្ដាល៖ ជំនួសចលនាខុសដោយ replace ហើយស៊កចលនាដែលអ្នកភ្លេចដោយ insert។ ចាក់ឡើងវិញ ហើយពិនិត្យ។
  expect: ចលនាខុសត្រូវជំនួស ចលនាភ្លេចត្រូវដាក់វិញ ហើយការចាក់ឡើងវិញឥឡូវត្រូវនឹងអ្វីដែលអ្នកចង់បើក។
- time: 25′
  text: ស្វែងរកវា៖ តើផ្លូវនេះមានការបង្វិលឆ្វេងទេ? ការបង្វិលឆ្វេងដំបូងនៅឯណា? ប្រើ break ដើម្បីឲ្យរង្វិលជុំឈប់ពេលវារកឃើញមួយ។
  expect: រូបយន្តឆ្លើយថា «តើមានការបង្វិលឆ្វេងក្នុងនេះទេ ហើយមួយដំបូងនៅឯណា?» ដោយមិនដើរបញ្ជីដែលនៅសល់។
- time: 20′
  text: បញ្ជាក់ថា break កំពុងធ្វើអ្វីមួយ៖ បង្ហាញ i លើអេក្រង់ ហើយមើលរង្វិលជុំឈប់មុនកាលកំណត់ ជំនួសឲ្យការរត់ដល់ចប់។
  expect: i បង្ហាញលើអេក្រង់ ឈប់ពាក់កណ្ដាលជំនួសឲ្យរាប់ដល់ចប់ — ភស្តុតាងថា break ពិតជាបញ្ឈប់រង្វិលជុំ។
- time: 10′
  text: កត់ត្រាប្រតិបត្តិការបញ្ជីទាំងបួន និងប្រយោគមួយអំពីអ្វីដែលនីមួយៗសម្រាប់។
  expect: ប្រតិបត្តិការបញ្ជីបួនក្នុងកំណត់ហេតុ មួយឃ្លាក្នុងមួយ ប្រាប់ថាវាមានសម្រាប់អ្វី។
