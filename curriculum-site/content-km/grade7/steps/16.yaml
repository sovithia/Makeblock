tips:
- delete (length of) គឺជាការដកវិញ។ ក្រុមដែលវាយលេខចូល មិនទាន់យល់វាទេ — សួរពួកគេថាកើតអ្វីបន្ទាប់ពីដកវិញពីរដង។
- បើគ្មាន break រង្វិលជុំរាយការណ៍ការត្រូវគ្នា <i>ចុងក្រោយ</i> មិនមែនដំបូងទេ។ ទុកឲ្យក្រុមមួយប៉ះវាហើយរកមូលហេតុ។
- Insert រុញអ្វីៗទាំងអស់ខាងក្រោយវាទៅមុខ។ គូរបញ្ជីលើក្ដារ មុននិងក្រោយ។
result:
  scene: debug
success:
- ការដកវិញដំណើរការម្ដងហើយម្ដងទៀត ដោយមិនដឹងប្រវែងបញ្ជី
- ចលនាកណ្ដាលត្រូវបានបិទភ្ជាប់ដោយ replace ហើយការចាក់ឡើងវិញបញ្ជាក់វា
- ការស្វែងរករកឃើញការត្រូវគ្នាដំបូង ហើយឈប់នៅទីនោះ
check:
- do: mid
  see: The last move disappears off the end of the list.
- do: B
  see: It tells you where the first left turn is.
- do: see
  see: Undo with nothing recorded says nothing to undo. It does not crash.
