  lang: blocks
  source: "define  celebrate\n  LED all displays R 0 G 255 B 0\n  play  hi\n  turns right  360  ° until\
    \ done\n  turn off LED  all\n\ndefine  scan\n  set  found  to 0\n  repeat 4\n    turns right  90\
    \  ° until done\n    if  (ultrasonic 2 1 distance to an object (cm)) < 30  then\n      set  found\
    \  to 1\n\ndefine  turn_by (deg)\n  reset encoder motor  (1) EM1  rotated angle\n  encoder motor\
    \ EM1 rotates at 30 RPM, encoder motor EM2 rotates at -30 RPM\n  wait until  (encoder motor (1)\
    \ EM1 rotated angle (°)) > (deg)\n  stop encoder motor  all\n\ndefine  drive_square (size)\n  repeat\
    \ 4\n    moves forward  (size)  cm  until done\n    turn_by  90\n\nwhen button A pressed\n  scan\n\
    \  if  (found) = 1  then\n    celebrate\n\nwhen button B pressed\n  drive_square  30\n  drive_square\
    \  60"
tips:
- មុំ encoder បន្តរាប់ឡើង។ កំណត់វាឡើងវិញមុនការបង្វិល បើមិនដូច្នេះទេ ការបង្វិលទីពីរបញ្ចប់ភ្លាមៗ — កំហុសប្រចាំថ្ងៃ។
- របស់អ្នកនឹងហួសនៅដំបូង ព្រោះកង់បន្តផ្លាស់ទីបន្ទាប់ពីការពិនិត្យ។ នោះជាវិស្វកម្មពិត ហើយការបន្ថយល្បឿនជាការកែស្មោះត្រង់។
- ឧបករណ៍វាស់មុំឈ្នះមតិ។ តម្រូវឲ្យវាស់ការបង្វិលទាំងពីរ ជំនួសឲ្យការមើល។
result:
  scene: library
success:
- ប្លុកមួយមានធាតុចូលជាលេខ ប្រើជាមួយតម្លៃបីខុសគ្នា
- turn_by(90) វាស់ធៀបនឹងរបស់ដែលភ្ជាប់មក បីដងម្នាក់
- ប្លុកមួយទទួលធាតុចូលតក្ក ហើយប្រព្រឹត្តខុសគ្នាសម្រាប់ពិត និងមិនពិត
