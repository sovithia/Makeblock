n: 17
stage: C
stage_title: រូបយន្តចងចាំ
kind: checkpoint
title: ចំណុចត្រួតពិនិត្យទី ៣ — អថេរ បញ្ជី
concept: ច្រកតាមទាន់
hours: 1
project: G7-C-remembers
goal: សិស្សគ្រប់រូបអាចធ្វើឲ្យរូបយន្តចងចាំលេខមួយ និងសំណុំរបស់តាមលំដាប់ — មុនពេលដំណាក់កាល D សុំឲ្យពួកគេរៀបចំកម្មវិធី។
build: គ្មានអ្វីថ្មីទេ។ ថ្នាក់ទាំងមូលមកដល់កន្លែងតែមួយ។
builds_on:
- ជំហានទី ១១–១៤
teach:
- '<b>ម៉ោងបម្រុង</b> មានផ្ដល់ជូននៅទីនេះ ហើយចេតនាមិនដាក់ក្នុងតារាងម៉ោងខាងលើទេ — បន្ថែមវាតែបើថ្នាក់មិនស្មើគ្នា។ ម៉ោងដែលបានប្រកាស គឺជាអ្វីដែលវគ្គសិក្សាត្រូវការ ពេលគ្មាននរណាត្រូវតាមទាន់។ បើថ្នាក់ស្មើគ្នា ចំណាយវាលើការពង្រីក៖ គ្រូបង្គោលសាងសង់រូបយន្តដែលកត់ត្រាផ្លូវ រកការបង្វិលឆ្វេងដំបូងក្នុងវា ហើយចាក់ឡើងវិញតែផ្នែកបន្ទាប់ពីនោះ។'
- ដំណាក់កាល D និយាយអំពីការដាក់ឈ្មោះ និងរៀបចំអ្វីដែលរូបយន្តធ្វើរួចហើយ ហើយពាក់កណ្ដាលនៃអ្វីដែលវារៀបចំគឺការចងចាំ។
  សិស្សដែលមិនទាន់អាចធ្វើឲ្យការរាប់ដំណើរការត្រឹមត្រូវ នឹងមិនរីករាយនឹងការរុំវាក្នុងអនុគមន៍ទេ។
- ច្បាប់ដូចមុន៖ ដោយដៃ គ្រូបង្គោលដាក់ដៃចេញពីរូបយន្តអ្នកដទៃ ម៉ោងបម្រុងទៅកន្លែងដែលថ្នាក់ត្រូវការ។
guide:
- label: ឆ្លង
  value: ទាំងបីបញ្ហា បង្ហាញឲ្យឃើញ
- label: គ្រូបង្គោល
  value: ដៃចេញ សួរតែសំណួរ
- label: ម៉ោងបម្រុង
  value: +១ ម៉ោង — តែបើថ្នាក់ត្រូវការ មិនរាប់ក្នុងម៉ោងវគ្គសិក្សា
steps:
- time: 10′
  text: រៀបចំស្ថានីយបី។ រំលឹកអ្នកគ្រប់គ្នាថាច្រករឹងមាំ។
  expect: ស្ថានីយបីរួចរាល់ និងថ្នាក់ដែលដឹងថាច្រកនេះឈរជាប់រហូតដល់គ្រប់គ្នាឆ្លង។
- time: 30′
  text: បញ្ហាទាំងបី៖ <b>(១)</b> រាប់អ្វីមួយដែលរូបយន្តគ្មានប្លុកសាងសង់សម្រាប់វា ហើយបង្ហាញវាមានស្លាកលើអេក្រង់
    — រាប់ម្ដងក្នុងមួយព្រឹត្តិការណ៍ មិនមែនម្ដងក្នុងមួយរង្វិលជុំ។ <b>(២)</b> កត់ត្រាចលនាយ៉ាងតិចប្រាំចូលបញ្ជី
    ហើយចាក់ពួកវាឡើងវិញ។ <b>(៣)</b> ដករបស់ចុងក្រោយចេញពីបញ្ជី <i>ដោយមិន</i> ដឹងថាបញ្ជីវែងប៉ុនណា។
  expect: បញ្ហាបីបង្ហាញ៖ ការរាប់មានស្លាកនៃអ្វីដែលគ្មានប្លុកស្រាប់ ចលនាប្រាំថតនិងចាក់ឡើងវិញ និងការលុបធាតុចុងក្រោយដោយមិនដឹងប្រវែងបញ្ជី។
- time: 20′
  text: ផ្គូផ្គង៖ អ្នកគ្រប់គ្នាដែលឆ្លងទាំងបី បង្គោលអ្នកដែលមិនទាន់ឆ្លង។
  expect: គ្រប់គ្នាដែលឆ្លងទាំងបី កំពុងបង្គោលអ្នកដែលមិនទាន់ឆ្លង។
blocks:
- Variables
- Control
- Display
tips:
- បញ្ហាទី ១ បែងចែកការយល់ពីការចម្លង។ បើការរាប់របស់ពួកគេលោតម្ភៃ ពួកគេមិនទាន់ឆ្លងទេ ទោះផ្នែកផ្សេងមើលទៅល្អយ៉ាងណា។
- បញ្ហាទី ៣ បញ្ជាក់ថាពួកគេយល់ length-of ជាជាងទន្ទេញលេខ។
- បង្វិលគូបង្គោលពីចំណុចត្រួតពិនិត្យទី ២ — ការផ្គូផ្គងខុសគ្នាបង្ហាញចន្លោះខុសគ្នា។
result:
  scene: healthcheck
  params:
    checks: [one count per event, route stored and replayed, last list item removed]
    caption: every student clears all three memory challenges
success:
- សិស្សគ្រប់រូបបានបង្ហាញបញ្ហាទាំងបី
- ការរាប់គ្រប់មួយរាប់ម្ដងក្នុងមួយព្រឹត្តិការណ៍ មិនមែនម្ដងក្នុងមួយរង្វិលជុំ
- ថ្នាក់ចាប់ផ្ដើមដំណាក់កាល D ជាមួយគ្នា
