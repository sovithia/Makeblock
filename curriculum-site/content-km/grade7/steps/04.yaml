n: 4
stage: A
stage_title: រូបយន្តស្តាប់បង្គាប់
kind: step
title: បញ្ជា និងជាក់ស្តែង
concept: ចលនា · បញ្ជា ធៀបនឹងជាក់ស្តែង
hours: 2
project: G7-A-obeys
goal: រូបយន្តបើកបររយៈចម្ងាយដែលអ្នកបានស្នើ ហើយក្រុមអាចប្រាប់ — ដោយប្រើលេខ — ថាវាខុសប៉ុន្មាន និងហេតុអ្វី។
build: រូបយន្តដែលចតក្នុងយានដ្ឋានបិទដោយកាសែត ហើយបង្ហាញអ្វីដែលវាគិតថាវាបានធ្វើ។
builds_on:
- ជំហានទី ១ · វាចាប់ផ្ដើមដោយខ្លួនឯង
teach:
- <b>moves forward 100 cm until done</b> មិនទាយទេ។ ម៉ូទ័រគឺជាម៉ូទ័រ <b>encoder</b>៖ ពួកវារាប់ថាបានបង្វិលប៉ុន្មាន
  ហើយប្លុកឈប់ពេលការរាប់និយាយថា 100 cm។ រូបយន្តបានវាស់ខ្លួនឯងតាំងពីដើមមក។
- ដូច្នេះថ្ងៃនេះមានលេខបី មិនមែនមួយទេ៖ អ្វីដែលអ្នក <b>ស្នើ</b>, អ្វីដែល <b>បន្ទាត់</b> និយាយ, និងអ្វីដែល
  <b>រូបយន្តគិត</b> ថាវាបានធ្វើ។ ពេលពួកវាមិនត្រូវគ្នា — ហើយវានឹងមិនត្រូវគ្នា ដោយសារកង់រអិល កម្រិតថ្ម
  និងផ្ទៃឥដ្ឋ — គម្លាតនោះមិនមែនជាកំហុសទេ។ វាជាព័ត៌មាន ហើយរាល់ការសម្រេចចិត្តលៃតម្រូវពេញមួយឆ្នាំកើតចេញពីវា។
guide:
- label: សាកល្បង
  value: joystick middle → drive and compare
- label: កន្លែងសាកល្បង
  value: ខ្សែចាប់ផ្ដើម + យានដ្ឋាន ចម្ងាយ 100 cm
- label: វិន័យ
  value: ខ្សែចាប់ផ្ដើមតែមួយគ្រប់ដង — បិទវាដោយកាសែត
- label: កត់ត្រា
  value: ស្នើ / បន្ទាត់ / រូបយន្ត — បីដង
- label: ឥដ្ឋ
  value: ទំនេរ ១,៥ ម៉ែត្រ ត្រង់ មានខ្សែចាប់ផ្ដើម
steps:
- time: 10′
  text: បន្ថែមប្លុកបើកបរមួយទៅការស្វាគមន៍ពីម្សិលមិញ។ ដាក់រូបយន្តលើខ្សែចាប់ផ្ដើម ហើយបញ្ជូនវា 100 cm។
  expect: ច្រានឧបករណ៍បញ្ជា ហើយរូបយន្តចាកចេញពីខ្សែចាប់ផ្ដើម ឈប់ប្រហែល ១០០ ស.ម.។
- time: 25′
  text: បីដង កូដតែមួយ។ វាស់ម្ដងៗដោយបន្ទាត់ ហើយសរសេរទាំងបី — មិនមែនតែលេខល្អបំផុតទេ។ ពួកវានឹងខុសគ្នា ហើយនោះជាចំណុចសំខាន់។
  expect: លេខបីខុសគ្នាសរសេរទុក — ទាំងបី មិនមែនតែលេខល្អបំផុតទេ។
- time: 25′
  text: ប្ដូរអ្វីមួយ៖ ផ្ទៃឥដ្ឋផ្សេង ឬល្បឿនទាបជាង។ បីដងទៀត។ ការផ្លាស់ប្ដូរណាមានឥទ្ធិពលជាង?
  expect: សាកល្បងបីដងទៀតបន្ទាប់ពីប្ដូររឿងតែមួយ និងចម្លើយច្បាស់ថាការប្ដូរណាសំខាន់ជាង។
- time: 20′
  text: ដាក់ការរាប់របស់រូបយន្តលើអេក្រង់ ជាប់នឹងលេខបន្ទាត់របស់អ្នក។ ឥឡូវអ្នកអាចឃើញអ្វីដែលវាជឿ ធៀបនឹងអ្វីដែលពិត។
  expect: លេខពីរដែលអ្នកឃើញក្នុងពេលតែមួយ៖ អ្វីដែលរូបយន្តជឿថាវាបានធ្វើ និងអ្វីដែលបន្ទាត់វាស់និយាយ។
- time: 15′
  text: ទិន្នន័យថ្នាក់លើក្ដារ។ កូដតែមួយ ឥដ្ឋតែមួយ រូបយន្តខុសគ្នា — អ្នកណារអិលច្រើនជាងគេ? ជជែកគ្នាថាហេតុអ្វី។
  expect: លេខរបស់គ្រប់ក្រុមនៅលើក្ដារ និងការជជែកថាហេតុអ្វីរូបយន្តមួយរសាត់ជាងមួយទៀត។
- time: 5′
  text: កត់ត្រាតារាង។ វាជាឯកសារយោងរាល់ពេលរូបយន្តមានបញ្ហាក្នុងឆ្នាំនេះ។
  expect: តារាងចម្លងចូលកំណត់ហេតុ — ទំព័រដែលអ្នកនឹងត្រឡប់មកមើលរាល់ពេលរូបយន្តប្រព្រឹត្តខុស។
code:
  lang: blocks
  source: "when CyberPi starts up\n  set print size to  big\n  print  Team Rocket  and move to a newline\n\
    \  LED all displays R 0 G 128 B 255\n  play LED animation  rainbow  until done\n\nwhen button A\
    \ pressed\n  play recording\n  ultrasonic 2 1 displays emotion  happy\n\nwhen button B pressed\n\
    \  clear screen\n  print  bye!\n  turn off LED all\n\nwhen joystick  middle pressed\n  reset encoder\
    \ motor  (1) EM1  rotated angle\n  moves forward  100  cm  until done\n  show label 1  join  robot\
    \ says:  (encoder motor (1) EM1 rotated angle (°))  at x: 0 y: 0  by small pixel"
tips:
- បិទខ្សែចាប់ផ្ដើមដោយកាសែត។ "វាដំណើរការពេលមុន" ស្ទើរតែតែងតែជាកន្លែងចាប់ផ្ដើមខុសគ្នា។
- កត់កម្រិតថ្មជាប់នឹងរាល់ការសាកល្បង។ រូបយន្តដែលបើកបរពេញព្រឹកនឹងទៅមិនដល់ ហើយក្រុមដែលមិនកត់ត្រានឹងស្តីបន្ទោសកូដរបស់ខ្លួន។
- កុំឲ្យអ្នកណាយកមធ្យមភាគនៃបីដងជាលេខតែមួយនៅឡើយ។ ការខុសគ្នា <i>ជា</i> រកឃើញ។
result:
  scene: calibrate
  params:
    target: 100 cm
    caption: three measured runs compare commanded distance with actual distance
success:
- បីដងវាស់ដោយបន្ទាត់ ហើយកត់ត្រាទាំងបី
- ការរាប់របស់រូបយន្តនៅលើអេក្រង់ ជាប់នឹងចម្ងាយដែលវាស់បាន
- ក្រុមអាចប្រាប់មូលហេតុរូបវិទ្យាមួយ ដែលបញ្ជា និងជាក់ស្តែងខុសគ្នា
