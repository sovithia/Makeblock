n: 24
stage: E
stage_title: The mission
kind: step
title: Freeze, and show it
concept: Reliability under pressure
hours: 1
project: G8-E-mission
goal: Two scored attempts against the team's own criteria, with the configuration frozen beforehand
  and an honest account of what failed.
build: The finished Rover — and this project is the demo.
builds_on:
- Step 23 · the job runs
teach:
- Score each team against <b>their own signed criteria</b>, because the missions differ. That is not
  a compromise; it is how engineering is actually judged — against the spec you committed to, not against
  somebody else's.
- 'Freeze before the first attempt: every number written down, project saved under its final name, no
  edits after that line. Then present, and include one honest failure. The team whose robot broke but
  who can explain precisely why has learned more than the team whose robot worked and who do not know
  how.'
guide:
- label: Freeze
  value: numbers written, project saved, stop editing
- label: Save as
  value: G8-E-mission-<team> — this is the demo
- label: Score
  value: against your own criteria, by phase
steps:
- time: 10′
  text: 'Reliability check: run it twice and count. Fix only what the count points at.'
  expect: Two runs, a success count, and repairs aimed only at what that count points at.
- time: 10′
  text: Freeze. Numbers into the log, project saved under its final name, no edits after this line.
  expect: Every number in the log and the project saved under its final name. Nothing is edited after
    this line.
- time: 25′
  text: Official attempts — two per team, scored against that team's own criteria, with pit time between.
  expect: Two scored attempts per team against that team’s own criteria, with pit time between.
- time: 15′
  text: 'Presentations: what the job was, how it works, one honest failure and what it taught you.'
  expect: A presentation covering what the job was, how it works, and one honest failure and what it taught.
blocks:
- My Blocks
- Variables
- Control
- AI
- mBot2 Extension Port
tips:
- Score against each team's own criteria. Missions differ; fairness lives in the spec they signed in
  Step 22.
- The failure story is the part that shows engineering maturity. Weight it, and coach the last sentence
  so it ends on the lesson rather than the excuse.
- Photograph the frozen numbers and the scoreboard. Grade 9 opens by asking what this robot could not
  do.
result:
  scene: demo
success:
- Two official attempts scored against the team's own signed criteria
- Configuration frozen in writing before the first attempt
- Every team told one honest failure story and what it taught them
parts:
- id: robot_tank
- id: foam
- id: patches
- id: controller
- id: timer
  note: and a visible scoreboard
