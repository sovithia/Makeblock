tips:
- 'The Rover guide is the <b>printed booklet in the add-on box</b>, front to back. There is no digital
  version — the pages above are photographs of it. Build from the booklet in your hands; the photographs
  only show where you are in it. Do not use <code>mbot2_addons.pdf</code>: despite its cover title that
  file is the <b>Ranger</b> guide, a different robot, with the motor cables straight instead of crossed
  and the servos on S3/S4 instead of S1.'
- The mirror error is the classic one and it is nearly invisible until the robot drives. Insist on the
  cross-check — a builder cannot see their own mistake by this point.
- After tightening each hub screw, back the nut off 90° counter-clockwise. The wheel must spin freely
  or the motors strain all year.
- Track grain direction matters; both tracks point the same way. There is a magnified inset in the guide
  showing it.
