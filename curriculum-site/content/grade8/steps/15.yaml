n: 15
stage: C
stage_title: Interaction
kind: step
title: A run you can read
concept: List as a dataset
hours: 2
project: G8-C-connects
goal: A run is logged into a list and drawn back on the Rover's own screen as a chart.
build: A robot that shows you its own data.
builds_on:
- Step 7 · lists
- Step 9 · sensor values
teach:
- A list does not have to hold instructions. Fill one with a <b>reading per lap</b> — distance, time,
  battery — and you have a dataset the robot collected itself. <b>add</b> during the run, then read
  it back afterwards.
- And the CyberPi can draw it. <b>bar chart, add data</b> puts one bar up per value, so the whole run
  appears on the robot's screen with no tablet and no spreadsheet. Seeing your own data plotted by the
  machine that gathered it is a different experience from copying numbers into a table, and it is the
  moment measurement stops feeling like homework.
guide:
- label: Try it
  value: joystick ← times five laps · → draws them
- label: Collect
  value: add <reading> to run
- label: Draw
  value: bar chart, add data — one per item
- label: Ask
  value: what does the shape tell you?
- label: Floor
  value: a lap of about 2 m per side of the course
steps:
- time: 15′
  text: Decide what is worth measuring on a lap, and why. A number nobody will look at is not worth
    collecting.
  expect: A decision about what is worth measuring on a lap, with a reason. A number nobody will look
    at is not worth collecting.
- time: 25′
  text: Log one reading per lap into a list. Show the count on screen so you know it is working.
  use:
  - my:follow_lap
  - cyberpi_timer_reset
  - data_addtolist
  expect: One reading stored per lap, with the count on screen so you can see it working.
- time: 25′
  text: 'Read it back afterwards: walk the list and print each value with its position.'
  use:
  - control_for_new
  expect: Every value printed back with its position, after the run is over.
- time: 25′
  text: Draw it as a bar chart on the robot. Run five laps and look at the shape.
  use:
  - cyberpi_display_bar_chart_add_data
  expect: Five laps drawn as bars on the robot’s own screen, with a shape you can point at.
- time: 20′
  text: Change something real — battery lower, or a different floor — and compare the two charts. What
    changed, and can you explain it?
  expect: Two charts from two real conditions side by side, and an explanation of what changed between
    them.
- time: 10′
  text: Log the chart and one sentence about what the shape shows.
  expect: The chart in the log and one sentence about what its shape shows.
