    \  bar chart, add data  (item (i) of run)"
tips:
- Decide what to measure before writing any blocks. Data collected without a question is data nobody
  reads.
- Five laps is enough to see a shape and short enough to repeat. Twenty is a lesson in boredom.
- If the bars all look the same, that is a finding too — it means whatever they changed did not matter
  as much as they thought.
result:
