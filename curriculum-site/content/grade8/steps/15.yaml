    \ done\n  turn off LED  all\n\ndefine  follow_lap\n  repeat 4\n    moves forward  50  cm  until\
    \ done\n    turns right  90  ° until done\n\nwhen button A pressed\n  forever\n    encoder motor\
    \ EM1 rotates at ((joystick LY) / 3) RPM, encoder motor EM2 rotates at ((joystick RY) / 3) RPM\n\
    \    if  button  L1  pressed  then\n      grip\n    if  button  R1  pressed  then\n      release\n\
