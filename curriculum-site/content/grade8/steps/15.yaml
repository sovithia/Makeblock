    ylab: lap time
    caption: five readings logged during the run and drawn afterward
success:
- At least five readings collected into a list during a real run
- The run drawn as a chart on the robot's own screen
- Two runs compared, with a stated reason for the difference
check:
- do: left
  see: It runs five laps and counts them on the screen.
- do: right
  see: The five lap times appear as five bars.
