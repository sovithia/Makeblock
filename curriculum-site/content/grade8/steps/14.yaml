    \ pixel\n  set  job  to  fetch"
tips:
- Make them write the protocol before they code it. Two teams coding to different assumptions is the
  whole lesson, and it is cheaper on paper.
- Let the channel collision happen. Two pairs on one channel is a genuinely confusing five minutes and
  the fix means far more afterwards.
- Message names are case- and spelling-sensitive. "found" and "Found" are two different messages, and
  that is a real debugging afternoon if not said early.
result:
  scene: relay
success:
- A message with a value sent and correctly received
- A full relay with nobody touching either robot
- Two pairs running in the same room on separate channels
check:
- do: B
  see: Robot A drives until it finds the red patch, and stops.
- do: hear
  see: Robot B wakes up and shows how many seconds A took to find it.
parts:
- id: robot_tank
  note: two of them, paired teams
- id: cards

