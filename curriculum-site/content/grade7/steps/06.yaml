    \  sides  to  5\n  repeat  (sides)\n    moves forward  30  cm  until done\n    turns right  (360\
    \ / (sides))  ° until done"
tips:
- 'Nothing moves until <b>button A</b> is pressed. Uploading starts the program on the robot immediately,
  and a robot that drives the instant it is flashed ends up on the floor — so every program whose start-up
  script drives now shows <i>press A to start</i> and waits. It is the same idea as this lesson''s stop
  button, one step earlier: a human decides when it begins, and a human decides when it ends.'
- Clear a floor area. A forever loop on a table is a robot on the floor thirty seconds later.
- 'Test the colour reading before the full run: hold the robot safely, place L1 over the floor and then
  over the tape, and watch the Boolean block change. Reflections or a sensor mounted too high can make
  red detection unreliable.'
- Agree a volume cap before twelve robots discover the speaker.
- If a team's stop button does nothing, their stop is inside the forever loop instead of beside it —
  a genuinely useful bug to let them find.
result:
  scene: patrol
success:
- The patrol runs unplugged from A and remains inside the red-tape arena
- At every edge it detects red, backs away, turns, and continues
- Button B stops it mid-movement, every time
- The team can say when to use forever and when to use repeat
check:
- do: A
  see: It drives until L1 sees the red strip, stops, backs away 5 cm, turns right, and keeps going.
- do: B
  see: Everything stops, mid-movement.
parts:
- id: robot_wheel
- id: tape
  note: wide red boundary, pressed flat with no gaps

guide:
- label: Floor
  value: red-tape arena — begin near the middle, facing an edge
