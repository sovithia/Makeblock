n: 6
stage: A
stage_title: The robot obeys
kind: step
title: It runs by itself
concept: Forever · start and stop
hours: 1.5
project: G7-A-obeys
goal: A patrol that starts on button A, runs until stopped, and needs no tablet at any point.
build: A robot that drives the same square over and over, lit up, until you stop it.
builds_on:
- Step 5 · loops
- Step 3 · events
teach:
- '<b>repeat 4</b> counts and ends. <b>forever</b> never does. That is the whole difference, and it
  matters more than it sounds: a robot that is meant to keep watching the world needs a loop with no
  end, and every autonomous behaviour for the rest of the year sits inside one.'
- Something must be able to stop it. <b>stop all</b> on button B is today's answer — a second event,
  doing the opposite of the first. From now on every program a team writes should be startable and stoppable
  without touching a cable.
steps:
- time: 10′
  text: Take the square from Step 5 and wrap it in forever. Watch it never stop. Enjoy it briefly.
  use:
  - control_forever
  expect: The square never stops. You have to press stop to end it.
- time: 25′
  text: 'Build the patrol: forward, turn, forward, turn — with the lights changing each lap so you can
    see the loop going round.'
  use:
  - cyberpi_play_audio_2
  expect: A robot patrolling a rectangle on its own, changing colour and sound every lap so you can
    see the loop going round.
- time: 25′
  text: 'Add the stop: button B ends everything. Test it while the robot is moving, not while it is
    parked.'
  use:
  - control_stop
  expect: Button B stops the robot while it is moving — not only when it is parked.
- time: 20′
  text: Unplug and run it on the floor for two minutes. Anything that goes wrong in two minutes will
    go wrong in the mission later.
  expect: Two minutes of unplugged running with nothing going wrong, watched the whole time.
- time: 10′
  text: 'Log: which of your programs so far could run with no tablet in the room? All of them should.'
  expect: 'A log line answering: which of your programs could run with no tablet in the room?'
code:
  lang: blocks
  source: "when CyberPi starts up\n  set print size to  big\n  print  Team Rocket  and move to a newline\n\
    \  LED all displays R 0 G 128 B 255\n  play LED animation  rainbow  until done\n  show label 1 \
    \ press A to start  at x: 0 y: 0  by small pixel\n  wait until  button  A  pressed?\n  forever\n\
    \    moves forward  30  cm  until done\n    turns right  90  ° until done\n    LED all displays\
    \ R  (pick random 0 to 255)  G 0 B 255\n    play  hi\n\nwhen button A pressed\n  play recording\n\
    \  ultrasonic 2 1 displays emotion  happy\n\nwhen button B pressed\n  clear screen\n  print  bye!\n\
    \  turn off LED all\n  stop all\n\nwhen joystick  middle pressed\n  reset encoder motor  (1) EM1\
    \  rotated angle\n  moves forward  100  cm  until done\n  show label 1  join  robot says:  (encoder\
    \ motor (1) EM1 rotated angle (°))  at x: 0 y: 0  by small pixel\n\nwhen joystick  pulled↑\n  set\
    \  sides  to  5\n  repeat  (sides)\n    moves forward  30  cm  until done\n    turns right  (360\
    \ / (sides))  ° until done"
tips:
- 'Nothing moves until <b>button A</b> is pressed. Uploading starts the program on the robot immediately,
  and a robot that drives the instant it is flashed ends up on the floor — so every program whose start-up
  script drives now shows <i>press A to start</i> and waits. It is the same idea as this lesson''s stop
  button, one step earlier: a human decides when it begins, and a human decides when it ends.'
- Clear a floor area. A forever loop on a table is a robot on the floor thirty seconds later.
- Agree a volume cap before twelve robots discover the speaker.
- If a team's stop button does nothing, their stop is inside the forever loop instead of beside it —
  a genuinely useful bug to let them find.
result:
  scene: patrol
success:
- The patrol runs unplugged, from A, and does not stop on its own
- Button B stops it mid-movement, every time
- The team can say when to use forever and when to use repeat
check:
- do: A
  see: It drives a square on its own — 30 cm, turn, beep, new colour — and keeps going.
- do: B
  see: Everything stops, mid-movement.
parts:
- id: robot_wheel
- id: tape
  note: patrol area

guide:
- label: Floor
  value: 1 m clear — it drives a 30 cm square
