n: 6
stage: A
stage_title: The robot obeys
kind: step
title: It runs by itself
concept: Forever · start and stop
hours: 1.5
project: G7-A-obeys
goal: A patrol that starts on button A, stays inside the red-tape arena by sensing its boundary, and
  runs until stopped without a tablet.
build: A robot that drives until it sees the red strip, backs away, turns, and continues patrolling
  until you stop it.
builds_on:
- Step 5 · loops
- Step 3 · events
teach:
- '<b>repeat 4</b> counts and ends. <b>forever</b> never does. That is the whole difference, and it
  matters more than it sounds: a robot that is meant to keep watching the world needs a loop with no
  end, and every autonomous behaviour for the rest of the year sits inside one.'
- Something must be able to stop it. <b>stop all</b> on button B is today's answer — a second event,
  doing the opposite of the first. From now on every program a team writes should be startable and stoppable
  without touching a cable.
- A measured distance cannot describe this arena because the robot may start anywhere. Let the robot
  move while its downward-facing <b>Quad RGB sensor</b> watches the floor. <b>wait until red</b> makes
  the tape—not a guessed number of centimetres—the signal to stop, back away, and turn. Reversing first
  clears the strip so the next loop does not detect the same edge again.
steps:
- time: 10′
  text: Take the square from Step 5 and wrap it in forever. Watch it never stop. Then explain why fixed
    30 cm sides cannot keep it inside the arena when it starts from a different place.
  use:
  - control_forever
  expect: The square never stops. You have to press stop to end it.
- time: 25′
  text: 'Build the arena patrol: move forward at 30 RPM, wait until the L1 probe sees red, stop, reverse
    5 cm, and turn right 90°. Put that sequence inside forever. Start near the middle, pointing toward
    an edge—not on top of the tape.'
  use:
  - mbuild_quad_color_sensor_is_color
  expect: The robot reaches the red strip, stops before crossing it, backs into the arena, turns, and
    drives toward another edge.
- time: 25′
  text: 'Add the stop: button B ends everything. Test it while the robot is moving, not while it is
    parked.'
  use:
  - control_stop
  expect: Button B stops the robot while it is moving — not only when it is parked.
- time: 20′
  text: Unplug and run it inside the red-tape arena for two minutes. If it crosses an edge, lower the
    speed, check that the sensor points straight down, and confirm that L1 reports red over the tape.
  expect: Two minutes of unplugged running without crossing the red boundary, watched the whole time.
- time: 10′
  text: 'Log: which of your programs so far could run with no tablet in the room? All of them should.'
  expect: 'A log line answering: which of your programs could run with no tablet in the room?'
