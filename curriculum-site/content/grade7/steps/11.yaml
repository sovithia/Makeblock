    \ of screen  by small pixel"
tips:
- Test all four combinations of two conditions on purpose — dark+close, dark+far, light+close, light+far.
  Teams test one and declare victory.
- '"Dark" is a number that changes with the weather and the time of day. Re-read it at the start of
  every session from now on.'
- The missing ≥ is not a bug in mBlock. Ask what not(x < 20) means in words until someone says "20 or
  more".
result:
  scene: lightdark
success:
- A condition using and that behaves correctly in all four cases
- '"At least" expressed with not and <, derived by the team'
- One value calculated rather than typed in
check:
- do: 'on'
  see: 'Cover it AND put your hand close: it turns red and beeps.'
- do: light
  see: Shine a torch at it and the screen says lights on!
parts:
- id: robot_wheel
- id: torch
  note: control the light
- id: boxes

