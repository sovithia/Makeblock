n: 11
stage: B
stage_title: The robot decides
kind: step
title: Comparing and combining
concept: Operators
hours: 2
project: G7-B-decides
goal: The robot reacts to two conditions at once, and the team can express "at least" without a greater-or-equal
  block.
build: A robot that only wakes up when it is dark AND something is close.
builds_on:
- Step 10 · conditions
- Step 8 · sensor values
teach:
- 'Conditions can be built, not just chosen. <b>and</b> needs both to be true, <b>or</b> needs either,
  <b>not</b> flips it. And numbers can be worked on before you compare them: speed can be a sum, a threshold
  can be a calculation.'
- 'There is a gap in the palette worth finding rather than announcing: there is <b>no ≥ and no ≤</b>.
  Only greater than, less than, equals. So "at least 20" has to be written <b>not (x &lt; 20)</b>. Let
  a team hit the wall, then let them work it out — that is real logical reasoning, and it is the moment
  <b>not</b> stops being decoration.'
guide:
- label: and
  value: both must be true
- label: or
  value: either will do
- label: ≥ 20
  value: not (x < 20) — there is no ≥
- label: Floor
  value: 2 m clear, and a way to darken the room
steps:
- time: 15′
  text: Cover the light sensor and watch the panel. Find the number that means "dark in this room, today"
    — it is not the same room it was yesterday.
  expect: The actual number that means “dark, in this room, today” — measured now, not remembered from
    yesterday.
- time: 25′
  text: 'Build the guard dog: only react when it is dark <b>and</b> something is close. Test all four
    combinations deliberately.'
  use:
  - control_if_else
  expect: The robot reacts only when it is dark AND something is close. All four combinations tried
    on purpose.
- time: 20′
  text: The ≥ problem. Ask for "at least 20 cm" and let them look for the block. Then let them build
    it out of not and <.
  expect: “At least 20 cm” working, built out of not and < because there is no ≥ block to find.
- time: 25′
  text: 'Arithmetic on the way through: make the speed rise as it gets darker instead of switching between
    two speeds.'
  use:
  - mbot2_move_direction_with_rpm
  expect: The speed rises smoothly as the room darkens, instead of flipping between two settings.
- time: 20′
  text: Then show them <b>when light value &gt; 50</b> — one hat block that does what took them three.
    Both are right; knowing why you would choose each is the point.
  use:
  - cyberpi_when_sensor_value_bigger_or_smaller_than
  expect: One hat block doing what took you three blocks — and you can say when you would still choose
    the long way.
- time: 15′
  text: Log the four-way test table and your thresholds.
  expect: The four-way test table and your thresholds in the log.
