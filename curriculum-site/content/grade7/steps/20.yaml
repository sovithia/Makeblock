    \ y: 0  by small pixel"
tips:
- Recalibrate whenever the floor or the light changes — including when the sun moves. This is not superstition,
  it is how the sensor works.
- Curled tape and glossy paper both fool the sensor. Tape the map flat at every edge.
- <b>Do not let anyone use deviation to steer yet</b>, however tempting. Watching it is the whole point
  today; Grade 9 turns it into control and that lesson is worth protecting.
result:
  scene: line
success:
- A full lap unassisted, with follow_line as a named block
- The deviation number is on screen and visibly swings
- The wobble is sketched, hypothesised about, and left unanswered
check:
- do: mid
  see: It follows the black line and shows how far off it is.
