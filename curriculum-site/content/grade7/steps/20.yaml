n: 20
stage: D
stage_title: The robot is organised
kind: step
title: Following the line
concept: Conditionals on a real control problem
hours: 2
project: G7-D-organised
goal: A line follower written as one named block, with the error visible on screen — and the wobble
  named but not fixed.
build: follow_line — the heart of the mission.
builds_on:
- Step 18 · functions
- Step 10 · nested decisions
teach:
- 'Calibrate first, every single time: <b>quad rgb sensor performs calibration</b> teaches the sensor
  what this floor and this light look like. Skip it and nothing works; do it religiously and most line-following
  misery disappears. Make it a ritual, like the connection check.'
- The follower itself is three decisions — line under the left probe, under the right, or straight ahead
  — wrapped in a block called <b>follow_line</b>. Put the sensor's <b>deviation</b> on the screen while
  it runs and watch the number swing negative, zero, positive as the robot hunts across the line. That
  swinging is <b>the wobble</b>. Name it, write the question on the board, and <i>do not answer it</i>
  — Grade 9 spends two sessions killing it, and the setup is worth more than a quick fix now.
guide:
- label: Try it
  value: joystick middle → calibrate, then follow
- label: Always first
  value: performs calibration
- label: Watch
  value: deviation (-100…100) on screen
- label: Leave open
  value: the wobble — Grade 9 answers it
- label: Floor
  value: the taped line course, about 2 m of track
steps:
- time: 15′
  text: Calibrate. Then deliberately skip calibration and run it — watch it fail. Now nobody will forget.
  use:
  - BLOCK_1663048571053
  expect: A calibrated sensor, and the memory of what happened when you skipped calibration on purpose.
- time: 25′
  text: 'Build follow_line as its own block: left probe, right probe, else straight.'
  use:
  - my:follow_line
  - control_if_else
  expect: A follow_line block that probes left, probes right, and otherwise drives straight.
- time: 25′
  text: Lap the track. Put deviation on the screen and watch it swing while the robot drives.
  use:
  - cyberpi_display_label_show_label_xy_with_size
  expect: A completed lap, with the deviation number swinging on the screen while the robot drives.
- time: 20′
  text: Sketch the wobble in the log. Why does it zig-zag? Collect hypotheses on the board and leave
    them there.
  expect: A drawing of the wobble in the log, and the class’s hypotheses for why, left up on the board.
- time: 25′
  text: Timed laps. Change one number per run — base speed, or the two steering speeds — and log what
    it did.
  expect: Timed laps where exactly one number changed per run, each one logged with what it did.
- time: 10′
  text: Log your best lap and the numbers that produced it. Step 24 needs them.
  expect: Your best lap time and the numbers that produced it. Step 24 needs them.
