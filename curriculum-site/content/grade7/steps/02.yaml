steps:
- time: 30′
  text: 'Fit the underside and the front: Quad RGB sensor and mini wheel below (M4×14), ultrasonic sensor
    at the front (M4×14). The ultrasonic must face exactly forward — a small tilt gives nonsense readings
    for the rest of the year.'
  expect: 'Quad RGB underneath, ultrasonic at the front. Sight along the chassis: the ultrasonic looks
    straight ahead, not tilted up, down or sideways.'
- time: 20′
  text: 'Shield on with the four long M4×25 screws, CyberPi slides in last. Route the cables and tuck
    them where no wheel can reach them. Read the port labels as you connect the motors: EM means encoder
    motor; left motor → EM1 and right motor → EM2.'
  expect: Shield screwed down with the four long screws, CyberPi seated, left motor in EM1, right motor
    in EM2, and no cable anywhere a wheel could catch it.
- time: 15′
  text: 'Cross-team QC. Four points, inspected on somebody else''s robot and signed: wheels turn freely
    · cables tucked · battery seated · nothing rattles when shaken.'
  expect: 'Four checks signed off on somebody else''s robot: wheels free · cables tucked · battery seated
    · nothing rattles.'
- time: 10′
  text: Fix whatever QC found on your own robot. Then shake it and spin the wheels in front of the class.
  expect: Your own robot passes all four, shaken and spun in front of the class.
- time: 15′
  text: 'Power on for the first time. It lights up and shows the Makeblock screen — that is all it does
    yet, and that is the point: the robot exists, and next step you make it yours.'
  expect: It lights up and shows the Makeblock screen. It does nothing else yet — that is exactly right.
- time: 10′
  text: 'Name the robot and label it. On your lesson sheet: what did QC catch on the robot you inspected?'
  expect: A robot with a name on it, and a log line naming what QC caught on the robot you inspected.
tips:
- The ultrasonic sensor must face exactly forward. Sight down it from above before tightening.
- 10 cm cables for the sensors. Teams reaching for the 20 cm one are on the step the guide crossed out.
- Left motor into EM1, right into EM2. Swapped means the robot turns when told to go straight, and you
  will not find out until Step 3.
- The Shield's battery is built in and charges over USB-C. Start every build day charged.
- Label each robot with its team name now, while there is still one on the bench that is not labelled.
result:
  scene: build
  params: {stage: full}
success:
- The robot passes all four QC points, signed by another team
- Sensors mounted straight and plugged into the right ports
- It powers on, and the team knows whose robot it is
check:
- do: "on"
  see: It lights up and shows the Makeblock screen. Nothing else yet.
- do: "see"
  see: Shake it gently. Nothing rattles and nothing falls off.
- do: "see"
  see: Another team has signed your four QC points.
