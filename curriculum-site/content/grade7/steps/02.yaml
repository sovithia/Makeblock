n: 2
stage: '0'
stage_title: Build the robot
kind: step
title: Finish it — sensors, shield, first power-on
concept: Quality control before it matters
hours: 2
goal: A finished robot that another team has inspected and signed off, powered on for the first time.
build: A robot that is yours, checked by somebody else, and switched on.
builds_on:
- Step 1 · chassis, motors, wheels
teach:
- 'Finish the build: the two sensors underneath and in front, then the mBot2 Shield on top — its battery
  is <b>built in</b>, so charge it before this lesson — and the CyberPi last. Cables go in with the
  <b>10 cm</b> mBuild leads; the guide crosses the 20 cm one out in red, and a cable left loose near a
  wheel is the commonest cause of a robot that "randomly stops" in week nine.'
- 'Then <b>quality control</b>, which is a real engineering practice and not a tidying-up ritual. Each
  team inspects <i>another</i> team''s robot against four points and signs it. You stop seeing your own
  mistakes after twenty minutes with a screwdriver; somebody else sees them in ten seconds. Everything
  the class finds today is a fault that does not eat a lesson later.'
- '<b>EM means encoder motor.</b> EM1 and EM2 are the two numbered motor ports on the Shield — they are
  not different kinds of motor. A block that says EM1 controls whichever motor cable is plugged into
  port EM1, and likewise for EM2. On this standard mBot2 build, connect the left motor to EM1 and the
  right motor to EM2; that lets later blocks use those names to choose a wheel.'
- '<b>A port contains several electrical pins.</b> S1 and S2 are multifunction connectors; each has
  separate contacts for power, ground and a signal. A digital-read block looks only at the signal
  voltage relative to ground and turns it into a yes/no answer: near ground is <b>low / false</b>, and
  near the positive logic supply is <b>high / true</b>. In a common pull-down switch circuit, open is
  low and closing the switch makes it high. Some sensors are <b>active-low</b> and reverse that meaning,
  so their documentation wins. A signal with nothing connected can <b>float</b> unpredictably and is
  not a valid reading. This course does not wire custom circuits to those pins, but those words explain
  what the raw S1/S2 pin blocks in the palette are reading.'
