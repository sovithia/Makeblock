n: 16
stage: C
stage_title: The robot remembers
kind: step
title: Fixing and searching the route
concept: List edit & search · break
hours: 2
project: G7-C-remembers
goal: The team can undo, patch and search a recorded route without re-driving it.
build: A route you can edit like a document.
builds_on:
- Step 15 · lists
teach:
- A recorded route is data, so it can be <b>edited</b>. <b>delete n of</b> removes an item, <b>insert
  … at n</b> squeezes one in, <b>replace item n</b> swaps one out. Undo is just <b>delete (length of
  route) of route</b> — remove whatever is on the end, without needing to know how long the list is.
- It can also be <b>searched</b>. <b>route contains …?</b> answers yes or no. To find <i>where</i>,
  walk it with count-with-i — and the moment you find it, <b>break</b> out. There is no point checking
  the other forty items once you have your answer, and that is a habit worth forming early.
guide:
- label: Try it
  value: joystick middle undoes · button B searches
- label: Undo
  value: delete (length of route) of route
- label: Search
  value: 'contains …? · item # of … in …'
- label: Stop early
  value: break, inside the loop
- label: Floor
  value: 1.5 m clear to drive a route in
steps:
- time: 15′
  text: Record a route with one deliberate mistake in the middle. Do not re-drive it — you are going
    to fix the data.
  expect: A recorded route with one wrong move in the middle, kept on purpose. Nobody re-drives it.
- time: 25′
  text: Undo the last move with delete. Then undo three. Notice you never had to know how long the list
    was.
  use:
  - data_deleteoflist
  expect: The last move gone, then three more gone — and you never had to know how long the list was.
- time: 25′
  text: 'Patch the middle: replace the wrong move, and insert the one you forgot. Replay and check.'
  expect: The wrong move replaced, the forgotten one put back, and a replay that now matches what you
    meant to drive.
- time: 25′
  text: 'Search it: does this route contain a left turn? Where is the first one? Use break so the loop
    stops when it finds one.'
  use:
  - control_break_new
  - control_if
  expect: The robot answers “is there a left turn in here, and where is the first one?” without walking
    the rest of the list.
- time: 20′
  text: 'Prove break is doing something: show i on screen and watch the loop stop early instead of running
    to the end.'
  expect: i shown on the screen, stopping partway instead of counting to the end — proof that break
    really stops the loop.
- time: 10′
  text: Log the four list operations and one sentence on what each is for.
  expect: Four list operations in the log, one sentence each on what it is for.
