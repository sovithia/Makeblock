tips:
- delete (length of) is the undo. Teams who type the number in have not understood it — ask them what
  happens after two undos.
- Undo an empty route and the robot stops with a traceback on its screen — deleting item 0 is not a
  no-op, it is an error. Guard it with <b>if (length of route) &gt; 0</b>, and let a team find that
  crash before you say so; it is the cheapest lesson in defensive code they will get all year.
- Without break the loop reports the <i>last</i> match, not the first. Let a team hit that and work
  out why.
- Insert shifts everything after it along. Draw the list on the board before and after.
result:
  scene: debug
success:
- Undo works repeatedly without knowing the list length
- A middle move is patched with replace and the replay proves it
- A search finds the first match and stops there
check:
- do: mid
  see: The last move disappears off the end of the list.
- do: B
  see: It tells you where the first left turn is.
- do: see
  see: Undo with nothing recorded says nothing to undo. It does not crash.
