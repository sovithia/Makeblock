n: 16
title: Build Sprint I ✱
goal: 'Navigation milestone: the robot completes its course path end-to-end, reliably.'
builds_on:
- S15 · the signed mission spec
teach:
- 'Sprint rules, borrowed from real teams: a 2-minute standup at the top (each team: done / doing / blocked
  — blockers get teacher attention first), then heads-down build, then a milestone check at the end. Today’s
  milestone for everyone regardless of mission: <b>navigation end-to-end</b> — the robot travels its full
  course path and stops where the mission needs it, three times in a row.'
- 'Hold the line on order: teams itching to get the arms working show first that the robot can reliably <i>arrive</i>.
  Navigation is the foundation every later behavior stands on; a wobbly foundation makes every arm bug
  ambiguous (‘did the grip fail or did we stop 4 cm short?’). Reliability before features — it’s the sprint’s
  only commandment.'
steps:
- time: 5′
  text: 'Standup circle: done / doing / blocked; blockers triaged.'
- time: 33′
  text: 'Build: course laid out to the sketch’s dimensions; navigation tuned on the real course.'
- time: 7′
  text: 'Milestone check: 3 consecutive end-to-end navigation runs, witnessed and logged.'
tips:
- 'Buffer session: teams behind on P-control tuning catch up here — that IS their navigation work.'
- Courses on the floor get shuffled between sessions; photograph the layout with a tape measure in frame.
result:
  scene: kanban
success:
- 3 consecutive clean navigation runs on the team’s own course
- Standup done in under 2 minutes with a real blocked-list
- Course layout photographed for exact rebuild
