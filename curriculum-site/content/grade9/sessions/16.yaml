long:
  goal: Navigation that arrives reliably three times running, on a course the team can rebuild exactly from
    its own photograph.
  recap:
    time: 10′
    text: Standup, and time it visibly. Done, doing, blocked — two minutes total, with blockers going to the
      teacher first. A standup that runs to six minutes has become a status meeting and helps nobody; holding
      the clock is the whole discipline.
  extend:
  - spec: 3 consecutive clean runs
    text: Witnessed and logged on the team's own course — three in a row, not the best three of six.
  - spec: course rebuilt from photo
    text: The layout reproduced from a photograph taken with a tape measure in frame.
  - spec: arrives before anything else
    text: No arm work until navigation is reliable, so that later arm bugs are unambiguous.
  log:
    time: 10′
    text: The run ledger and the course photograph with dimensions. Floors get shuffled between sessions,
      and a course that cannot be rebuilt exactly makes every measurement taken on it incomparable with the
      next one.
  review:
    time: 15′
    text: Milestone check with a witness from another team. Criteria — three consecutive runs, and was the
      course rebuilt to the sketch's dimensions rather than to roughly the right shape?
  parts:
  - id: tape
    note: in frame in the layout photo
  - id: map
  success:
  - Three consecutive clean navigation runs witnessed by another team
  - The course rebuilt from a photograph with dimensions visible

