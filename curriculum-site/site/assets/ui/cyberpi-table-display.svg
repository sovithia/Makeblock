  <circle cx="126" cy="192" r="13" fill="#334155"/><circle cx="634" cy="192" r="13" fill="#334155"/>
  <text x="380" y="374" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">Four instructions fill two labels and two live values; unused cells remain empty.</text>
