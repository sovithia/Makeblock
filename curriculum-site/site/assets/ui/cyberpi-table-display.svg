<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">A table displayed on the CyberPi screen</title>
  <desc id="desc">A four-row, three-column grid. Row one column one contains dist and row one column two contains 24.6.</desc>
  <rect width="760" height="390" rx="24" fill="#f8fafc"/>
  <rect x="104" y="42" width="552" height="300" rx="48" fill="#172033"/>
  <rect x="160" y="76" width="440" height="232" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <g stroke="#64748b" stroke-width="2">
    <line x1="306.7" y1="76" x2="306.7" y2="308"/>
    <line x1="453.3" y1="76" x2="453.3" y2="308"/>
    <line x1="160" y1="134" x2="600" y2="134"/>
    <line x1="160" y1="192" x2="600" y2="192"/>
    <line x1="160" y1="250" x2="600" y2="250"/>
  </g>
  <rect x="163" y="79" width="140.7" height="52" rx="5" fill="#0ea5e9" opacity=".22"/>
