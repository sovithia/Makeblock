  <rect x="163" y="137" width="140.7" height="52" rx="5" fill="#0ea5e9" opacity=".22"/>
  <rect x="309.7" y="137" width="140.6" height="52" rx="5" fill="#22c55e" opacity=".22"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="233" y="112" font-size="23" font-weight="700" fill="#e0f2fe">dist</text>
    <text x="380" y="112" font-size="23" font-weight="700" fill="#dcfce7">24.6</text>
    <text x="526" y="112" font-size="18" fill="#64748b">—</text>
    <text x="233" y="170" font-size="23" font-weight="700" fill="#e0f2fe">speed</text><text x="380" y="170" font-size="23" font-weight="700" fill="#dcfce7">40</text><text x="526" y="170" font-size="18" fill="#64748b">—</text>
    <text x="233" y="228" font-size="18" fill="#64748b">—</text><text x="380" y="228" font-size="18" fill="#64748b">—</text><text x="526" y="228" font-size="18" fill="#64748b">—</text>
    <text x="233" y="286" font-size="18" fill="#64748b">—</text><text x="380" y="286" font-size="18" fill="#64748b">—</text><text x="526" y="286" font-size="18" fill="#64748b">—</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">
